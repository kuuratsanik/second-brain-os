version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
