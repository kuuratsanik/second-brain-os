name: lint

# Static checks on our own code and workflows. Any finding fails the run.
# Run the same commands locally before a PR; see CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump a version here together with the matching local command in CONTRIBUTING.md.
  RUFF_VERSION: "0.16.10"
  ZIZMOR_VERSION: "1.30.1"
  ACTIONLINT_VERSION: "1.7.12"
  # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's
  # actionlint_1.7.12_checksums.txt.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      # Rules and the py39 target are in ruff.toml.
      - name: Lint scripts, tools and tests
        run: ruff check --output-format=github .

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Release binary from github.com/rhysd/actionlint, verified against a
      # checksum pinned here (docs/install.md, "Prebuilt binaries"). actionlint
      # runs shellcheck on `run:` scripts when it is on PATH; ubuntu-latest has it.
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint the workflows (actionlint)
        run: actionlint -color
      - name: Install zizmor
        run: pip install "zizmor==${ZIZMOR_VERSION}"
      # --offline skips the audits that call the GitHub API (impostor commits,
      # known-vulnerable actions); every other audit runs, and dependabot.yml is
      # audited too.
      - name: Audit the workflows (zizmor)
        run: zizmor --offline --no-progress --format=github .github
