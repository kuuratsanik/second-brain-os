name: link-rot

# Advisory only: a weekly look at the external links in docs/ and resources/.
# It never fails the run and never opens issues (they are disabled here); read
# the report in the run summary.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days; re-enable it under the Actions tab, or run it by hand with
# workflow_dispatch. From memory of the GitHub Actions docs ("Events that
# trigger workflows", schedule); not re-checked against the live page.
on:
  schedule:
    - cron: "37 5 * * 1"   # Mondays 05:37 UTC; not on the hour, when runners are busiest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-rot
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test the checker
        run: python3 tools/check_external_links.py --selftest
      - name: Check external links
        continue-on-error: true
        # timeout 15m is below the job's 20, and --budget 780 (13 min) below that;
        # the script exits as soon as the report is printed, without waiting for
        # requests still in flight, so the summary is written even when hosts are
        # slow. 2>&1 puts a crash in the summary too.
        run: |
          timeout 15m python3 tools/check_external_links.py --markdown --budget 780 > "$RUNNER_TEMP/report.md" 2>&1 || true
          {
            echo "## External link check"
            echo
            if [ -s "$RUNNER_TEMP/report.md" ]; then
              cat "$RUNNER_TEMP/report.md"
            else
              echo "No report was produced (the check timed out or crashed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
