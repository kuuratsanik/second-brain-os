name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the agent kit
        run: |
          python3 tools/check_kit.py --selftest
          python3 tools/check_kit.py
      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Test the external link checker (no network)
        run: python3 tools/check_external_links.py --selftest
      - name: Test the release notes and KV-slot benchmark tools (no network)
        run: |
          python3 tools/release_notes.py --selftest
          python3 tools/bench_kv_slots.py --selftest
      - name: Check docs links and anchors
        run: |
          python3 tools/doc_links.py --selftest
          python3 tools/doc_links.py
      # Also run through unittest (tests/test_guard_and_demo.py), but this step
      # prints the guard's own case list on failure and runs before the stale-HTML check.
      - name: Run the vault guard tests
        run: python3 vault-template/.claude/hooks/test_guard.py
      - name: Rebuild the site
        run: python3 scripts/build_all.py
      # Covers every generated file: index.html, resources.html, tree.html, 404.html,
      # sitemap.xml, robots.txt, llms.txt, llms-full.txt, feed.xml and og.png. A
      # generated file that was never committed shows up in `git status --porcelain`.
      - name: Fail if the committed output is stale
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Check vault-template links
        run: python3 scripts/link_check.py vault-template

  # The vault scripts ship to users on plain Python 3, Windows included, with
  # no installs. Run their tests on the oldest and newest Python we claim.
  vault-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the unit tests
        run: python -m unittest discover -s tests -t . -v
      # Also run through unittest; the direct run shows the guard's own case list.
      - name: Run the vault guard tests
        run: python vault-template/.claude/hooks/test_guard.py
      # link_check exits 0 even with findings; tests/test_guard_and_demo.py
      # asserts the demo vault has 0 broken links and 0 orphans.
      - name: Smoke-test the vault scripts on the demo vault
        shell: bash  # pwsh would gate the step on the last command only
        run: |
          set -e
          python scripts/link_check.py examples/demo-vault
          python scripts/vault_stats.py examples/demo-vault
          python scripts/graph_export.py examples/demo-vault "${{ runner.temp }}/graph.csv"
          python scripts/graph_export.py examples/demo-vault "${{ runner.temp }}/graph.graphml" --format graphml
          python scripts/vault_search.py examples/demo-vault "weekly review" --limit 3
          python scripts/vault_search.py examples/demo-vault "oppimise plaan" --json
          python scripts/dashboard.py examples/demo-vault --out "${{ runner.temp }}/dashboard.html"
          python scripts/dashboard.py examples/demo-vault --json
