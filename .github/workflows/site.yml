name: site

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Rebuild the site
        run: python3 scripts/build_all.py
      - name: Fail if the committed output is stale
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Check vault-template links
        run: python3 scripts/link_check.py vault-template
