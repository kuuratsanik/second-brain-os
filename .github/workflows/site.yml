name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the agent kit
        run: |
          python3 tools/check_kit.py --selftest
          python3 tools/check_kit.py
      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Check docs links and anchors
        run: |
          python3 tools/doc_links.py --selftest
          python3 tools/doc_links.py
      - name: Rebuild the site
        run: python3 scripts/build_all.py
      - name: Fail if the committed output is stale
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Check vault-template links
        run: python3 scripts/link_check.py vault-template

  # The vault scripts ship to users on plain Python 3, Windows included, with
  # no installs. Run their tests on the oldest and newest Python we claim.
  vault-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the unit tests
        run: python -m unittest discover -s tests -t . -v
