432,237 400,382" stroke-width="2.06" stroke-opacity="0.71"/><path class="edge" d="M576,353 Q380,246 115,186" stroke-width="2.06" stroke-opacity="0.71"/><path class="edge" d="M685,278 Q420,218 224,111" stroke-width="2.06" stroke-opacity="0.71"/><path class="edge" d="M685,186 Q420,202 224,111" stroke-width="2.06" stroke-opacity="0.71"/><g class="node" data-sec="01-concepts" tabindex="0" role="link"><circle cx="400" cy="82" r="14.0"/><text x="400" y="56" text-anchor="middle">Concepts</text><text class="cnt" x="400" y="69" text-anchor="middle">8 pages</text><text class="idx" x="400" y="86" text-anchor="middle">1</text></g><g class="node" data-sec="02-setup" tabindex="0" role="link"><circle cx="576" cy="111" r="14.8"/><text x="600" y="84" text-anchor="start">Setup</text><text class="cnt" x="600" y="97" text-anchor="start">9 pages</text><text class="idx" x="576" y="114" text-anchor="middle">2</text></g><g class="node" data-sec="03-ingestion" tabindex="0" role="link"><circle cx="685" cy="186" r="13.2"/><text x="708" y="191" text-anchor="start">Ingestion</text><text class="cnt" x="708" y="204" text-anchor="start">7 pages</text><text class="idx" x="685" y="189" text-anchor="middle">3</text></g><g class="node" data-sec="04-structuring" tabindex="0" role="link"><circle cx="685" cy="278" r="14.0"/><text x="708" y="283" text-anchor="start">Structuring</text><text class="cnt" x="708" y="296" text-anchor="start">8 pages</text><text class="idx" x="685" y="282" text-anchor="middle">4</text></g><g class="node" data-sec="05-graphs" tabindex="0" role="link"><circle cx="576" cy="353" r="13.2"/><text x="599" y="385" text-anchor="start">Graphs</text><text class="cnt" x="599" y="398" text-anchor="start">7 pages</text><text class="idx" x="576" y="357" text-anchor="middle">5</text></g><g class="node" data-sec="06-agents" tabindex="0" role="link"><circle cx="400" cy="382" r="12.5"/><text x="400" y="412" text-anchor="middle">Agents</text><text class="cnt" x="400" y="426" text-anchor="middle">6 </div></div><!--ENTRIES--><div class="entr"><a class="ent e1" href="#01-concepts/what-is-a-second-brain"><span class="ek">the guide &middot; 01&ndash;10</span><h2>The second brain</h2><p>A path you follow once: a knowledge base an agent builds and maintains for you, in markdown you own.</p><span class="em">65 pages &middot; starter vault &middot; 29 skills</span></a><a class="ent e2" href="#course-0-map/what-an-agent-is"><span class="ek">the agents course &middot; C0&ndash;C6</span><h2>The agents course</h2><p>A path you read in order: seven modules from a single prompt to a production agent, practice in every module.</p><span class="em">21 lessons &middot; plugin: tools in two commands</span></a><a class="ent e3" href="#track-graph/why-graphs"><span class="ek">handbooks &middot; T1&ndash;T5</span><h2>The handbooks</h2><p>Not a path &mdash; references: the full menu of techniques, tools and builds for one layer, when it starts hurting.</p><span class="em">5 handbooks &middot; 46 pages &middot; dip in anywhere</span></a></div><!--/ENTRIES--><div class="trkhead"><h2>the second-brain guide</h2><p>A path you follow once, in order: from the concept to a vault that maintains itself, one evening to set up.</p></div><div class="seclist"><article><h3><a href="#01-concepts/what-is-a-second-brain">Concepts</a></h3><p>Why an LLM-maintained knowledge base beats the note system you abandoned, and what the pattern actually is.</p><div class="pg">8 pages</div></article><article><h3><a href="#02-setup/obsidian-install-and-vault">Setup</a></h3><p>From zero to a vault your agent maintains, in one evening. Follow the pages in order the first time. Nine steps, roughly twenty minutes of typing and however long the interview in step four takes you.</p><div class="pg">9 pages</div></article><article><h3><a href="#03-ingestion/web-clipper">Ingestion</a></h3><p>Getting everything you read, watch and write into <code>raw/</code> with as little friction as possible, then into the wiki without flooding it.</p><div class="pg">7 pages</div></article><article><h3><a href="#04-structuring/atomic-pages">Structuring</a></h3><p>The rules that decide whether your vault becomes a graph or a landfill.</p><div class="pg">8 pages</div></article><article><h3><a href="#05-graphs/graph-basics">Graphs</a></h3><p>The part most second-brain guides skip. They tell you to open the graph view, say it looks like a brain, and move on.</p><div class="pg">7 pages</div></article><article><h3><a href="#06-agents/agent-roles">Agents</a></h3><p>Turning a one-off setup into a system that maintains itself.</p><div class="pg">6 pages</div></article><article><h3><a href="#07-retrieval/asking-questions">Retrieval</a></h3><p>How to actually ask your vault things and get answers worth trusting.</p><div class="pg">5 pages</div></article><article><h3><a href="#08-outputs/writing-from-the-vault">Outputs</a></h3><p>The vault earns its keep when things come out of it.</p><div class="pg">4 pages</div></article><article><h3><a href="#09-maintenance/lint-and-health">Maintenance</a></h3><p>What keeps the thing alive after the novelty wears off.</p><div class="pg">6 pages</div></article><article><h3><a href="#10-troubleshooting/common-failures">Troubleshooting</a></h3><p>Concrete failures, with fixes.</p><div class="pg">5 pages</div></article></div><!--COURSE--><div class="trkhead"><h2>the agents course</h2><p>Seven modules from a single prompt to a production agent: theory from the whitepapers, a build in every module. A path — start at the map, read in order, finish with the day-one plan.</p></div><div class="seclist courselist"><article><h3><a href="#course-0-map/what-an-agent-is">0 · The map</a></h3><p>What an agent is, the five layers around the model, and when a workflow beats a loop.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-1-context/how-models-read">1 · Context</a></h3><p>What the model sees: attention, caching, the four places, sessions and memory.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-2-loop/loops-vs-workflows">2 · Loop</a></h3><p>Who decides the next step: goal, checker, stop rule, budget - and the hybrid that survives production.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-3-gate/cheap-decisions">3 · The gate</a></h3><p>Cheap decisions in front of expensive models: classifiers first, System One models where they earn it.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-4-harness/the-office">4 · Harness</a></h3><p>The office around the model: containment, guides, sensors, permissions - built from the outside in.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-5-evals/two-kinds-of-checks">5 · Evals</a></h3><p>The same test every month: behavioural checks on traces, judged judges, golden sets that include failures.</p><div class="pg">3 pages</div></article><article><h3><a href="#course-6-production/from-prototype">6 · Production</a></h3><p>From demo to deployed: gateways, tracing, cost, security - and the day-one plan across all five layers.</p><div class="pg">3 pages</div></article></div><!--/COURSE--><!--TRACKS--><div class="trkhead"><h2>handbooks</h2><p>Not a path — references. The full menu of techniques, tools and builds for one layer of the course; open one when that layer starts hurting, dip in anywhere.</p></div><div class="seclist tracklist"><article><h3><a href="#track-graph/why-graphs">Knowledge graphs</a></h3><p>Graphs as agent memory: GraphRAG, extraction pipelines, stores — then an evening build of a graph layer over your own vault.</p><div class="pg">9 pages</div></article><article><h3><a href="#track-jev/system-one-models">Jev engineering</a></h3><p>The gate is the layer; Jev is one way to build it. Typed decisions with confidence scores instead of generated text — and a build you can run before your Jev access lands.</p><div class="pg">8 pages</div></article><article><h3><a href="#track-harness/what-a-harness-is">Agent harnesses</a></h3><p>The machinery around the model: loops, tools, context engineering, the landscape — and a working harness in an evening, about 150 lines.</p><div class="pg">11 pages</div></article><article><h3><a href="#track-loop/what-loop-engineering-is">Loop engineering</a></h3><p>The control system around the agent: stop conditions, critics, context hygiene — and an overnight loop you can trust by morning.</p><div class="pg">9 pages</div></article><article><h3><a href="#track-evals/why-evals">Eval engineering</a></h3><p>Measurement as the discipline of AI products: golden sets, judges that do not lie, agent trajectories — and your first suite built in an afternoon.</p><div class="pg">9 pages</div></article></div><!--/TRACKS--></template>

<script id="data" type="application/json">{"pages":[{"id":"01-concepts/what-is-a-second-brain","title":"What a second brain actually is","html":"<p>One local folder of plain text that an agent reads and writes, holding what you\nhave read and understood, that you can ask questions.<\/p>\n<p>That is the whole definition. Everything else in this guide is detail about\nmaking it work.<\/p>\n<h2 id=\"what-it-is-not\">What it is not<\/h2>\n<p><strong>Not a prettier notes app.<\/strong> The point is not organisation. You can organise\nnotes beautifully and still never reopen them.<\/p>\n<p><strong>Not a chatbot with your PDFs attached.<\/strong> Attaching documents to a chat gets you\nanswers about those documents in that session. Nothing accumulates, nothing\nconnects, and next week you attach them again.<\/p>\n<p><strong>Not a memory feature.<\/strong> Assistants that remember facts about you are useful and\nare a different thing. This is a body of knowledge you own, that outlives any\nparticular tool.<\/p>\n<h2 id=\"the-three-jobs\">The three jobs<\/h2>\n<p><strong>Capture.<\/strong> Everything you read, watch and write down lands in one place with\nnear-zero friction. If capture takes effort, nothing else matters, because there\nwill be nothing to organise.<\/p>\n<p><strong>Connect.<\/strong> New material gets linked into what is already there. This is the job\nhumans stop doing after two weeks and the reason every previous note system\nfailed. It is also the entire value: unconnected notes are a folder.<\/p>\n<p><strong>Answer.<\/strong> You ask questions across everything at once, and get answers grounded\nin your own sources with citations you can open.<\/p>\n<h2 id=\"where-the-value-comes-from\">Where the value comes from<\/h2>\n<p>Not from any single page. A page is a slightly better version of a note you could\nhave written.<\/p>\n<p>It comes from density. At fifty sources, the vault starts connecting things you\nread months apart. At five hundred, it answers questions you could not have\nanswered yourself, because nobody holds five hundred sources in their head at\nonce.<\/p>\n<p>That is why the first two weeks feel underwhelming and why most people quit\nbefore the payoff. The system is not broken at thirty pages, it is just\nearly. See <a href=\"what-good-looks-like.md\">what good looks like<\/a> for a realistic\ntimeline.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"the-save-for-later-paradox.md\">The save-for-later paradox<\/a><\/p>"},{"id":"01-concepts/the-save-for-later-paradox","title":"The save-for-later paradox","html":"<p>You screenshot the post. You bookmark the article. You save the video to a\nplaylist named \"watch later\" that has four hundred items in it.<\/p>\n<p>You do not go back. Almost nobody does.<\/p>\n<h2 id=\"why-saving-fails\">Why saving fails<\/h2>\n<p>Saving feels like an action, and it discharges the feeling that made you want to\nsave. The intention gets spent at the moment of saving rather than at the moment\nof reading, which is why the queue grows and the reading does not.<\/p>\n<p>Then retrieval costs more than it is worth. Finding the thing you saved means\nremembering that you saved it, remembering where, and searching wording you no\nlonger recall. Compared to a fresh search, the saved item loses, so you search\nagain and save again.<\/p>\n<p>And the pile itself becomes a deterrent. Four hundred unread items is not a\nresource, it is a debt you avoid looking at.<\/p>\n<h2 id=\"what-actually-changes-it\">What actually changes it<\/h2>\n<p>Not better tagging. Not a better read-later app. Not discipline, which is the\nthing that already failed.<\/p>\n<p>What changes it is removing the step you keep failing at. If the filing and\nconnecting happen without you, the queue stops being a queue: the material is\nalready processed, already linked, already reachable by asking a question in\nplain language.<\/p>\n<p>The retrieval cost inverts too. You no longer need to remember that you saved\nsomething, or where. You ask what you know about a topic, and things you had\nforgotten saving come back.<\/p>\n<h2 id=\"the-honest-limit\">The honest limit<\/h2>\n<p>The system does not make you read things. It processes what you feed it, and\nwhat you feed it is still your choice.<\/p>\n<p>What it does is make saving worth doing. That is a smaller claim than most\nsecond-brain pitches make, and it is the one that holds up after a month.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"llm-wiki-pattern.md\">The LLM wiki pattern<\/a><\/p>"},{"id":"01-concepts/llm-wiki-pattern","title":"The LLM wiki pattern","html":"<p>The specific pattern this guide implements, published by Andrej Karpathy as a\n<a href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\">gist<\/a> on\n2026-04-04.<\/p>\n<p>The inversion in one sentence: instead of you maintaining notes and occasionally\nasking an AI about them, the AI maintains the wiki and you read it.<\/p>\n<h2 id=\"what-the-pattern-specifies\">What the pattern specifies<\/h2>\n<p><strong>The wiki is primary.<\/strong> Raw sources are an archive you keep and rarely open.\nThe wiki is what you and the agent both work from, written in plain language,\none idea per page, densely linked.<\/p>\n<p><strong>Compilation, not summarization.<\/strong> Each new source is integrated into existing\npages rather than added beside them as another summary. A page about a concept\nimproves as sources accumulate; it does not turn into a list of what each source\nsaid.<\/p>\n<p><strong>Three operations.<\/strong> Ingest brings new material in. Query answers from the\nwiki. Lint is a periodic health check of the wiki. The gist names these three;\neverything else here is variation on them.<\/p>\n<h2 id=\"why-it-holds-up\">Why it holds up<\/h2>\n<p>Because it removes the one task that killed every previous system. Linking fifty\nnotes to each other every time you read a paper is genuinely boring work that\nhumans stop doing, and the wiki dies when the maintainer gets tired.<\/p>\n<p>The other reason is that it needs no infrastructure. Markdown files, wikilinks,\nan agent that can read and write files. No database, no index to keep fresh, no\nservice to depend on.<\/p>\n<h2 id=\"where-the-gist-stops\">Where the gist stops<\/h2>\n<p>It describes intent, not implementation. Integrate new sources, lint\nperiodically, treat the wiki as primary. It suggests an <code>index.md<\/code> and a\n<code>log.md<\/code> and a schema file such as <code>CLAUDE.md<\/code>, and calls all of it optional.<\/p>\n<p>The mechanics are left open, which is why every implementation of it differs.\nHow integration handles contradictions, what a page must contain, when lint\nruns, who the wiki is written for. This guide's answers to those are in\n<a href=\"../04-structuring/README.md\">Structuring<\/a>, and they are opinions, not the\npattern itself.<\/p>\n<h2 id=\"what-people-build-on-top\">What people build on top<\/h2>\n<p>The gist does not cover a project layer or scheduled automation. This guide adds\nthem: see <a href=\"two-layers.md\">the two layers<\/a> and <a href=\"../06-agents/README.md\">Agents<\/a>.<\/p>\n<p>The pattern also spread quickly because the primitives are ordinary: anyone with\nan agent and a folder can run it, and the implementations are all readable\nmarkdown. See <a href=\"../../resources/skills.md\">resources<\/a> for the ones worth reading.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"two-layers.md\">The two layers<\/a><\/p>"},{"id":"01-concepts/two-layers","title":"The two layers","html":"<p>Most second-brain setups fail because they pick one shape and try to make it do\ntwo jobs.<\/p>\n<p><strong>The knowledge layer<\/strong> answers \"what do I know about X\". It is organised by\nidea, it grows forever, and its value is in the links between pages. This is the\nLLM wiki pattern: sources in, concepts out, everything connected.<\/p>\n<p><strong>The project layer<\/strong> answers \"what am I doing this week\". It is organised as a\npipeline, inputs to outputs, and most of it goes cold the moment the project\nships.<\/p>\n<p>They fail differently when merged. A wiki with project folders in it fills up\nwith dead task lists that make every search worse. A project system with\nconceptual notes in it buries the working files under material nobody opens\nwhile working.<\/p>\n<h2 id=\"how-they-connect\">How they connect<\/h2>\n<p>Projects consume the knowledge layer and feed it back:<\/p>\n<pre><code>        wiki/concepts ──────&gt; project Inputs/\n              ▲                      │\n              │                      ▼\n        ingest what                Process/ ──&gt; Outputs/\n        you learned                              │\n              └──────────────────────────────────┘\n<\/code><\/pre>\n<p>Work produces material worth keeping. Ingesting your own finished work is the\nstep almost everyone skips, and it is the one that makes the second project in\na domain meaningfully faster than the first.<\/p>\n<h2 id=\"which-to-build-first\">Which to build first<\/h2>\n<p>The knowledge layer, if you read a lot and retain little.<\/p>\n<p>The project layer, if your problem is that you re-explain your situation to a\nchat window every morning.<\/p>\n<p>Both eventually. See <a href=\"../02-setup/vault-structure.md\">vault structure<\/a> for the\nlayout that keeps them separate inside one folder.<\/p>"},{"id":"01-concepts/why-markdown-and-plain-text","title":"Why markdown and plain text","html":"<p>The format looks like a detail. It decides whether the system works.<\/p>\n<h2 id=\"agents-handle-files-better-than-apis\">Agents handle files better than APIs<\/h2>\n<p>An agent reading a folder does what it is best at: reading text and writing text.\nNo schema to learn, no API to call correctly, no failure mode where a request\nhalf-succeeds.<\/p>\n<p>That reliability compounds over thousands of operations. A pipeline that writes\nmarkdown files fails in ways you can see in a diff; one that writes through an\nAPI fails in ways you find out about later.<\/p>\n<h2 id=\"portability-is-not-theoretical\">Portability is not theoretical<\/h2>\n<p>Every previous notes tool people trusted either shut down, changed pricing, or\nmade export deliberately awkward.<\/p>\n<p>Plain files remove the question. Your vault opens in any text editor, syncs with\nany tool, and works with any agent that reads files. Switch models, switch\neditors, switch operating systems, and the vault is unaffected because it was\nnever in anything.<\/p>\n<p>This matters more than usual here, because a second brain accumulates value over\nyears. A format that traps you is a format that eventually costs you the whole\nthing.<\/p>\n<h2 id=\"wikilinks-as-a-graph-format\">Wikilinks as a graph format<\/h2>\n<p><code>[[Page name]]<\/code> is a two-character convention that produces a real graph, is\nreadable as text, and survives every tool that does not understand it, because\nin the worst case it is still just words in a sentence.<\/p>\n<p>You can parse it with a regex, which is what <code>scripts/graph_export.py<\/code> does. Try\nthat with a proprietary block reference format.<\/p>\n<h2 id=\"git-works-on-it\">Git works on it<\/h2>\n<p>Text diffs. That single property is what makes an agent safe to run unattended:\nevery change it makes is reviewable, revertible, and attributable to a run.<\/p>\n<p>Binary formats and database-backed apps give you no equivalent. You either trust\nthe automation completely or you do not automate.<\/p>\n<h2 id=\"the-limits\">The limits<\/h2>\n<p>Plain text is bad at a few things, and pretending otherwise is how people end up\nfrustrated.<\/p>\n<p><strong>Structured queries at scale.<\/strong> Dataview covers a lot, but past a few thousand\npages, relational questions want a real database. Export the graph rather than\nabandoning markdown; see <a href=\"../05-graphs/exporting-your-graph.md\">exporting the\ngraph<\/a>.<\/p>\n<p><strong>Rich media.<\/strong> Images live beside the text as files, not in it. Diagrams are\nattachments.<\/p>\n<p><strong>Concurrent editing.<\/strong> Two agents writing the same file conflict in the way\nfiles conflict, which is to say badly.<\/p>\n<p>None of those outweigh portability for a personal vault. All of them are worth\nknowing before you hit them.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"pkm-lineage.md\">Zettelkasten, PARA, evergreen notes<\/a><\/p>"},{"id":"01-concepts/pkm-lineage","title":"Zettelkasten, PARA, evergreen notes","html":"<p>None of this is new. The methods people abandoned were mostly right, and it is\nworth knowing which parts of them still apply, because the good ideas came with a\ncost that has now changed.<\/p>\n<h2 id=\"zettelkasten\">Zettelkasten<\/h2>\n<p>Niklas Luhmann's slip-box, popularised for a modern audience by Sönke Ahrens in\n\"How to Take Smart Notes\". Atomic notes, one idea each, densely cross-referenced,\nwritten in your own words.<\/p>\n<p><strong>Still right:<\/strong> atomic notes, dense linking, rewriting in your own words rather\nthan clipping quotes. All three are in this guide's <a href=\"../04-structuring/README.md\">structuring\nrules<\/a>.<\/p>\n<p><strong>The cost:<\/strong> every link was manual. Reading one paper meant deciding where it\nconnected among hundreds of existing notes, which is real cognitive work and the\nreason most slip-boxes die in month three.<\/p>\n<h2 id=\"para\">PARA<\/h2>\n<p>Tiago Forte's system from \"Building a Second Brain\": Projects, Areas, Resources,\nArchive. Organise by actionability rather than by subject.<\/p>\n<p><strong>Still right:<\/strong> the insight that project material and reference material want\ndifferent structures. That is exactly <a href=\"two-layers.md\">the two layers<\/a>, arrived at\nfrom a different direction.<\/p>\n<p><strong>The cost:<\/strong> constant filing decisions, and the fact that actionability changes,\nso the same note moves between categories over time.<\/p>\n<h2 id=\"evergreen-notes\">Evergreen notes<\/h2>\n<p>Andy Matuschak's approach: notes written to be reread and improved over years,\nconcept-oriented, densely linked, developed slowly.<\/p>\n<p><strong>Still right:<\/strong> the standard for what a good concept page is. Matuschak's\nargument that notes should be written for your future self, not as a record of\nhaving read something, is the bar this guide's concept pages aim at.<\/p>\n<p><strong>The counterweight:<\/strong> his position is that the writing is the thinking, and\ndelegating it means not doing the thinking. That is a real objection to this\nwhole approach and worth sitting with rather than dismissing.<\/p>\n<h2 id=\"what-changed\">What changed<\/h2>\n<p>One thing: the maintenance is now delegable.<\/p>\n<p>Every system above works. Every one of them failed for the same reason, which is\nthat they required a human to do boring linking work forever. An agent doing it\ndoes not get tired in month three.<\/p>\n<h2 id=\"what-did-not-change\">What did not change<\/h2>\n<p>You still have to choose what to read. You still have to decide what matters.\nThe agent files and connects; it does not have taste, and a vault fed\nindiscriminately is a well-organised pile.<\/p>\n<p>And Matuschak's objection stands: understanding comes from writing. The way to\nkeep it is to write the concept pages that matter to you yourself, and let the\nagent handle sources, entities and the linking. That split is a preference this\nguide does not enforce, and it is worth deciding deliberately rather than by\ndefault.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"wiki-vs-rag.md\">Wiki vs RAG<\/a><\/p>"},{"id":"01-concepts/wiki-vs-rag","title":"Wiki vs RAG","html":"<p>The default advice for asking questions of your own documents is to embed them\nin a vector database. This guide does something else, and the reason is\nstructural rather than a preference about tools.<\/p>\n<h2 id=\"the-two-approaches\">The two approaches<\/h2>\n<p><strong>RAG<\/strong> stores your documents as chunks with embeddings. A question retrieves the\nmost similar chunks and the model answers from them. Nothing is written; the\ncorpus stays as it was.<\/p>\n<p><strong>A wiki<\/strong> processes documents once, into pages an agent wrote and linked.\nQuestions are answered by navigating those pages. The corpus is transformed and\nkeeps improving.<\/p>\n<p>The difference is where the work happens. RAG does it at query time, every time,\nfrom scratch. A wiki does it once, at ingest, and the result is reused.<\/p>\n<h2 id=\"what-that-buys\">What that buys<\/h2>\n<p><strong>Understanding accumulates.<\/strong> The tenth source about a topic improves the page\nthe first nine built. In RAG, the tenth document is just another chunk, and\nnothing gets better as the corpus grows, only larger.<\/p>\n<p><strong>Contradictions are visible.<\/strong> Two documents disagreeing produce two chunks that\nmay never be retrieved together. On a page, the disagreement is written down,\ndated, and unavoidable.<\/p>\n<p><strong>Answers are checkable.<\/strong> The page cites sources you can open. Retrieved chunks\nare fragments without the reasoning that connected them.<\/p>\n<p><strong>No infrastructure.<\/strong> No index, no re-embedding, no drift between the store and\nthe files.<\/p>\n<h2 id=\"what-it-costs\">What it costs<\/h2>\n<p><strong>Ingest is expensive.<\/strong> Writing and linking pages costs model time up front,\nwhere RAG's ingest is nearly free.<\/p>\n<p><strong>Quality depends on the ingest.<\/strong> A bad page contract produces a bad vault, and\nyou find out later. RAG's failures are at query time and are more visible.<\/p>\n<p><strong>Recall depends on linking.<\/strong> A page nobody linked is a page the graph cannot\nreach. RAG will find it by similarity regardless.<\/p>\n<h2 id=\"the-honest-position\">The honest position<\/h2>\n<p>This trade is right for a personal, curated corpus of a few thousand pages and\nwrong for a million documents nobody organised.<\/p>\n<p>Which is to say it is right for a second brain and wrong for a search product,\nand most advice about RAG is written for the second case. See <a href=\"../07-retrieval/rag-on-top.md\">adding RAG when\nyou need it<\/a> for the threshold where the answer\nflips, and <a href=\"../05-graphs/graph-vs-vectors.md\">graph vs embeddings<\/a> for the\nretrieval mechanics.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"what-good-looks-like.md\">What good looks like<\/a><\/p>"},{"id":"01-concepts/what-good-looks-like","title":"What good looks like","html":"<p>Concrete criteria, so you can tell whether yours is working rather than guessing.<\/p>\n<h2 id=\"the-test\">The test<\/h2>\n<p>Ask it something you half-remember reading about, months ago, that you cannot\nname precisely.<\/p>\n<p>If it comes back with the idea, the sources, and two related things you had\nforgotten, it works. If it returns nothing, or returns a general explanation that\ncould have come from any model, it does not.<\/p>\n<h2 id=\"signals-of-health\">Signals of health<\/h2>\n<p><strong>You reach for it before searching the web.<\/strong> The strongest signal, and it\nhappens on its own once the vault is dense enough.<\/p>\n<p><strong>Answers cite pages you can open,<\/strong> and the pages say what the answer said.<\/p>\n<p><strong>The graph has clusters you did not plan.<\/strong> Evidence it is tracking what you\nactually pay attention to rather than what you told it to.<\/p>\n<p><strong>New sources mostly update existing pages<\/strong> rather than creating new ones. That\nmeans the vault has the concepts already and is deepening rather than sprawling.<\/p>\n<p><strong>It contradicts you occasionally,<\/strong> because you have material on both sides of\nsomething.<\/p>\n<h2 id=\"signals-of-trouble\">Signals of trouble<\/h2>\n<p><strong>Orphan rate climbing.<\/strong> Ingestion has stopped linking. See\n<a href=\"../05-graphs/metrics.md\">metrics<\/a>.<\/p>\n<p><strong>Pages that read as summaries<\/strong> rather than explanations. The page contract in\n<code>CLAUDE.md<\/code> needs tightening.<\/p>\n<p><strong>Concept pages untouched for months while sources keep arriving.<\/strong> New material\nis landing in new pages instead of updating existing ones, which produces four\npages about one thing.<\/p>\n<p><strong>You stopped opening it.<\/strong> The honest one. Usually means capture broke, not that\nthe idea failed.<\/p>\n<h2 id=\"a-realistic-timeline\">A realistic timeline<\/h2>\n<p><strong>Week one.<\/strong> Setup, ten or twenty sources. Feels like a folder with extra steps.\nThis is normal and it is where most people quit.<\/p>\n<p><strong>Week two to four.<\/strong> Fifty to a hundred sources. First moment of the vault\nconnecting two things you read weeks apart. This is when it starts being worth\nthe setup.<\/p>\n<p><strong>Month three.<\/strong> A few hundred pages. It answers questions faster than you could\nby rereading, and it surfaces things you had forgotten saving.<\/p>\n<p><strong>Month six.<\/strong> It knows things you do not remember learning. That is the state\neveryone describes as the payoff, and it is real, and it takes six months of\nfeeding it.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../02-setup/README.md\">Setup<\/a>.<\/p>"},{"id":"02-setup/obsidian-install-and-vault","title":"Obsidian and your first vault","html":"<p>Obsidian is the storage half of the system. It is free to use (Obsidian's <a href=\"https://help.obsidian.md/credit\">help<\/a> says it \"is completely free to use\"), it keeps everything as\nplain text files on your own machine, and it renders the links between notes as\na graph. Nothing here is stored in a company's cloud, and the files stay\nreadable in any text editor if you ever walk away from the app.<\/p>\n<h2 id=\"install\">Install<\/h2>\n<p>Download from <a href=\"https://obsidian.md\">obsidian.md<\/a> and install it.<\/p>\n<p>If you ran the Quickstart from the <a href=\"../../README.md\">README<\/a>, you already have\na <code>~/brain<\/code> folder with the starter structure in it. On the welcome screen,\nclick <strong>Open folder as vault<\/strong> and pick it.<\/p>\n<p>If you are starting from nothing, click <strong>Create new vault<\/strong> instead. Name it\nsomething short you will type often, <code>brain<\/code> works. Pick a folder on your\nmachine and click <strong>Create<\/strong>, then copy the contents of\n<a href=\"../../vault-template/\"><code>vault-template/<\/code><\/a> into it, including the hidden\n<code>.gitignore<\/code>.<\/p>\n<p>Either way, that folder is now your second brain. Everything the agent writes\nlands there as markdown files.<\/p>\n<p>The template is an opinionated starter, not a blank vault: it assumes an agent\nthat works without asking first, six domains and notes in more than one\nlanguage, and it ships with no personal facts. The <a href=\"claude-md.md\">CLAUDE.md\ninterview<\/a> fills in your profile. If you did not run the\nQuickstart's git step, do it once now with the commands in the\n<a href=\"../../vault-template/README.md\">template README<\/a>: the vault has to be its own\ngit repository, not a folder inside another one, because the agent's rails\ncommit a checkpoint before any destructive step.<\/p>\n<h2 id=\"make-one-note-by-hand\">Make one note by hand<\/h2>\n<p>Do this once before automating anything, so the mechanic is not abstract.<\/p>\n<p>Click the new-note icon, type a sentence, then type <code>[[goals]]<\/code>. The bracketed\nword becomes a link to a page called <code>goals<\/code>, whether or not that page exists\nyet. Click it and Obsidian creates the page.<\/p>\n<p>That is the entire data model: notes pointing at notes. Everything the agent\ndoes later is this, at volume, without you doing it.<\/p>\n<h2 id=\"where-to-put-the-vault\">Where to put the vault<\/h2>\n<p>Somewhere with a stable path you can type from a terminal. Avoid a folder your\ncloud sync client rewrites aggressively, because an agent writing files while a\nsync client rewrites them produces conflict copies that are genuinely painful\nto untangle. See <a href=\"git-and-sync.md\">git and sync<\/a> for the options that work.<\/p>\n<p>Avoid spaces in the folder name. You will be pasting this path into commands.<\/p>\n<h2 id=\"settings-worth-changing-now\">Settings worth changing now<\/h2>\n<ul>\n<li><strong>Files and links → New link format:<\/strong> Relative path to file or Shortest path\n  when possible, consistently (Obsidian's\n  <a href=\"https://help.obsidian.md/settings\">settings reference<\/a> lists the options). Mixed link formats are a common cause of broken links\n  after a rename.<\/li>\n<li><strong>Files and links → Automatically update internal links:<\/strong> on.<\/li>\n<li><strong>Editor → Properties in document:<\/strong> Visible (the default) or Source. You want\n  to see the metadata the agent writes, at least for the first weeks.<\/li>\n<\/ul>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"claude-code-setup.md\">Claude Code in the vault<\/a><\/p>"},{"id":"02-setup/claude-code-setup","title":"Claude Code in the vault","html":"<p>Claude Code is the half that reads and writes. Two ways to run it, and the\nchoice only affects where you type, not what happens.<\/p>\n<h2 id=\"option-a-the-desktop-app\">Option A: the desktop app<\/h2>\n<p>Download Claude Desktop from <a href=\"https://claude.com/download\">claude.com/download<\/a>\nand sign in. The app has a <strong>Code<\/strong> tab, which is Claude Code without a\nterminal. If you have never used a command line, start here.<\/p>\n<h2 id=\"option-b-the-terminal\">Option B: the terminal<\/h2>\n<p>Install Claude Code and run <code>claude<\/code> from inside the vault folder:<\/p>\n<pre><code class=\"language-bash\">cd ~/brain\nclaude\n<\/code><\/pre>\n<p>Started this way, the agent reads and writes the vault directly through the\nfilesystem, with no plugin and no MCP server involved. This is the simplest\npossible setup and it is enough for everything in the ingestion, structuring\nand retrieval sections of this guide.<\/p>\n<p>Installation instructions for each platform are in the <a href=\"https://code.claude.com/docs/en/setup\">official setup\ndocs<\/a>.<\/p>\n<h2 id=\"option-c-inside-obsidian\">Option C: inside Obsidian<\/h2>\n<p>Community plugins now embed the agent in the editor, and they are heavily used.\n<a href=\"https://github.com/yishentu/claudian\">Claudian<\/a> and\n<a href=\"https://github.com/logancyang/obsidian-copilot\">Copilot<\/a> each have more than two\nmillion installs in Obsidian's\n<a href=\"https://github.com/obsidianmd/obsidian-releases/blob/master/community-plugin-stats.json\">community-plugin-stats.json<\/a>\n(about 2.3 million each in October 2026). Both can run Claude Code and Codex in a\npane next to your notes. The README of each lists the other agents it supports.<\/p>\n<p>Worth knowing about because it removes the window switching entirely. Worth\nbeing careful with for the same reason this guide keeps ingestion on a\nschedule: an agent in the editor invites ad-hoc edits that never make it into\n<code>log.md<\/code>, and an unlogged vault is one you cannot audit.<\/p>\n<p>A reasonable split is the plugin for conversation and drafting, the terminal or\na scheduled task for anything that writes wiki pages.<\/p>\n<h2 id=\"python-3-for-the-guard-hook\">Python 3 for the guard hook<\/h2>\n<p>The vault template's safety rails include a hook, <code>.claude/hooks/guard.py<\/code>,\nthat Claude Code starts with <code>python3<\/code>. A hook that cannot start blocks\nnothing, so Python 3 is a prerequisite, not an option. Check that\n<code>python3 --version<\/code> prints a version. On a Mac, <code>/usr/bin/python3<\/code> is one of Apple's developer-tool shims\n(<a href=\"https://developer.apple.com/library/archive/technotes/tn2339/_index.html\">TN2339<\/a>); if <code>python3 --version<\/code> asks to install the Command Line Tools instead of printing a version, accept, or install Python from <a href=\"https://www.python.org/downloads/\">python.org<\/a>. After copying the\ntemplate into the vault (see the <a href=\"../../README.md#quickstart\">Quickstart<\/a>), run:<\/p>\n<pre><code class=\"language-bash\">cd ~/brain\npython3 .claude/hooks/test_guard.py\n<\/code><\/pre>\n<p>It should end with \"N/N passed\". Do not rely on the rails until it does.<\/p>\n<h2 id=\"windows\">Windows<\/h2>\n<p>The Quickstart commands are bash. Run them in Git Bash, which comes with <a href=\"https://git-scm.com/download/win\">Git\nfor Windows<\/a>, and they work unchanged. In\nPowerShell, <code>mkdir -p<\/code>, <code>cp -r<\/code>, the <code>rm<\/code> glob and <code>\\<\/code> line continuations fail;\nthe <a href=\"../../README.md#windows\">Quickstart<\/a> has PowerShell equivalents. On Windows\n<code>python3<\/code> is often the Microsoft Store stub: use <code>python<\/code> or <code>py<\/code> for the check\nabove, and change <code>python3<\/code> to <code>python<\/code> or <code>py<\/code> in the three hook entries of\n<code>.claude/settings.json<\/code>, as the <a href=\"../../vault-template/README.md#what-is-enforced-and-what-is-not\">template README<\/a>\ndescribes.<\/p>\n<h2 id=\"plan-requirement\">Plan requirement<\/h2>\n<p>Claude Code needs a paid account: Pro, Max, Team, Enterprise, or a Console\naccount billed per token. The free Claude.ai plan does not include Claude Code\naccess, per Anthropic's own setup documentation. If the Code tab prompts you to\nupgrade, that is why.<\/p>\n<h2 id=\"filesystem-or-mcp\">Filesystem or MCP<\/h2>\n<p>Both work. The difference is narrow and worth knowing before you pick:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Filesystem<\/th>\n<th>MCP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Setup<\/td>\n<td>none, just <code>cd<\/code> into the vault<\/td>\n<td>plugin plus a config command<\/td>\n<\/tr>\n<tr>\n<td>Obsidian open<\/td>\n<td>not required<\/td>\n<td>required, the plugin serves the API<\/td>\n<\/tr>\n<tr>\n<td>Scope<\/td>\n<td>whatever folder you started in<\/td>\n<td>the whole vault, from anywhere<\/td>\n<\/tr>\n<tr>\n<td>Failure mode<\/td>\n<td>none to speak of<\/td>\n<td>plugin off, app closed, wrong port<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Start on the filesystem. Move to <a href=\"mcp-obsidian.md\">MCP<\/a> when you want the agent\nto reach the vault from sessions that are not running inside it, which mostly\nmatters once you add scheduled tasks.<\/p>\n<h2 id=\"first-run\">First run<\/h2>\n<p>Point it at the structure before asking for anything else:<\/p>\n<pre><code>Read CLAUDE.md and wiki/index.md, then tell me what this vault currently\ncontains and what is missing.\n<\/code><\/pre>\n<p>The answer tells you immediately whether the agent understood its instructions.\nIf it starts inventing a structure you did not ask for, your <code>CLAUDE.md<\/code> is too\nvague. See <a href=\"claude-md.md\">writing your CLAUDE.md<\/a>.<\/p>\n<h2 id=\"permissions\">Permissions<\/h2>\n<p>The agent will ask before editing files. Grant it write access to the vault and\nnothing else. Do not grant blanket shell access on a folder that holds anything\nyou cannot lose, and read <a href=\"../06-agents/safety-and-guardrails.md\">guardrails<\/a>\nbefore you automate anything on a schedule.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"mcp-obsidian.md\">MCP for Obsidian<\/a><\/p>"},{"id":"02-setup/mcp-obsidian","title":"MCP for Obsidian","html":"<p>MCP is the standard way Claude talks to other applications. For a vault, it\nadds a door into Obsidian itself rather than into the folder underneath, which\nmeans the agent can work with the vault from any session, not only one started\ninside that directory.<\/p>\n<p>You do not need this to start. Add it when you want scheduled tasks, or when\nyou are working from the desktop app rather than a terminal in the vault.<\/p>\n<h2 id=\"two-routes\">Two routes<\/h2>\n<p>The <a href=\"https://github.com/coddingtonbear/obsidian-local-rest-api\">Local REST API\nplugin<\/a> now ships a\nbuilt-in MCP server at <code>https://127.0.0.1:27124/mcp/<\/code> (HTTP on port 27123 if you\nenable it), so a separate server is no longer required. Its README gives a\n<code>claude mcp add --transport http<\/code> command for it.\nCheck its README first: if the built-in server covers what you need, skip\nstraight to registering it with your client and ignore step 2 below.<\/p>\n<p>The third-party route described here is\n<a href=\"https://github.com/MarkusPfundstein/mcp-obsidian\"><code>mcp-obsidian<\/code><\/a>, which talks\nto the plugin's REST API. Both end up in the same place.<\/p>\n<h2 id=\"step-1-enable-the-plugin\">Step 1: enable the plugin<\/h2>\n<p>In Obsidian: <strong>Settings<\/strong> (gear, bottom left) → <strong>Community plugins<\/strong> → <strong>Turn\non community plugins<\/strong> → <strong>Browse<\/strong> → search <code>Local REST API<\/code> → <strong>Install<\/strong> →\n<strong>Enable<\/strong>. Obsidian's\n<a href=\"https://help.obsidian.md/community-plugins\">community plugins page<\/a> has the\nsteps.<\/p>\n<p>Open the plugin's settings. There is an <strong>API Key<\/strong>, a long string of letters\nand numbers. Copy it.<\/p>\n<p>The plugin's settings page also shows the key inside a ready-made\n<code>Authorization<\/code> header value, with the word <code>Bearer<\/code> in front of it\n(<a href=\"https://github.com/coddingtonbear/obsidian-local-rest-api/blob/main/src/main.ts\">source<\/a>).\nThat word is not part of the key. Copy only the string after it. This is the single most\ncommon reason the connection fails on the first try.<\/p>\n<h2 id=\"step-2-register-the-server\">Step 2: register the server<\/h2>\n<p>In the Claude Code tab or terminal, with your key pasted in place of\n<code>PASTE-YOUR-KEY-HERE<\/code>:<\/p>\n<pre><code class=\"language-bash\">claude mcp add-json obsidian-vault '{\n  &quot;type&quot;: &quot;stdio&quot;,\n  &quot;command&quot;: &quot;uvx&quot;,\n  &quot;args&quot;: [&quot;mcp-obsidian&quot;],\n  &quot;env&quot;: {\n    &quot;OBSIDIAN_API_KEY&quot;: &quot;PASTE-YOUR-KEY-HERE&quot;,\n    &quot;OBSIDIAN_HOST&quot;: &quot;127.0.0.1&quot;,\n    &quot;OBSIDIAN_PORT&quot;: &quot;27124&quot;\n  }\n}'\n<\/code><\/pre>\n<p><code>uvx<\/code> runs the server without a permanent install. If the command is not found,\ninstall <code>uv<\/code> first.<\/p>\n<h2 id=\"step-3-test-it\">Step 3: test it<\/h2>\n<pre><code>List every file in my Obsidian vault.\n<\/code><\/pre>\n<p>If the agent reads your notes back, the connection works.<\/p>\n<h2 id=\"when-it-does-not-work\">When it does not work<\/h2>\n<ul>\n<li><strong>Obsidian is closed.<\/strong> The plugin serves the API from inside the app, so the\n  connection only exists while Obsidian is running.<\/li>\n<li><strong><code>Bearer<\/code> in the key.<\/strong> Strip it.<\/li>\n<li><strong>Wrong port.<\/strong> Check the port shown in the plugin settings against the value\n  in your config. The default is 27124.<\/li>\n<li><strong>Plugin disabled.<\/strong> Turning on Obsidian's\n  <a href=\"https://help.obsidian.md/plugin-security#Restricted+mode\">Restricted mode<\/a>\n  makes it ignore every community plugin.<\/li>\n<\/ul>\n<h2 id=\"do-you-need-this-at-all\">Do you need this at all<\/h2>\n<p>Routing through a REST plugin adds a moving part when a vault is just markdown\nfiles on disk. That is the argument this guide makes for starting on the\nfilesystem, and it is worth taking seriously: MCP earns its place when you need\nthe vault reachable from sessions not running inside it, and not before.<\/p>\n<h2 id=\"security\">Security<\/h2>\n<p>This opens a local HTTP server with a key that grants full read and write access\nto your notes. Keep it on <code>127.0.0.1<\/code>, never expose the port, and treat the key\nlike a password. If you paste it anywhere public, rotate it in the plugin\nsettings.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"claude-md.md\">Writing your CLAUDE.md<\/a><\/p>"},{"id":"02-setup/claude-md","title":"Writing your CLAUDE.md","html":"<p><code>CLAUDE.md<\/code> at the vault root is the file the agent reads at the start of every\nsession. It is the difference between an assistant that knows your situation and\none you brief from scratch every time.<\/p>\n<p>An empty vault with a good <code>CLAUDE.md<\/code> is more useful than a full vault without\none, because context about you shapes every page the agent writes afterwards.<\/p>\n<h2 id=\"do-not-type-it-get-interviewed\">Do not type it, get interviewed<\/h2>\n<p>Writing this file cold produces a thin, generic version. Answering questions\nproduces a specific one. Paste this into the agent:<\/p>\n<pre><code>You are setting up my second brain. Interview me ONE question at a time to\nbuild my profile. Ask about: who I am and what I do, my goals for this year,\nhow I want you to talk to me, my strengths and weaknesses, and my current\nprojects. Wait for each answer before the next question. When finished, write\neverything into CLAUDE.md at the vault root, structured with headers.\n<\/code><\/pre>\n<p>If you use the <a href=\"../../vault-template/CLAUDE.md\">vault template<\/a>, its <code>CLAUDE.md<\/code>\nalready holds the rules and has a Profile block of <code>TODO(interview)<\/code> lines. The\ninterview fills in only that block. Tell the agent to write just the Profile,\nand run it in a live session: the template's agent offers the interview once\nwhen it finds a <code>TODO(interview)<\/code> line, never in a scheduled run, and it edits\nnothing else in the file. Any other change it wants to make, it proposes in its\nrun report.<\/p>\n<p>Answer as if briefing a co-founder on their first day. Vague answers produce a\nvague file, and every session inherits it.<\/p>\n<h2 id=\"what-belongs-in-it\">What belongs in it<\/h2>\n<ul>\n<li><strong>Who you are and what you work on.<\/strong> Enough that a stranger could act on it.<\/li>\n<li><strong>Goals with a horizon.<\/strong> This year, this quarter. Undated goals age badly.<\/li>\n<li><strong>How to talk to you.<\/strong> Length, tone, how much pushback you want.<\/li>\n<li><strong>Your strengths and weak spots.<\/strong> This is what lets the agent know when to\n  challenge you rather than agree.<\/li>\n<li><strong>Current projects,<\/strong> one line each, linked to their folders.<\/li>\n<li><strong>The vault's own rules:<\/strong> folder layout, page contracts, linking rules. The\n  version in <a href=\"../../vault-template/CLAUDE.md\"><code>vault-template/CLAUDE.md<\/code><\/a> is a\n  working starting point. It is an opinionated one: six domains, mixed\n  languages, a page contract with <code>domain<\/code>, <code>lang<\/code> and <code>sensitivity<\/code>, and an\n  Autonomy section with rails and hard stops.<\/li>\n<\/ul>\n<h2 id=\"what-does-not-belong-in-it\">What does not belong in it<\/h2>\n<ul>\n<li>Anything that changes weekly. That goes in the project files.<\/li>\n<li>Long explanations of things the model already knows.<\/li>\n<li>Credentials of any kind.<\/li>\n<li>Aspirational statements you will not act on. The agent takes them literally.<\/li>\n<\/ul>\n<h2 id=\"two-levels\">Two levels<\/h2>\n<p>The root <code>CLAUDE.md<\/code> is the strategy layer: who you are, what you are aiming\nat, how the vault works. Each project folder gets its own <code>CLAUDE.md<\/code> covering\nthat project only. When you open a project as its own vault, the agent reads\njust that one and stops carrying your entire life into every task. See\n<a href=\"project-scoping.md\">project scoping<\/a>.<\/p>\n<h2 id=\"iterate-on-it\">Iterate on it<\/h2>\n<p>When the agent does something wrong twice, that is a <code>CLAUDE.md<\/code> problem, not a\nprompting problem. Add the rule, with the reason attached, because a rule\nwithout a reason gets applied too literally in the cases you did not anticipate.<\/p>\n<p>Re-read the file monthly. Goals move, projects close, and a stale profile\nquietly degrades everything the agent writes.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"vault-structure.md\">Vault structure<\/a><\/p>"},{"id":"02-setup/vault-structure","title":"Vault structure","html":"<p>The vault does two different jobs, and they want different shapes. Keeping them\nin one folder tree while keeping the shapes separate is what makes the system\nhold up past the first month.<\/p>\n<p><strong>The knowledge layer<\/strong> is what you have read and understood. It grows forever\nand it is organised by idea.<\/p>\n<p><strong>The project layer<\/strong> is what you are working on now. It is organised by\npipeline and most of it goes cold when the project ships.<\/p>\n<pre><code>brain/\n  CLAUDE.md            who you are, how the vault works, the agent's rails\n  raw/                 source material by origin; the agent adds, never edits\n    clippings/         web articles from the Web Clipper\n    youtube/           video transcripts\n    meetings/          meeting transcripts and notes\n    workspace/         email, chat, docs, calendar (git-ignored by default)\n    ai-chats/          exported AI chat history\n    inbox/             PDFs, voice notes, anything else\n    assets/            images and attachments\n  wiki/                the knowledge layer\n    sources/           one page per ingested item\n    entities/          people, organisations, products, tools\n    concepts/          ideas, methods, frameworks\n    synthesis/         comparisons, themes, open questions\n    hubs/              one entry page per domain\n    self-improvement/  ideas/, experiments/, reviews/\n    systems/           routing, lifecycle, queue for the owner, operating notes\n    index.md           catalog of every page\n    log.md             what the agent did, chronologically\n  journal/             your own entries; the agent never rewrites them\n  projects/            the project layer\n    youtube-channel/\n      CLAUDE.md        this project only\n      Inputs/          ideas, briefs, raw material\n      Process/         work in progress\n      Outputs/         finished work\n      Feedback/        results, metrics, what happened\n  output/              generated reports and drafts\n  archive/             retired pages, never deleted\n  templates/           page templates\n<\/code><\/pre>\n<p>The tree is the one in <a href=\"../../vault-template/\"><code>vault-template/<\/code><\/a>, which is an\nopinionated starter: several domains, mixed languages, an agent that works\nwithout asking first. The guide teaches the general method. Where the template\nmakes a stricter or more specific choice, this page says so. Delete the domains\nand folders you do not use.<\/p>\n<h2 id=\"why-the-split\">Why the split<\/h2>\n<p>A project pipeline answers \"what am I doing this week\". A wiki answers \"what do\nI know about X\". Force one structure to do both and you get either a knowledge\nbase full of dead task folders, or projects buried under conceptual pages\nnobody opens while working.<\/p>\n<p>They connect through links. A project page links to the concepts it depends on;\nconcept pages accumulate references from the projects that used them. That is\nwhere the compounding shows up: the second time you start a project in a domain,\nthe knowledge layer already has it.<\/p>\n<h2 id=\"set-the-projects-up-by-asking\">Set the projects up by asking<\/h2>\n<pre><code>Create a project folder in my vault called youtube-channel. Inside it, create\nfour folders: Inputs, Process, Outputs, Feedback. Then write a CLAUDE.md inside\nthat project folder describing what this project is, its one goal, and your\nspecific role in helping me hit it. Interview me if you need details.\n<\/code><\/pre>\n<p>Repeat per area: content, finances, clients. One goal per project, stated in\nthe project's own <code>CLAUDE.md<\/code>. Projects with three goals produce work that\nserves none of them.<\/p>\n<h2 id=\"rules-that-keep-it-working\">Rules that keep it working<\/h2>\n<ul>\n<li><strong>Never edit an existing file in <code>raw/<\/code>.<\/strong> It is the archive. If a source is\n  wrong, add the corrected file beside it and re-ingest, so it stays a faithful\n  record of what you actually saved. The template lets the agent add new files\n  there, for example when it pulls from a connected service or writes a\n  cleaned transcript as <code>&lt;name&gt;-clean.md<\/code> beside the original, but never change,\n  rename or delete one that is already there.<\/li>\n<li><strong>Never hard-delete.<\/strong> The template moves retired pages to <code>archive/<\/code>, keeping\n  their path, instead of deleting them. See <a href=\"../06-agents/safety-and-guardrails.md\">safety and\n  guardrails<\/a>.<\/li>\n<li><strong>Do not nest deeply.<\/strong> Folders four levels down stop getting opened. The\n  graph is the navigation, not the tree.<\/li>\n<li><strong>Everything the agent generates for outside use goes to <code>output/<\/code> or the\n  project's <code>Outputs/<\/code>,<\/strong> never loose in the vault root.<\/li>\n<\/ul>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"project-scoping.md\">Project scoping<\/a><\/p>"},{"id":"02-setup/project-scoping","title":"Project scoping","html":"<p>This is the step that most setups skip and then wonder why output quality drops\nas the vault grows.<\/p>\n<p>When the agent is pointed at the whole vault, every task competes with\neverything you have ever saved. It reads a root <code>CLAUDE.md<\/code> covering your entire\nlife, plus whatever else it decides is relevant. Answers get broader and\nshallower.<\/p>\n<p>When it is pointed at one project, it reads that project's <code>CLAUDE.md<\/code>, sees\nthat project's files, and does the job in front of it.<\/p>\n<h2 id=\"how-to-scope\">How to scope<\/h2>\n<p>In Obsidian, click the vault profile (your vault's name) in the bottom left, then\n(<a href=\"https://help.obsidian.md/manage-vaults\">Manage vaults<\/a>):<\/p>\n<p><strong>Manage Vaults... → Open folder as vault → Open → pick your project folder<\/strong><\/p>\n<p>From a terminal, the same thing is just:<\/p>\n<pre><code class=\"language-bash\">cd ~/brain/projects/youtube-channel\nclaude\n<\/code><\/pre>\n<p>The agent now reads only that project's instructions.<\/p>\n<h2 id=\"when-to-use-which\">When to use which<\/h2>\n<p><strong>The full vault<\/strong> for anything that spans domains: planning, review, asking\nwhat you know about a topic, weekly maintenance, ingestion. The knowledge layer\nis the whole point of a wide view.<\/p>\n<p><strong>A single project<\/strong> for producing anything: drafting, building, analysing this\nweek's numbers. Narrow context, one goal, no drift.<\/p>\n<p>The rough rule: the full vault plans, a single project ships.<\/p>\n<h2 id=\"passing-knowledge-into-a-project\">Passing knowledge into a project<\/h2>\n<p>Scoping down cuts the agent off from the wiki, which is usually what you want\nand occasionally not. Two ways to bridge it:<\/p>\n<ul>\n<li>Link the relevant concept pages from the project's <code>CLAUDE.md<\/code>, and copy the\n  handful that genuinely matter into the project's <code>Inputs/<\/code>.<\/li>\n<li>Or run the research question against the full vault first, save the answer\n  into the project's <code>Inputs/<\/code>, then scope down and work.<\/li>\n<\/ul>\n<p>The second is better. It keeps the decision about what matters with you, which\nis the part you should not be delegating.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"live-data.md\">Live data connectors<\/a><\/p>"},{"id":"02-setup/live-data","title":"Live data connectors","html":"<p>Static notes are half a brain. The other half is what is changing: your\ncalendar, your inbox, the channels where decisions actually get made.<\/p>\n<p>MCP connects those the same way it connects Obsidian.<\/p>\n<h2 id=\"calendar\">Calendar<\/h2>\n<pre><code class=\"language-bash\">claude mcp add --transport stdio \\\n  --env GOOGLE_OAUTH_CLIENT_ID=your-client-id \\\n  --env GOOGLE_OAUTH_CLIENT_SECRET=your-client-secret \\\n  google-workspace -- uvx workspace-mcp --tools calendar --read-only\n<\/code><\/pre>\n<p>The server needs an OAuth client of your own from the Google Cloud Console, with\nthe Calendar API enabled; see the\n<a href=\"https://github.com/taylorwilsdon/google_workspace_mcp\">workspace-mcp README<\/a>.\n<code>--read-only<\/code> keeps it from writing. The <code>--<\/code> separates Claude Code's options\nfrom the server command, as described in the\n<a href=\"https://code.claude.com/docs/en/mcp\">Claude Code MCP docs<\/a>. A sign-in opens in\nthe browser on first use.<\/p>\n<p>Then the vault can act on it:<\/p>\n<pre><code>Read my calendar for today, log what I committed to in each meeting into my\ntasks project, and flag anything without a clear next step.\n<\/code><\/pre>\n<p>Email, Slack and Notion connect through their own MCP servers, registered the\nsame way.<\/p>\n<h2 id=\"grant-read-not-write\">Grant read, not write<\/h2>\n<p>Give every connector the narrowest scope that does the job, and prefer read-only\nwherever the option exists. The brain should read your data, not delete it or\nsend things on your behalf.<\/p>\n<h2 id=\"the-rule-that-matters-most\">The rule that matters most<\/h2>\n<p><strong>Keys, not prompts.<\/strong><\/p>\n<p>Telling an agent \"do not delete this\" is a suggestion. It is not a safety\nsetting. If the agent technically can delete a file, empty a folder or send an\nemail, then one day, in some context you did not predict, it will.<\/p>\n<p>Control what is possible at the permission level: read-only tokens, scoped keys,\nseparate credentials per connector. Then the instruction in your <code>CLAUDE.md<\/code> is\na preference on top of a boundary, rather than the only thing standing between\nyour inbox and a bad run.<\/p>\n<p>This applies to your own vault too. See\n<a href=\"../06-agents/safety-and-guardrails.md\">guardrails<\/a>.<\/p>\n<h2 id=\"what-is-worth-connecting\">What is worth connecting<\/h2>\n<p>Connect the sources where decisions and commitments live: calendar first, then\nwhichever of email or chat you actually use for work.<\/p>\n<p>Skip the ones that produce volume without signal. A connector that floods the\nvault with notifications makes every future query worse, because the agent has\nto read past all of it.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"obsidian-plugins.md\">Plugins worth installing<\/a><\/p>"},{"id":"02-setup/obsidian-plugins","title":"Plugins worth installing","html":"<p>Obsidian works fine with none of these. Add them when you hit the specific\nproblem each one solves.<\/p>\n<h2 id=\"local-rest-api\">Local REST API<\/h2>\n<p>Required only for the <a href=\"mcp-obsidian.md\">MCP path<\/a>. Serves your vault over a\nlocal HTTP API so the agent can reach it while Obsidian is open, from any\nsession.<\/p>\n<h2 id=\"dataview\">Dataview<\/h2>\n<p>Queries over frontmatter, rendered inside a note. Worth it once you have enough\npages to want dashboards:<\/p>\n<pre><code>```dataview\nTABLE updated, tags\nFROM &quot;wiki/concepts&quot;\nWHERE updated &lt; date(today) - dur(90 days)\nSORT updated ASC\n```\n<\/code><\/pre>\n<p>That one lists concept pages nobody has touched in three months, which is the\nmost useful review query in the vault.<\/p>\n<h2 id=\"templater\">Templater<\/h2>\n<p>Templates with variables and dates, for the page shapes in\n<a href=\"../../vault-template/templates/\"><code>vault-template/templates/<\/code><\/a>. Useful for the\nnotes you write by hand. The agent does not need it, it writes frontmatter\ndirectly.<\/p>\n<h2 id=\"worth-adding-later\">Worth adding later<\/h2>\n<ul>\n<li><strong><a href=\"https://github.com/Vinzent03/obsidian-git\">Git<\/a><\/strong>, one of the most\n  installed plugins in the catalog (about 3.2 million installs in Obsidian's\n  <a href=\"https://github.com/obsidianmd/obsidian-releases/blob/master/community-plugin-stats.json\">community-plugin-stats.json<\/a>,\n  October 2026). Commits from inside Obsidian, which pairs with\n  <a href=\"../09-maintenance/versioning-with-git.md\">versioning<\/a>.<\/li>\n<li><strong><a href=\"https://github.com/obsidianmd/obsidian-importer\">Importer<\/a><\/strong>, official,\n  pulls in Notion, Evernote, Roam, Bear, Apple Notes and others (see its README\n  for the full list). The first step if you are migrating an existing pile.<\/li>\n<li><strong><a href=\"https://github.com/Vinzent03/find-unlinked-files\">Find orphaned files and broken links<\/a><\/strong>,\n  the same checks as <a href=\"../09-maintenance/lint-and-health.md\">lint<\/a> without leaving\n  the app.<\/li>\n<li><strong><a href=\"https://github.com/scambier/obsidian-omnisearch\">Omnisearch<\/a><\/strong> for better\n  full-text search. Indexing PDFs and images needs the separate\n  <a href=\"https://github.com/scambier/obsidian-text-extractor\">Text Extractor<\/a> plugin,\n  per the Omnisearch README.<\/li>\n<\/ul>\n<p>Full ranked list with install counts:\n<a href=\"../../resources/plugins.md\">resources/plugins.md<\/a>.<\/p>\n<h2 id=\"what-to-avoid\">What to avoid<\/h2>\n<p>Plugins that rewrite files in the background. Anything that auto-formats,\nauto-sorts frontmatter, or renames on a schedule will fight the agent, and you\nwill spend an evening working out which of the two mangled a page.<\/p>\n<p>Also avoid heavy graph or dashboard plugins until you have material worth\nlooking at. An empty vault with fifteen plugins is a procrastination artifact,\nnot a system.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"git-and-sync.md\">Git, sync and backups<\/a><\/p>"},{"id":"02-setup/git-and-sync","title":"Git, sync and backups","html":"<p>A vault is a folder of text files, which makes it close to an ideal git\nrepository, and git is what makes an agent safe to run unattended.<\/p>\n<p>Without version control, a bad run is a mystery. With it, every change the agent\nmade is a diff you can read and revert in one command.<\/p>\n<pre><code class=\"language-bash\">cd ~/brain\ngit init\ngit add .gitignore CLAUDE.md README.md templates wiki projects output journal archive raw .obsidian \\\n  .claude/settings.json .claude/hooks .claude/skills .claude/commands .claude/agents scripts\ngit commit -m &quot;Initial vault&quot;\n<\/code><\/pre>\n<p>The vault must be its own repository, not a folder inside another one. The\n<a href=\"../../vault-template/README.md\">vault template<\/a> uses the explicit-path first\ncommit above instead of <code>git add .<\/code>, so nothing you have not looked at is\ncommitted. It includes <code>.claude/<\/code> (settings, hooks, skills, commands, agents) and <code>scripts/<\/code>\n(the six vault scripts the Quickstart copies, not the site builders), the\nvault's agent setup, which is worth versioning so a revert covers it too. <code>raw<\/code>\nis included so the empty subfolders are tracked.<\/p>\n<p>The template's <code>.claude/settings.json<\/code> and <code>.claude/hooks/guard.py<\/code> block pushes,\ndeletion, changes to existing <code>raw/<\/code> files, and writes to <code>journal/<\/code>, <code>scripts/<\/code>\nand <code>.claude/<\/code> before they run; commit them so\na revert restores them too. See\n<a href=\"../../vault-template/README.md#what-is-enforced-and-what-is-not\">what is enforced<\/a>.<\/p>\n<p>The template's <code>.gitignore<\/code> already covers the list below plus <code>raw/workspace/<\/code>,\nwhere email, chat, docs and calendar pulls land. Its agent will\nnot run <code>git init<\/code> for you; if the vault is nested in another repository it\nqueues the problem for you instead.<\/p>\n<h2 id=\"what-to-ignore\">What to ignore<\/h2>\n<pre><code>.obsidian/workspace*\n.obsidian/cache\n.DS_Store\n.trash/\n<\/code><\/pre>\n<p>Commit the rest of <code>.obsidian/<\/code>, so your plugin list and settings travel with\nthe vault. Never commit API keys; the Local REST API key lives in plugin data,\nso check what <code>.obsidian/plugins/<\/code> contains before the first push.<\/p>\n<p>If any part of the vault is private, keep the remote private. A second brain is\none of the highest-signal documents about a person that exists.<\/p>\n<h2 id=\"commit-around-agent-runs\">Commit around agent runs<\/h2>\n<p>Commit before a big ingest and after it. Then a bad batch is a revert of one\ncommit rather than an afternoon of manual repair. Scheduled tasks should commit\ntheir own work, by path and not with <code>git add -A<\/code>, with a message naming the\nrun, so the history stays readable months later and a revert leaves your own\nedits alone.<\/p>\n<h2 id=\"sync-across-machines\">Sync across machines<\/h2>\n<ul>\n<li><strong>Git remote:<\/strong> free, versioned, works everywhere, needs a pull and push\n  habit.<\/li>\n<li><strong><a href=\"https://help.obsidian.md/sync\">Obsidian Sync<\/a>:<\/strong> a paid add-on, end-to-end encrypted by default\n  (<a href=\"https://help.obsidian.md/sync/security\">security and privacy<\/a>), with mobile support.<\/li>\n<li><strong>Generic cloud drives:<\/strong> work, with a caveat. A sync client rewriting files\n  while an agent writes them produces conflict copies. If you go this route,\n  keep long-running agent work to one machine.<\/li>\n<\/ul>\n<h2 id=\"backups\">Backups<\/h2>\n<p>Sync is not backup. Sync propagates a bad delete to every device.<\/p>\n<p>Keep one copy that is not connected to the sync path: a periodic archive to\nexternal storage or a separate remote. Test a restore once, before you need it.\nThe failure mode you are protecting against is not disk death, it is an\nautomation that quietly rewrote two hundred pages three weeks ago.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p>The vault is set up. Go to <a href=\"../03-ingestion/README.md\">Ingestion<\/a> to start\nfeeding it, or <a href=\"../04-structuring/README.md\">Structuring<\/a> for the rules that\ndecide what the pages look like.<\/p>"},{"id":"03-ingestion/web-clipper","title":"Web articles","html":"<p>Articles are the bulk of what most people save, and the browser is where the\ndecision to save happens. Anything that requires switching windows loses.<\/p>\n<h2 id=\"obsidian-web-clipper\">Obsidian Web Clipper<\/h2>\n<p>The <a href=\"https://obsidian.md/clipper\">official extension<\/a> from the Obsidian team.\nPer Obsidian's <a href=\"https://help.obsidian.md/web-clipper\">Web Clipper\nhelp<\/a>, it is available for Chrome, Brave,\nArc, Orion and other Chromium-based browsers, for Firefox, for Safari and for\nEdge. It uses <a href=\"https://github.com/kepano/defuddle\">Defuddle<\/a> to capture only the\nmain content of a page and saves it as markdown straight into your vault.<\/p>\n<p>Install it, open the settings, and set the destination folder to <code>raw/clippings/<\/code>, which is where the\n<a href=\"../../vault-template/raw/README.md\">vault template<\/a> expects web articles.<\/p>\n<h2 id=\"template\">Template<\/h2>\n<p>The default template saves the page body. Add frontmatter so the agent knows\nwhat it is holding without re-reading the whole file:<\/p>\n<pre><code>---\ntitle: {{title}}\nsource: {{url}}\nauthor: {{author}}\npublished: {{published}}\nclipped: {{date}}\ntype: article\n---\n\n{{content}}\n<\/code><\/pre>\n<p>These are Web Clipper's\n<a href=\"https://help.obsidian.md/web-clipper/variables\">preset variables<\/a>.\n<code>{{author}}<\/code> and <code>{{published}}<\/code> come back empty on plenty of sites. That is\nfine, an empty field is better than a guessed one, and the agent handles the\ngap by saying the source is undated rather than inventing a date.<\/p>\n<h2 id=\"what-to-clip\">What to clip<\/h2>\n<p>Clip what you would want to find again in a year: primary sources, engineering\nposts, papers, documentation, arguments you disagree with and want to answer\nlater.<\/p>\n<p>Skip news that will be stale in a week, listicles, and anything you are saving\nout of guilt. Every low-value page you ingest costs twice: once at ingest, and\nagain every time the agent reads past it looking for something else.<\/p>\n<p>The honest test at clip time is whether you can name what you would ask this\nsource later. If you cannot, do not clip it.<\/p>\n<h2 id=\"awkward-pages\">Awkward pages<\/h2>\n<ul>\n<li><strong>Paywalls.<\/strong> The clipper saves what the browser rendered. If you can read it,\n  it can save it. If you cannot, it saves the paywall notice, so check before\n  moving on.<\/li>\n<li><strong>Documentation sites.<\/strong> Clipping page by page is a losing game. Save the\n  entry point and let the agent fetch the rest, or clone the docs repo into\n  <code>raw/<\/code> if it is open source.<\/li>\n<li><strong>Single-page apps and dynamic content.<\/strong> The main-content extraction sometimes\n  returns a fragment (Obsidian's\n  <a href=\"https://help.obsidian.md/web-clipper/troubleshoot\">troubleshooting page<\/a> says\n  it can be overly conservative and describes how to bypass it). Look at the file before ingest.<\/li>\n<li><strong>Threads and comment sections.<\/strong> The value is usually in the replies, which\n  the clipper drops. Copy the thread manually or screenshot it into\n  <code>raw/assets/<\/code>.<\/li>\n<\/ul>\n<h2 id=\"clip-now-ingest-later\">Clip now, ingest later<\/h2>\n<p>Clipping and ingesting are separate steps on purpose. Clip freely during the\nday, run <code>/ingest<\/code> in one batch later, because ingesting one source at a time\ngives the agent no chance to spot that three things you saved this week are\nabout the same idea.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"youtube-transcripts.md\">YouTube and podcasts<\/a><\/p>"},{"id":"03-ingestion/youtube-transcripts","title":"YouTube and podcasts","html":"<p>Video is the highest-volume, lowest-retention source most people have. An hour\nof a conference talk leaves almost nothing behind a week later. Transcripts fix\nthat, and a transcript is just text, which is exactly what the vault wants.<\/p>\n<h2 id=\"pulling-a-transcript\">Pulling a transcript<\/h2>\n<p>Most videos have captions, auto-generated or uploaded. Two dependable routes\n(flags per the <a href=\"https://github.com/yt-dlp/yt-dlp#subtitle-options\">yt-dlp README<\/a>,\nAPI per the <a href=\"https://github.com/jdepoix/youtube-transcript-api\">youtube-transcript-api\nREADME<\/a>):<\/p>\n<pre><code class=\"language-bash\"># yt-dlp: subtitles only, no video download\nyt-dlp --write-auto-subs --skip-download --sub-format vtt --sub-langs en URL\n<\/code><\/pre>\n<pre><code class=\"language-python\"># youtube-transcript-api, if you want it in a script\nfrom youtube_transcript_api import YouTubeTranscriptApi\nlines = YouTubeTranscriptApi().fetch(&quot;VIDEO_ID&quot;)  # pass the video ID, not the URL\nfor snippet in lines:\n    print(snippet.start, snippet.text)\n<\/code><\/pre>\n<p>Save the result into <code>raw/<\/code> with frontmatter naming the video, the channel and\nthe URL. Without the URL, a transcript is an anonymous wall of text and the\nagent cannot cite it properly.<\/p>\n<h2 id=\"keep-the-timestamps\">Keep the timestamps<\/h2>\n<p>Auto-generated transcripts arrive as timestamped fragments. Strip the\nformatting, keep coarse timestamps every few minutes.<\/p>\n<p>The reason is retrieval: when the wiki says a claim came from minute 34 of a\ntalk, you can verify it in ten seconds. Without that, checking means rewatching,\nwhich means you will not check.<\/p>\n<h2 id=\"clean-before-ingest\">Clean before ingest<\/h2>\n<p>Auto-captions have no punctuation, no speaker labels, and mangle technical\nterms. Have the agent do a pass first:<\/p>\n<pre><code>Read raw/youtube/talk-transcript.md. Add punctuation and paragraph breaks, label\nspeakers where they change, and fix obvious mistranscriptions of technical\nterms. Do not summarise, do not cut anything, and flag anything you could not\nmake sense of.\n<\/code><\/pre>\n<p>Do not skip to ingesting the raw caption dump. Concept pages built from\nunpunctuated text come out noticeably worse, because the model spends its\nattention reconstructing sentence boundaries instead of understanding claims.<\/p>\n<h2 id=\"long-videos\">Long videos<\/h2>\n<p>A three-hour podcast is not one source. Split it by topic before ingesting,\neither by chapter markers if the uploader added them, or by asking the agent to\npropose split points from the transcript.<\/p>\n<p>Ingested whole, a long interview produces one bloated source page and two or\nthree vague concepts. Split, it produces the four ideas that were actually in\nit.<\/p>\n<h2 id=\"podcasts-and-audio\">Podcasts and audio<\/h2>\n<p>Podcasts rarely ship transcripts. Options, in order of effort: check the show\nnotes, many now publish one; run local transcription with Whisper; or use a\ntranscription service.<\/p>\n<p>Local transcription is worth setting up if you listen daily. The audio never\nleaves your machine, which matters more for meeting recordings than for\npodcasts.<\/p>\n<h2 id=\"what-is-worth-transcribing\">What is worth transcribing<\/h2>\n<p>Talks, lectures, interviews with practitioners, anything with a specific claim\nyou might need later.<\/p>\n<p>Not tutorials you watched to do a task once, and not anything you would not\nreread as an article. Video feels valuable while watching because it takes an\nhour. That feeling is not a signal about the content.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"pdfs-and-books.md\">PDFs, papers and books<\/a><\/p>"},{"id":"03-ingestion/pdfs-and-books","title":"PDFs, papers and books","html":"<p>PDFs are the format most likely to arrive in your vault as garbage. Two columns\nbecome interleaved lines, tables collapse, footnotes land mid-sentence, and the\nagent quietly builds pages on top of the mess.<\/p>\n<p>Check extraction quality before ingesting. It takes ten seconds and saves\nrewriting pages later.<\/p>\n<h2 id=\"extraction\">Extraction<\/h2>\n<pre><code class=\"language-bash\"># text, layout preserved reasonably well\npdftotext -layout paper.pdf raw/inbox/paper.md\n<\/code><\/pre>\n<p>For anything structured, <a href=\"https://github.com/pymupdf/PyMuPDF\">PyMuPDF<\/a> gives\nbetter control and can pull images and tables separately. Whatever you use, open the output and read a paragraph from\nthe middle. If the sentences do not flow, fix extraction rather than hoping the\nagent copes.<\/p>\n<h2 id=\"scanned-documents\">Scanned documents<\/h2>\n<p>A scan is an image, and text extraction returns nothing or near-nothing. Run OCR\nfirst with <a href=\"https://github.com/ocrmypdf/OCRmyPDF\"><code>ocrmypdf<\/code><\/a>, which adds an\nOCR text layer to scanned PDFs so they can be searched. Expect errors in proper nouns and numbers, and treat any figure from\nan OCR'd source as needing verification before it goes into a wiki page as\nfact.<\/p>\n<h2 id=\"papers\">Papers<\/h2>\n<p>Papers deserve different handling than articles, because the parts you will\nwant later are not spread evenly. Abstract, method, results and limitations\ncarry almost everything.<\/p>\n<p>A useful ingest instruction:<\/p>\n<pre><code>This is an academic paper. Build the source page around: the question it asks,\nthe method, the result with its actual numbers, and the limitations the authors\nstate themselves. Record sample sizes. Do not report a finding without the\ncondition it holds under.\n<\/code><\/pre>\n<p>That last rule is what keeps a wiki honest. Findings stripped of their\nconditions become confident nonsense two years later.<\/p>\n<p>Zotero is worth using if you read papers regularly. It handles the metadata\nand the library; check what format your export produces before it lands in\n<code>raw/<\/code>.<\/p>\n<h2 id=\"books\">Books<\/h2>\n<p>A full book is too large to ingest as one source and mostly not worth it. What\nis worth it is your highlights.<\/p>\n<p>Kindle highlights can come through Readwise, whose <a href=\"https://github.com/readwiseio/obsidian-readwise\">official Obsidian\nplugin<\/a> syncs highlights into a\nvault, Kindle among its sources. Highlights arrive as a list of quoted passages, so\ningest them as one source page per book, and let the agent build concept pages\nfrom the ideas rather than from the quotes.<\/p>\n<p>Keep the quotes short in the wiki and keep the citation. A page that reproduces\nhalf a chapter is a copyright problem and a retrieval problem at the same time.<\/p>\n<h2 id=\"figures-and-tables\">Figures and tables<\/h2>\n<p>Text extraction drops both. When a figure carries the argument, screenshot it\ninto <code>raw/assets/<\/code> and reference it from the source page, so the claim on the\npage has something behind it.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"chat-exports.md\">Chat exports<\/a><\/p>"},{"id":"03-ingestion/chat-exports","title":"Chat exports","html":"<p>Your chat history is the most underrated source you own and the most sensitive.\nYears of problems you worked through, decisions you reasoned about, and\nexplanations tailored to what you did not understand at the time.<\/p>\n<p>It is also full of things you would not want in a file you might later share.\nRead the privacy section below before running anything here.<\/p>\n<h2 id=\"exporting\">Exporting<\/h2>\n<p>Both Claude and ChatGPT can export your history from account settings, and the\nexport arrives as a download link by email. For Claude it is <strong>Settings →\nPrivacy → Export data<\/strong>; the link expires 24 hours after delivery, and Team and\nEnterprise members must ask their organization's Primary Owner\n(<a href=\"https://support.claude.com/en/articles/9450526-how-can-i-export-my-claude-data\">Anthropic help<\/a>).\nThe script below expects JSON, so open the export and check the file you got\nbefore running it.<\/p>\n<h2 id=\"converting-to-markdown\">Converting to markdown<\/h2>\n<p>One JSON blob is not ingestible. Split it into one file per conversation:<\/p>\n<pre><code class=\"language-bash\">python3 scripts/chat_export_to_m
