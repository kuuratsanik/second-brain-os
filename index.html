d.py conversations.json ./raw --min-words 150\n<\/code><\/pre>\n<p>The script is in <a href=\"../../scripts/README.md\"><code>scripts/<\/code><\/a>. It handles the common\nexport shapes, writes frontmatter with the title and date, and skips\nconversations shorter than the word threshold.<\/p>\n<p>Raise <code>--min-words<\/code> if the output is dominated by one-line exchanges. Most\npeople's history is roughly ninety percent short throwaway questions, and those\nadd nothing but volume.<\/p>\n<h2 id=\"filter-before-ingesting\">Filter before ingesting<\/h2>\n<p>Do not ingest the whole export. A thousand conversations produce a thousand\nsource pages and a wiki where everything is faintly connected to everything.<\/p>\n<p>Sort into three piles:<\/p>\n<ul>\n<li><strong>Worth ingesting.<\/strong> Conversations where you worked something out, decided\n  something, or got an explanation that landed. These carry your reasoning, not\n  just facts.<\/li>\n<li><strong>Worth keeping, not ingesting.<\/strong> Leave them in <code>raw/<\/code> as an archive. The\n  agent can search them on demand without every one having a wiki page.<\/li>\n<li><strong>Skip.<\/strong> Debugging sessions, one-off lookups, anything you would be\n  annoyed to find in a search result. Skipped means not ingested: the file stays\n  in <code>raw/<\/code> and no page is made. The template's agent never deletes from <code>raw/<\/code>,\n  so if a file should not exist at all, remove it yourself.<\/li>\n<\/ul>\n<p>Have the agent help with the sort rather than doing it by hand:<\/p>\n<pre><code>Read the titles and first exchange of every file in raw/ai-chats/. Group them\ninto worth-ingesting, archive, and skip, with one line of reasoning each. Do not\nmove or delete anything, just give me the lists.\n<\/code><\/pre>\n<h2 id=\"what-makes-these-sources-different\">What makes these sources different<\/h2>\n<p>A chat log is a record of you thinking, which means the useful extraction is\noften not the answer. It is the question you asked, the thing you had wrong at\nthe start, and what changed your mind.<\/p>\n<p>Tell the agent so:<\/p>\n<pre><code>These are my own past conversations. Build pages around what I was trying to\nwork out and what conclusion I reached, not around the assistant's explanations.\nNote where I changed position, and record the date, because my views may have\nmoved since.\n<\/code><\/pre>\n<h2 id=\"privacy\">Privacy<\/h2>\n<p>Chat history contains more about you than any other file in the vault: health,\nmoney, work you cannot discuss, other people's information you happened to\nmention.<\/p>\n<p>Before ingesting, decide what does not belong in the vault at all and remove\nthose files from <code>raw/<\/code> yourself, by hand; the template's agent never deletes\nthere. Redaction after the fact is unreliable, because the material will already\nhave propagated into concept pages and links. If you would rather keep the\nfiles, leave them in <code>raw/ai-chats/<\/code> and skip them.<\/p>\n<p>If the vault lives in a git repo, keep the remote private. See\n<a href=\"../09-maintenance/privacy-and-secrets.md\">privacy<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"voice-and-meetings.md\">Voice notes and meetings<\/a><\/p>"},{"id":"03-ingestion/voice-and-meetings","title":"Voice notes and meetings","html":"<p>The ideas worth capturing rarely arrive at your desk. Voice is the only capture\nmethod that works while walking, driving or standing in a queue, and it is the\none most vaults never wire up.<\/p>\n<h2 id=\"capture\">Capture<\/h2>\n<p>Any recorder app works, as long as the file ends up somewhere the vault can\nreach. The friction to eliminate is the transfer: if getting audio from phone to\nvault takes more than one action, you will stop.<\/p>\n<p>Simplest reliable setup: record in the phone's default app, share to a cloud\nfolder, and have a scheduled task transcribe anything new into <code>raw/<\/code>.<\/p>\n<p>Obsidian's <a href=\"https://help.obsidian.md/plugins/audio-recorder\">Audio recorder<\/a>\ncore plugin records audio into a note and saves the file in your vault. If you\nsync your vault to your phone, that can remove the transfer; check that the\nplugin works in your mobile app.<\/p>\n<h2 id=\"transcription\">Transcription<\/h2>\n<p><a href=\"https://github.com/openai/whisper\">Whisper<\/a> is open source, runs locally, and is good enough for a voice note recorded at arm's\nlength. Local matters more here than for other sources, because voice notes\ncarry half-formed thoughts and meeting audio carries other people's words.<\/p>\n<p>Expect names and technical terms to come out wrong. Correct them at ingest, not\nlater, while you still remember what you said.<\/p>\n<h2 id=\"voice-notes-are-drafts-not-sources\">Voice notes are drafts, not sources<\/h2>\n<p>A voice note is you thinking out loud, with false starts and abandoned\nsentences. Ingesting it verbatim produces an incoherent source page.<\/p>\n<p>Treat the transcript as raw input to a single idea:<\/p>\n<pre><code>This is a voice note, my own thinking out loud. Extract the actual idea, drop\nthe false starts and repetition, and write it as one short concept page in my\nwords. If there are two unrelated ideas, make two pages. Keep the recording date.\n<\/code><\/pre>\n<h2 id=\"meetings\">Meetings<\/h2>\n<p>Meetings produce three things worth keeping and a great deal that is not: the\ndecisions, the commitments with owners, and the open questions.<\/p>\n<pre><code>This is a meeting transcript. Extract decisions made, commitments with who owns\neach one, and open questions. Link every person mentioned to their entity page.\nSkip discussion that did not lead anywhere.\n<\/code><\/pre>\n<p>Route the commitments into the relevant project's <code>Inputs/<\/code> rather than the\nwiki. A commitment is work, not knowledge, and it goes stale in a week. The\n<a href=\"../01-concepts/two-layers.md\">two layers<\/a> page covers why that separation\nmatters.<\/p>\n<h2 id=\"consent-and-other-people\">Consent and other people<\/h2>\n<p>Recording other people has legal requirements that vary by jurisdiction, and\nthey are not a formality. Some places require every participant to consent.<\/p>\n<p>Separately from legality: a meeting transcript contains other people's\nunguarded words. Keep those out of any vault you might share, and think about\nwhether the meeting needs to be in the knowledge layer at all, or whether the\nthree extracted decisions are enough.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"newsletters-and-email.md\">Newsletters and email<\/a><\/p>"},{"id":"03-ingestion/newsletters-and-email","title":"Newsletters and email","html":"<p>Newsletters are the easiest source to automate and the easiest to over-ingest.\nAutomate the capture, then be strict about what gets a wiki page, because a feed\nthat files itself will happily fill your vault with a hundred pages a month that\nyou never asked for.<\/p>\n<h2 id=\"a-dedicated-address\">A dedicated address<\/h2>\n<p>Make an address that exists only for the vault, and resubscribe your newsletters\nto it. That single move separates the material you want to keep from everything\nelse in your inbox, and it means automation never touches your real mail.<\/p>\n<p>From there, forward that address into <code>raw/<\/code> with whatever automation you\nalready use. Any rule that can write a file works.<\/p>\n<h2 id=\"deduplicate\">Deduplicate<\/h2>\n<p>Newsletters repeat themselves. The same launch appears in four different digests\nin the same week, each with the same facts and a different opening line.<\/p>\n<p>Ingested straight, you get four source pages saying one thing and a concept page\nciting all four as if that were corroboration. Cross-references between\nnewsletters are not independent confirmation, and a wiki that treats them as\nsuch will overstate how well established something is.<\/p>\n<p>Instruct the ingest explicitly:<\/p>\n<pre><code>These are newsletters. Several will cover the same item. Group them by topic\nfirst, write one source page per actual item citing every newsletter that\nmentioned it, and note where they disagree. Do not treat repetition across\nnewsletters as confirmation.\n<\/code><\/pre>\n<h2 id=\"what-deserves-a-page\">What deserves a page<\/h2>\n<p>Newsletters are mostly links with commentary. The commentary is rarely worth a\nconcept page; the thing being linked sometimes is.<\/p>\n<p>The useful pattern is to let the agent read the digests and hand you a shortlist:<\/p>\n<pre><code>Read this week's newsletters in raw/inbox/. List anything worth reading in\nfull, with one line on why. Ingest nothing yet.\n<\/code><\/pre>\n<p>The vault template has no folder of its own for newsletters, so they land in\n<code>raw/inbox/<\/code>, or in <code>raw/workspace/email/<\/code> if they arrive through a Gmail pull.\nAdd a <code>raw/newsletters/<\/code> folder, and a row in <code>wiki/systems/routing.md<\/code>, if you\nget enough of them to want one.<\/p>\n<p>Then clip the two or three primary sources properly and ingest those. The\nnewsletter did its job as a filter, and the vault ends up with the actual source\ninstead of a summary of it.<\/p>\n<h2 id=\"regular-email\">Regular email<\/h2>\n<p>Most email should not be in a second brain. Threads about scheduling, receipts,\nback and forth about logistics: none of it is knowledge, all of it is volume.<\/p>\n<p>Worth ingesting: threads where a real decision was made or something was\nexplained properly. Route those in by forwarding to the capture address, one\nthread at a time, deliberately.<\/p>\n<p>Never wire your whole inbox into <code>raw/<\/code> on a schedule. It ingests everything\nabout everyone you correspond with, most of it not yours to keep.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"bulk-backfill.md\">Backfilling years of material<\/a><\/p>"},{"id":"03-ingestion/bulk-backfill","title":"Backfilling years of material","html":"<p>At some point you will want to import everything: the bookmark folder, the\ndownloads directory, three years of chat history, the read-later queue with\neight hundred unread items.<\/p>\n<p>This is the run that goes wrong. It is expensive, it takes hours, and done in\nthe wrong order it produces a wiki that reads like a pile rather than a\nstructure. It is also the run that makes the vault genuinely useful in one\nsitting, so it is worth doing carefully.<\/p>\n<h2 id=\"order-matters\">Order matters<\/h2>\n<p>Process oldest first.<\/p>\n<p>The reason is that later sources should update pages that earlier sources\ncreated. Run it that way and the wiki records how your understanding developed:\nthe early page on a topic, then the correction, then the current position.<\/p>\n<p>Run it newest first and every old source arrives as a contradiction to be\nreconciled against a page that already has the final answer. The agent spends\nits work reconciling, the history comes out inverted, and you lose the one thing\nthis structure gives you over a search index.<\/p>\n<h2 id=\"batch-always\">Batch, always<\/h2>\n<p>Ten sources per batch. After each batch: update <code>index.md<\/code>, append to <code>log.md<\/code>,\ncommit, report.<\/p>\n<pre><code>/backfill raw/inbox/2024\n<\/code><\/pre>\n<p>The <code>backfill<\/code> command in <a href=\"../../commands/README.md\"><code>commands/<\/code><\/a> works this\nway and stops between batches for a go-ahead.<\/p>\n<p>Batching exists for three reasons. Cost stays visible while you can still stop.\nQuality stays checkable, so you catch a bad page contract on page ten rather\nthan page four hundred. And a crash costs you one batch instead of the run.<\/p>\n<h2 id=\"check-the-first-batch-properly\">Check the first batch properly<\/h2>\n<p>Read every page the first batch produced. All of them.<\/p>\n<p>This is the moment to catch systematic problems: pages that are summaries rather\nthan explanations, concepts that are too granular, links that are decorative,\nfrontmatter that is wrong. Fix <code>CLAUDE.md<\/code> and re-run the batch before\ncontinuing.<\/p>\n<p>A flaw you let through in batch one is a flaw in four hundred pages by the end,\nand fixing it afterwards costs more than the original run.<\/p>\n<h2 id=\"cost-control\">Cost control<\/h2>\n<p>Backfilling a thousand sources is a real bill. Ways to keep it sane:<\/p>\n<ul>\n<li><strong>Filter first.<\/strong> Most archives are half dead links and things you saved and\n  never opened. Have the agent triage titles before ingesting anything.<\/li>\n<li><strong>Cap the batch size<\/strong> and watch what the first few cost before scaling.<\/li>\n<li><strong>Skip the archive tier.<\/strong> Not everything needs a wiki page; leaving material\n  in <code>raw/<\/code> still leaves it searchable.<\/li>\n<\/ul>\n<h2 id=\"dead-links\">Dead links<\/h2>\n<p>Old bookmark exports are full of pages that no longer exist. Check before\ningesting rather than discovering it halfway:<\/p>\n<pre><code class=\"language-bash\"># one URL per line in urls.txt; prints the ones that do not answer\npython3 -c &quot;\nimport sys, urllib.request as u\nfor l in sys.stdin:\n    url = l.strip()\n    try: u.urlopen(u.Request(url, method='HEAD'), timeout=10)\n    except Exception as e: print(url, e)\n&quot; &lt; urls.txt\n<\/code><\/pre>\n<p>Some servers refuse HEAD requests, so treat the output as a list to check by\nhand, not a verdict.<\/p>\n<p>For anything valuable that is gone, the Internet Archive usually has a copy.\nClip from there and note in the frontmatter that the original is dead, because a\nsource page whose URL 404s is unverifiable a year later.<\/p>\n<h2 id=\"resuming\">Resuming<\/h2>\n<p>Record progress in <code>log.md<\/code> as you go, one line per batch with the folder and\nrange covered. When the run stops halfway, and it will, you resume from the log\ninstead of guessing which files were done.<\/p>\n<h2 id=\"after-the-backfill\">After the backfill<\/h2>\n<p>Run a full lint. A large import always leaves orphans, near-duplicates and\nbroken links.<\/p>\n<pre><code>/lint\n<\/code><\/pre>\n<p>Then run a review to see what the vault now contains, because after a backfill\nit knows things you have forgotten you saved. That moment is the payoff for the\nwhole exercise.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../04-structuring/README.md\">Structuring<\/a>, for the rules that decide what all\nthese pages actually look like.<\/p>"},{"id":"04-structuring/atomic-pages","title":"One page, one idea","html":"<p>A page holds one idea, explained well enough that someone who has never seen the\nsource understands it.<\/p>\n<p>The rule exists because of how retrieval works. When the agent answers a\nquestion, it pulls in whole pages. A page covering four topics drags three\nirrelevant ones into context every time it is touched. A page covering one gets\nlinked precisely, retrieved precisely, and updated without collateral damage.<\/p>\n<h2 id=\"what-atomic-means-here\">What atomic means here<\/h2>\n<p>Not short. A concept page can run several hundred words. Atomic means it has one\nsubject and you could give it an accurate title without using \"and\".<\/p>\n<p>If the title needs \"and\", or the page has section headings for unrelated\nsubjects, it is two pages.<\/p>\n<h2 id=\"splitting-a-source\">Splitting a source<\/h2>\n<p>One article usually yields one to three concepts worth their own page, plus the\nsource page recording what the article itself said.<\/p>\n<p>The test for whether something deserves a page: can it be explained without\nreferring back to this one source? An idea that only makes sense as \"what this\narticle argued\" belongs inside the source page. An idea that will recur across\nother sources needs its own page, because that is where the other sources will\nattach.<\/p>\n<h2 id=\"the-failure-in-both-directions\">The failure in both directions<\/h2>\n<p><strong>Over-splitting<\/strong> produces ten pages from one article, each a restated\nparagraph, each linking only back to the source. The graph looks dense and says\nnothing. This is the more common failure with agents, because splitting feels\nlike thoroughness.<\/p>\n<p><strong>Under-splitting<\/strong> produces source pages that are article summaries and a wiki\nwith no concepts at all. You end up with a searchable archive, which you already\nhad.<\/p>\n<p>If you are unsure, write fewer pages. Merging later is cheap; untangling a\nhundred fragments is not.<\/p>\n<h2 id=\"length\">Length<\/h2>\n<p>A concept page under about eighty words is usually a stub that failed, not a\npage that was efficient. (The lint check flags any page under about forty words\nwith no links; the eighty-word figure is the stricter bar for concept pages.) Either the source did not really cover it, or the agent\ngave up. Both are worth catching in a lint pass.<\/p>\n<p>A page over roughly a thousand words is usually two ideas that grew together.\nRead it and look for the seam.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"page-types.md\">The four page types<\/a><\/p>"},{"id":"04-structuring/page-types","title":"The four page types","html":"<p>Four types, each with a job. Every page declares its type in frontmatter, which\nis what lets you query the vault by shape rather than reading everything.<\/p>\n<h2 id=\"sources\">Sources<\/h2>\n<p>One page per ingested item. What this article, video, paper or conversation\nsaid.<\/p>\n<p>Records claims as claims: this source says X, with the URL, author and date\nattached. It does not evaluate. It does not merge in what other sources think.<\/p>\n<p>Source pages are the audit trail. When a concept page says something surprising,\nthe source pages behind it are how you check whether it was ever true.<\/p>\n<h2 id=\"entities\">Entities<\/h2>\n<p>People, organisations, products, tools. What it is, why it appears in your\nvault, and everything that mentions it.<\/p>\n<p>Entity pages are cheap to create and pay off in a way that is not obvious until\nthe vault is large. They become the natural join points: three unrelated sources\nthat all mention the same company suddenly connect through it, and that\nconnection is often the thing worth noticing.<\/p>\n<p>Do not write biographies. An entity page holds what is relevant to your vault,\nnot what Wikipedia holds.<\/p>\n<h2 id=\"concepts\">Concepts<\/h2>\n<p>Ideas, methods, frameworks, arguments. These are the pages that compound.<\/p>\n<p>A concept page explains the idea in plain language, says where it came from,\nwhat supports it, what argues against it, and what is still unclear. Written\nwell, it is readable by someone who has seen none of your sources, including\nyou in a year.<\/p>\n<p>This is the only page type where the agent should be synthesising across\nsources rather than recording.<\/p>\n<h2 id=\"synthesis\">Synthesis<\/h2>\n<p>Comparisons, themes, open questions. A synthesis page exists only when it says\nsomething no single source did: two sources disagree, three describe the same\npattern, a question keeps recurring across unrelated material.<\/p>\n<p>The rule that keeps these honest: do not write a synthesis page to have one. An\nagent asked for synthesis will always produce something, and manufactured themes\nare the fastest way to fill a wiki with confident nonsense.<\/p>\n<h2 id=\"where-the-types-blur\">Where the types blur<\/h2>\n<p>Some things are legitimately two types. A methodology named after its author is\nboth an entity and a concept. Pick one, usually the concept, and give the other\nan alias pointing at it.<\/p>\n<p>Some things are neither. A recipe, a config snippet, a checklist. Those are\nreference material, not knowledge, and they belong in a project folder rather\nthan the wiki.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"linking-rules.md\">Linking rules<\/a><\/p>"},{"id":"04-structuring/linking-rules","title":"Linking rules","html":"<p>Links are the entire value of the structure. Without them you have a folder of\nfiles with good filenames, which is a search index, and search indexes already\nexist.<\/p>\n<h2 id=\"the-rule\">The rule<\/h2>\n<p>Link the first mention of any concept or entity, on every page.<\/p>\n<p>That is it. Applied consistently, it produces the graph on its own, with no\nseparate linking pass and no maintenance ritual.<\/p>\n<h2 id=\"link-do-not-restate\">Link, do not restate<\/h2>\n<p>If you are explaining something that already has a page, link it and move on.<\/p>\n<p>This is what keeps knowledge in one place. When the explanation of a concept\nlives on four pages in four slightly different versions, updating it means\nfinding all four, and you will not. Linked, it lives once and improves once.<\/p>\n<h2 id=\"both-directions\">Both directions<\/h2>\n<p>A new page links out to what it references. What it references links back.<\/p>\n<p>One-directional linking produces pages that reference the vault but that the\nvault never reaches. They exist, they are correct, and nothing finds them.\nObsidian's <a href=\"https://help.obsidian.md/plugins/backlinks\">Backlinks<\/a> pane shows\nunlinked mentions, which helps you spot these, but the agent\nshould be closing the loop at ingest rather than leaving it to you.<\/p>\n<h2 id=\"links-that-do-not-exist-yet\">Links that do not exist yet<\/h2>\n<p>Write the link anyway, then either create the target page in the same run or\nrecord it under Gaps in <code>index.md<\/code>.<\/p>\n<p>Gaps are useful information. A page that three sources have linked to and that\ndoes not exist yet is exactly what to write next, or exactly what to go read\nabout.<\/p>\n<p>What is not acceptable is a permanent gap. Links to pages that will never exist\nmake the graph lie about its own coverage.<\/p>\n<h2 id=\"how-many\">How many<\/h2>\n<p>There is no target number, but the shape matters. A page with no outbound links\nis a dead end. A page with forty is usually a list pretending to be a page.<\/p>\n<p>Watch the average across the vault rather than any single page. Below roughly\ntwo links per page, the graph is not connected enough to answer anything the\nindividual pages could not. Track it with <code>scripts/vault_stats.py<\/code>.<\/p>\n<h2 id=\"hub-pages\">Hub pages<\/h2>\n<p>Some pages accumulate links until everything routes through them. A general\nconcept that every source touches becomes a hub, and once it is a hub, the graph\naround it stops being informative: everything is two hops from everything.<\/p>\n<p>The fix is to split the hub into the specific ideas people are actually linking\nto. If forty pages link to a single broad concept, they are linking to four\ndifferent aspects of it.<\/p>\n<h2 id=\"decorative-links\">Decorative links<\/h2>\n<p>A link is a claim that two pages are related in a way worth following. Links\nadded because a word happened to appear are noise, and enough of them make the\ngraph unusable in exactly the way an empty graph is unusable.<\/p>\n<p>The test: would you follow this link while researching the topic? If not,\ndelete it.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"frontmatter-schema.md\">Frontmatter schema<\/a><\/p>"},{"id":"04-structuring/frontmatter-schema","title":"Frontmatter schema","html":"<p>Frontmatter is what makes the vault queryable by something other than text\nsearch. It costs nothing to write and it is what Dataview, scripts and the agent\nitself use to find things by shape.<\/p>\n<h2 id=\"the-schema\">The schema<\/h2>\n<pre><code class=\"language-yaml\">---\ntitle: Canonical name\ntype: source | entity | concept | synthesis\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\naliases: [other names this is known by]\ntags: [two or three]\n---\n<\/code><\/pre>\n<p>Source pages add:<\/p>\n<pre><code class=\"language-yaml\">url: https://...\nauthor:\npublished: YYYY-MM-DD\n<\/code><\/pre>\n<p>Entity pages add <code>kind: person | org | product | tool<\/code>.<\/p>\n<p>That is the minimum the method needs. The <a href=\"../../vault-template/CLAUDE.md\">vault\ntemplate<\/a> makes a stricter choice, because it is\nbuilt for several domains, mixed languages and an agent that works unattended:<\/p>\n<pre><code class=\"language-yaml\">---\ntitle: Canonical name, in the page's own language\ntype: source | entity | concept | synthesis | idea | experiment | review | system | hub\ndomain: [work | learning | personal | creative | self-improvement | systems]\nlang: ISO 639-1 code, usually en or et\nsensitivity: normal | private | restricted\nmaintained_by: human | agent\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\naliases: [other names, including the original spelling]\ntags: [two or three]\n---\n<\/code><\/pre>\n<p>The extra fields:<\/p>\n<ul>\n<li><code>domain<\/code> says which area of life or work the page belongs to, and which hub\n  links to it. A page can have more than one.<\/li>\n<li><code>lang<\/code> is the language the page is written in. Pages keep the language of their\n  source and are not translated. If you write in two languages, such as\n  Estonian and English, put the title in the other language in <code>aliases<\/code>, so a\n  search or a wikilink in either language finds the page.<\/li>\n<li><code>sensitivity<\/code> decides what may leave the vault. <code>private<\/code> is for health,\n  finance, relationships, journal-derived material and third parties'\n  information; <code>restricted<\/code> is for anything that would hurt someone if it\n  leaked. When unsure, use the higher level.<\/li>\n<li><code>maintained_by: human<\/code> marks pages whose wording the agent must not change. It\n  may add links and fix structure only. The default is <code>agent<\/code>.<\/li>\n<li><code>status<\/code> appears on idea, experiment and system pages and tracks where they\n  are in their lifecycle. Ideas use <code>new<\/code>, <code>considering<\/code>, <code>promoted<\/code> or\n  <code>dropped<\/code>; experiments <code>planned<\/code>, <code>active<\/code>, <code>reviewing<\/code>, <code>adopted<\/code> or\n  <code>dropped<\/code>; systems <code>draft<\/code>, <code>active<\/code> or <code>retired<\/code>. <code>scope<\/code> on a review page names the period\n  it covers (<code>experiment<\/code>, <code>week<\/code>, <code>month<\/code>, <code>quarter<\/code>, <code>year<\/code>).<\/li>\n<li><code>kind<\/code> on a source page is <code>article<\/code>, <code>video<\/code>, <code>meeting<\/code>, <code>email<\/code>, <code>chat<\/code>,\n  <code>doc<\/code>, <code>ai-chat<\/code>, <code>paper<\/code> or <code>other<\/code>. On an entity, <code>kind: person<\/code>.<\/li>\n<li><code>raw:<\/code> on a source page is the path of the raw file it came from, so a page can\n  be traced back and refreshed.<\/li>\n<li><code>archived<\/code>, <code>archived_reason<\/code>, <code>archived_from<\/code> and, for a merge, <code>merged_into<\/code>\n  are written when a page moves to <code>archive/<\/code>. See <a href=\"../06-agents/safety-and-guardrails.md\">safety and\n  guardrails<\/a>.<\/li>\n<li><code>publish: true<\/code> is the explicit opt-in described in <a href=\"../08-outputs/publishing-and-export.md\">publishing and\n  export<\/a>. Only the owner sets it, in a\n  live session.<\/li>\n<\/ul>\n<p><code>wiki/index.md<\/code> and <code>wiki/log.md<\/code> are exempt from the schema. If you do not need\nseveral domains or languages, leave these fields out; the method still works.<\/p>\n<h2 id=\"why-each-field-earns-its-place\">Why each field earns its place<\/h2>\n<p><code>type<\/code> drives every structural query and every lint check. Without it you cannot\nask how many concepts you have, or find sources with no concepts attached.<\/p>\n<p><code>updated<\/code> is what makes review possible. Stale concept pages are the main way a\nvault rots, and you cannot find them without a date.<\/p>\n<p><code>aliases<\/code> is what makes wikilinks resolve when the same thing has three names.\nSee <a href=\"naming-and-aliases.md\">naming and aliases<\/a>.<\/p>\n<p><code>url<\/code> on a source page is what separates a citation from a claim. A source page\nwithout it is unverifiable.<\/p>\n<h2 id=\"tags\">Tags<\/h2>\n<p>Two or three per page, from a small controlled vocabulary you actually maintain.<\/p>\n<p>Tags fail in one specific way: the vocabulary grows until it is meaningless.\nFifty tags used once each are worse than no tags, because they create the\nimpression of a taxonomy while doing none of the work.<\/p>\n<p>Keep the list in <code>CLAUDE.md<\/code> and instruct the agent to use existing tags or\npropose a new one explicitly rather than inventing them silently.<\/p>\n<p>Folders and links carry the structural load. Tags are for cross-cutting\nqualities that do not fit either: <code>unverified<\/code>, <code>to-revisit<\/code>, <code>disputed<\/code>.<\/p>\n<h2 id=\"empty-fields\">Empty fields<\/h2>\n<p>Leave a field out rather than filling it with a guess. An absent <code>published<\/code>\nmeans unknown, which the agent can say honestly. A guessed date becomes a fact\nin a concept page three weeks later.<\/p>\n<h2 id=\"keep-it-stable\">Keep it stable<\/h2>\n<p>Adding a field to the schema means either backfilling every page or living with\na mixed vault where queries miss the older half.<\/p>\n<p>Decide the schema early, keep it small, and change it rarely. When you do change\nit, run a backfill pass over the whole vault in one go rather than letting the\nchange apply only to new pages.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"naming-and-aliases.md\">Naming and aliases<\/a><\/p>"},{"id":"04-structuring/naming-and-aliases","title":"Naming and aliases","html":"<p>Wikilinks resolve by name, so the name is not cosmetic. It is the key the whole\ngraph is built on.<\/p>\n<h2 id=\"canonical-titles\">Canonical titles<\/h2>\n<p>One page, one canonical title, and it is the name you would use talking to\nsomeone in the field.<\/p>\n<p>Practical rules that avoid most of the pain:<\/p>\n<ul>\n<li><strong>Singular, not plural.<\/strong> <code>Vector database<\/code>, not <code>Vector databases<\/code>.<\/li>\n<li><strong>Spell out acronyms in the title, put the acronym in aliases.<\/strong> The title is\n  for the reader, the alias is for the link.<\/li>\n<li><strong>No dates, no versions in the title<\/strong> unless the thing genuinely is a\n  version. A page called <code>MCP spec 2026-07<\/code> becomes wrong in a month; a page\n  called <code>MCP<\/code> with a version history does not.<\/li>\n<li><strong>No your-vault-specific prefixes.<\/strong> <code>Concept - RAG<\/code> fights the link syntax\n  for no benefit.<\/li>\n<\/ul>\n<h2 id=\"aliases\">Aliases<\/h2>\n<p>Everything the same subject gets called, listed in frontmatter:<\/p>\n<pre><code class=\"language-yaml\">title: Retrieval augmented generation\naliases: [RAG, retrieval-augmented generation]\n<\/code><\/pre>\n<p>Aliases are what stop the vault from quietly growing three pages for one thing.\nWithout the alias, a source that says RAG creates <code>RAG<\/code>, and a source that\nspells it out creates a second page, and neither knows about the other.<\/p>\n<p>Add aliases at creation, not later. By the time you notice the duplicate, both\npages have inbound links.<\/p>\n<h2 id=\"two-things-with-the-same-name\">Two things with the same name<\/h2>\n<p>Disambiguate in the title, not with a suffix nobody would type:<\/p>\n<pre><code>Mercury (planet)\nMercury (element)\n<\/code><\/pre>\n<p>Then alias the bare word to whichever one is dominant in your vault, or to\nneither if both matter, which forces the agent to pick explicitly rather than\nguessing.<\/p>\n<p>Same applies to people who share a name and to your own projects that collide\nwith a well-known product.<\/p>\n<h2 id=\"renaming\">Renaming<\/h2>\n<p>Obsidian updates links when you rename inside the app. The agent renaming a file\ndirectly does not, and that is the single most common source of broken links in\nan agent-maintained vault.<\/p>\n<p>Rule for <code>CLAUDE.md<\/code>: renames go through a documented procedure. Update the\nfile, update every inbound link, add the old name as an alias, and record it in\n<code>log.md<\/code>. The alias matters because it keeps external references and your own\nmemory working.<\/p>\n<p>Then run <code>scripts/link_check.py<\/code> to confirm nothing dangled.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"dedupe-and-merge.md\">Deduplication and merging<\/a><\/p>"},{"id":"04-structuring/dedupe-and-merge","title":"Deduplication and merging","html":"<p>Duplicates are inevitable. Two sources use different words for the same idea, an\nalias was missing, a bulk import ran before the vault had the concept. The\nquestion is not how to prevent them entirely but how to catch them before they\nboth accumulate links.<\/p>\n<h2 id=\"finding-them\">Finding them<\/h2>\n<p>Signals, in order of reliability:<\/p>\n<ul>\n<li><strong>Similar titles.<\/strong> Cheap to check, catches the plural and acronym cases.<\/li>\n<li><strong>Overlapping aliases.<\/strong> Two pages claiming the same alias is always a bug.<\/li>\n<li><strong>Shared inbound links.<\/strong> Two pages that the same five sources both link to\n  are usually one page.<\/li>\n<li><strong>Content similarity.<\/strong> Expensive, but catches the cases where the names look\n  unrelated.<\/li>\n<\/ul>\n<p><code>second-brain-lint<\/code> runs the first three and proposes merges. It does not\nperform them, which is deliberate.<\/p>\n<h2 id=\"why-merging-is-not-automatic\">Why merging is not automatic<\/h2>\n<p>A merge is irreversible in the way that matters: once two pages are one, you\ncannot tell which claim came from which, and the agent's judgement about \"these\nare the same thing\" is exactly the judgement that goes wrong.<\/p>\n<p>Two ideas that look identical from their summaries are often a general case and\na specific one, and merging them loses the distinction permanently.<\/p>\n<p>So: the agent proposes, you decide. Reviewing a merge takes fifteen seconds.<\/p>\n<h2 id=\"the-procedure\">The procedure<\/h2>\n<p>When you approve one:<\/p>\n<ol>\n<li><strong>Pick the survivor<\/strong> by canonical name, not by which is longer.<\/li>\n<li><strong>Merge content,<\/strong> keeping every distinct claim with its source. Overlapping\n   claims collapse, differing ones both stay.<\/li>\n<li><strong>Merge aliases,<\/strong> including the dead page's title as an alias on the\n   survivor.<\/li>\n<li><strong>Redirect inbound links<\/strong> to the survivor.<\/li>\n<li><strong>Leave a stub<\/strong> at the old path only if it was linked from outside the\n   vault. Otherwise archive it: move it to <code>archive/<\/code> with <code>merged_into<\/code> set to\n   the survivor, rather than deleting it. The vault template does this.<\/li>\n<li><strong>Record it in <code>log.md<\/code><\/strong> with both names, so a page that vanishes is\n   traceable.<\/li>\n<\/ol>\n<p>Step 6 is the one agents skip and the one you will need. A page that disappears\nwithout a record is indistinguishable from a page that was deleted by mistake.<\/p>\n<h2 id=\"do-not-dedupe-live\">Do not dedupe live<\/h2>\n<p>Merging during an ingest run means the agent is restructuring the vault while\nadding to it, and a bad merge lands in the middle of otherwise good work.<\/p>\n<p>Run dedupe as its own pass, weekly or after a large import, on a clean git\nstate. Then a wrong merge is one revert of its own commit away from undone.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"contradictions-and-supersession.md\">Contradictions and supersession<\/a><\/p>"},{"id":"04-structuring/contradictions-and-supersession","title":"Contradictions and supersession","html":"<p>This is the rule that separates a second brain from a search engine, and the one\nmost implementations get wrong.<\/p>\n<p>When a new source disagrees with what a page already says, the page records\nboth. It does not overwrite.<\/p>\n<h2 id=\"why-overwriting-is-the-worst-failure-mode\">Why overwriting is the worst failure mode<\/h2>\n<p>A vault that silently updates to the latest claim has no memory of what you\nbelieved and why. It always presents the most recent thing you read as the\ntruth, which is a ranking by recency, not by evidence.<\/p>\n<p>Worse, it is invisible. Nothing errors. The page simply says something different\nthan it did last month, with the same confidence, and you have no way to notice\nor to check what changed.<\/p>\n<p>The history is the asset. Knowing that you believed X because of a 2024 source,\nthen revised to Y after better evidence, is more valuable than either claim\nalone, because it tells you how firm Y actually is.<\/p>\n<h2 id=\"what-a-contradiction-looks-like-on-a-page\">What a contradiction looks like on a page<\/h2>\n<p>Both positions, each attributed and dated. The claim and the sources in this\nexample are placeholders, not findings:<\/p>\n<pre><code class=\"language-markdown\">## Current position\n\nRetrieval quality degrades past roughly 50k tokens of context\n([[Source A]], 2023).\n\n## Contested\n\n[[Source B]] (2026) reports no degradation up to 200k on the same task\nfamily. The two use different evaluation setups: the first measures position\nsensitivity, the second end-task accuracy. Unresolved.\n<\/code><\/pre>\n<p>The reader can act on that. A page that had silently adopted whichever was\ningested last cannot be acted on at all.<\/p>\n<h2 id=\"supersession\">Supersession<\/h2>\n<p>Sometimes it is not a genuine disagreement, it is old information. A tool\nchanged its API, a company was acquired, a paper was retracted.<\/p>\n<p>Mark the old claim as superseded and keep it. This example is illustrative; the\ndate is invented:<\/p>\n<pre><code class=\"language-markdown\">~~Requires Node 18 or later~~ superseded 2026-05: the native installer no\nlonger requires Node ([[source]]).\n<\/code><\/pre>\n<p>Deleting it means that when you read something written before the change, you\nhave no way to reconcile it with what the vault now says.<\/p>\n<h2 id=\"confidence\">Confidence<\/h2>\n<p>Not everything ingested deserves equal weight. A tag or a frontmatter field is\nenough:<\/p>\n<ul>\n<li><strong>stated<\/strong> by a primary source you trust<\/li>\n<li><strong>reported<\/strong> by secondary coverage<\/li>\n<li><strong>self-reported<\/strong> by the party it benefits<\/li>\n<li><strong>unverified<\/strong><\/li>\n<\/ul>\n<p>Self-reported numbers in particular should never lose that label. A company's\nown performance claim repeated as fact in a concept page is how a vault becomes\nconfidently wrong.<\/p>\n<h2 id=\"the-instruction\">The instruction<\/h2>\n<p>In <code>CLAUDE.md<\/code>, worded so it generalises rather than covering only the obvious\ncase:<\/p>\n<pre><code>When a new source disagrees with an existing page, do not overwrite. Record both\npositions with sources and dates, and say what would settle it. If the new\nsource is clearly better evidence, mark the older claim superseded rather than\ndeleting it. Never resolve a contradiction by picking the more recent source.\n<\/code><\/pre>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"index-and-log.md\">index.md and log.md<\/a><\/p>"},{"id":"04-structuring/index-and-log","title":"index.md and log.md","html":"<p>Two files that are not knowledge, but without which the knowledge is hard to\nreach and impossible to audit.<\/p>\n<h2 id=\"indexmd\">index.md<\/h2>\n<p>The catalog. Every page, grouped by type, with the gaps listed at the bottom.<\/p>\n<p>Its real job is retrieval economy. When the agent gets a question, reading the\nindex first tells it what exists and which pages are worth opening. Without it,\nthe alternative is a full-text sweep, which is slower, costs more context, and\nmisses pages whose wording differs from the question.<\/p>\n<p>Keep it navigable rather than exhaustive-looking:<\/p>\n<pre><code class=\"language-markdown\">## Concepts\n\n### Retrieval\n- [[Retrieval augmented generation]] - chunking, embeddings, when it beats a wiki\n- [[GraphRAG]] - entity graph plus community summaries\n\n### Agents\n- [[Agent harness]] - the loop around a model\n<\/code><\/pre>\n<p>One line of description per entry. That line is what lets the agent decide\nwhether to open the page, and it is worth the tokens.<\/p>\n<h2 id=\"gaps\">Gaps<\/h2>\n<p>At the bottom of the index, the pages that are linked and do not exist.<\/p>\n<p>This section is the most actionable thing in the vault. It is a list of what\nyour own material keeps referring to and you have never written down, which is\nusually a precise map of what to read next.<\/p>\n<h2 id=\"logmd\">log.md<\/h2>\n<p>One line per operation, appended, newest at the bottom.<\/p>\n<pre><code>2026-09-07 ingest raw/clippings/karpathy-gist.md -&gt; 1 source, 2 concepts, 1 entity, 9 links\n2026-09-07 merge [[RAG]] &lt;- [[Retrieval-augmented generation]]\n2026-09-08 lint -&gt; 3 broken links fixed, 2 orphans flagged\n<\/code><\/pre>\n<p>The <a href=\"../../vault-template/CLAUDE.md\">vault template<\/a> is stricter, because its\nagent runs unattended. The format is <code>DATE OPERATION target -&gt; result<\/code>, and a\ndestructive operation also names the checkpoint commit and the reason, so you\ncan undo it:<\/p>\n<pre><code>2026-10-05 archive wiki/concepts/x.md -&gt; archive/wiki/concepts/x.md (reason; checkpoint a1b2c3d)\n<\/code><\/pre>\n<p>Its operations are ingest, pull, link, merge, archive, rename, split, retype,\nlint, review, rollback and skip. <code>skip<\/code> records an item the agent left alone\nbecause it hit a hard stop, and sent to the owner's queue instead.<\/p>\n<p>The log is what makes an agent-maintained vault auditable. When a page says\nsomething you do not recognise, the log tells you which run produced it. When\nsomething disappears, the log is the difference between a traceable merge and a\nmystery.<\/p>\n<p>It also gives the <a href=\"../../skills/README.md\">review skill<\/a> its raw material: what\nchanged this week comes from here, not from guessing at file timestamps.<\/p>\n<h2 id=\"keeping-both-from-bloating\">Keeping both from bloating<\/h2>\n<p>The index grows with the vault, which is fine, but flat lists stop being\nnavigable somewhere around two hundred entries. Group by theme, and once a theme\nhas more than about thirty entries, give it its own index page and link it from\nthe main one.<\/p>\n<p>The log grows forever and nobody reads old entries. Roll entries older than a\nfew months into one summary line per month, or archive them into a dated file.\nKeep recent detail, compress history.<\/p>\n<h2 id=\"the-rule-that-matters\">The rule that matters<\/h2>\n<p>Both files update in the same run as the work they describe.<\/p>\n<p>An index that lags is worse than no index, because the agent trusts it and stops\nlooking for pages it does not list. A log written later is a reconstruction, not\na record.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../05-graphs/README.md\">Graphs<\/a>, where these structures start paying off.<\/p>"},{"id":"05-graphs/graph-basics","title":"Graph basics for a knowledge base","html":"<p>Your vault is a graph whether you plan it or not. Pages are nodes, wikilinks are\nedges. Every structural decision in the previous section was a decision about\nwhat shape that graph takes.<\/p>\n<p>Four terms are enough to reason about it. This section is about your vault's own graph — wikilinks, shape, health. Graphs as an agent's memory in general (GraphRAG, extraction, stores) are the <a href=\"../track-graph/why-graphs.md\">knowledge graphs handbook<\/a>.<\/p>\n<p><strong>Degree<\/strong> is how many links a page has. In-degree is how many point at it,\nout-degree how many it points out. A page with zero in-degree is unreachable by\nfollowing links, which is what makes orphans a problem rather than a cosmetic\nissue.<\/p>\n<p><strong>Path length<\/strong> is how many hops separate two pages. This is the one that\nmatters for answers: the agent following links from a starting page can only\nreach what is a few hops away before the context budget runs out. Two related\nideas eight hops apart will never be connected in an answer.<\/p>\n<p><strong>Clustering<\/strong> is how much a page's neighbours link to each other. High\nclustering means a genuine topic area. Low clustering with high degree usually\nmeans a page that collects unrelated things.<\/p>\n<p><strong>Components<\/strong> are the disconnected islands. A vault in five components is five\nvaults, and nothing in one will ever inform an answer about another.<\/p>\n<h2 id=\"the-shapes-that-go-wrong\">The shapes that go wrong<\/h2>\n<p><strong>The star.<\/strong> Everything links to two or three hub pages and to nothing else.\nPath length between any two leaves is short, but only through the hub, so the\ngraph tells you nothing beyond \"these are all in my vault\". Usually caused by\nlinking to broad concepts instead of specific ones.<\/p>\n<p><strong>The chain.<\/strong> Sources link to the concept they introduced and nothing links\nsideways. Common after a bulk import that ran without checking existing pages.\nThe vault grows and never connects.<\/p>\n<p><strong>Islands.<\/strong> Distinct topic clusters with no bridges. Sometimes legitimate: your\ncooking notes and your database notes genuinely do not connect. Often not: two\nclusters about related things that were built under different vocabulary and\nnever linked because the aliases were missing.<\/p>\n<h2 id=\"what-a-healthy-graph-looks-like\">What a healthy graph looks like<\/h2>\n<p>Dense within topics, sparse but present between them. Most pages reachable from\nmost pages within three or four hops. Hubs that exist but do not dominate. A\nsmall number of bridge pages that connect clusters, which are usually your most\nvaluable pages, because they hold the connections you could not have made from\none source alone.<\/p>\n<h2 id=\"why-any-of-this-matters\">Why any of this matters<\/h2>\n<p>When you ask the vault something, the agent starts at the pages that match and\nwalks outward. The graph is the search space. A well-shaped graph means the walk\nreaches the relevant material in a few hops; a badly shaped one means it either\nreaches nothing or reaches everything.<\/p>\n<p>That is the whole argument for the linking rules. They are not tidiness, they\nare what determines whether retrieval works.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"obsidian-graph-view.md\">Reading the Obsidian graph view<\/a><\/p>"},{"id":"05-graphs/obsidian-graph-view","title":"Reading the Obsidian graph view","html":"<p>The global graph is the screenshot everyone posts. It is the least useful view\nin the app.<\/p>\n<p>At two hundred pages it is a hairball, and a hairball tells you nothing except\nthat you have pages. What it is good for is spotting shape at a glance: isolated\nclumps, a single dominant hub, a scatter of unconnected dots around the edge.<\/p>\n<h2 id=\"local-graph\">Local graph<\/h2>\n<p>This is the view that does work. Open a page, run the <strong>Open local graph<\/strong>\ncommand, and set the depth slider to two.<\/p>\n<p>You are looking for two things. What is one hop away should be obviously\nrelated; anything surprising there is either a decorative link to delete or a\nconnection worth reading. What is missing at two hops tells you where the page\nis under-connected.<\/p>\n<p>Reviewing the local graph of a page you just wrote is the fastest quality check\nthere is, and it takes five seconds.<\/p>\n<h2 id=\"filters-that-make-the-global-view-usable\">Filters that make the global view usable<\/h2>\n<ul>\n<li><strong>Filter by path.<\/strong> In the graph's <strong>Search files<\/strong> filter,\n  <a href=\"https://help.obsidian.md/plugins/search\"><code>-path:sources<\/code><\/a> hides every page\n  whose path contains <code>sources<\/code> and leaves the concept graph, which is the part\n  with meaning in it. Sources outnumber concepts heavily and drown them visually.<\/li>\n<li><strong>Groups by colour.<\/strong> Colour concepts, entities and synthesis differently, with\n  a search term per group (see the <a href=\"https://help.obsidian.md/plugins/graph\">Graph\n  view<\/a> help). A\n  cluster with no concept pages in it is a pile of sources nobody has processed.<\/li>\n<li><strong>Orphan toggle.<\/strong> Turn orphans on deliberately, look at what appears, then\n  fix or delete them.<\/li>\n<li><strong>Forces.<\/strong> Lowering the link force loosens the pull along each link, which can\n  spread clusters apart enough to see bridges.<\/li>\n<\/ul>\n<h2 id=\"what-to-look-for\">What to look for<\/h2>\n<p><strong>Dots at the edge, connected to one thing.<\/strong> Failed ingests, usually. The\nsource page was written and the concepts never linked back.<\/p>\n<p><strong>One giant node in the middle.<\/strong> A hub that has swallowed the graph. Split it.<\/p>\n<p><strong>Two clusters with a single connecting page.<\/strong> That page is doing real work.\nIt is also fragile: if it is wrong, both clusters are wrong about each other.<\/p>\n<p><strong>A cluster you do not recognise.<\/strong> Usually the most interesting thing on\nscreen. It means the vault has accumulated material on a topic you have not\nconsciously been tracking.<\/p>\n<h2 id=\"what-the-view-cannot-tell-you\">What the view cannot tell you<\/h2>\n<p>It shows that pages are connected, never why. Every edge looks the same whether\nit means \"supports\", \"contradicts\" or \"mentioned once in passing\".<\/p>\n<p>That limitation is the entire argument for the next page.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"typed-links.md\">Typed links<\/a><\/p>"},{"id":"05-graphs/typed-links","title":"Typed links","html":"<p>A plain <code>[[wikilink]]<\/code> says two pages are related. It does not say how, and at\nscale that is a real loss.<\/p>\n<p>You cannot ask an untyped graph what contradicts a claim, what evidence supports\nit, or which pages extend a method. Every edge is the same edge, so every\nquestion collapses to \"what is nearby\".<\/p>\n<h2 id=\"a-minimal-vocabulary\">A minimal vocabulary<\/h2>\n<p>Small enough to remember, expressive enough to be worth it:<\/p>\n<ul>\n<li><strong>supports<\/strong> - this page is evidence for that one<\/li>\n<li><strong>contradicts<\/strong> - this page argues against it<\/li>\n<li><strong>extends<\/strong> - builds on it, adds to it<\/li>\n<li><strong>part-of<\/strong> - a component of a larger thing<\/li>\n<li><strong>applies<\/strong> - a use of a method in practice<\/li>\n<\/ul>\n<p>Five is deliberately few. Every additional type is one the agent has to choose\nbetween correctly on every link, and a vocabulary of twenty produces\ninconsistent tagging, which is worse than none.<\/p>\n<h2 id=\"two-ways-to-encode-it\">Two ways to encode it<\/h2>\n<p><strong>Inline, next to the link:<\/strong><\/p>\n<pre><code class=\"language-markdown\">The position sensitivity result (supports:: [[Lost in the Middle]]) suggests\ncontext length alone does not fix retrieval.\n<\/code><\/pre>\n<p>Dataview reads inline fields, so this is queryable inside Obsidian without extra\ntooling.<\/p>\n<p><strong>In frontmatter, per page:<\/strong><\/p>\n<pre><code class=\"language-yaml\">contradicts: [&quot;[[Long context replaces RAG]]&quot;]\nextends: [&quot;[[Retrieval augmented generation]]&quot;]\n<\/code><\/pre>\n<p>Cleaner to query, further from the sentence the link came from. Frontmatter for\npage-level relationships, inline for claim-level ones.<\/p>\n<h2 id=\"what-it-buys-you\">What it buys you<\/h2>\n<pre><code class=\"language-dataview\">LIST FROM &quot;wiki/concepts&quot;\nWHERE contains(contradicts, this.file.link)\n<\/code><\/pre>\n<p>That is \"everything in my vault that argues against this page\", which is a\nquestion a plain graph cannot answer at all.<\/p>\n<p>At the agent level it is stronger still. An ingest that records a new source as\n<code>contradicts<\/code> an existing page has done the work of flagging the disagreement\nstructurally, rather than burying it in prose that only surfaces if someone\nreads the page.<\/p>\n<h2 id=\"do-not-type-everything\">Do not type everything<\/h2>\n<p>Most links are plain mentions and should stay plain. Typing every link makes the\nvocabulary meaningless and makes ingestion slower and more error-prone.<\/p>\n<p>Type the links where the relationship is the point: evidence, disagreement,\nextension. As a starting point, aim for about one link in five and adjust.<\/p>\n<h2 id=\"the-instruction\">The instruction<\/h2>\n<pre><code>When a source supports, contradicts or extends a claim on an existing page,\nrecord the relationship with a typed link. Plain wikilinks for ordinary\nmentions. Do not type a relationship you are inferring; only type what the\nsource states.\n<\/code><\/pre>\n<p>That last sentence matters. An agent guessing at relationships produces a graph\nthat looks rigorous and encodes its own assumptions.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"graph-vs-vectors.md\">Graph vs embeddings<\/a><\/p>"},{"id":"05-graphs/graph-vs-vectors","title":"Graph vs embeddings","html":"<p>The usual advice for asking questions of your own documents is to embed them and\nretrieve by similarity. This guide does not, and the reason is worth\nunderstanding rather than taking on faith.<\/p>\n<h2 id=\"what-each-is-good-at\">What each is good at<\/h2>\n<p><strong>Embeddings<\/strong> find text that means something similar to your query, including\nwhen the wording is completely different. They are good at recall, they need no\nstructure, and they work on a pile of documents you have never organised.<\/p>\n<p><strong>A graph<\/strong> finds things that are explicitly connected, in a direction you can\nfollow, with a reason attached if the links are typed. It is good at\nmulti-hop questions and at telling you why two things are related.<\/p>\n<h2 id=\"where-similarity-fails\">Where similarity fails<\/h2>\n<p>The failure is specific: similarity retrieves chunks that resemble the question,\nand the answer to a good question often does not resemble it.<\/p>\n<p>Ask what connects two ideas, and the passages that establish the connection may\nshare no vocabulary with either. Ask what you have changed your mind about, and\nno chunk is similar to that, because the answer lives in the relationship\nbetween two pages written a year apart.<\/p>\n<p>There is also the ranking problem. Twenty chunks that all half-answer the\nquestion crowd out the one page that answers it fully, because similarity has no\nnotion of completeness.<\/p>\n<h2 id=\"where-the-graph-fails\">Where the graph fails<\/h2>\n<p>Recall. If a page was never linked, the graph cannot reach it, and the linking\nrules are exactly the thing that degrades quietly when ingestion gets sloppy.<\/p>\n<p>The graph also cannot find the thing you half-remember but cannot name. That is\na search problem, and full-text search on a vault of a few thousand pages is\ninstant, which is why <code>ripgrep<\/code> covers most of this in practice.<\/p>\n<h2 id=\"why-a-personal-vault-leans-graph\">Why a personal vault leans graph<\/h2>\n<p>Three reasons specific to this scale.<\/p>\n<p>Your corpus is small. A few thousand pages is not a retrieval problem, it is a\nfolder. The infrastructure that embeddings require pays off at millions of\ndocuments and costs more than it returns below that.<\/p>\n<p>Your corpus is already chunked. Atomic pages are semantic units written by\nsomething that understood them. Splitting them again into fixed-size chunks\ndestroys the structure you paid to create.<\/p>\n<p>Your questions are relational. What do I know about X, what connects X and Y,\nwhat argues against Z. Those are graph queries.<\/p>\n<h2 id=\"hybrid-when-you-get-there\">Hybrid, when you get there<\/h2>\n<p>The combination that makes sense: full-text search or embeddings to find\nentry points, the graph to expand from them.<\/p>\n<p>That way recall comes from search and structure comes from the graph, each doing\nwhat it is good at. See <a href=\"../07-retrieval/rag-on-top.md\">adding RAG when you need\nit<\/a> for the threshold where it starts to be worth\nthe maintenance. For graphs as agent memory outside a vault, see the handbook's\n<a href=\"../track-graph/why-graphs.md\">why knowledge graphs<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"graphrag.md\">GraphRAG and where it fits<\/a><\/p>"},{"id":"05-graphs/graphrag","title":"GraphRAG and where it fits","html":"<p>GraphRAG is the approach of building a graph from a corpus first, then answering\nquestions against the graph rather than against raw chunks. Microsoft Research\npublished the best-known version, <a href=\"https://arxiv.org/abs/2404.16130\">From Local to Global: A Graph RAG Approach to\nQuery-Focused Summarization<\/a>, and its\n<a href=\"https://github.com/microsoft/graphrag\">graphrag<\/a> repository warns that indexing\n\"can be an expensive operation\".<\/p>\n<p>In outline: extract entities and relationships from every document, group\ndensely connected entities into communities, summarise each community, and\nanswer from the summaries. This page covers how that compares with a vault. The\nfour stages, their cost and the cheaper successors are in the\n<a href=\"../track-graph/graphrag.md\">GraphRAG handbook page<\/a>.<\/p>\n<h2 id=\"why-it-exists\">Why it exists<\/h2>\n<p>It targets a specific failure of chunk retrieval: questions about the corpus as\na whole. \"What are the main themes here\" cannot be answered by retrieving the\nfive most similar chunks, because no chunk contains the answer. It has to be\nassembled from everything.<\/p>\n<p>That class of question is exactly what people want from a second brain and\nexactly what similarity search is worst at.<\/p>\n<h2 id=\"what-your-vault-already-has\">What your vault already has<\/h2>\n<p>Read the pipeline again against a well-maintained wiki and most of it is already\nbuilt.<\/p>\n<p>Entity extraction is what ingestion does when it writes entity pages.\nRelationships are the wikilinks, with types if you added them. The graph is the\nvault. What is missing is the community layer: the detection of clusters and the\nsummaries over them.<\/p>\n<p>And that missing piece has a manual equivalent you are already writing.\nSynthesis pages are community summaries, produced by a model that read the\nsources rather than by an algorithm clustering entities.<\/p>\n<h2 id=\"whether-to-run-it\">Whether to run it<\/h2>\n<p>Probably not, at personal scale, and the honest reason is size. The approach\nearns its cost on corpora too large to have been curated by hand. A few thousand\ncurated pages with real links do not need automated community detection to find\ntheir own themes; you can see the clusters in the graph view.<\/p>\n<p>There is a case for it as an audit rather than as a retrieval system. Running\ncommunity detection over your exported graph and comparing the algorithmic\nclusters against your synthesis pages tells you where the vault has themes you\nhave not noticed. That is a once-a-quarter exercise, not infrastructure.<\/p>\n<h2 id=\"related-research-worth-reading\">Related research worth reading<\/h2>\n<p><a href=\"https://arxiv.org/abs/2405.14831\">HippoRAG<\/a> (see also its\n<a href=\"https://github.com/OSU-NLP-Group/HippoRAG\">repository<\/a>) applies personalised PageRank over a knowledge graph for multi-hop\nquestions, which is a more direct analogue of what an agent does walking links\noutward from a starting page.<\/p>\n<p>Read the papers themselves rather than summaries of them. Both are specific\nabout the conditions their results hold under, and those conditions are what\ndecide whether the approach transfers to your situation.<\/p>\n<p>For the implementation side, see the handbook's <a href=\"../track-graph/graphrag.md\">GraphRAG<\/a>\nand <a href=\"../track-graph/building-graphs-with-llms.md\">building graphs with LLMs<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"exporting-your-graph.md\">Exporting the graph<\/a><\/p>"},{"id":"05-graphs/exporting-your-graph","title":"Exporting the graph","html":"<p>Obsidian's graph view is a viewer. To compute anything, you need the graph\noutside it.<\/p>\n<h2 id=\"export\">Export<\/h2>\n<pre><code class=\"language-bash\">python3 scripts/graph_export.py ~/brain edges.csv\npython3 scripts/graph_export.py ~/brain graph.graphml --format graphml\n<\/code><\/pre>\n<p>The script parses every wikilink into an edge list and has no dependencies. CSV\nis a two-column <code>source,target<\/code> list for code. GraphML is for Gephi and also\ncarries each page's <code>type<\/code> as a node attribute.<\/p>\n<h2 id=\"analysis\">Analysis<\/h2>\n<pre><code class=\"language-python\">import networkx as nx, csv\n\ng = nx.DiGraph()\nwith open(&quot;edges.csv&quot;) as f:\n    next(f)\n    g.add_edges_from(tuple(r) for r in csv.reader(f))\n\nprint(nx.number_weakly_connected_components(g))\nprint(sorted(nx.pagerank(g).items(), key=lambda kv: -kv[1])[:10])\nprint([n for n in g if g.in_degree(n) == 0])\n<\/code><\/pre>\n<p>Three questions in ten lines: how fragmented is the vault, which pages are\nstructurally central, and what is unreachable.<\/p>\n<p>PageRank on a knowledge graph is worth running once. The top pages are what your\nvault is actually about, which is reliably different from what you would say it\nis about.<\/p>\n<h2 id=\"betweenness-the-one-worth-the-compute\">Betweenness, the one worth the compute<\/h2>\n<pre><code class=\"language-python\">b = nx.betweenness_centrality(g)\n<\/code><\/pre>\n<p>Betweenness measures how often a page sits on the shortest path between two\nothers. High-betweenness pages are the bridges between clusters.<\/p>\n<p>They matter for two reasons. They are your most valuable pages, holding\nconnections no single source contained. And they are the fragile points: if a\nbridge page is wrong or gets deleted in a merge, two areas of the vault silently\nstop informing each other.<\/p>\n<h2 id=\"graph-databases\">Graph databases<\/h2>\n<p><a href=\"https://github.com/kuzudb/kuzu\">Kuzu<\/a> is an embedded, serverless graph database\nwith Cypher queries, and querying your own notes with it is a fun evening. Its\nrepository was archived by its owner on 10 October 2025 and is read-only; earlier\nreleases still work, but do not build anything long-lived on it without checking\nthe current state. <a href=\"https://neo4j.com\">Neo4j<\/a> is the full server version and is\noverkill unless you are building something on top.<\/p>\n<p>Be clear about what this is: an analysis layer, not a replacement. The markdown\nstays canonical, the database is a rebuildable derivative. The moment you start\nwriting knowledge that exists only in the database, you have lost the\nportability that made the whole approach worth choosing.<\/p>\n<h2 id=\"gephi\">Gephi<\/h2>\n<p>For looking rather than computing. Load the GraphML, run ForceAtlas2, size nodes\nby degree, colour by type. It renders large graphs in a way Obsidian cannot, and\nit is what to use if you want a screenshot worth showing.<\/p>\n<h2 id=\"keep-it-in-sync\">Keep it in sync<\/h2>\n<p>The export is a snapshot and it is stale immediately. Regenerate it rather than\nmaintaining it, and never edit the exported graph expecting the vault to follow.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"metrics.md\">Graph metrics worth tracking<\/a><\/p>"},{"id":"05-graphs/metrics","title":"Graph metrics worth tracking","html":"<p>Four numbers, checked monthly. The thresholds below are this guide's rules of\nthumb, not published benchmarks; adjust them to your own vault. Their direction over time tells you whether the\nsystem is working, which is not obvious from using it day to day.<\/p>\n<pre><code class=\"language-bash\">python3 scripts/vault_stats.py ~/brain\n<\/code><\/pre>\n<h2 id=\"orphan-rate\">Orphan rate<\/h2>\n<p>Pages with no inbound links, as a share of all pages.<\/p>\n<p>The single most diagnostic number in the vault. A rising orphan rate means\ningestion is writing pages without connecting them, which is the exact failure\nmode that turns a wiki back into a folder.<\/p>\n<p>Under five percent is healthy. Over fifteen and something is broken in the\ningest instructions, not in your habits.<\/p>\n<h2 id=\"average-degree\">Average degree<\/h2>\n<p>Links per page.<\/p>\n<p>Below two, the graph is barely connected and retrieval cannot do better than\nsearch. Between three and eight is the working range for a personal vault. Much\nabove ten, check whether links are being added decoratively, which inflates the\nnumber while making the graph less useful.<\/p>\n<p>Watch it alongside page count. Degree that stays flat while the vault doubles is\nfine; degree that falls means new pages are attaching to less than the existing\nones did.<\/p>\n<h2 id=\"component-count\">Component count<\/h2>\n<p>How many disconnected islands.<\/p>\n<p>Ideally one large component holding most pages, plus a few genuinely separate\ntopics. If the main component holds less than about eighty percent of pages, the\nvault is fragmented and answers will be systematically incomplete without\nanything appearing wrong.<\/p>\n<h2 id=\"stale-page-rate\">Stale page rate<\/h2>\n<p>Concept pages whose <code>updated<\/code> date is older than ninety days, as a share of\nconcept pages.<\/p>\n<p>Some staleness is correct: a well-written page on a settled idea does not need\ntouching. But a vault where most concept pages have not been touched in months\nwhile sources keep arriving means new material is landing in new pages instead\nof updating existing ones. That is how you end up with four pages about one\nthing.<\/p>\n<pre><code class=\"language-dataview\">TABLE updated FROM &quot;wiki/concepts&quot;\nWHERE updated &lt; date(today) - dur(90 days)\nSORT updated ASC\n<\/code><\/pre>\n<h2 id=\"what-not-to-track\">What not to track<\/h2>\n<p>Page count and word count. Both go up regardless of whether the vault is getting\nbetter, which makes them satisfying and useless. A vault that doubled its pages\nwhile doubling its orphan rate got worse.<\/p>\n<h2 id=\"recording-them\">Recording them<\/h2>\n<p>Append the four numbers to a note monthly. Trend is the information; a single\nreading tells you almost nothing, and you will not remember what last quarter's\norphan rate was.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../06-agents/README.md\">Agents<\/a>, for running all of this without you.<\/p>"},{"id":"06-agents/agent-roles","title":"Agent roles","html":"<p>One agent doing everything produces mediocre work at every job. The instructions\nthat make a good ingestor are not the ones that make a good reviewer, and stuffed\ninto one prompt they dilute each other.<\/p>\n<p>Six roles cover a vault, four of them read-only. The definitions are in\n<a href=\"../../agents/README.md\"><code>agents/<\/code><\/a>.<\/p>\n<h2 id=\"ingestor\">Ingestor<\/h2>\n<p>Reads <code>raw/<\/code>, writes wiki pages, links them, updates the index and log. Writes\nmore than any other role and is the one whose output quality determines\neverything downstream.<\/p>\n<p>Its instructions are narrow on purpose: it does not answer questions, does not\nrestructure existing pages beyond adding links, and does not delete. An ingestor\nthat reorganises while ingesting produces runs you cannot review, because content\nchanges and structural changes arrive mixed in the same diff.<\/p>\n<h2 id=\"linker\">Linker<\/h2>\n<p>Finds connections between existing pages that ingestion missed.<\/p>\n<p>Runs after imports and weekly. Adds links, creates nothing, rewrites nothing.\nSeparating it from the ingestor matters because linking well requires reading\nbroadly across the vault, which is a different job from reading one source\nclosely.<\/p>\n<p>Its one rule: a link it adds must be one you would agree with on reading both\npages side by side. A linker optimising for link count degrades the graph while\nappearing productive.<\/p>\n<h2 id=\"reviewer\">Reviewer<\/h2>\n<p>Read-only. Produces the periodic review: what changed, where attention went,\nwhat contradicts what, what to read next.<\/p>\n<p>Read-only is not caution, it is what makes the review trustworthy. A reviewer\nthat can edit will fix small things as it goes, and then its report describes a\nvault that no longer exists.<\/p>\n<h2 id=\"researcher\">Researcher<\/h2>\n<p>Read-only. Answers questions from the vault, cites pages, names what is missing.<\/p>\n<p>Also the role you talk to most, and the one that most needs the rule about not\nfalling back on general knowledge. See the\n<a href=\"../../skills/README.md\">query skill<\/a>.<\/p>\n<h2 id=\"graph-analyst\">Graph analyst<\/h2>\n<p>Read-only. Runs the metrics, finds hubs, bridges and clusters, and says what the\nnumbers mean for retrieval. Monthly.<\/p>\n<p>Separate from the linter because analysis and repair want opposite dispositions:\none should notice everything, the other should touch as little as possible.<\/p>\n<h2 id=\"curator\">Curator<\/h2>\n<p>Read-only. Proposes what to prune, archive or merge, quarterly.<\/p>\n<p>Proposals only, never actions. Deletion is the one operation you cannot recover\nfrom by reading a diff, so it stays a decision the owner makes. The vault\ntemplate relaxes this for one case: an unattended curator may archive, not\ndelete, behind a checkpoint commit and a log line, because archiving is\nreversible.<\/p>\n<h2 id=\"roles-not-worth-creating\">Roles not worth creating<\/h2>\n<p><strong>A deleter.<\/strong> Deletion should be a decision you make, executed with a record.\nThe curator proposes; you dispose.<\/p>\n<p><strong>A summariser.<\/strong> Summaries of pages that are already summaries produce a layer\nthat is less true than what is under it and gets read instead of it.<\/p>\n<p><strong>A tagger.<\/strong> Tagging is a five-second judgement made during ingest with full\ncontext. A separate pass has less context and produces worse tags.<\/p>\n<h2 id=\"handoffs\">Handoffs<\/h2>\n<p>Roles communicate through the vault, not through each other. The ingestor writes\ngaps into <code>index.md<\/code>; the linker reads them. The ingestor logs its run; the\nreviewer reads the log.<\/p>\n<p>That is deliberate. Files as the interface means any run is inspectable\nafterwards, and a role can be replaced without touching the others.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"scheduled-maintenance.md\">Scheduling<\/a><\/p>"},{"id":"06-agents/scheduled-maintenance","title":"Scheduling","html":"<p>Scheduled runs are what make the vault feel alive. You wake up and it has filed\nwhat you clipped, noticed a contradiction, and left you three lines about what\nchanged.<\/p>\n<p>They are also unattended writes to your notes, so the order matters: get the\n<a href=\"safety-and-guardrails.md\">guardrails<\/a> right first, then schedule.<\/p>\n<h2 id=\"cadence-per-job\">Cadence per job<\/h2>\n<p><strong>Ingest, daily.<\/strong> Overnight, on whatever accumulated in <code>raw/<\/code> during the day.\nDaily is right because a batch gives the agent a chance to notice that three\nthings you saved are about the same idea. Hourly does not.<\/p>\n<p><strong>Link, weekly.<\/strong> Connections need material to connect. Run it after a week of\ningestion.<\/p>\n<p><strong>Lint, weekly.<\/strong> After the linker, so it catches what that pass broke.<\/p>\n<p><strong>Review, weekly.<\/strong> The one output you actually read, written as a review page\nin the vault rather than a chat message. Put it on the morning you plan.<\/p>\n<p><strong>Metrics, monthly.<\/strong> Four numbers appended to a note. See\n<a href=\"../05-graphs/metrics.md\">metrics<\/a>.<\/p>\n<p><strong>Archive pass, monthly.<\/strong> Retire pages that have one source, no inbound links\nand have sat for a year, and stubs that were never filled. They move to\n<code>archive/<\/code>; nothing is deleted.<\/p>\n<h2 id=\"setting-one-up\">Setting one up<\/h2>\n<p>In Claude Desktop, Code tab, then Routines, New routine, Local. The form takes a\nname (unique across your tasks), a description, the instructions, and a schedule;\nyou pick the working folder, your vault, under the instructions (see the\n<a href=\"https://code.claude.com/docs/en/desktop-scheduled-tasks\">desktop scheduled tasks documentation<\/a>):<\/p>\n<pre><code>Name:          vault-ingest\nSchedule:      Daily, 7:00am\nInstructions:  File the 20 oldest pending items in raw/ into the wiki\n               following CLAUDE.md. Before any merge, archive or batch\n               rewrite, commit a checkpoint of the paths you will change.\n               Link what you create to existing pages. Update index.md and\n               log.md. Do not delete anything; archive instead. If an item\n               hits a hard stop (a secret, a connected service, a person's\n               details leaving the vault, two pages you cannot tell apart),\n               skip it and record it in wiki/systems/needs-owner.md. Make\n               one commit for the run, staging only the paths you wrote,\n               by path, with the run id in the message. Then write me three\n               lines in counts and names: created, updated, archived, still\n               pending, waiting on you.\n<\/code><\/pre>\n<p>A Desktop scheduled task runs on your machine, only while the app is open and\nthe computer is awake. A run missed while the machine slept is skipped; on wake,\nDesktop starts one catch-up run for the most recent missed time and discards\nolder ones (<a href=\"https://code.claude.com/docs/en/desktop-scheduled-tasks\">documentation<\/a>).\n\"Overnight\" therefore means a machine that is on overnight.<\/p>\n<p>A scheduled task can fire a slash command only from the 17-command maintenance\nset listed in <a href=\"../../commands/README.md\"><code>commands/README.md<\/code><\/a> (<code>/ingest<\/code>,\n<code>/link<\/code>, <code>/lint<\/code>, <code>/vault-review<\/code>, <code>/weekly<\/code>, <code>/monthly<\/code>, <code>/metrics<\/code>, <code>/health<\/code>,\n<code>/brief<\/code>, <code>/commit<\/code>, <code>/stale<\/code>, <code>/orphans<\/code>, <code>/prune<\/code>, <code>/archive<\/code>, <code>/dedupe<\/code>, <code>/backfill<\/code>\nand <code>/index<\/code>). The other commands set <code>disable-model-invocation: true<\/code>, and from\nClaude Code v2.1.196 that also stops a scheduled task from running them\n(<a href=\"https://code.claude.com/docs/en/skills\">skills documentation<\/a>). Anything else\nneeds a plain-language prompt like the one above, and on an older version none\nof the commands can be relied on. If you installed the kit as the <code>second-brain<\/code>\nplugin, the commands carry the plugin prefix (<code>/second-brain:ingest<\/code>); see\n<a href=\"../../plugins/README.md#second-brain\">plugins<\/a>.\nThe backlog limit of 20 and the rest of the rails come from the <a href=\"../../vault-template/CLAUDE.md\">vault\ntemplate<\/a>, which applies them to scheduled runs\ntoo.<\/p>\n<p>Or ask for it in a session: \"set up a daily task at 7am that ingests raw/ and\nsummarises what changed\".<\/p>\n<p>From a terminal, <code>cron<\/code> or Task Scheduler calling Claude Code headless works the\nsame way, and is the better option if you want the run inside a git commit\nautomatically.<\/p>\n<h3 id=\"let-the-skill-propose-it\">Let the skill propose it<\/h3>\n<p>The <code>second-brain-schedule<\/code> skill, or the <code>/maintenance-schedule<\/code> command that\npoints at it, reads your vault and proposes the jobs, cadence, where each should\nrun and the exact prompt for each. It proposes only; you create the tasks. The\ncommand is not called <code>/schedule<\/code> because that would shadow Claude Code's\nbuilt-in <code>/schedule<\/code>, which creates cloud routines.<\/p>\n<h3 id=\"why-not-cloud-for-a-template-vault\">Why not cloud for a template vault<\/h3>\n<p>A cloud routine runs on a fresh clone of a GitHub repository, per Anthropic's\n<a href=\"https://code.claude.com/docs/en/routines\">routines documentation<\/a>. For a vault\nthat means four things:<\/p>\n<ul>\n<li>It cannot see git-ignored folders, so <code>raw/workspace/<\/code> (email, chat, docs and\n  calendar pulls) is absent.<\/li>\n<li>It pushes its changes to <code>claude/<\/code> branches by default, so the run commit\n  does not reach your local history until you merge that branch. The template\n  treats pushing as a hard stop.<\/li>\n<li>The account's connectors are available by default, and a connector that can\n  write will write without asking. The template treats writing to a connected\n  service as a hard stop.<\/li>\n<li>It runs without permission prompts.<\/li>\n<\/ul>\n<p>For a vault that follows the template, use Desktop scheduled tasks or headless\nClaude Code, which run in your vault folder. These\nfeatures change, so check the documentation before relying on any of it.<\/p>\n<h3 id=\"permission-mode-for-unattended-runs\">Permission mode for unattended runs<\/h3>\n<p>In the default permission mode, a headless run with the template refuses every\npage write, because nobody is there to approve it. A Desktop run in Manual mode\nstalls until you approve the action. Start the run\nwith <code>--permission-mode acceptEdits<\/code>, set the task's permission mode in the\nDesktop form, or set <code>permissions.defaultMode<\/code> in <code>.claude/settings.json<\/code>. The\ndeny rules and the hook still apply. See the \"Scheduled runs\" paragraph in the\n<a href=\"../../vault-template/README.md#what-is-enforced-and-what-is-not\">vault template README<\/a>.<\/p>\n<h2 id=\"what-a-run-must-produce\">What a run must produce<\/h2>\n<p>Three things, every time.<\/p>\n<p><strong>A log entry.<\/strong> Otherwise you cannot audit what happened while you were asleep.<\/p>\n<p><strong>A commit.<\/strong> One per run, with the run named in the message, staging only the\npaths the run wrote. This is what makes a bad run revertible in one command\ninstead of an evening, without touching your own edits.<\/p>\n<p><strong>A report to you.<\/strong> Even one line. A scheduled task that produces nothing\nvisible is one you stop trusting and then stop reading.<\/p>\n<h2 id=\"detecting-silent-failure\">Detecting silent failure<\/h2>\n<p>The failure mode is not a crash. It is a run that completes and does nothing\nuseful: the source was empty, the API call failed halfway, the instructions\nmatched no files.<\/p>\n<p>Two cheap checks. Have the run report counts, not just completion, so \"ingested\n0 sources\" is visible. And look at commit frequency once a month: a week with no\ncommits from the daily task means it has been failing quietly since Tuesday.<\/p>\n<h2 id=\"start-manual\">Start manual<\/h2>\n<p>Run each job by hand for a week before scheduling it. You are checking that the\noutput is good enough to accept without reading it closely, because that is\nexactly what scheduling means.<\/p>\n<p>Schedule the ingest last. It is the one that writes most.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"subagents.md\">Subagents and parallel work<\/a><\/p>"},{"id":"06-agents/subagents","title":"Subagents and parallel work","html":"<p>Subagents run in their own context window\n(<a href=\"https://code.claude.com/docs/en/sub-agents\">Claude Code docs<\/a>). That is the\nwhole point: a subagent\nreading thirty pages to answer a question does not fill the main session's\ncontext with those thirty pages, only with the answer.<\/p>\n<h2 id=\"when-to-fan-out\">When to fan out<\/h2>\n<p><strong>Research across many pages.<\/strong> Send a subagent to read a cluster and come back\nwith a summary. The main session keeps its budget for the actual work.<\/p>\n<p><strong>Independent sources.<\/strong> Ingesting ten unrelated articles parallelises cleanly,\nbecause none of them touch the same wiki pages.<\/p>\n<p><strong>Verification.<\/strong> One agent writes, another
