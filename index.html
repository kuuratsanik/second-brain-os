ore' \\\n  -H 'Content-Type: application/json' -d '{&quot;filename&quot;:&quot;vault-prefix.bin&quot;}'\n<\/code><\/pre>\n<p>The README's example response shows a save of 1,745 tokens writing 14,309,796 bytes in 49.865 ms, and a restore taking 42.937 ms. It does not name the model or the disk, so use it only as a shape of response. The command-line tools have a separate <code>--prompt-cache FNAME<\/code> (with <code>--prompt-cache-all<\/code> and <code>--prompt-cache-ro<\/code>), documented in the <a href=\"https://github.com/ggml-org/llama.cpp/blob/master/tools/completion/README.md\">completion README<\/a>; it says a restored cache does not restore the exact session state, so a fixed seed does not guarantee the same output. This route is manual: you save a slot after loading the stable prefix and restore it after a restart. It works on any hardware llama.cpp supports.<\/p>\n<h3>Ollama<\/h3>\n<p>Ollama's <a href=\"https://github.com/ollama/ollama/blob/main/docs/faq.mdx\">FAQ<\/a> documents <code>keep_alive<\/code> and <code>OLLAMA_KEEP_ALIVE<\/code> (how long a model stays in memory) and <code>OLLAMA_KV_CACHE_TYPE<\/code> (K/V cache quantization, default <code>f16<\/code>, needs Flash Attention). It documents no disk tier for the KV cache. Its source was not searched for undocumented behaviour. A smaller cache type reduces the bytes per token in the formula above but does not persist anything.<\/p>\n<h3>NVIDIA Dynamo (KVBM)<\/h3>\n<p>The <a href=\"https://github.com/ai-dynamo/dynamo/blob/main/README.md\">Dynamo README<\/a> describes the KV Block Manager as one that \"Offloads KV cache across GPU → CPU → SSD → remote storage\", and its support table marks KVBM as supported for vLLM and TensorRT-LLM and in progress for SGLang. The configuration docs are on docs.nvidia.com, which could not be fetched, so no flags are given here. Dynamo is a multi-node serving system; for one vault it is probably more machinery than needed.<\/p>\n<h2>Practical guidance<\/h2>\n<p><strong>When it pays.<\/strong> A long prefix reused across many sessions or restarts. If your agent already keeps the prefix under a few thousand tokens, spend the effort on <a href=\"context-engineering.md\">trimming context<\/a> instead. If you run a single session and never restart, GPU and CPU tiers cover it.<\/p>\n<p><strong>Put the stable part first, and only cache that.<\/strong> Order the prompt as system prompt, tool schemas, vault index, then the per-session material. Cache keys are built from the token prefix, so one changed token early on invalidates everything after it. In vLLM, <code>max_offload_tokens<\/code> stores only the leading tokens of a request, which is the system-prompt use case its docs name.<\/p>\n<p><strong>Endurance.<\/strong> Every prompt block that is offloaded is a write. At 128 KiB per token for the 8B example, 1,000,000 newly prefilled tokens a day is 131 GB a day if all are stored. That arithmetic is yours to redo with your model's bytes per token and your real token volume. Compare it with your drive's rated total bytes written (TBW) or drive writes per day, which the drive's datasheet gives. No vendor datasheet could be fetched, so no endurance figure is stated here. Reduce writes by capping offload to the stable prefix, by setting a disk size limit (<code>LMCACHE_MAX_LOCAL_DISK_SIZE<\/code>) and by not putting the cache on the drive that holds your only copy of the vault.<\/p>\n<p><strong>NVMe versus SATA, QLC.<\/strong> Throughput sets how fast a prefix loads. The interface limits for NVMe (PCIe generation and lane count) and SATA (6 Gbit/s link) are in the standards, which could not be fetched; read the datasheet and, better, measure with a tool such as <code>fio<\/code> using large sequential reads. Do not trust the datasheet peak for a QLC drive until you have tested sustained writes, since a long write burst is the case an offload tier produces. This is a testing instruction, not a measured claim.<\/p>\n<p><strong>Filesystem placement.<\/strong> Use a local filesystem on the SSD itself, not a network share, and not the volume that holds your vault or backups. vLLM's tier creates many files (sharded by hash prefix) and LMCache's in-process mode creates one per chunk, so a filesystem with generous inode limits helps. LMCache's <code>use_odirect<\/code> bypasses the page cache; its docs recommend it when most CPU memory is in use. Keep the cache directory out of any sync tool or backup. Directories are keyed by model, block size, parallelism and dtype (vLLM), so changing any of them leaves orphaned directories that you delete by hand.<\/p>\n<p><strong>Privacy.<\/strong> The cache is derived from your prompts. A KV cache can in principle be used to recover the text it was computed from, so treat the directory like the vault itself: same disk encryption, same permissions. This is a precaution, not a claim from the sources.<\/p>\n<h2>Measure it<\/h2>\n<p>Time to first token (TTFT) for a long shared prefix, cold versus cached. The prefix must be real: use your actual system prompt and index.<\/p>\n<ol>\n<li>Build a fixed prefix file from your agent's real preamble, and a short question that you change on every run, so only the prefix is shared.<\/li>\n<li>Stream a chat request and record the time until the first content chunk arrives.<\/li>\n<li>Run it in four states and write down each time:<\/li>\n<li>cold: server just started, empty cache directory;<\/li>\n<li>GPU-warm: the same request again immediately;<\/li>\n<li>disk-warm: restart the engine (keep the cache directory, and for LMCache keep <code>lmcache server<\/code> running or its L2 directory), then send it again;<\/li>\n<li>baseline: the same restart with the disk tier disabled.<\/li>\n<\/ol>\n<p>Disk-warm should beat cold by roughly the prefill time minus the read time. If it does not, the drive or the connector is the bottleneck. After a restart the operating system may still hold the files in its page cache, which makes the disk-warm run look faster than a real cold read; use <code>use_odirect<\/code> where available, or, on Linux as root, run <code>sync; echo 3 &gt; /proc/sys/vm/drop_caches<\/code> before the run. The kernel's <a href=\"https://github.com/torvalds/linux/blob/master/Documentation/admin-guide/sysctl/vm.rst\">vm sysctl documentation<\/a> describes <code>drop_caches<\/code> as freeing clean page cache and reclaimable slab objects, and says running <code>sync<\/code> first leaves fewer dirty objects. That page was read on 6 October 2026.<\/p>\n<pre><code class=\"language-python\">import json, sys, time, urllib.request\n\nprefix = open(sys.argv[1]).read()\nquestion = sys.argv[2]\nbody = json.dumps({\n    &quot;model&quot;: sys.argv[3],\n    &quot;stream&quot;: True, &quot;max_tokens&quot;: 1,\n    &quot;messages&quot;: [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: prefix},\n                 {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: question}],\n}).encode()\nreq = urllib.request.Request(&quot;http://localhost:8000/v1/chat/completions&quot;,\n                             body, {&quot;Content-Type&quot;: &quot;application/json&quot;})\nt0 = time.perf_counter()\nwith urllib.request.urlopen(req) as r:\n    for line in r:\n        if not line.startswith(b&quot;data: &quot;) or line.strip() == b&quot;data: [DONE]&quot;:\n            continue\n        delta = json.loads(line[6:])[&quot;choices&quot;][0][&quot;delta&quot;]\n        if delta.get(&quot;content&quot;):  # skip the role-only first chunk\n            print(f&quot;TTFT {time.perf_counter() - t0:.3f} s&quot;)\n            break\n<\/code><\/pre>\n<p>This script is a plain timing harness written for this page, not taken from any project's docs; it assumes an OpenAI-compatible server on port 8000 that streams, and it stops the timer at the first non-empty content delta. A reasoning model may stream reasoning in a different field first; adjust the check if so. <code>llama-server<\/code> reports the numbers itself: the <code>/completion<\/code> response has a <code>timings<\/code> object with <code>cache_n<\/code> (prompt tokens reused from cache), <code>prompt_n<\/code> (tokens processed) and <code>prompt_ms<\/code>, so a restore should show a large <code>cache_n<\/code> and a small <code>prompt_ms<\/code>. Run each state several times and keep the median; one run on a cold drive tells you little.<\/p>\n<h2>A saved slot for the vault's CLAUDE.md<\/h2>\n<p>If a local model runs scheduled vault maintenance (tagging, summaries, lint triage), the stable prefix is the vault's <code>CLAUDE.md<\/code> plus a tag vocabulary, and the llama.cpp slot save and restore described above is how to keep it across restarts. <a href=\"local-models-for-maintenance.md\">Local models for cheap maintenance<\/a> walks through that, and through pointing <code>vault_search.py --embed-url<\/code> at a local embedding server.<\/p>\n<h2>What was and was not checked<\/h2>\n<p>Checked on 6 October 2026 against the primary files named above: the LMCache README and docs source (<code>quickstart.rst<\/code>, <code>mp/l2_storage/fs.rst<\/code>, <code>local_storage.rst<\/code>), vLLM's <code>disagg_prefill.md<\/code> and <code>kv_offloading_usage.md<\/code> on <code>main<\/code>, SGLang's HiCache docs on <code>main<\/code>, the llama.cpp server and completion READMEs on <code>master<\/code>, Ollama's <code>faq.mdx<\/code>, the Dynamo README, and Meta's llama-models repository. The docs describe the branch head, so flags may differ from the release you installed. No server or benchmark was run for this page, so no speed result is claimed.<\/p>\n<p>Not re-checked on 6 October 2026 because the page could not be fetched:<\/p>\n<ul>\n<li>The Hugging Face <code>config.json<\/code> for Llama 3.1 8B (<code>huggingface.co<\/code> was unreachable); the example uses Meta's repository instead.<\/li>\n<li>NVIDIA's Dynamo and KVBM documentation on docs.nvidia.com.<\/li>\n<li>Any SSD vendor datasheet, and the NVMe, PCIe and SATA specifications, so no endurance or interface throughput numbers are given.<\/li>\n<li>The upstream hosted docs sites for LMCache and SGLang; their source files in the repositories were read instead.<\/li>\n<li>SGLang's <code>file<\/code> backend source and its exact environment variable spelling beyond what the design page prints.<\/li>\n<\/ul>"},{"id":"track-harness/local-models-for-maintenance","title":"Local Models for Cheap Maintenance","html":"<p>Some vault maintenance is routine enough that a small model on your own CPU might do it: suggest tags, write a one-paragraph summary of one source, sort lint findings into \"mechanical\" and \"needs a human\". This page covers what such a model can and cannot do in a second-brain vault, how to run it with <code>llama-server<\/code> from llama.cpp, how to turn the vault's <code>CLAUDE.md<\/code> into a saved prompt-cache slot so each run does not re-read it, and how to point <code>vault_search.py --embed-url<\/code> at a local embedding server.<\/p>\n<p>It does not claim a local model matches Claude. No model was run for this page, and no quality or speed figure is given. Where a statement is a judgement rather than something a source says, it says so.<\/p>\n<p>Everything attributed to llama.cpp below was read from its <a href=\"https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md\">server README<\/a> on <code>master<\/code> on 6 October 2026, through a fetch tool that returns extracts, not the whole file. The flags change between releases; run <code>llama-server --help<\/code> on the build you have. The last section lists what was not checked.<\/p>\n<h2>What a small local model can and cannot do here<\/h2>\n<p>This is judgement, not measurement. The test that matters is whether you can check the output cheaply. A small model is a reasonable fit where you can, and a poor one where you cannot.<\/p>\n<table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>Fit<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag a page from a fixed vocabulary<\/td>\n<td>Plausible<\/td>\n<td>A closed choice. Your script can reject any tag not in the vocabulary<\/td>\n<\/tr>\n<tr>\n<td>Summarise one source page in a paragraph<\/td>\n<td>Plausible, with a check<\/td>\n<td>The source is in the prompt, so you can compare. Small models are more likely to drop or invent detail than a large one; sample and read<\/td>\n<\/tr>\n<tr>\n<td>Triage <code>link_check<\/code> output (broken link, stub, stale) into mechanical or needs-human<\/td>\n<td>Plausible<\/td>\n<td>A short classification of lines the script already found<\/td>\n<\/tr>\n<tr>\n<td>Draft aliases or the other-language title<\/td>\n<td>Weak<\/td>\n<td>Needs knowledge of what the owner actually calls things; an alias must be a real name, not an invented one<\/td>\n<\/tr>\n<tr>\n<td>Ingest a source into several linked pages<\/td>\n<td>Do not<\/td>\n<td>Needs the whole vault in view and judgement about what already exists<\/td>\n<\/tr>\n<tr>\n<td>Find contradictions, merge duplicates, decide what to archive<\/td>\n<td>Do not<\/td>\n<td>The vault <code>CLAUDE.md<\/code> makes uncertain identity a hard stop (f), and a wrong merge is expensive<\/td>\n<\/tr>\n<tr>\n<td>Read email, meetings or web pages unattended<\/td>\n<td>Do not<\/td>\n<td>The <a href=\"build-graduate.md\">graduation page<\/a> gives \"reads untrusted content\" and \"runs unattended\" as reasons to use a harness with a real permission system; a script you wrote has neither<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Three facts shape the design.<\/p>\n<p><strong>Claude Code is not the harness for this.<\/strong> The Claude Code gateway documentation says Anthropic \"doesn't support routing Claude Code to non-Claude models through any gateway\" (<a href=\"https://code.claude.com/docs/en/llm-gateway\">LLM gateways<\/a>, read 6 October 2026). llama-server does offer an Anthropic-compatible <code>/v1/messages<\/code> endpoint, per its README, but that does not make the pairing supported. So a local job is a small script of your own that sends a prompt to llama-server and reads the reply, in the shape of <a href=\"build-the-loop.md\">the loop you built<\/a>.<\/p>\n<p><strong>Your script has none of the vault's guardrails.<\/strong> The vault's <code>.claude/settings.json<\/code> and guard hook protect Claude Code sessions. They do not see your script. Give the script one place to write, a proposals file such as <code>output/local-proposals-YYYY-MM-DD.md<\/code>, and have it validate before writing (is every tag in the vocabulary, does the summary quote text that is in the source). Then a Claude session or you apply what is worth applying. That keeps the local model on proposals and the vault rails on writes.<\/p>\n<p><strong>Local does keep content on the machine.<\/strong> The README gives <code>--host<\/code> a default of <code>127.0.0.1<\/code>, so a server started without that flag listens only on the local machine. That matters for <code>private<\/code> pages, whose content the vault <code>CLAUDE.md<\/code> bars from any request to another service. If you set <code>--host<\/code> to expose the server, set <code>--api-key<\/code> as well; the README lists both.<\/p>\n<h2>Run llama-server on a CPU<\/h2>\n<pre><code class=\"language-bash\">llama-server -m ./models/your-chat-model.gguf \\\n  -c 8192 -t 8 -np 1 -ngl 0 \\\n  --host 127.0.0.1 --port 8080 \\\n  --slot-save-path ./slots\n<\/code><\/pre>\n<p>What the README says about each flag:<\/p>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>README description (quoted)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>-m, --model FNAME<\/code><\/td>\n<td>model path to load<\/td>\n<\/tr>\n<tr>\n<td><code>-c, --ctx-size N<\/code><\/td>\n<td>\"size of the prompt context (default: 0, 0 = loaded from model)\"<\/td>\n<\/tr>\n<tr>\n<td><code>-t, --threads N<\/code><\/td>\n<td>\"number of CPU threads to use during generation (default: -1)\"<\/td>\n<\/tr>\n<tr>\n<td><code>-np, --parallel N<\/code><\/td>\n<td>\"number of server slots (default: -1, -1 = auto)\"<\/td>\n<\/tr>\n<tr>\n<td><code>-ngl, --gpu-layers N<\/code><\/td>\n<td>\"max. number of layers to store in VRAM, either an exact number, 'auto', or 'all' (default: auto)\"<\/td>\n<\/tr>\n<tr>\n<td><code>--host HOST<\/code><\/td>\n<td>\"IP addresses to listen on ... (default: 127.0.0.1)\"<\/td>\n<\/tr>\n<tr>\n<td><code>--slot-save-path PATH<\/code><\/td>\n<td>\"path to save slot kv cache (default: disabled)\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>-ngl 0<\/code> is this page's reading of the <code>-ngl<\/code> description: if it is the maximum number of layers kept in VRAM, zero keeps none there. On a machine with no GPU the default <code>auto<\/code> should already do that; the flag is only a way to say so. <code>-np 1<\/code> gives one slot, so there is one cache to save and restore; the README does not say how the context is divided between several slots, so check that before raising it. Set <code>-t<\/code> to your physical core count as a starting point, which is a convention, not a README recommendation, and measure.<\/p>\n<p>Calling it from a script uses the OpenAI-compatible chat endpoint, which the README describes as \"POST <code>/v1/chat/completions<\/code>: OpenAI-compatible Chat Completions API\" that takes <code>messages<\/code>. For output your script must parse, the README documents schema-constrained JSON (<code>{\"type\": \"json_object\", \"schema\": {...}}<\/code>) and grammar-based sampling. Use one of them for tags and triage so the model cannot return free text where your code expects a list. Constraining the shape does not make the content right; you still validate it.<\/p>\n<h2>Make CLAUDE.md a saved slot<\/h2>\n<p>llama-server does not read <code>CLAUDE.md<\/code>. That file is Claude Code's. What you can do is put the same text at the start of every prompt your script sends, and have the server keep the processed result.<\/p>\n<p>The <a href=\"kv-cache-ssd-tier.md\">KV-cache page<\/a> explains why: the model has to read the stable front of the prompt before it can read your page, and that work (prefill) is the slow part on a CPU. The vault <code>CLAUDE.md<\/code> in this repo is about 12,000 characters (1,800 words); the token count depends on the model's tokenizer, so measure it rather than guess. If every maintenance call starts with that text, only the page at the end is new.<\/p>\n<p>Per the README, <code>--cache-prompt<\/code> is on by default, and the <code>cache_prompt<\/code> request option reads \"Re-use KV cache from a previous request if possible. This way the common prefix does not have to be re-processed, only the suffix that differs between the requests.\" So within one server run, a stable prefix is reused for free. Saving a slot makes it survive a restart:<\/p>\n<ol>\n<li>Build the prefix once: your instruction block, the vault <code>CLAUDE.md<\/code>, the tag vocabulary. Keep it byte-identical from run to run. Put the page being processed after it, never before; one changed early character defeats the reuse.<\/li>\n<li>Send a first request with that prefix (and a trivial question), pinned to a slot with <code>id_slot<\/code> (README: \"Assign the completion task to an specific slot. If is -1 the task will be assigned to a Idle slot.\").<\/li>\n<li>Save the slot. The README documents <code>POST /slots/{id_slot}?action=save<\/code> with a required <code>filename<\/code>, relative to <code>--slot-save-path<\/code>:<\/li>\n<\/ol>\n<p><code>bash\n   curl -X POST 'http://127.0.0.1:8080/slots/0?action=save' \\\n     -H 'Content-Type: application/json' -d '{\"filename\":\"vault-claude-md.bin\"}'<\/code><\/p>\n<ol>\n<li>At the start of each scheduled run, after starting the server, restore it with <code>action=restore<\/code> and the same <code>filename<\/code>.<\/li>\n<li>Check it worked. The <code>/completion<\/code> response's <code>timings<\/code> object includes <code>cache_n<\/code> (\"number of prompt tokens reused from cache\") and <code>prompt_n<\/code> (\"number of prompt tokens being processed\"). After a restore, <code>cache_n<\/code> should be large and <code>prompt_n<\/code> small.<\/li>\n<\/ol>\n<p>When <code>CLAUDE.md<\/code> changes, or you change the model, the saved file no longer matches: save a new one. The README does not say what a restore does with a file from a different model, so do not rely on it; keep one file per model and per <code>CLAUDE.md<\/code> version in the name. The kv-cache page covers the other cache routes, and its measurement recipe works here too.<\/p>\n<h2>Point vault_search at a local embedding server<\/h2>\n<p><code>scripts/vault_search.py<\/code> ranks with BM25 on its own. With <code>--embed-url<\/code> it adds semantic ranking, using an embedding endpoint, and caches vectors on disk with <code>--embed-cache<\/code>. The README's description of <code>--embedding<\/code> is: \"restrict to only support embedding use case; use only with dedicated embedding models (default: disabled)\". So an embedding server is a second llama-server process with an embedding model, not the chat server you started above.<\/p>\n<pre><code class=\"language-bash\">llama-server -m ./models/your-embedding-model.gguf --embedding \\\n  --host 127.0.0.1 --port 8081\n\npython3 scripts/vault_search.py . &quot;hoidmine&quot; --embed-url http://127.0.0.1:8081 \\\n  --embed-cache .cache/embeddings.json\n<\/code><\/pre>\n<p>Notes from the README: <code>--pooling {none,mean,cls,last,rank}<\/code> is the \"pooling type for embeddings, use model default if unspecified\", so usually leave it. The <code>/v1/embeddings<\/code> endpoint is OpenAI-compatible and \"requires pooling different from <code>none<\/code>\"; the separate <code>/embedding<\/code> endpoint also supports <code>none<\/code>. Which of the two paths the script calls, and whether <code>--embed-url<\/code> wants the base address or the full path, is in <code>python3 scripts/vault_search.py --help<\/code>; check it on the version you have rather than copying the line above.<\/p>\n<p>The cache file holds vectors computed from your pages. Treat it like the pages: keep <code>.cache/<\/code> out of git (the vault template's <code>.gitignore<\/code> lists it) and out of any shared folder. Use an address on this machine only. The <code>/ask<\/code> skill follows the same rule, because page text goes to the server.<\/p>\n<h2>Run it on a schedule<\/h2>\n<p>A scheduled job that uses a local model is a plain script run by <code>cron<\/code>, Task Scheduler or a Desktop scheduled task, not a Claude Code session; see <a href=\"../06-agents/scheduled-maintenance.md\">scheduled maintenance<\/a> for where each runs. The job starts llama-server, restores the slot, loops over the pages, writes proposals and stops the server. CPU inference is slow, so cap the pages per run, as the vault rails cap ingest at 20.<\/p>\n<h2>Quality limits against Claude<\/h2>\n<p>State these plainly before relying on any of this.<\/p>\n<ul>\n<li>No comparison was run for this page. Do not assume the small model's tags, summaries or triage are as good as Claude's; assume they are worse until a sample says otherwise.<\/li>\n<li>Expect more format slips, more invented detail in summaries and weaker handling of the vault's rules. The schema constraint and your validation catch the first; reading a sample catches the others.<\/li>\n<li>Before you switch a job on, run the local model and Claude on the same 20 pages and read both. Count tags outside the vocabulary and summaries with a claim not in the source. If you would not accept the local output unreviewed, do not schedule it unreviewed.<\/li>\n<li>Keep a Claude pass on top: a weekly run that reads the proposals file and applies, edits or discards each item. That is the cheap part of the saving, and the part that keeps the wiki's quality where it was.<\/li>\n<li>Anything that needs the whole vault in view, or that is a hard stop in <code>CLAUDE.md<\/code>, stays with Claude and the owner.<\/li>\n<\/ul>\n<h2>What was and was not checked<\/h2>\n<p>Checked on 6 October 2026: the llama.cpp server README on <code>master<\/code> (flags <code>-m<\/code>, <code>-c<\/code>, <code>-t<\/code>, <code>-np<\/code>, <code>-ngl<\/code>, <code>--host<\/code>, <code>--api-key<\/code>, <code>--embedding<\/code>, <code>--pooling<\/code>, <code>--slot-save-path<\/code>, <code>--cache-prompt<\/code>; the <code>/v1/embeddings<\/code>, <code>/embedding<\/code>, <code>/v1/chat/completions<\/code>, <code>/v1/messages<\/code> and <code>/slots<\/code> endpoints; <code>cache_prompt<\/code>, <code>id_slot<\/code>, <code>cache_n<\/code> and <code>prompt_n<\/code>; JSON-schema and grammar options), and the Claude Code gateway documentation.<\/p>\n<p>Not re-checked on that date:<\/p>\n<ul>\n<li>The last part of the server README (about 16,000 of its 116,000 characters) was not returned by the fetch tool.<\/li>\n<li>The fetch tool returned extracts, so quoted descriptions are as it returned them; confirm any flag against <code>llama-server --help<\/code> for your build.<\/li>\n<li>What <code>--slot-save-path<\/code> restore does across different models, and how context is divided between slots when <code>-np<\/code> is above 1.<\/li>\n<li>The exact path and base-address handling of <code>--embed-url<\/code> in <code>vault_search.py<\/code>, which belongs to the script, not to llama.cpp.<\/li>\n<li>Model choice, model file formats and their licences, CPU speed, and token counts. No model was downloaded or run.<\/li>\n<\/ul>"},{"id":"track-harness/resources","title":"Resources","html":"<p>Curated, not exhaustive. Everything here was checked in September 2026 and earns its place, except where an entry says it was not re-checked. Anthropic and Claude Code docs entries and the GitHub repos were re-checked on 5 October 2026. Read alongside <a href=\"what-a-harness-is.md\">what a harness is<\/a> for the vocabulary.<\/p>\n<h2>Foundational posts<\/h2>\n<ul>\n<li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\">Building effective agents<\/a> — Anthropic, 19 December 2024. Still the clearest taxonomy: workflows versus agents, and the advice everyone quotes and few follow — start simple.<\/li>\n<li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\">Effective context engineering for AI agents<\/a> — Anthropic. Named the discipline covered in <a href=\"context-engineering.md\">context engineering<\/a>.<\/li>\n<li><a href=\"https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus\">Context engineering for AI agents: lessons from building Manus<\/a> — production scars: KV-cache economics, append-only context, masking tools instead of removing them.<\/li>\n<li><a href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\">Writing effective tools for agents<\/a> — the tool-design companion to <a href=\"tools-and-mcp.md\">tools and MCP<\/a>.<\/li>\n<\/ul>\n<h2>Deep guides and talks<\/h2>\n<ul>\n<li><a href=\"https://ampcode.com/notes/how-to-build-an-agent\">How to build an agent<\/a> — Thorsten Ball. A code-editing agent in under 400 lines of Go. Do this before adopting any framework; nothing demystifies faster.<\/li>\n<li><a href=\"https://github.com/humanlayer/12-factor-agents\">12-factor agents<\/a> — HumanLayer. Principles for agents that survive production: own your prompts, own your context window, small focused agents.<\/li>\n<li><a href=\"https://www.anthropic.com/engineering/multi-agent-research-system\">How we built our multi-agent research system<\/a> — Anthropic. Orchestrator-worker patterns, and the honest admission that, in Anthropic's data, agents use about 4x the tokens of chat and multi-agent systems about 15x.<\/li>\n<li><a href=\"https://www.trychroma.com/research/context-rot\">Context rot<\/a> — Chroma. The evidence that model performance degrades as input grows, long before the window fills.<\/li>\n<li><a href=\"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/\">The lethal trifecta<\/a> — Simon Willison. The security frame for every agent that reads untrusted content. His ongoing blog is the best running commentary on agents generally.<\/li>\n<li>\n<p><a href=\"https://blog.modelcontextprotocol.io/posts/2026-07-28/\">The 2026-07-28 MCP specification<\/a> — what changed when MCP went stateless, from the protocol team.<\/p>\n<\/li>\n<li>\n<p><a href=\"https://cursor.com/blog/improved-token-efficiency\">Improved token efficiency<\/a> — Cursor. A production harness slimmed in six moves: two thirds of the system prompt deleted as models improved, tools loaded on demand (60% of static tool tokens gone), explicit cache breakpoints, sparser line numbers, subagent discipline. The rare post with numbers per change; <a href=\"https://x.com/undefinedKi/status/2103219508605555033\">this replication prompt<\/a> applies the same audit to your own setup. <em>Last checked September 2026; not re-checked on 5 October 2026 because the page could not be fetched.<\/em><\/p>\n<\/li>\n<li>\n<p><a href=\"https://www.palantir.com/docs/foundry/architecture-center/aip-architecture\">Palantir AIP architecture<\/a> — the agent stack of a platform run inside genuinely locked-down organisations, and most of it copies to a small project: an ontology of typed objects and permitted actions instead of raw data access, one gateway in front of every model call (masking, caching, retries, token accounting), swappable models behind config, three triggers (schedule, event, API), evals inside the release cycle, every action traced. <a href=\"https://x.com/undefinedKi/status/2103883647501652057\">This breakdown<\/a> maps each piece to what you would use at home. <em>Last checked September 2026; not re-checked on 5 October 2026 because the page could not be fetched. The linked breakdown thread is a third-party reading, not Palantir's own description.<\/em><\/p>\n<\/li>\n<\/ul>\n<h2>Repos worth reading<\/h2>\n<ul>\n<li><a href=\"https://github.com/earendil-works/pi\">pi<\/a> — a full harness small enough to actually read; the loop, tools and extensions with no ceremony.<\/li>\n<li><a href=\"https://github.com/huggingface/smolagents\">smolagents<\/a> — the code-as-actions pattern in ~1,000 core lines.<\/li>\n<li><a href=\"https://github.com/OpenHands/OpenHands\">OpenHands<\/a> — how sandboxed runtimes and event streams look at production scale.<\/li>\n<li><a href=\"https://code.claude.com/docs/en/overview\">Claude Code docs<\/a> — not a repo, but the reference harness's manual; the <a href=\"https://code.claude.com/docs/en/hooks\">hooks reference<\/a> alone is an education in lifecycle design.<\/li>\n<\/ul>\n<h2>Start here<\/h2>\n<ol>\n<li><strong>Build the naked loop.<\/strong> Work through Thorsten Ball's tutorial in your language of choice. One afternoon; permanently changes how you read framework docs.<\/li>\n<li><strong>Read two posts.<\/strong> Building effective agents, then effective context engineering. Together they cover 80% of the judgement calls you will face.<\/li>\n<li><strong>Adopt one harness and instrument it.<\/strong> Pick from the <a href=\"harness-landscape.md\">landscape<\/a>, wire up a real task, and read the raw transcripts of every failure. The transcript is the curriculum; everything in this handbook is visible there.<\/li>\n<\/ol>"},{"id":"track-loop/what-loop-engineering-is","title":"What Loop Engineering Is","html":"<p>Loop engineering is the discipline of designing the control system that runs an agent: the thing that decides what to prompt, how to verify the result, whether to retry, and when to stop. You stop doing those jobs by hand, turn by turn, and encode them once. Prompt engineering optimised a single message. Loop engineering optimises the cycle — who calls the model next, against what goal, judged by what test, under what budget.<\/p>\n<h2>Where the term came from<\/h2>\n<p>On 7 June 2026 Peter Steinberger posted the line that named the shift: \"You shouldn't be prompting coding agents anymore. You should be designing loops that prompt your agents.\" It was viewed millions of times within a day. Addy Osmani's essay \"Loop Engineering\" followed almost immediately (O'Reilly Radar syndicated it on 22 June), giving the idea an anatomy: automations, worktrees, skills, connectors, subagents, and external state so progress survives between runs. Boris Cherny of Anthropic put it bluntly: \"I don't prompt Claude anymore. I have loops running that prompt Claude... My job is to write loops.\"<\/p>\n<p>The practices are older than the name. Geoffrey Huntley's Ralph loop dates from July 2025; Simon Willison wrote \"Designing agentic loops\" that September, defining an agent as something that \"runs tools in a loop to achieve a goal\". June 2026 is simply when the discipline got a label — it is three months old as this handbook is written, so expect the vocabulary to churn.<\/p>\n<h2>Prompt engineering versus loop engineering<\/h2>\n<p>Hand-prompting spends your judgement one turn at a time: you read the output, decide whether it is good, and phrase the next nudge. Loop engineering spends that judgement once, up front, on four artefacts: a goal expressed as an executable test, a retry policy that feeds failures back, a budget, and a stop rule. After that, the loop prompts the agent and you review outcomes. The bottleneck moves from writing instructions to proving results.<\/p>\n<h2>The four pillars<\/h2>\n<ul>\n<li><strong>Context hygiene<\/strong> — deciding what survives between turns and attempts, and what gets deliberately thrown away. Covered in <a href=\"context-hygiene.md\">context hygiene<\/a>.<\/li>\n<li><strong>Stop conditions<\/strong> — goal tests, budgets, ratchets and spin detection, because \"the agent says it's done\" is a claim, not a condition. Covered in <a href=\"stop-conditions.md\">stop conditions<\/a>.<\/li>\n<li><strong>A real critic<\/strong> — verification the agent cannot argue with, separated from the agent that did the work. Covered in <a href=\"critics-and-verification.md\">critics and verification<\/a>.<\/li>\n<li><strong>Idempotent tools<\/strong> — anything the loop retries will eventually run twice, so every write the agent can reach must be safe to repeat. A retried \"create invoice\" must not create two invoices; design tools so the second call is a no-op.<\/li>\n<\/ul>\n<h2>Not the same thing as a harness<\/h2>\n<p>This site already has a handbook on <a href=\"../track-harness/what-a-harness-is.md\">agent harnesses<\/a> — the machinery around the model: the inner while-loop, tool schemas, permissions, context window management. Loop engineering is the control discipline layered on top of that machinery. The harness executes a turn; the loop decides whether there should be a next turn, what it should attempt, who judges it, and when the whole exercise ends. You need both: a good harness with no loop discipline is a very fast way to produce unverified work, and loop discipline without a decent harness has nothing reliable to steer.<\/p>"},{"id":"track-loop/stop-conditions","title":"Stop Conditions","html":"<p>The hardest design problem in a loop is not making the agent go; it is making it stop. An agent will happily report success it has not earned, and a loop with no exit is a bill with no ceiling. Every serious loop carries several independent brakes, any one of which ends the run.<\/p>\n<h2>Goal tests<\/h2>\n<p>The primary stop is an executable definition of done: a script that exits 0 when the work is acceptable — tests pass, lint is clean, the build compiles. If the goal cannot be written as a script, you do not have a loopable task; you have an interactive session, and that is fine, but stop pretending otherwise. \"Improve the code\" cannot terminate. \"All tests under <code>tests/<\/code> pass and <code>ruff check .<\/code> reports nothing\" can. The <a href=\"build-goal-test.md\">goal test build page<\/a> turns this into forty lines of bash.<\/p>\n<p>Note what is absent: the agent's own opinion. \"The agent said it's done\" is never a stop condition — it is the claim the goal test exists to check, a point <a href=\"critics-and-verification.md\">critics and verification<\/a> expands.<\/p>\n<h2>Budgets<\/h2>\n<p>Goal tests stop successful runs. Budgets stop everything else, and you want at least three, because they fail differently:<\/p>\n<ul>\n<li><strong>Iterations<\/strong> — a hard cap on attempts. Start small; five attempts finds most tractable problems, and problem twenty attempts can solve but five cannot is rare.<\/li>\n<li><strong>Tokens or money<\/strong> — a spend ceiling per run. Headless CLIs report cost per invocation (<code>--output-format json<\/code> includes <code>total_cost_usd<\/code> in Claude Code, a <a href=\"https://code.claude.com/docs/en/headless\">client-side estimate<\/a> that can differ from the bill), so the wrapper can add it up and quit.<\/li>\n<li><strong>Wallclock<\/strong> — a timeout on the whole run and on each attempt. An agent stuck waiting on a hung command burns hours, not tokens.<\/li>\n<\/ul>\n<p>Budgets are cheap insurance; the only mistake is setting them generously \"to give it room\". Generous budgets convert bugs into invoices.<\/p>\n<h2>Ratchets<\/h2>\n<p>A budget allows ten iterations of slow degradation. A ratchet does not: it requires each iteration to beat the best previous state on a measurable score — tests passing, items ticked off, errors remaining — or the loop resets the attempt and stops. Progress must be monotonic; sideways is failure. This is the backbone of unattended runs, built concretely in <a href=\"build-overnight.md\">the overnight loop<\/a>.<\/p>\n<h2>Detecting spin<\/h2>\n<p>Some failures are loud. Spin is quiet: the agent repeats the same search, produces an empty diff, or hits the same failing test with the same message, attempt after attempt. Detect it by fingerprinting state between iterations — the set of failing test names, a hash of the diff, the last tool commands issued. Two identical fingerprints in a row mean the loop is not converging, and more attempts will only spend the budget. Stop early and say why.<\/p>\n<h2>Handing back to the human<\/h2>\n<p>Every exit that is not goal-test-green should end in a report addressed to a person: what was attempted, what state the working tree is in, which brake fired, and the loop's best evidence for why. Escalation is a feature. A loop that fails legibly at attempt three is worth more than one that flails to attempt fifty, because the report tells you whether to fix the goal test, raise the budget, or take the task back into your own hands. The <a href=\"patterns.md\">patterns page<\/a> shows how the unattended variants formalise this into a morning report.<\/p>"},{"id":"track-loop/critics-and-verification","title":"Critics and Verification","html":"<p>A loop is only as good as its judge. Generation is now cheap — the model will produce another attempt for pennies — so the bottleneck has moved from writing code to proving it works. Whatever plays the role of critic decides whether your loop compounds progress or compounds garbage.<\/p>\n<h2>Done versus claims done<\/h2>\n<p>Models are trained to make transcripts look finished. \"All tests pass, the feature is complete\" is prose, and prose is not evidence: the agent may not have run the tests, may have run the wrong ones, or may have quietly deleted the failing one. The rule that follows is absolute: the loop checks, it never asks. Completion is a property of the world — an exit code, a diff, a green pipeline — measured by something other than the process that did the work. This is the same reason <a href=\"stop-conditions.md\">stop conditions<\/a> exclude the agent's own report.<\/p>\n<h2>Code as critic<\/h2>\n<p>Reach for deterministic critics first: the test suite, the type checker, the linter, the build. They cost nothing per run, give identical verdicts every time, and cannot be persuaded. Their weakness is that they judge only what they encode, and an agent under pressure will satisfy the letter — the classic move is weakening or deleting the test that fails. So keep the critic outside the maker's reach: deny the agent write access to <code>tests/<\/code>, or restore the test directory from git before every verification pass. A checker the maker can edit is not a checker.<\/p>\n<h2>LLM critics with narrow rubrics<\/h2>\n<p>Some judgements code cannot make: is the diff minimal, is the error handling real or decorative, did the change stay inside the task. For these, use a second model call as critic — but narrow it ruthlessly. A good critic prompt names three to five checkable rules, demands a structured verdict (PASS, or a list of violations with locations and fixes), and explicitly forbids commentary on anything else. Wide-rubric \"review this code\" critics produce plausible noise, and the next attempt burns its budget chasing style opinions instead of defects.<\/p>\n<p>LLM critics inherit every failure mode documented for <a href=\"../track-evals/llm-as-judge.md\">LLM-as-judge in the evals handbook<\/a>: leniency bias, verbosity preference, and self-preference. The last one matters most here — never let the model grade its own work in the same context. The critic gets a fresh context, sees only the diff and the rubric, and ideally is a different model. <a href=\"build-critic.md\">Build: the critic<\/a> wires exactly this between attempts.<\/p>\n<h2>Verifier asymmetry<\/h2>\n<p>The reason loops work at all is that checking is usually cheaper than doing. A test suite verifies in seconds what took the agent twenty minutes to write; that asymmetry is the engine, because it lets you buy many cheap attempts and pay full price only for judgement. It also tells you which tasks to loop. Work with a cheap, reliable verifier — failing tests, a reproducible bug, a benchmark number — loops beautifully. Work whose verification is as expensive as the work itself — architectural taste, prose quality, product judgement — does not, and pretending otherwise produces confident garbage at scale. Before building any loop, price the verifier. If you cannot afford a real one, keep the human in the chair.<\/p>"},{"id":"track-loop/context-hygiene","title":"Context Hygiene","html":"<p>The harness handbook covers <a href=\"../track-harness/context-engineering.md\">context engineering<\/a>: what the model sees within a session, curated turn by turn. Context hygiene is the loop-level version of the same discipline: what survives between turns and between attempts, and — just as important — what gets deliberately destroyed. The harness manages a window; the loop manages a lifecycle.<\/p>\n<h2>Editing within long runs<\/h2>\n<p>Long-running loops die of context exhaustion before they die of anything else. Anthropic's <a href=\"https://claude.com/blog/context-management\">context management announcement<\/a> (29 September 2025) attacks this directly: context editing automatically clears stale tool calls and results as the window approaches its limit, keeping the conversation flow intact. In their 100-turn web search evaluation, context editing let agents complete workflows that otherwise failed outright, while cutting token consumption by 84%. On Anthropic's internal evaluation set for agentic search on complex, multi-step tasks, editing alone improved performance 29% over baseline; combined with the memory tool, 39%. These are the vendor's own figures on an internal set, not an independent benchmark. The lesson generalises beyond one vendor: old tool output is the least valuable and most voluminous thing in the window, and a loop that never prunes it is paying rent on rubbish.<\/p>\n<h2>Files as the loop's memory<\/h2>\n<p>State that must survive belongs outside the window entirely, in plain files the agent reads and writes: a <code>plan.md<\/code>, a <code>TODO.md<\/code> with checkboxes, a ratchet file recording the best score so far. The model forgets between runs; the repository remembers. This is Osmani's \"external state\" component and the quiet trick behind every unattended pattern — the <a href=\"build-overnight.md\">overnight loop<\/a> is really just a ratchet file and a report file with a while-loop around them. Second-brain readers will recognise the move: working memory is ephemeral, so anything that matters gets written down.<\/p>\n<h2>Fresh context per attempt<\/h2>\n<p>The counterintuitive discipline, learned the hard way by the Ralph loop crowd: between attempts, throw the transcript away. A failed attempt's transcript is mostly a record of confusion — wrong hypotheses, dead-end searches, apologies — and carrying it forward poisons the next attempt, which treats the confusion as established fact. Geoffrey Huntley's original loop restarts the agent cold every iteration on purpose; the same files stack into context every pass, so the prompt file and the repo are the only memory, and each attempt gets a clean window plus the goal.<\/p>\n<p>What crosses the gap between attempts is a distillation, not a history: the failing test output, the critic's list of defects, the current todo state. That is exactly what the <a href=\"build-goal-test.md\">goal test build<\/a> feeds back — the goal script's stderr, nothing else.<\/p>\n<h2>What to carry, what to burn<\/h2>\n<ul>\n<li><strong>Carry<\/strong>: the goal, the todo file, the last verifier output, the critic's verdict, the ratchet score.<\/li>\n<li><strong>Burn<\/strong>: exploration transcripts, bulk tool output, the agent's running commentary, anything it said about how well things are going.<\/li>\n<\/ul>\n<p>The test for each item is blunt: would a fresh, competent agent act better with this in front of it? Verifier output passes that test. A 40,000-token log of the last attempt failing does not. Hygiene is deciding on behalf of the next attempt, which is why it belongs to the loop and not to the model.<\/p>"},{"id":"track-loop/patterns","title":"Patterns","html":"<p>Five loop shapes keep reappearing under different names. Each earns its keep on a particular kind of work, and each has failure modes its advocates tend to soft-pedal. They are listed here with both.<\/p>\n<h2>Run-in-a-loop (Ralph)<\/h2>\n<p>Geoffrey Huntley's July 2025 original: <code>while :; do cat PROMPT.md | claude-code ; done<\/code>. No orchestration at all — when a session ends, another starts cold, reads the same prompt file and the same repo, and picks up where the last one left off through files on disk. It is the purest demonstration that fresh context plus persistent files beats one long degrading session, and Anthropic ships a variant as the <a href=\"https://github.com/anthropics/claude-code/blob/main/plugins/ralph-wiggum/README.md\"><code>ralph-wiggum<\/code> plugin<\/a> in the Claude Code repo. The plugin differs from the original in one respect that matters here: a Stop hook blocks the session from exiting and feeds the same prompt back, so the loop runs inside your current session rather than starting cold each time, and <code>--max-iterations<\/code> defaults to unlimited.<\/p>\n<p>Failure modes, admitted by the author himself: placeholder implementations that satisfy the compiler and nothing else; waking up to a tree that does not build; and it suits greenfield work — Huntley's own line is that he would not run Ralph on an existing codebase. Ralph gets you roughly 90% of a first version, with a human stop button as the only brake.<\/p>\n<h2>Plan-execute-verify<\/h2>\n<p>Split the run into phases: one pass produces a plan file, subsequent passes execute steps, a verifier gates each one. Good for multi-step work where a single prompt drifts. Failure mode: plans go stale on contact with reality, and a loop that executes a stale plan faithfully compounds the error — the verifier must run per step, not once at the end.<\/p>\n<h2>Generator-critic pairs<\/h2>\n<p>One agent makes, a separate pass judges against a narrow rubric, defects feed the next attempt. The maker-checker separation is the point: the implementer cannot grade itself. Failure modes: a vague rubric turns the critic into a noise generator; and when generator and critic share a model and a context, they share blind spots and converge on approving each other. Details in <a href=\"critics-and-verification.md\">critics and verification<\/a>; wiring in <a href=\"build-critic.md\">Build: the critic<\/a>.<\/p>\n<h2>Tournament / best-of-n<\/h2>\n<p>Launch n attempts in parallel — git worktrees make this cheap to isolate — and let a verifier pick the winner. Powerful when attempts are high-variance and verification is cheap. Failure modes: cost multiplies by n whether or not any attempt is good; and without a genuinely strong picker you have paid n times for confident garbage and then chosen the most confident of it. The verifier asymmetry test decides whether this pattern is affordable at all.<\/p>\n<h2>Overnight unattended runs with mailbox reports<\/h2>\n<p>Budgeted, ratcheted, branch-isolated runs that work while you sleep and leave a morning report in markdown: what improved, what stopped the loop, what needs a decision. The end state of the discipline, and the pattern with the strictest entry requirements — every brake from <a href=\"stop-conditions.md\">stop conditions<\/a>, plus rails that make the worst case boring. Failure modes: unattended loops make unattended mistakes, and the debt lands on you as comprehension debt — shipped changes outpacing your understanding of them. Osmani's warning stands: build the loop like someone who intends to stay the engineer, not just the person who presses go.<\/p>\n<h2>Choosing between them<\/h2>\n<p>Start with the simplest loop that has a real verifier: the plain retry loop in <a href=\"build-goal-test.md\">Build: the goal test<\/a>. Add a critic when green-but-ugly becomes your common failure. Go parallel or overnight only once the single loop stops legibly every time — the fancier patterns amplify whichever discipline you already have, including its absence.<\/p>"},{"id":"track-loop/build-goal-test","title":"Build: the Goal Test","html":"<p>Three build pages assemble a working loop around a headless coding agent. This one delivers the skeleton: define done as a script, run the agent, run the goal test, feed failures back, cap the attempts. The examples drive Claude Code's non-interactive mode (<code>claude -p<\/code>), the reference harness from <a href=\"../track-harness/claude-code-as-harness.md\">the harness handbook<\/a>, but any CLI agent that takes a prompt and edits files will slot in.<\/p>\n<p>You need <code>claude<\/code> and <code>jq<\/code> on your path, and a repo with a test suite. The flags below match the <a href=\"https://code.claude.com/docs/en/headless\">headless mode documentation<\/a> as of October 2026: <code>-p<\/code> runs one non-interactive session, <code>--allowedTools<\/code> pre-approves tools using permission rule syntax (the trailing <code>*<\/code> is prefix matching), <code>--permission-mode acceptEdits<\/code> lets it write files without prompting, and <code>--output-format json<\/code> returns the result with metadata including <code>total_cost_usd<\/code>, which the docs call a client-side estimate that can differ from your bill.<\/p>\n<h2>Done as a script<\/h2>\n<p>The goal test is the whole design. It must be executable, binary, and outside the agent's control — here, tests plus lint:<\/p>\n<pre><code class=\"language-bash\">#!/usr/bin/env bash\n# goal-loop.sh — run a coding agent until the goal test passes or attempts run out.\nset -u\n\nTASK=&quot;Make every test under tests/ pass. Do not delete, skip or weaken any test.&quot;\nMAX_ATTEMPTS=5\n\ngoal_test() {\n    python -m pytest -q --tb=short &amp;&amp; ruff check .\n}\n\nfeedback=&quot;&quot;\nattempt=1\nwhile [ &quot;$attempt&quot; -le &quot;$MAX_ATTEMPTS&quot; ]; do\n    echo &quot;=== attempt $attempt of $MAX_ATTEMPTS ===&quot;\n\n    prompt=&quot;$TASK&quot;\n    if [ -n &quot;$feedback&quot; ]; then\n        prompt=&quot;$TASK\n\nThe previous attempt failed the goal test with this output:\n$feedback\n\nFix these specific failures.&quot;\n    fi\n\n    claude -p &quot;$prompt&quot; \\\n        --allowedTools &quot;Read,Edit,Bash(python -m pytest *),Bash(ruff *)&quot; \\\n        --permission-mode acceptEdits \\\n        --output-format json | jq -r '.total_cost_usd as $c | &quot;agent done (cost $\\($c))&quot;'\n\n    if feedback=$(goal_test 2&gt;&amp;1); then\n        echo &quot;PASS: goal test green on attempt $attempt&quot;\n        exit 0\n    fi\n    echo &quot;FAIL: goal test still red&quot;\n    attempt=$((attempt + 1))\ndone\n\necho &quot;STOP: $MAX_ATTEMPTS attempts spent; handing back to the human&quot;\nexit 1\n<\/code><\/pre>\n<p>Save it, <code>chmod +x goal-loop.sh<\/code>, run it in a repo with failing tests, and watch it converge or stop.<\/p>\n<h2>Why each piece is there<\/h2>\n<p><strong>The goal test runs in the wrapper, not the agent.<\/strong> The agent also runs pytest while working — that is fine, that is how it navigates. But the verdict that ends the loop comes from your shell, in a process the model never touches. This is the \"checks, never asks\" rule from <a href=\"critics-and-verification.md\">critics and verification<\/a> in its smallest form.<\/p>\n<p><strong>Failure output is the only thing carried forward.<\/strong> Each attempt is a fresh <code>claude -p<\/code> session: clean context, the task, and the distilled evidence of what is still wrong. No transcript of the previous attempt's confusion travels with it — the fresh-context-per-attempt argument from <a href=\"context-hygiene.md\">context hygiene<\/a>.<\/p>\n<p><strong>The cap is small and the exit codes are honest.<\/strong> Five attempts, then exit 1 with a plain statement. That makes the script composable: CI can gate on it, cron can alert on it, and the next two build pages can wrap it.<\/p>\n<h2>What it is not, yet<\/h2>\n<p>This loop accepts anything green. An agent that passes the tests by ugly means — dead code, swallowed errors, a sneaky change just outside the tests' reach — sails through. Part two adds a judge for exactly that: <a href=\"build-critic.md\">Build: the critic<\/a>.<\/p>"},{"id":"track-loop/build-critic","title":"Build: the Critic","html":"<p><a href=\"build-goal-test.md\">Part one<\/a> stops on green. This part adds the second judgement: green and clean. A separate critic pass reviews the diff against a narrow rubric, and its defects — not vague advice — feed the next attempt. The theory is in <a href=\"critics-and-verification.md\">critics and verification<\/a>; this is the forty extra lines.<\/p>\n<p>Two design rules carry the whole thing. The critic is a <strong>separate session<\/strong>: a fresh <code>claude -p<\/code> call that sees only the diff and the rubric, never the working transcript, so it cannot inherit the maker's rationalisations. And the rubric is <strong>narrow and checkable<\/strong>: four rules, a demanded verdict format, and an explicit ban on commenting about anything else.<\/p>\n<h2>The code<\/h2>\n<pre><code class=\"language-bash\">#!/usr/bin/env bash\n# critic-loop.sh — the goal test decides correct; a critic pass decides acceptable.\nset -u\n\nTASK=&quot;Make every test under tests/ pass. Do not delete, skip or weaken any test.&quot;\nMAX_ATTEMPTS=5\nBASE_REF=$(git rev-parse HEAD)\n\ngoal_test() {\n    python -m pytest -q --tb=short &amp;&amp; ruff check .\n}\n\ncritic() {\n    git diff &quot;$BASE_REF&quot; | claude -p \\\n&quot;You are a code reviewer. Judge this diff against exactly four rules:\n1. No test was deleted, skipped or weakened.\n2. No debug prints, dead code or commented-out blocks were added.\n3. Errors are handled, not silently swallowed.\n4. The change stays inside the task; no drive-by refactoring.\nIf all four hold, reply with the single word PASS.\nOtherwise list each violation as: file, the problem, the one-line fix.\nJudge only these rules. Never comment on style or architecture.&quot; \\\n        --output-format json | jq -r '.result'\n}\n\nfeedback=&quot;&quot;\nfor attempt in $(seq 1 &quot;$MAX_ATTEMPTS&quot;); do\n    echo &quot;=== attempt $attempt of $MAX_ATTEMPTS ===&quot;\n\n    prompt=&quot;$TASK&quot;\n    if [ -n &quot;$feedback&quot; ]; then\n        prompt=&quot;$TASK\n\nThe previous attempt was rejected:\n$feedback\n\nFix exactly these points, nothing else.&quot;\n    fi\n\n    claude -p &quot;$prompt&quot; \\\n        --allowedTools &quot;Read,Edit,Bash(python -m pytest *),Bash(ruff *)&quot; \\\n        --permission-mode acceptEdits &gt; /dev/null\n\n    if ! feedback=$(goal_test 2&gt;&amp;1); then\n        echo &quot;goal test red; retrying with failures&quot;\n        continue\n    fi\n\n    verdict=$(critic)\n    case &quot;$verdict&quot; in\n        PASS*)\n            echo &quot;green and clean on attempt $attempt&quot;\n            exit 0\n            ;;\n        *)\n            feedback=&quot;The goal test passes, but the reviewer found defects:\n$verdict&quot;\n            echo &quot;critic rejected; retrying with defects&quot;\n            ;;\n    esac\ndone\n\necho &quot;STOP: $MAX_ATTEMPTS attempts spent; handing back to the human&quot;\nexit 1\n<\/code><\/pre>\n<h2>How the pieces fit<\/h2>\n<p>The order matters: goal test first, critic second. There is no point paying for a review of code that does not work, so the deterministic critic screens for the LLM critic — cheap judges before expensive ones. The diff is taken against <code>BASE_REF<\/code>, pinned before the loop starts, so the critic always reviews the total change rather than the last increment.<\/p>\n<p>Notice what the critic's output becomes: the next attempt's <code>feedback<\/code>, phrased as \"fix exactly these points, nothing else\". Actionable defects with locations convert directly into a bounded task. That is why the rubric bans style commentary — a critic that says \"consider a more functional approach\" sends the next attempt on a refactoring holiday, and your five attempts evaporate into churn.<\/p>\n<p>The critic still shares failure modes with any LLM judge — leniency, self-preference when maker and checker share a model. Rule one of the rubric is also enforced by nothing but the critic here; a stricter build would deny the agent write access to <code>tests/<\/code> outright. Both rails, plus running the whole thing unattended, are <a href=\"build-overnight.md\">part three<\/a>.<\/p>"},{"id":"track-loop/build-overnight","title":"Build: the Overnight Loop","html":"<p>The final build runs unattended. Everything from <a href=\"build-goal-test.md\">parts one and two<\/a> still applies; what changes is that nobody is watching, so the rails must make the worst case boring: a budget on iterations, a ratchet that stops the run the moment progress stalls, a morning report in markdown, and git as the safety net — own branch, hard reset on regression, and nothing is ever pushed.<\/p>\n<p>The ratchet is the heart. Each iteration must beat the best previous score — here, tests passing — or the loop resets the attempt and stops. Monotonic or nothing; a loop allowed to move sideways all night will. The reasoning is in <a href=\"stop-conditions.md\">stop conditions<\/a>.<\/p>\n<h2>The code<\/h2>\n<pre><code class=\"language-python\">#!/usr/bin/env python3\n&quot;&quot;&quot;overnight.py — unattended agent loop: budgeted, ratcheted, reported.&quot;&quot;&quot;\nimport datetime\nimport json\nimport pathlib\nimport re\nimport subprocess\nimport sys\n\nTASK = (&quot;Open TODO.md. Implement the top unchecked item, add tests for it, &quot;\n        &quot;and tick the item off. Do not delete, skip or weaken any existing test.&quot;)\nMAX_ITERATIONS = 10\nRATCHET = pathlib.Path(&quot;ratchet.json&quot;)\nREPORT = pathlib.Path(&quot;MORNING-REPORT.md&quot;)\n\n\ndef sh(cmd, timeout=2400):\n    return subprocess.run(cmd, shell=True, capture_output=True, text=True,\n                          timeout=timeout)\n\n\ndef score():\n    &quot;&quot;&quot;Progress metric: tests passing. Higher is better; it must never fall.&quot;&quot;&quot;\n    out = sh(&quot;python -m pytest -q --tb=no&quot;).stdout\n    m = re.search(r&quot;(\\d+) passed&quot;, out)\n    return int(m.group(1)) if m else 0\n\n\ndef main():\n    # refuse to run over uncommitted work; the loop's own files are exempt\n    if sh(&quot;git status --porcelain -- ':!ratchet.json' ':!MORNING-REPORT.md'&quot;).stdout.strip():\n        sys.exit(&quot;working tree not clean&quot;)\n    stamp = datetime.datetime.now().strftime(&quot;%Y%m%d-%H%M&quot;)\n    sh(f&quot;git checkout -b overnight/{stamp}&quot;)  # rail 1: own branch, never pushed\n    best = score()\n    RATCHET.write_text(json.dumps({&quot;best&quot;: best}))\n    lines = [f&quot;# Overnight report {stamp}&quot;, &quot;&quot;,\n             f&quot;Baseline: {best} tests passing.&quot;, &quot;&quot;]\n\n    for i in range(1, MAX_ITERATIONS + 1):\n        sh('claude -p &quot;{}&quot; '\n           '--allowedTools &quot;Read,Edit,Bash(python -m pytest *)&quot; '\n           '--permission-mode acceptEdits '\n           '--permission-prompts none'.format(TASK))\n        now = score()\n        if now &gt; best:\n            best = now\n            RATCHET.write_text(json.dumps({&quot;best&quot;: best}))\n            sh(f'git add -A &amp;&amp; git commit -m &quot;overnight {i}: {now} passing&quot;')\n            lines.append(f&quot;- iteration {i}: improved to {now} passing, committed&quot;)\n        else:\n            sh(&quot;git reset --hard&quot;)            # rail 2: a bad attempt never survives\n            lines.append(f&quot;- iteration {i}: {now} passing, no improvement; stopped&quot;)\n            break\n    else:\n        lines.append(f&quot;- iteration budget of {MAX_ITERATIONS} spent&quot;)\n\n    lines += [&quot;&quot;, f&quot;Final: {best} passing on branch overnight/{stamp}. &quot;\n                  &quot;Nothing was pushed; review and merge by hand.&quot;]\n    REPORT.write_text(&quot;\\n&quot;.join(lines) + &quot;\\n&quot;, encoding=&quot;utf-8&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    main()\n<\/code><\/pre>\n<p>Run <code>python overnight.py<\/code> before bed; read <code>MORNING-REPORT.md<\/code> with coffee.<\/p>\n<h2>The rails, spelled out<\/h2>\n<p><strong>Branch, commit, never push.<\/strong> Every improvement is committed on <code>overnight/&lt;stamp&gt;<\/code>, so the morning decision is a normal code review of a normal branch. The script contains no push and the agent has no git permissions at all — its <code>--allowedTools<\/code> covers reading, editing and pytest, nothing else. <code>--permission-prompts none<\/code> tells the harness nobody is available: anything that would prompt is denied rather than left hanging until dawn. The flag needs Claude Code v2.1.259 or later; earlier versions reject it (<a href=\"https://code.claude.com/docs/en/headless\">headless docs<\/a>).<\/p>\n<p><strong>Reset on regression.<\/strong> When the score fails to improve, <code>git reset --hard<\/code> discards the attempt before stopping. Combined with the ratchet, the invariant is strong: the branch only ever contains states measurably better than the last, which is what lets you trust the report without rereading every diff.<\/p>\n<p><strong>Scope of the git commands.<\/strong> <code>git add -A<\/code> and <code>git reset --hard<\/code> are safe here only because this runs in a code repository on its own <code>overnight/&lt;stamp&gt;<\/code> branch with a clean working tree. <code>git reset --hard<\/code> also discards uncommitted edits to tracked files, which is why the script refuses to start on a dirty tree. It leaves untracked files behind, so a file the agent created and never added stays in the working directory. Do not copy these two lines into a vault. The guide's rules there are narrower: stage only the paths the run wrote, revert a run by reverting its commit, and retire pages by archiving them instead of deleting. See <a href=\"../06-agents/safety-and-guardrails.md\">guardrails<\/a> and <a href=\"../09-maintenance/versioning-with-git.md\">versioning with git<\/a>.<\/p>\n<p><strong>The report is the mailbox.<\/strong> Unattended loops make unattended mistakes; the report is where they surface, per iteration, with the brake that fired. Between iterations, only <code>TODO.md<\/code> and the ratchet file persist — deliberately, per <a href=\"context-hygiene.md\">context hygiene<\/a>. Each session wakes up cold, reads the todo, and does one bounded thing.<\/p>"},{"id":"track-loop/resources","title":"Resources","html":"<p>A health warning first: \"loop engineering\" was coined in June 2026 and is three months old as this page is written. The practices underneath are sturdier than the label — Steinberger himself was already asking whether the conversation had moved from loops to graphs by mid-July. Read for the mechanisms, hold the vocabulary loosely. Anthropic, Claude Code docs and GitHub entries were re-checked on 5 October 2026; the X, O'Reilly, Osmani, IBM, Huntley, Willison and arXiv entries are marked as last checked September 2026 and not re-checked on 5 October 2026 because the pages could not be fetched.<\/p>\n<h2>The naming<\/h2>\n<ul>\n<li><a href=\"https://x.com/steipete/status/2063697162748260627\">Peter Steinberger's post<\/a> — the line that caught, June 2026: \"You shouldn't be prompting coding agents anymore. You should be designing loops that prompt your agents.\"<\/li>\n<li><a href=\"https://www.oreilly.com/radar/loop-engineering/\">Loop Engineering<\/a> — Addy Osmani's essay, syndicated on O'Reilly Radar. The anatomy: automations, worktrees, skills, connectors, subagents, external state — and the honest closing warnings about verification burden and comprehension debt.<\/li>\n<li><a href=\"https://addyosmani.com/blog/code-review-ai/\">Code review in the age of AI<\/a> — Osmani's companion piece; \"your job is to ship code you confirmed works\" is this handbook in nine words.<\/li>\n<li><a href=\"https://www.ibm.com/think/topics/loop-engineering\">What is loop engineering?<\/a> — IBM's topic page; useful as the sober institutional definition, strong on the risks (comprehension debt, intent debt, cognitive surrender).<\/li>\n<\/ul>\n<h2>Papers<\/h2>\n<ul>\n<li><a href=\"https://arxiv.org/pdf/2607.00038\">Stop Hand-Holding Your Coding Agent<\/a> — Sandeco Macedo. The academic treatment: termination conditions, verification and critic components as first-class loop infrastructure.<\/li>\n<li><a href=\"https://arxiv.org/pdf/2606.10209\">Less Context, Better Agents<\/a> — efficient context engineering for long-horizon tool-using agents; the measured case for the pruning argued in <a href=\"context-hygiene.md\">context hygiene<\/a>.<\/li>\n<\/ul>\n<h2>Anthropic material<\/h2>\n<ul>\n<li><a href=\"https://claude.com/blog/context-management\">Managing context on the Claude Developer Platform<\/a> — context editing and the memory tool, with the numbers this handbook quotes: an 84% token cut on a 100-turn evaluation, 29% from editing alone, 39% combined.<\/li>\n<li>The harness handbook's <a href=\"../track-harness/resources.md\">resources page<\/a> holds the rest of the Anthropic canon — building effective agents, effective context engineering — which this handbook assumes rather than repeats.<\/li>\n<\/ul>\n<h2>Practice<\/h2>\n<ul>\n<li><a href=\"https://ghuntley.com/ralph/\">Ralph Wiggum as a \"software engineer\"<\/a> — Geoffrey Huntley. The bash loop that started it, with unusually honest failure notes.<\/li>\n<li><a href=\"https://simonwillison.net/2025/Sep/30/designing-agentic-loops/\">Designing agentic loops<\/a> — Simon Willison, September 2025. Which tasks loop well, and the security posture for letting one run.<\/li>\n<\/ul>\n<h2>Repos worth reading<\/h2>\n<ul>\n<li><a href=\"https://github.com/humanlayer/12-factor-agents\">humanlayer/12-factor-agents<\/a> — principles for agents that survive production; several factors are loop discipline by another name.<\/li>\n<li><a href=\"https://github.com/anthropics/claude-code/blob/main/plugins/ralph-wiggum/README.md\">anthropics/claude-code<\/a> — the <code>ralph-wiggum<\/code> plugin: the run-in-a-loop pattern as maintained, inspectable code.<\/li>\n<li><a href=\"https://github.com/vercel-labs/ralph-loop-agent\">vercel-labs/ralph-loop-agent<\/a> — the same pattern rebuilt on the AI SDK, with verification and iteration made explicit.<\/li>\n<\/ul>\n<h2>Start here<\/h2>\n<ol>\n<li><strong>Write one goal test.<\/strong> Pick a task you keep hand-prompting and express done as a script that exits 0. If you cannot, per <a href=\"what-loop-engineering-is.md\">what loop engineering is<\/a>, it is not a loop candidate yet.<\/li>\n<li><strong>Build the retry loop.<\/strong> Work through <a href=\"build-goal-test.md\">Build: the goal test<\/a> on a small repo with failing tests. One evening.<\/li>\n<li><strong>Add the judge, then the rails.<\/strong> Critic pass, then ratchet and report — and only once the loop stops legibly every single time do you let it run while you sleep.<\/li>\n<\/ol>"},{"id":"track-evals/why-evals","title":"Why Evals","html":"<p>Evals are the tests of AI products. A prompt change that fixes one complaint quietly breaks three other things; without measurement you find out from users. Teams that ship reliable LLM features treat evaluation as an engineering discipline, not a vibe check before the demo.<\/p>\n<h2>Vibes vs measurement<\/h2>\n<p>Vibes-based development looks like this: tweak the prompt, paste in the three examples you remember, nod, ship. It works for a weekend project. It collapses the moment you have real traffic, because you are sampling your own memory instead of your users' inputs.<\/p>\n<p>Measurement is boring and specific:<\/p>\n<ul>\n<li>a fixed set of inputs that represent real usage<\/li>\n<li>an automated way to score each output<\/li>\n<li>a number that moves when you change something<\/li>\n<\/ul>\n<p>That number is what lets you say \"the new model is worth the migration\" or \"this prompt edit made retrieval worse\" with a straight face.<\/p>\n<h2>The eval flywheel<\/h2>\n<p>The loop, roughly as taught by Hamel Husain and Shreya Shankar and echoed in <a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\">Anthropic's agent-evals guide<\/a>:<\/p>\n<ol>\n<li><strong>Error analysis.<\/strong> Read real traces. Not dashboards — actual transcripts, thirty or a hundred of them. Write a short note on every failure you see.<\/li>\n<li><strong>Taxonomy.<\/strong> Cluster those notes into named failure modes: \"hallucinated order ID\", \"ignored the date filter\", \"apologised instead of acting\".<\/li>\n<li><strong>Metrics.<\/strong> Turn each frequent failure mode into a check — a string assertion, a code test, or an <a href=\"llm-as-judge.md\">llm as judge<\/a> with a narrow rubric.<\/li>\n<li><strong>Iterate.<\/strong> Fix the biggest failure mode, re-run, watch the numbers, go back to step 1 with fresh traces.<\/li>\n<\/ol>\n<p>The flywheel matters more than any single metric. Generic scores like \"helpfulness 1–10\" tell you nothing; a metric born from your own failure taxonomy tells you exactly what to fix. How to turn failure modes into concrete test cases is covered in <a href=\"designing-evals.md\">designing evals<\/a>.<\/p>\n<h2>Why teams skip it, and the bill<\/h2>\n<p>Common excuses, all understandable, all expensive:<\/p>\n<ul>\n<li>\"Outputs are subjective, you can't test them.\" You can. Subjective wholes decompose into objective parts.<\/li>\n<li>\"We'll add evals after launch.\" After launch you are debugging in production with angry users as your graders.<\/li>\n<li>\"Looking at data is grunt work.\" Reading traces is the highest-leverage hour an AI engineer spends. Nobody delegates their unit tests to hope.<\/li>\n<\/ul>\n<p>The bill arrives as regression whack-a-mole: every fix is a gamble, model upgrades are terrifying, and velocity drops precisely when the product starts mattering. Teams with evals upgrade models the week they ship, because the suite tells them what broke.<\/p>\n<p>Start small. Twenty real failures, one taxonomy, one metric. The flywheel does the rest. When your product is an agent rather than a single call, see <a href=\"agent-evals.md\">agent evals<\/a> for the extra machinery.<\/p>"},{"id":"track-evals/designing-evals","title":"Designing Evals","html":"<p>An eval is only as good as its test cases. The route from \"our bot sometimes messes up\" to a suite you trust runs through failure modes: name what goes wrong, then build cases that provoke it. This page assumes you have done the error analysis described in <a href=\"why-evals.md\">why evals<\/a>.<\/p>\n<h2>Golden sets<\/h2>\n<p>A golden set is a fixed collection of inputs with known-good expectations, curated by a human who understands the product. Rules of thumb:<\/p>\n<ul>\n<li>Source from production traces first, invention second. Real inputs are weirder than anything you will write.<\/li>\n<li>Every named failure mode gets at least a handful of cases that historically triggered it.<\/li>\n<li>Include boring successes too, or you will over-fit to pathology and regress the happy path.<\/li>\n<li>Version it in git next to the code. A golden set nobody can diff is a golden set nobody trusts.<\/li>\n<\/ul>\n<h2>Synthetic data<\/h2>\n<p>When traffic is thin — pre-launch, or for rare-but-critical paths — generate cases. Use an LLM to vary dimensions you choose deliberately: persona, phrasing, length, language, adversarial intent. Two cautions:<\/p>\n<ul>\n<li>Synthetic inputs are fine; synthetic <em>labels<\/em> are circular. A model grading a model on data it invented proves little. Have a human spot-check labels.<\/li>\n<li>Generate along a schema of dimensions, not \"give me 100 diverse examples\", which yields 100 examples of the same three ideas.<\/li>\n<\/ul>\n<h2>Graded vs binary<\/h2>\n<p>Prefer binary. Pass/fail forces you to define the bar, and disagreements between humans surface immediately. A 1–5 \"quality\" scale mostly measures the grader's mood; two annotators will happily give the same output a 3 and a 4 and learn nothing. If something genuinely has degrees, decompose it into several binary checks (cites a source: yes/no; correct source: yes/no) rather than one fuzzy scalar. This matters double when the grader is an <a href=\"llm-as-judge.md\">llm as judge<\/a>.<\/p>\n<h2>Per-step vs end-to-end<\/h2>\n<p>For single calls the question does not arise. For agents you need both:<\/p>\n<ul>\n<li><strong>End-to-end<\/strong>: did the task get done? This is the number that matters to users.<\/li>\n<li><strong>Per-step<\/strong>: was each tool call sensible, did retrieval return the right document, did the plan address the request? These localise the failure when end-to-end fails.<\/li>\n<\/ul>\n<p>End-to-end tells you <em>that<\/em> it broke; per-step tells you <em>where<\/em>. Details in <a href=\"agent-evals.md\">agent evals<\/a>.<\/p>\n<h2>Sample sizes that matter<\/h2>\n<p>Small suites lie. With 20 cases, a swing from 70% to 80% is two examples — noise. Rough guidance:<\/p>\n<ul>\n<li>20–50 cases: enough to start the flywheel, not enough to compare prompts.<\/li>\n<li>100–200 per failure mode you care about: at 100 cases the 95% interval on a single pass rate is still about ±10 points at worst (normal approximation, 1.96·√(0.25/100)), so only large or paired differences mean something.<\/li>\n<li>Run stochastic systems multiple times per case; report the spread, not one lucky run.<\/li>\n<\/ul>\n<p>When in doubt, compute a confidence interval before celebrating. If the interval spans both \"improved\" and \"regressed\", collect more cases instead of shipping.<\/p>"},{"id":"track-evals/llm-as-judge","title":"LLM as Judge","html":"<p>Some checks are code: exact match, regex, JSON schema, \"does the SQL run\". Everything else — tone, faithfulness, whether the answer actually addresses the question — needs a grader that reads. That grader is usually another LLM. Useful, cheap, and untrustworthy until calibrated.<\/p>\n<h2>Writing the judge prompt<\/h2>\n<p>A judge prompt is a job description, not a wish:<\/p>\n<ul>\n<li>One question per judge. \"Is the claim supported by the provided context: yes/no\" beats \"rate overall quality\".<\/li>\n<li>Binary output with a required <em>written rationale before the verdict<\/em>. The rationale is your debugging trail; verdict-first judges rationalise.<\/li>\n<li>Include 2–4 worked examples of pass and fail, especially borderline ones.<\/li>\n<li>Give it the same context the product had. A judge grading a RAG answer without the retrieved documents is guessing.<\/li>\n<\/ul>\n<p>Keep the rubric in the prompt concrete: quote the failure taxonomy from your error analysis (see <a href=\"designing-evals.md\">designing evals<\/a>), not adjectives like \"helpful\" or \"high-quality\".<\/p>\n<h2>Calibration against human labels<\/h2>\n<p>An uncalibrated judge is a random number generator with confidence. The procedure, straight from Hamel Husain's <a href=\"https://hamel.dev/blog/posts/llm-judge/\">judge guide<\/a>:<\/p>\n<ol>\n<li>A domain expert labels 50–100 outputs pass/fail with a short reason.<\/li>\n<li>Run the judge on the same set; measure agreement (report per-class agreement, not raw accuracy — a judge that always says \"pass\" scores 90% on mostly-good data).<\/li>\n<li>Read every disagreement. Fix the rubric, or discover your own labels were inconsistent — both happen.<\/li>\n<li>Repeat until agreement is boring, then re-check quarterly and whenever you change the judge model.<\/li>\n<\/ol>\n<p>Shreya Shankar's <a href=\"https://arxiv.org/abs/2404.12272\">Who Validates the Validators?<\/a> is the research treatment of this loop.<\/p>\n<h2>Known bias failure modes<\/h2>\n<p>Documented since the <a href=\"https://arxiv.org/abs/2306.05685\">MT-Bench paper<\/a> and still alive in 2026:<\/p>\n<ul>\n<li><strong>Position bias.<\/strong> In pairwise comparisons, judges favour the first (sometimes second) answer. Swap the order and average, or the comparison is meaningless.<\/li>\n<li><strong>Verbosity bias.<\/strong> Longer answers score higher, correctness held constant. Length-cap or explicitly instruct against it, then verify.<\/li>\n<li><strong>Self-preference.<\/strong> Models rate their own family's outputs higher. Judge with a different model than the one being judged where feasible.<\/li>\n<li><strong>Sycophancy toward stated intent.<\/strong> Include the user's claimed goal and the judge grades effort, not results.<\/li>\n<\/ul>\n<h2>When judges lie<\/h2>\n<p>Judges fail silently on: maths and arithmetic, niche domain facts, subtle instruction violations, and anything the judge model itself would get wrong. If a check <em>can<\/em> be code, make it code. Reserve the judge for genuinely linguistic judgements, keep humans auditing a sample of its verdicts forever, and never let judge scores gate a release that per-step checks contradict — see <a href=\"agent-evals.md\">agent evals<\/a> for how the two combine.<\/p>"},{"id":"track-evals/agent-evals","title":"Agent Evals","html":"<p>A single completion is a function; an agent is a process. It plans, calls tools, reads results, and recovers (or doesn't) from its own mistakes. Evaluating the final answer alone is like reviewing a chess game by the last move. This page builds on <a href=\"designing-evals.md\">designing evals<\/a>.<\/p>\n<h2>Trajectories, not just outcomes<\/h2>\n<p>Log the whole trajectory: every model turn, tool call, tool result, and retry. Then evaluate at two levels:<\/p>\n<ul>\n<li><strong>Outcome<\/strong>: did the task complete, and is the end state correct? Best checked against the <em>environment<\/em> (the file exists, the row was inserted, the tests pass
