checks the pages against the sources.\nSeparate context is what makes the check meaningful; the same agent rereading its\nown work mostly agrees with itself.<\/p>\n<h2 id=\"when-not-to\">When not to<\/h2>\n<p><strong>Related sources.<\/strong> Three articles about the same topic must be ingested\nsequentially. In parallel, each one creates the concept page independently and\nyou get three versions of it, or two of them are overwritten.<\/p>\n<p><strong>Anything touching the index.<\/strong> <code>index.md<\/code> and <code>log.md<\/code> are single files that\nevery run wants to append to. Parallel writes to them conflict or silently lose\nentries.<\/p>\n<p><strong>Small jobs.<\/strong> Spawning a subagent costs a full context setup. For two files it\nis slower than doing it directly.<\/p>\n<h2 id=\"merging-parallel-work\">Merging parallel work<\/h2>\n<p>The rule that avoids most conflicts: subagents write to disjoint paths, the\nparent merges.<\/p>\n<p>Have each subagent report what it would write rather than writing shared files\ndirectly. The parent applies the index and log updates in one pass, after all\nsubagents return. Page files themselves are safe to write in parallel as long as\ntwo subagents were never given overlapping material.<\/p>\n<p>Commit before any parallel run. When it goes wrong, it goes wrong across many\nfiles at once.<\/p>\n<h2 id=\"cost\">Cost<\/h2>\n<p>Parallelism does not reduce total token use, it reduces wall-clock time and\nprotects the main context. Each subagent sends its own requests, and those count\ntoward the same usage limits as your main conversation, so four subagents cost\nroughly four times one.<\/p>\n<p>That trade is worth it for a large backfill and pointless for a daily ingest of\nfive clipped articles.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"hooks.md\">Hooks<\/a><\/p>"},{"id":"06-agents/hooks","title":"Hooks","html":"<p>Hooks are shell commands that Claude Code runs at set points in its lifecycle\n(the <a href=\"https://code.claude.com/docs/en/hooks-guide\">hooks guide<\/a> lists the\nevents, such as <code>PreToolUse<\/code>, <code>PostToolUse<\/code> and <code>Stop<\/code>). They fire on events\nrather than on a schedule. They are the right tool for\nthings that must happen every time, which is exactly the set of things a prompt\ninstruction will eventually miss.<\/p>\n<h2 id=\"worth-hooking\">Worth hooking<\/h2>\n<p><strong>Validation before a write.<\/strong> Check frontmatter parses and required fields are\npresent. A malformed page caught at write time is a non-event; caught a month\nlater it is a page that has been invisible to every query since.<\/p>\n<p><strong>Lint after a run.<\/strong> Broken links appear at the moment they are created, which\nis the moment there is enough context to fix them properly.<\/p>\n<p><strong>Commit after a scheduled run.<\/strong> Removes the possibility of a run that changed\nforty files and left no commit.<\/p>\n<p><strong>Notify on deletion.<\/strong> Any delete, any time, surfaces. Deletions are rare enough\nthat a notification costs nothing and matters when it fires.<\/p>\n<h2 id=\"not-worth-hooking\">Not worth hooking<\/h2>\n<p>Anything slow. A hook that runs on every file write and takes two seconds turns a\nforty-page ingest into a ninety-second pause, and you will disable it.<\/p>\n<p>Anything that needs judgement. Hooks are mechanical checks. A hook trying to\ndecide whether a page is good enough will be wrong in both directions.<\/p>\n<h2 id=\"keep-them-fast-and-quiet\">Keep them fast and quiet<\/h2>\n<p>A hook should complete in well under a second and print nothing when it passes.\nHooks that log on success train you to ignore hook output, which is the same as\nhaving no hooks the day one fails.<\/p>\n<h2 id=\"failure-behaviour\">Failure behaviour<\/h2>\n<p>Decide explicitly whether a failing hook blocks the operation.<\/p>\n<p>Validation hooks should block: a page that fails schema validation should not be\nwritten. Notification hooks should not: a failed notification is not a reason to\nlose the work.<\/p>\n<p>In Claude Code, a hook blocks by exiting with code 2; per the hooks guide, other\nfailures show up as non-blocking errors and the action proceeds. Which events\ncan be blocked at all differs, and <code>PreToolUse<\/code> is the one that can stop a tool\ncall before it runs.<\/p>\n<p>The bad case is a blocking hook that fails for an unrelated reason and silently\nstops your scheduled ingest for a week. Whatever blocks must be simple enough\nthat it only fails for the reason it exists.<\/p>\n<h2 id=\"the-guard-in-the-vault-template\">The guard in the vault template<\/h2>\n<p>The <a href=\"../../vault-template/README.md\">vault template<\/a> ships a working example: a\n<code>PreToolUse<\/code> hook, <a href=\"../../vault-template/.claude/hooks/guard.py\"><code>guard.py<\/code><\/a>,\nwired up in <a href=\"../../vault-template/.claude/settings.json\"><code>settings.json<\/code><\/a>. It is\nwritten in Python, so Python 3 must be installed, and <code>test_guard.py<\/code> beside it\nchecks it. The template README section <a href=\"../../vault-template/README.md#what-is-enforced-and-what-is-not\">what is enforced and what is not<\/a>\nlists which rules the hook enforces and which stay instructions in <code>CLAUDE.md<\/code>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"skills-and-commands.md\">Skills and slash commands<\/a><\/p>"},{"id":"06-agents/skills-and-commands","title":"Skills and slash commands","html":"<p>Two mechanisms that look similar and do different jobs.<\/p>\n<p><strong>A skill<\/strong> teaches repeatable behaviour. It loads when relevant and shapes how\nthe agent does something, whether you invoked it explicitly or just described the\ntask.<\/p>\n<p><strong>A command<\/strong> is a shortcut for a task you run often. It points at a skill and\nsaves you typing the instructions.<\/p>\n<p>The behaviour belongs in the skill. That way ingestion works the same whether it\nwas triggered by <code>/ingest<\/code>, by a scheduled task, or by you saying \"add this to my\nvault\".<\/p>\n<h2 id=\"what-this-repo-ships\">What this repo ships<\/h2>\n<p>Twenty-nine skills in <a href=\"../../skills/README.md\"><code>skills/<\/code><\/a>, one per workflow in this\nguide. Seventy-eight commands in <a href=\"../../commands/README.md\"><code>commands/<\/code><\/a>. Most are a\nfew lines pointing at a skill and setting its scope; a few (<code>/audit<\/code>,\n<code>/dry-run<\/code>, <code>/index<\/code> and <code>/scope<\/code>) are self-contained and name no skill. The\nscheduling command is <code>/maintenance-schedule<\/code>, which points at\n<code>second-brain-schedule<\/code>. It is not called <code>/schedule<\/code> because that name would\nshadow Claude Code's built-in <code>/schedule<\/code>, which creates, updates, lists and runs\n<a href=\"https://code.claude.com/docs/en/routines\">routines<\/a> that execute in the cloud\n(<a href=\"https://code.claude.com/docs/en/commands\">commands reference<\/a>).<\/p>\n<p>The ratio is deliberate. Behaviour belongs in a small number of well-written\nskills; commands are cheap, so there is no reason to make you remember how to\nphrase a request you make every week.<\/p>\n<p>Install them inside the vault at <code>.claude/skills/<\/code> and <code>.claude/commands/<\/code> so\nthey are versioned alongside your notes and travel with the vault. Claude Code\nhas merged custom commands into skills: a file at <code>.claude/commands/x.md<\/code> and a\nskill at <code>.claude/skills/x/SKILL.md<\/code> both create <code>/x<\/code>, and existing command files\nkeep working (<a href=\"https://code.claude.com/docs/en/skills\">skills docs<\/a>).<\/p>\n<h2 id=\"writing-your-own\">Writing your own<\/h2>\n<p>A skill worth writing has three properties: you do it repeatedly, you have\nopinions about how, and the opinions are not obvious enough for the model to\nguess.<\/p>\n<p>The <code>description<\/code> is what Claude matches your request against, and the skills\ndocs say the listing truncates it at 1,536 characters, so put the key use case\nfirst. Anthropic's own\n<a href=\"https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md\">skill-creator<\/a>\nrecommends \"pushy\" descriptions because Claude tends to undertrigger skills.<\/p>\n<p>Structure that works:<\/p>\n<pre><code class=\"language-markdown\">---\nname: skill-name\ndescription: &gt;-\n  What it does. When to use it, written pushy, because Claude tends to\n  under-trigger skills. Do NOT use for the tempting near-misses.\n---\n\n# Name\n\n[Why this skill exists: what failure it prevents. This paragraph is the rubric\nfor every case the rules below do not cover.]\n\n## Core rule\n## Workflow\n## Output format\n## Calibration\n## Example\n<\/code><\/pre>\n<p>The opening paragraph does more work than the rules. Rules cover the cases you\nthought of; the reason covers the rest.<\/p>\n<h2 id=\"explain-the-why\">Explain the why<\/h2>\n<p>\"Never overwrite a contradiction\" gets applied literally and fails on the edge\ncases. \"Never overwrite a contradiction, because the history of what you believed\nis the thing this vault has that a search engine does not\" generalises to\nsituations you never described.<\/p>\n<p>All-caps NEVER without a reason is usually a missing explanation.<\/p>\n<h2 id=\"versioning\">Versioning<\/h2>\n<p>Skills live in the vault, so git tracks them. When output quality changes, the\nskill diff is the first place to look.<\/p>\n<p>Test a skill on three or four real cases before letting a scheduled task use it.\nA flaw in a skill that runs nightly is a flaw in three hundred pages by the end\nof the year.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"safety-and-guardrails.md\">Guardrails<\/a><\/p>"},{"id":"06-agents/safety-and-guardrails","title":"Guardrails","html":"<p>The rule this whole section rests on:<\/p>\n<p><strong>Keys, not prompts.<\/strong><\/p>\n<p>Telling an agent not to do something is a preference. It is not a boundary. If\nthe agent technically can delete a file, empty a folder or send an email, then\none day, in a context you did not anticipate, it will.<\/p>\n<p>Control what is possible at the permission level. Then the instruction in\n<code>CLAUDE.md<\/code> is a preference sitting on top of a boundary, rather than the only\nthing between your notes and a bad run.<\/p>\n<h2 id=\"scope-write-access\">Scope write access<\/h2>\n<p>The agent needs write access to the vault. It does not need write access to your\nhome directory, and a scheduled task running with broad filesystem permissions is\na large blast radius for a small convenience.<\/p>\n<p>Same principle for connectors: read-only wherever the option exists. A calendar\nconnector that can only read cannot cancel a meeting, no matter what a\nmisinterpreted instruction says.<\/p>\n<h2 id=\"archive-never-delete\">Archive, never delete<\/h2>\n<p>Deletion is the one operation you cannot recover from by reading a diff, because\nthe content is gone and only the absence remains.<\/p>\n<p>Rule: retire a page by moving it to <code>archive/<\/code>, keeping its path, and write a\nline in <code>log.md<\/code> naming it and why. Merges count: the absorbed page is archived\nwith a <code>merged_into<\/code> field, its aliases move to the survivor and inbound links\nare repointed. Applied consistently, a page that vanishes is always traceable\nand restorable by moving it back, and \"where did that page go\" stops being an\nunanswerable question.<\/p>\n<p>The <a href=\"../../vault-template/CLAUDE.md\">vault template<\/a> goes further and treats\ndeleting files as a hard stop. The agent never hard-deletes anything, never\ntouches <code>raw/<\/code>, <code>journal/<\/code> or <code>output/<\/code> destructively, and never archives hubs,\nthe index, the log or anything in <code>wiki/systems/<\/code>. Imports that would have\ndropped material (a chat export's \"delete\" pile, for instance) skip it and\nrecord it instead.<\/p>\n<h2 id=\"a-worked-example-settings-and-a-hook\">A worked example: settings and a hook<\/h2>\n<p>The <a href=\"../../vault-template/README.md#what-is-enforced-and-what-is-not\">vault template<\/a>\nships two files that turn some of its rules into boundaries. Both are copied\ninto the vault's <code>.claude/<\/code> folder.<\/p>\n<ul>\n<li><strong><code>.claude/settings.json<\/code><\/strong> holds permission rules in three lists, <code>deny<\/code>,\n  <code>ask<\/code> and <code>allow<\/code>. A deny rule wins over an ask rule, and an ask rule over an\n  allow rule. The syntax is in the\n  <a href=\"https://code.claude.com/docs/en/permissions\">permissions documentation<\/a>.<\/li>\n<li><strong><code>.claude/hooks/guard.py<\/code><\/strong> is a PreToolUse hook. Claude Code runs it before\n  each file edit or shell command, including PowerShell (partially covered), and\n  exit code 2 blocks the call. It runs once more when the session stops, to warn\n  about uncommitted paths; that one only warns. The protocol\n  is in the <a href=\"https://code.claude.com/docs/en/hooks\">hooks documentation<\/a>. The\n  hook exists because permission rules cannot say \"existing files only\", which\n  the append-only <code>raw/<\/code> folder needs.<\/li>\n<\/ul>\n<p>What this enforces, per the template's own table:<\/p>\n<ul>\n<li>no push, remote change, hard reset, <code>--amend<\/code>, rebase or <code>revert --abort<\/code>;<\/li>\n<li>no <code>rm<\/code>, <code>git rm<\/code>, <code>git clean<\/code> or <code>find -delete<\/code>;<\/li>\n<li>moves and copies stay inside the vault and never overwrite protected paths;<\/li>\n<li><code>journal/<\/code>, <code>scripts/<\/code> and <code>.claude/<\/code> are owner-only, so the agent cannot\n  write a script and then run it;<\/li>\n<li>no changes to existing files in <code>raw/<\/code>; new files are allowed;<\/li>\n<li><code>CLAUDE.md<\/code> editable only in its Profile block;<\/li>\n<li>no staging of <code>raw/workspace/<\/code>;<\/li>\n<li>curl and wget uploads are denied, and web access asks first;<\/li>\n<li>by tool-name pattern, no writes through connected services.<\/li>\n<\/ul>\n<p>What stays at the prompt level: the checkpoint, the log entry, the report and\nthe queue, secrets, and merging people. Neither layer reads a script's insides,\nso a Python file the agent writes and runs can still delete things. Don't run the\nvault in <code>bypassPermissions<\/code> mode. It disables permission prompts and safety\nchecks, and the permission modes documentation says it \"offers no protection\nagainst prompt injection or unintended actions\". Deny rules and explicit ask\nrules still apply in it, per\n<a href=\"https://code.claude.com/docs/en/permission-modes\">that page<\/a>, and the hook\nstill runs, but everything your rules leave unmatched is approved without a\nprompt. For operating-system enforcement, turn on Claude\nCode's <a href=\"https://code.claude.com/docs/en/sandboxing\">sandbox<\/a>. Check the connector\npatterns against the tool names your own connectors expose, because they differ\nby server.<\/p>\n<p>The rest of this page is the prompt level. It still matters, but it sits on top\nof these boundaries and does not replace them.<\/p>\n<h2 id=\"git-is-the-real-safety-net\">Git is the real safety net<\/h2>\n<p>Every guardrail above is preventive. Git is what saves you when one fails.<\/p>\n<p>The vault has to be its own git repository for this to work. The template's\nrules:<\/p>\n<ul>\n<li><strong>Checkpoint before destructive steps.<\/strong> Before a merge, prune, archive,\n  rename, split or any batch rewriting more than a few existing pages, the agent\n  commits exactly the paths it is about to change, by path, with a message\n  <code>checkpoint: &lt;op&gt; &lt;run id&gt;<\/code>. If the checkpoint fails, it queues the problem and\n  carries on with non-destructive work only.<\/li>\n<li><strong>One commit per run,<\/strong> staging only the paths that run wrote, by path. Never\n  <code>git add -A<\/code> or <code>git add .<\/code>, which would sweep in your own uncommitted edits\n  and anything git-ignored. The message starts with the run id, such as\n  <code>run-2026-10-05-ingest<\/code>.<\/li>\n<li><strong>Restore by path.<\/strong> A bad ingest is a revert of that run's commit, or a\n  restore of the paths it listed. <code>git checkout .<\/code> and <code>git reset --hard<\/code>\n  discard your own unrelated work along with the agent's, so they are not\n  the fix. <code>/rollback<\/code> reverts that run's own commit only.<\/li>\n<li><strong>Never stage a file in which a secret was found.<\/strong> Report the file and kind,\n  not the value.<\/li>\n<\/ul>\n<p>Read the diffs from scheduled runs occasionally, especially in the first weeks.\nThat is how you learn what your agent actually does at 7am, which is reliably\ndifferent from what you assumed.<\/p>\n<h2 id=\"a-queue-and-hard-stops\">A queue and hard stops<\/h2>\n<p>A scheduled run cannot ask a question. The template gives it somewhere to put\none: <code>wiki/systems/needs-owner.md<\/code>, a page where each skipped item is recorded\nwith what it was, why it stopped and what the agent needs from you. The agent\nsearches the page first and updates the date on an existing entry instead of\nadding a second one. You answer an entry and the agent moves it to Done.<\/p>\n<p>Items go there when they hit a hard stop. In a live session the agent asks; in a\nscheduled run it skips and queues. The template's hard stops:<\/p>\n<ul>\n<li>writing to any connected service, pushing to a remote, or publishing, which\n  happens only when you ask for that specific action in a live session<\/li>\n<li>any web request or API call carrying a person's name or email, or content from\n  <code>private<\/code> or <code>restricted<\/code> pages<\/li>\n<li>anything irreversible: deleting files, force-push, rewriting history,\n  <code>git clean<\/code>, emptying <code>archive/<\/code><\/li>\n<li>credentials, tokens or account numbers in any file<\/li>\n<li>changing <code>CLAUDE.md<\/code> (except the Profile block), skills, commands or schedule\n  prompts<\/li>\n<li>merging two people, or two pages whose identity is uncertain<\/li>\n<\/ul>\n<h2 id=\"dry-runs\">Dry runs<\/h2>\n<p>For anything that touches many files, run it once in report-only mode.<\/p>\n<pre><code>Do a dry run: list every page you would create, update or archive, and the links\nyou would add. Write nothing.\n<\/code><\/pre>\n<p>The output takes a minute to read and catches misread instructions before they\nbecome four hundred edits.<\/p>\n<h2 id=\"watch-for-scope-creep\">Watch for scope creep<\/h2>\n<p>Agents extend the job. Asked to ingest, an agent may also tidy an unrelated page,\nfix formatting, rename something for consistency. Each is defensible; together\nthey mean you cannot tell what a run did without reading everything.<\/p>\n<p>Instruct explicitly: do the job asked, list anything else you noticed, change\nnothing else.<\/p>\n<h2 id=\"what-not-to-put-in-the-vault\">What not to put in the vault<\/h2>\n<p>Credentials, API keys, anything you are under obligation to keep confidential,\nother people's private information.<\/p>\n<p>Not because the agent will leak it, but because the vault is a single file tree\nthat gets synced, committed, backed up and occasionally shared. Every copy is\nanother place that content exists. See\n<a href=\"../09-maintenance/privacy-and-secrets.md\">privacy<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../07-retrieval/README.md\">Retrieval<\/a>, for getting answers out of what all this\nbuilt.<\/p>"},{"id":"07-retrieval/asking-questions","title":"Asking the vault","html":"<p>You built the vault so answers would come from what you actually read. An agent\nthat quietly falls back on its own knowledge destroys that, and it does so\ninvisibly: the answer is fluent, plausible, and unverifiable.<\/p>\n<h2 id=\"the-rule\">The rule<\/h2>\n<p>Every claim in an answer comes from a page, and names the page.<\/p>\n<pre><code>Answer from my vault only. Cite the page for each claim. If the vault does not\ncover part of the question, say which part rather than filling it in.\n<\/code><\/pre>\n<p>That instruction belongs in <code>CLAUDE.md<\/code>, not typed each time. A rule you have to\nremember is a rule that lapses on the day it matters.<\/p>\n<h2 id=\"start-from-the-index\">Start from the index<\/h2>\n<p>The agent should read <code>index.md<\/code> first, then open the pages that look relevant,\nthen follow links outward from those.<\/p>\n<p>The alternative, a full-text sweep, is slower, spends context on near-misses, and\nmisses pages whose wording differs from your question. The index exists to make\nthis cheap; see <a href=\"../04-structuring/index-and-log.md\">index.md and log.md<\/a>.<\/p>\n<h2 id=\"outside-knowledge-labelled\">Outside knowledge, labelled<\/h2>\n<p>Sometimes the model knows something useful that the vault does not contain. That\nis fine as long as it is marked:<\/p>\n<pre><code>Cite vault pages for anything from my notes. Anything you know that my vault\ndoes not contain, put under a separate heading marked outside the vault.\n<\/code><\/pre>\n<p>Separated, it is useful context. Blended, it makes the whole answer unreliable,\nbecause you no longer know which parts you can trace.<\/p>\n<h2 id=\"empty-is-a-valid-answer\">Empty is a valid answer<\/h2>\n<p>If the vault has nothing on a topic, the right response is one sentence saying\nso.<\/p>\n<p>An agent padding an empty result with general knowledge is the failure mode to\nwatch for, because it feels like a good answer. Notice when an answer contains no\npage references at all; that is the signal.<\/p>\n<h2 id=\"answers-should-end-with-what-is-missing\">Answers should end with what is missing<\/h2>\n<pre><code>Read: [[page]], [[page]], [[page]]\nNot covered: whether this holds for the streaming case\n<\/code><\/pre>\n<p>Two lines, and they do more than they look. They tell you how much of the vault\nthe answer rests on, and the gap line is often the more useful half, because it\nis a precise statement of what to go read next.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"query-patterns.md\">Query patterns<\/a><\/p>"},{"id":"07-retrieval/query-patterns","title":"Query patterns","html":"<p>Some questions a vault answers far better than a search engine or a general\nmodel. These are the ones worth building the habit around.<\/p>\n<h2 id=\"what-do-i-know-about-x\">What do I know about X<\/h2>\n<p>The basic one, and the reason most people build a vault.<\/p>\n<pre><code>What do I know about agent harnesses? Read the concept pages and the sources\nbehind them. Say where my sources disagree.\n<\/code><\/pre>\n<p>The second sentence is what makes it better than reading a page yourself. A\nconsolidated view across everything you read, with the disagreements surfaced,\nis not something any single page contains.<\/p>\n<h2 id=\"what-connects-x-and-y\">What connects X and Y<\/h2>\n<p>The question a search index cannot answer at all.<\/p>\n<pre><code>What connects retrieval quality and context length in my vault? Show the path\nthrough pages, not just the endpoints.\n<\/code><\/pre>\n<p>Asking for the path matters. The intermediate pages are the reasoning, and they\nare checkable in a way a bare conclusion is not.<\/p>\n<h2 id=\"what-have-i-changed-my-mind-about\">What have I changed my mind about<\/h2>\n<p>Only possible because of the <a href=\"../04-structuring/contradictions-and-supersession.md\">supersession\nrules<\/a>.<\/p>\n<pre><code>Find pages where a later source superseded an earlier claim. What did I believe,\nwhat changed it, and when?\n<\/code><\/pre>\n<p>Run this quarterly. It is the closest thing to watching your own thinking from\noutside, and it usually surfaces at least one belief you updated without\nnoticing.<\/p>\n<h2 id=\"what-is-missing\">What is missing<\/h2>\n<pre><code>Look at my concept pages on prediction markets. What questions do they raise\nthat no source in my vault answers?\n<\/code><\/pre>\n<p>This turns the vault into a reading list generated from your own gaps rather\nthan from what an algorithm thinks you would click.<\/p>\n<h2 id=\"what-did-i-say-about-this-before\">What did I say about this before<\/h2>\n<p>Especially useful with <a href=\"../03-ingestion/chat-exports.md\">chat exports<\/a> ingested.<\/p>\n<pre><code>Have I worked on this problem before? What did I conclude and what did I get\nwrong?\n<\/code><\/pre>\n<h2 id=\"what-contradicts-this\">What contradicts this<\/h2>\n<pre><code>I am about to argue that X. What in my vault argues against it?\n<\/code><\/pre>\n<p>The most valuable query in the set and the least used, because nobody\nvolunteers to be contradicted. A vault that only confirms you is a vault you\nbuilt badly.<\/p>\n<h2 id=\"questions-to-ask-elsewhere\">Questions to ask elsewhere<\/h2>\n<p>Anything about the present state of the world. Your vault knows what your\nsources said on the day you saved them, and nothing since.<\/p>\n<p>Anything general the model already knows. Asking your vault to explain a\nwell-documented concept from scratch gets you a worse version of what a plain\nanswer would give.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"search-tools.md\">Search tools<\/a><\/p>"},{"id":"07-retrieval/search-tools","title":"Search tools","html":"<p>Retrieval in a plain-text vault is mostly grep. That sounds primitive and is\nalmost always enough.<\/p>\n<h2 id=\"ripgrep\">ripgrep<\/h2>\n<pre><code class=\"language-bash\">rg -i &quot;graph rag&quot; ~/brain --type md -l\nrg -i &quot;supersed&quot; ~/brain -C 2\n<\/code><\/pre>\n<p>Instant on tens of thousands of files. Claude Code's Grep tool is built on it\n(<a href=\"https://code.claude.com/docs/en/tools-reference\">tools reference<\/a>), and for \"where did I mention this\" it beats every fancier\noption on both speed and predictability.<\/p>\n<p>Its limit is exact wording. It cannot find the page about a concept you\ndescribed differently, which is what the graph and the index are for.<\/p>\n<h2 id=\"obsidian-search\">Obsidian search<\/h2>\n<p>Fine for interactive use. Operators worth knowing, from Obsidian's\n<a href=\"https://help.obsidian.md/plugins/search\">Search<\/a> help: <code>path:<\/code>, <code>file:<\/code>, <code>tag:<\/code>\n(written <code>tag:#work<\/code>) and <code>line:<\/code>, which matches terms that appear together on\none line and so cuts false positives.<\/p>\n<h2 id=\"dataview\">Dataview<\/h2>\n<p>Queries over frontmatter, which is where structural questions get answered:<\/p>\n<pre><code>```dataview\nTABLE updated, tags FROM &quot;wiki/concepts&quot;\nWHERE contains(tags, &quot;unverified&quot;)\nSORT updated ASC\n```\n<\/code><\/pre>\n<p>Anything phrased as \"which pages have property P\" is a Dataview query, and\nanswering those by asking the agent to read files is slower and less reliable.<\/p>\n<h2 id=\"combining-them\">Combining them<\/h2>\n<p>The pattern that works: Dataview or ripgrep to get a candidate set, the graph to\nexpand from it, the agent to read and synthesise.<\/p>\n<pre><code>Find every page tagged unverified, follow their links, and tell me which claims\ndepend on unverified sources.\n<\/code><\/pre>\n<p>Mechanical filtering first, judgement second. Asking the agent to do the\nfiltering by reading everything wastes context on pages a query would have\nexcluded in milliseconds.<\/p>\n<h2 id=\"when-search-gets-slow\">When search gets slow<\/h2>\n<p>It will not, at personal scale. Ripgrep over ten thousand markdown files is\nstill instant, and if search feels slow the cause is usually the agent reading\ntoo many files, not the search itself.<\/p>\n<p>That is a context problem, not a search problem. See <a href=\"context-budget.md\">context\nbudget<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"rag-on-top.md\">Adding RAG when you need it<\/a><\/p>"},{"id":"07-retrieval/rag-on-top","title":"Adding RAG when you need it","html":"<p>This guide argues against a vector database for a personal vault. That argument\nhas a threshold, and it is worth naming rather than treating as doctrine.<\/p>\n<h2 id=\"when-it-starts-to-pay\">When it starts to pay<\/h2>\n<p>Three conditions, roughly together:<\/p>\n<p><strong>Scale past a few thousand pages,<\/strong> where reading the index plus following\nlinks stops fitting the context budget.<\/p>\n<p><strong>Questions phrased in wording your pages do not use.<\/strong> If you regularly fail to\nfind things you know are there, that is a recall problem, which is what\nembeddings solve.<\/p>\n<p><strong>A corpus you did not curate.<\/strong> A vault that absorbed ten thousand documents\nwithout a human deciding what mattered has no reliable structure to navigate,\nso similarity is what is left.<\/p>\n<p>Most personal vaults never hit all three, and two out of three is not enough to\njustify the maintenance.<\/p>\n<h2 id=\"what-to-embed\">What to embed<\/h2>\n<p>Not raw sources. Embed the wiki pages.<\/p>\n<p>They are already semantic units, written by something that understood them, one\nidea each. That is what chunking tries to approximate and rarely achieves.\nRe-chunking them into fixed-size windows destroys the structure you paid for.<\/p>\n<p>Embed the page title, aliases and body together. Titles carry a lot of signal\nin a curated vault, because you chose them.<\/p>\n<h2 id=\"hybrid-not-replacement\">Hybrid, not replacement<\/h2>\n<p>The useful arrangement keeps the graph in charge:<\/p>\n<ol>\n<li>Embeddings find entry-point pages, including ones whose wording differs.<\/li>\n<li>The graph expands from those entry points through links.<\/li>\n<li>The agent reads the expanded set and answers with citations.<\/li>\n<\/ol>\n<p>Embeddings supply recall, the graph supplies structure and the reason two pages\nare related. Using similarity for the whole pipeline throws away the links,\nwhich is the part of your vault that took work.<\/p>\n<h2 id=\"keeping-the-index-fresh\">Keeping the index fresh<\/h2>\n<p>This is the maintenance nobody accounts for. Every ingest changes pages, and a\nstale embedding index returns pages whose content has moved on.<\/p>\n<p>Re-embed changed pages as part of the ingest run, not on a separate schedule. An\nindex that lags by a week is quietly wrong in a way that produces plausible bad\nanswers.<\/p>\n<p>If that sounds like more upkeep than it is worth, that is the correct reading for\nmost vaults, and it is the honest reason this section is short.<\/p>\n<h2 id=\"simpler-things-to-try-first\">Simpler things to try first<\/h2>\n<p>Before adding infrastructure, check whether the problem is actually recall.<\/p>\n<p>Missing aliases are the most common cause of \"I cannot find it\". So is a bad\nindex. So is an ingest that stopped linking properly two months ago and left a\ngrowing pile of orphans, which no retrieval method can reach.<\/p>\n<p>Run <code>scripts/link_check.py<\/code> and read your index before concluding you need\nvectors.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"context-budget.md\">Context budget<\/a><\/p>"},{"id":"07-retrieval/context-budget","title":"Context budget","html":"<p>Every page the agent reads costs context, and quality degrades well before the\nwindow is full. Reading more is not reading better.<\/p>\n<h2 id=\"progressive-disclosure\">Progressive disclosure<\/h2>\n<p>The pattern that works:<\/p>\n<ol>\n<li><strong>Index first.<\/strong> What exists, one line each.<\/li>\n<li><strong>Open the pages that matter.<\/strong> Usually three to eight.<\/li>\n<li><strong>Follow links one hop at a time,<\/strong> stopping when new pages stop adding.<\/li>\n<\/ol>\n<p>Each step is cheap and informs the next. The alternative, loading everything\nplausibly related up front, spends most of the budget on pages that turn out\nirrelevant, and pushes the useful ones into the middle of a long context where\nattention is weakest.<\/p>\n<h2 id=\"why-not-paste-the-whole-vault\">Why not paste the whole vault<\/h2>\n<p>Long-context models can hold a lot, and it is tempting to skip retrieval\nentirely.<\/p>\n<p>Two reasons not to. Attention is uneven across a long context, and material in\nthe middle is used less reliably than material at the edges, which is the finding\nin <a href=\"https://arxiv.org/abs/2307.03172\">\"Lost in the Middle\"<\/a> (Liu et al., 2023)\nand the reason position matters at all. And an answer\nbuilt from everything cannot be checked: you have no idea which pages it actually\nused.<\/p>\n<p>An answer citing five pages you can open beats a fluent answer built from four\nhundred you cannot.<\/p>\n<h2 id=\"summary-layers\">Summary layers<\/h2>\n<p>Past a few hundred pages, add one level of index between the master index and\nthe pages: a short page per topic area, listing what is in that area and what\neach page covers.<\/p>\n<p>The agent reads the master index, opens the one topic index that matters, then\nopens pages. Three cheap reads instead of one expensive one.<\/p>\n<p>Do not let summary layers accumulate. Two levels is enough; three means you are\nbuilding a hierarchy nobody maintains, and summaries of summaries drift from\nwhat is underneath them.<\/p>\n<h2 id=\"measuring-what-was-read\">Measuring what was read<\/h2>\n<pre><code>List the pages you read to answer that, in the order you opened them.\n<\/code><\/pre>\n<p>Worth running occasionally. It exposes two problems: an agent reading thirty\npages when six would do, and an agent answering from three when the vault has\ntwenty relevant ones. Both are fixable by adjusting the instructions, and neither\nis visible from the answer alone.<\/p>\n<h2 id=\"subagents-for-wide-reads\">Subagents for wide reads<\/h2>\n<p>When a question genuinely needs a lot of material, send a\n<a href=\"../06-agents/subagents.md\">subagent<\/a>. It reads in its own context and returns a\nsummary, so the main session pays for the answer rather than for the sources.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../08-outputs/README.md\">Outputs<\/a>, where the vault starts producing rather than\nanswering.<\/p>"},{"id":"08-outputs/writing-from-the-vault","title":"Writing from the vault","html":"<p>Writing is where the vault stops being an input and starts being leverage. The\nresearch is already done, cited, and connected. What is left is the argument.<\/p>\n<h2 id=\"outline-from-concept-pages-not-from-a-prompt\">Outline from concept pages, not from a prompt<\/h2>\n<pre><code>I want to write about why context length does not replace retrieval. Which of my\nconcept pages are relevant, what do they collectively argue, and where do my\nsources disagree?\n<\/code><\/pre>\n<p>That gives you an outline grounded in things you read, with the weak points\nmarked. Asking a model to outline the topic from scratch gives you the consensus\nview of the internet, which is what everyone else is also writing.<\/p>\n<p>The disagreements are the most useful part. They are where you have something to\nsay that is not the consensus.<\/p>\n<h2 id=\"cite-your-own-sources\">Cite your own sources<\/h2>\n<p>Every claim in a draft traces back through a concept page to a source page to a\nURL. That chain is what makes fact-checking a five-minute job instead of an\nafternoon.<\/p>\n<p>It also protects you from the specific failure of writing with a model: fluent\nsentences containing invented specifics. If a number in the draft has no source\npage behind it, it did not come from your research.<\/p>\n<h2 id=\"keep-your-voice\">Keep your voice<\/h2>\n<p>Drafting from the vault produces the model's phrasing over your material. That is\nfine as a first pass and bad as a final one.<\/p>\n<p>The practical split: let the agent assemble structure and evidence, write the\nsentences yourself. Or draft with it and rewrite every paragraph. What does not\nwork is publishing the assembly, which reads exactly like what it is.<\/p>\n<h2 id=\"close-the-loop\">Close the loop<\/h2>\n<p>Ingest your own finished work back into the vault.<\/p>\n<p>Your published pieces are sources like any other: they contain your positions,\nstated clearly, at a date. Six months later the vault can tell you what you\nargued and whether you still believe it.<\/p>\n<p>This is the step almost everyone skips, and it is what makes the second piece in\na domain meaningfully faster than the first.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"research-reports.md\">Research reports<\/a><\/p>"},{"id":"08-outputs/research-reports","title":"Research reports","html":"<p>A research report is what you produce when a question needs more than the vault\ncurrently holds. The vault is the starting point, not the whole answer.<\/p>\n<h2 id=\"scope-against-what-exists-first\">Scope against what exists first<\/h2>\n<pre><code>I need to understand how companies are deploying agent harnesses in production.\nWhat does my vault already cover, what is thin, and what is missing entirely?\n<\/code><\/pre>\n<p>That answer is your research plan. Most of the work in a good report is knowing\nwhat you do not need to look up, and starting from the vault means you are not\nre-reading things you read last year.<\/p>\n<h2 id=\"fill-the-gaps-deliberately\">Fill the gaps deliberately<\/h2>\n<p>Go find sources for the gaps, ingest them properly through <code>raw/<\/code>, and let them\nbuild pages the same way everything else does.<\/p>\n<p>Resisting the shortcut matters. Pasting a fresh article straight into the report\ndraft gets the report written and leaves the vault no better, which means the\nnext report on an adjacent topic starts from the same place.<\/p>\n<h2 id=\"structure\">Structure<\/h2>\n<pre><code>Question\nWhat I found          (with page citations)\nWhere sources disagree\nWhat I could not establish\nWhat would change the conclusion\n<\/code><\/pre>\n<p>The last two sections are what make a report worth rereading. A report that\npresents only findings looks stronger and is less useful, because the reader\ncannot tell where it is load-bearing and where it is thin.<\/p>\n<h2 id=\"store-it-as-a-source\">Store it as a source<\/h2>\n<p>Reports go in <code>output/<\/code>, then get ingested back as sources.<\/p>\n<p>A report is a dated snapshot of your understanding, and having it in the vault as\na source means later material can contradict it explicitly rather than quietly\nsuperseding it. See\n<a href=\"../04-structuring/contradictions-and-supersession.md\">supersession<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"publishing-and-export.md\">Publishing and export<\/a><\/p>"},{"id":"08-outputs/publishing-and-export","title":"Publishing and export","html":"<p>Some of your vault is worth showing to other people. Most of it is not, and the\nmechanics of that split are worth setting up before you publish anything.<\/p>\n<h2 id=\"deciding-what-is-public\">Deciding what is public<\/h2>\n<p>The simplest reliable approach is an explicit opt-in: a <code>publish: true<\/code> field in\nfrontmatter, and nothing without it ever leaves. In the vault template only you set it, in a\nlive session: publishing is one of its hard stops, so the agent never adds\n<code>publish: true<\/code> or publishes on its own, and a scheduled run skips it.<\/p>\n<p>Opt-out is the alternative and it is a mistake. Under opt-out, one forgotten flag\npublishes something private, and the failure is silent and permanent because it\nis already indexed.<\/p>\n<h2 id=\"static-site-options\">Static site options<\/h2>\n<p><a href=\"https://help.obsidian.md/publish\">Obsidian Publish<\/a> is the official route and\nthe least work: a hosted service where you select notes and press Publish.\n<a href=\"https://github.com/jackyzha0/quartz\">Quartz<\/a> (MIT-licensed) and <a href=\"https://github.com/oleeskild/obsidian-digital-garden\">Obsidian\nDigital Garden<\/a> are\nopen-source routes that build a static site from a vault, and both document\nwikilink and backlink support. That matters because a published wiki with broken\nlinks is worse than a blog. Digital Garden has its own opt-in, <code>dg-publish: true<\/code>\nin frontmatter; it does not read the template's <code>publish: true<\/code>, so map one to\nthe other in your build step.<\/p>\n<p>Whatever you use, check what happens to a link pointing at an unpublished page.\nIt should degrade to plain text rather than to a 404.<\/p>\n<h2 id=\"publishing-a-subset-safely\">Publishing a subset safely<\/h2>\n<p>The pattern that works: a build step copies only <code>publish: true<\/code> pages into a\nseparate folder, rewrites links to unpublished pages as plain text, and builds\nfrom that copy.<\/p>\n<p>Never point a publishing tool at your live vault directly. One misconfigured\ninclude pattern publishes everything, and there is no way to unpublish something\nthat was crawled.<\/p>\n<h2 id=\"what-publishing-does-to-your-writing\">What publishing does to your writing<\/h2>\n<p>A public wiki changes how you write pages, and not entirely for the better. You\nstart writing for an audience: hedging more, explaining more, keeping tentative\nthoughts out.<\/p>\n<p>Tentative thoughts are exactly what a personal vault is for. If you publish,\nconsider keeping the private vault primary and publishing a deliberately selected\nsubset, rather than making the whole thing public and unconsciously sanitising\nit.<\/p>\n<h2 id=\"other-exports\">Other exports<\/h2>\n<p>PDF and HTML for a single report, straight from markdown with pandoc. Fine for\nsharing one document.<\/p>\n<p>Do not export the vault as a whole to any format you cannot regenerate. The\nmarkdown is the artifact.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"teaching-yourself.md\">Learning from your own vault<\/a><\/p>"},{"id":"08-outputs/teaching-yourself","title":"Learning from your own vault","html":"<p>Reading something is not learning it. A vault full of well-written pages you\nnever revisit is a library, and libraries do not make anyone knowledgeable.<\/p>\n<h2 id=\"questions-from-your-own-pages\">Questions from your own pages<\/h2>\n<pre><code>Generate ten questions from my concept pages on prediction markets. Mix recall\nand application. Do not include the answers.\n<\/code><\/pre>\n<p>Answer them without looking. The ones you cannot answer are things you saved and\nnever actually learned, which is most of what anyone saves.<\/p>\n<p>This is more useful than generic quizzing because the questions come from\nmaterial you chose, at the depth you recorded it.<\/p>\n<h2 id=\"spaced-repetition-without-the-card-writing\">Spaced repetition, without the card-writing<\/h2>\n<p>Writing cards by hand is the tedious part of spaced repetition. The vault removes\nthat step: concept pages are the source material, and the agent can generate\ncards from them.<\/p>\n<p>The <a href=\"https://github.com/st3v3nmw/obsidian-spaced-repetition\">Spaced Repetition<\/a>\nplugin reads cards written inside your notes (for example <code>Question::Answer<\/code> on\none line, in a note tagged <code>#flashcards<\/code>, per its README), so they live\nalongside the concept rather than in a separate app that drifts out of sync.<\/p>\n<p>Keep it to a small number of pages that actually matter. Reviewing everything you\never saved is a job, not a habit.<\/p>\n<h2 id=\"find-what-you-saved-and-did-not-understand\">Find what you saved and did not understand<\/h2>\n<pre><code>Which of my concept pages are written in language copied from the source rather\nthan explained in my own words? Those are the ones I probably did not understand.\n<\/code><\/pre>\n<p>A page that reproduces the source's phrasing is a page nobody digested. That is a\nreal signal, and it is invisible until you ask.<\/p>\n<h2 id=\"explain-it-back\">Explain it back<\/h2>\n<p>The oldest test there is:<\/p>\n<pre><code>Ask me to explain [[GraphRAG]] as if to someone who has not read about it. Then\ncompare what I said to my page and tell me what I left out.\n<\/code><\/pre>\n<p>Gaps between what you can say and what your page contains are precise, and they\nare exactly the thing rereading never reveals.<\/p>\n<h2 id=\"measure-learning-not-collection\">Measure learning, not collection<\/h2>\n<p>Page count goes up whether or not you know more. What is worth tracking is\nwhether you can answer questions from your own material without opening it.<\/p>\n<p>Once a quarter is enough. The result reliably surprises people, in both\ndirections.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../09-maintenance/README.md\">Maintenance<\/a>, for keeping all of it alive.<\/p>"},{"id":"09-maintenance/lint-and-health","title":"Linting the vault","html":"<p>Structural rot is silent. Nothing errors. The vault just slowly stops answering\nwell because a third of its pages are unreachable and nobody noticed.<\/p>\n<h2 id=\"what-a-lint-checks\">What a lint checks<\/h2>\n<p><strong>Broken links.<\/strong> Two distinct cases: a typo or rename, which gets fixed, and a\ngenuine gap, which goes into <code>index.md<\/code> under Gaps.<\/p>\n<p><strong>Orphans.<\/strong> Pages nothing links to. Either find where they belong and link\nthem, or delete them.<\/p>\n<p><strong>Stubs.<\/strong> Pages under about forty words with no links, usually a failed ingest.\nFlag for re-ingest from the original in <code>raw/<\/code>.<\/p>\n<p><strong>Schema violations.<\/strong> Missing frontmatter, wrong type, tags outside the\nvocabulary.<\/p>\n<p><strong>Near-duplicates.<\/strong> Similar titles, overlapping aliases, shared inbound links.<\/p>\n<p><strong>Index drift.<\/strong> Pages missing from <code>index.md<\/code>, entries pointing nowhere.<\/p>\n<h2 id=\"report-before-repairing\">Report before repairing<\/h2>\n<p>Mechanical fixes happen automatically. Anything requiring judgement gets\nproposed and waits for you.<\/p>\n<p>That line matters because a linter that merges pages on its own judgement\ndestroys work, and one that only reports produces a list nobody acts on. Broken\nlinks and schema errors are mechanical. Merges and deletions are not.<\/p>\n<h2 id=\"running-it\">Running it<\/h2>\n<pre><code>/lint\n<\/code><\/pre>\n<p>Weekly, or after any import of more than about twenty sources. Not after every\ningest, where it costs more than it catches.<\/p>\n<p>Run it on a clean git state, so a wrong repair is one revert of its own commit away.<\/p>\n<p>Inside Obsidian, <a href=\"https://github.com/Vinzent03/find-unlinked-files\">Find orphaned files and broken\nlinks<\/a> covers the same two\nchecks visually.<\/p>\n<p>For a fast read without invoking the agent:<\/p>\n<pre><code class=\"language-bash\">python3 scripts/link_check.py ~/brain\n<\/code><\/pre>\n<h2 id=\"reading-the-output\">Reading the output<\/h2>\n<p>The counts matter more than the individual items. Three broken links after a\nweek is normal. Forty means something in the ingest instructions changed and is\nproducing links to pages it never creates.<\/p>\n<p>Track the rates over time rather than the raw numbers, since both grow with the\nvault. See <a href=\"../05-graphs/metrics.md\">metrics<\/a>.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"review-cadence.md\">Review cadence<\/a><\/p>"},{"id":"09-maintenance/review-cadence","title":"Review cadence","html":"<p>Lint keeps the structure sound. Review is what keeps you in the loop, and it is\nthe only maintenance task that produces something you read rather than something\nthat happens.<\/p>\n<h2 id=\"weekly-ten-minutes\">Weekly, ten minutes<\/h2>\n<p>The agent prepares it; you read it.<\/p>\n<pre><code>/vault-review\n<\/code><\/pre>\n<p>What comes back: what was added, which concepts gained the most links,\ncontradictions recorded and still unresolved, open questions, and three specific\nthings to read or write next.<\/p>\n<p>The clusters are the part worth attention. Where your links went last week is\nwhere your attention actually was, which is reliably different from where you\nthink it was.<\/p>\n<h2 id=\"monthly-structurally\">Monthly, structurally<\/h2>\n<p>Once a month, look at the vault rather than the week:<\/p>\n<ul>\n<li>The four <a href=\"../05-graphs/metrics.md\">metrics<\/a>, appended to a note so you have a\n  trend<\/li>\n<li>Concept pages untouched in ninety days while their topic kept getting sources<\/li>\n<li>The Gaps list in <code>index.md<\/code>, which is a reading list you generated without\n  trying<\/li>\n<li>One local graph of a page you wrote recently, as a spot check on linking\n  quality<\/li>\n<\/ul>\n<h2 id=\"quarterly-honestly\">Quarterly, honestly<\/h2>\n<p>Two questions.<\/p>\n<p><strong>What have I changed my mind about?<\/strong> Only answerable because of the\n<a href=\"../04-structuring/contradictions-and-supersession.md\">supersession rules<\/a>, and\nworth the whole system on its own.<\/p>\n<p><strong>What am I keeping that I will never use?<\/strong> Archive it. A vault carrying dead\nmaterial makes every query slightly worse, forever.<\/p>\n<h2 id=\"what-to-prune\">What to prune<\/h2>\n<p>Sources for topics you no longer care about: archive rather than delete, they\ncost nothing in <code>raw/<\/code> and the wiki pages can go.<\/p>\n<p>Concept pages that never got a second source: usually means the idea was not\nactually important to you.<\/p>\n<p>Nothing that is linked. A page five others depend on is load-bearing regardless\nof how it reads.<\/p>\n<h2 id=\"keep-the-review-short\">Keep the review short<\/h2>\n<p>A review that lists everything gets skimmed and then ignored. Three\nrecommendations, not ten. If a week produced nothing worth reporting, one line\nsaying so is the correct output.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"versioning-with-git.md\">Versioning<\/a><\/p>"},{"id":"09-maintenance/versioning-with-git","title":"Versioning","html":"<p>Git is what makes an agent safe to run unattended. Without it, a bad run is a\nmystery; with it, every change is a diff you can read and revert in one command.<\/p>\n<h2 id=\"commit-granularity\">Commit granularity<\/h2>\n<p>One commit per run, with the run named:<\/p>\n<pre><code>run-2026-09-07-ingest: 4 sources, 9 pages\nrun-2026-09-07-lint: 3 broken links, 1 merge\n<\/code><\/pre>\n<p>The vault template starts the message with a run id in this form, as in\n<a href=\"../06-agents/safety-and-guardrails.md#git-is-the-real-safety-net\">guardrails<\/a>.<\/p>\n<p>Not one commit per file, which buries the history, and not one commit per week,\nwhich makes reverting a single bad run impossible without losing the good ones.<\/p>\n<p>Scheduled tasks commit their own work as part of the run. See\n<a href=\"../06-agents/scheduled-maintenance.md\">scheduling<\/a>.<\/p>\n<h2 id=\"reading-diffs-of-generated-pages\">Reading diffs of generated pages<\/h2>\n<p>Worth doing in the first weeks, and occasionally after.<\/p>\n<p>You are looking for two things: pages that changed when they should not have,\nand rewrites where an update was expected. An agent quietly rewriting a page it\nwas asked to append to is the kind of behaviour that only shows up in a diff.<\/p>\n<p><code>git log --stat<\/code> after a week tells you which pages your automation touches most,\nwhich is usually informative.<\/p>\n<h2 id=\"reverting\">Reverting<\/h2>\n<pre><code class=\"language-bash\">git revert &lt;run commit&gt;  # undo one run, keep the history\ngit checkout HEAD~3 -- wiki/concepts/some-page.md   # one page back\n<\/code><\/pre>\n<p>Scope every restore to paths. <code>git checkout .<\/code> and <code>git reset --hard<\/code> throw away\nyour own uncommitted edits along with the agent's, which is why the vault\ntemplate has the agent commit by path, once per run, and why <code>/rollback<\/code> reverts\nthat run's own commit and nothing else. Committing before any large operation is\nwhat makes this work: a backfill that went wrong halfway costs you the run\nrather than the vault.<\/p>\n<h2 id=\"branches\">Branches<\/h2>\n<p>Worth it for experiments that touch structure: a new page contract, a schema\nchange, a bulk re-ingest under different instructions.<\/p>\n<pre><code class=\"language-bash\">git checkout -b new-schema\n<\/code><\/pre>\n<p>Run it, read the result, merge or delete the branch. Doing this on <code>main<\/code> and\ndeciding afterwards is how vaults end up in a half-migrated state that nobody\nwants to finish.<\/p>\n<h2 id=\"what-not-to-commit\">What not to commit<\/h2>\n<p><code>.obsidian/workspace*<\/code>, caches, and anything containing a key. The Local REST API\nkey lives in plugin data, so check <code>.obsidian/plugins/<\/code> before the first push.<\/p>\n<p>Keep the remote private unless you have deliberately made the vault public.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"backups-and-portability.md\">Backups and portability<\/a><\/p>"},{"id":"09-maintenance/backups-and-portability","title":"Backups and portability","html":"<h2 id=\"sync-is-not-backup\">Sync is not backup<\/h2>\n<p>This is the whole page, and it is the mistake almost everyone makes.<\/p>\n<p>Sync propagates. If an automation rewrites two hundred pages badly, sync\nfaithfully copies the damage to every device within seconds. If a file is\ndeleted, it is deleted everywhere.<\/p>\n<p>Backup means a copy that does not follow. At least one, disconnected from the\nsync path.<\/p>\n<h2 id=\"a-workable-arrangement\">A workable arrangement<\/h2>\n<p><strong>Git remote,<\/strong> private, pushed after every run. Versioned, so it covers the\n\"what did it look like three weeks ago\" case that a file backup does not.<\/p>\n<p><strong>Sync<\/strong> for working across machines, whichever kind you already use.<\/p>\n<p><strong>A periodic archive<\/strong> to external or separate cloud storage, not connected to\neither of the above. Monthly is enough.<\/p>\n<p>Three copies, one of which is dumb and slow, is the arrangement that survives the\nfailure modes that actually happen.<\/p>\n<h2 id=\"test-a-restore\">Test a restore<\/h2>\n<p>Once. Take the archive, restore it somewhere else, open it in Obsidian, and check\nthe links work.<\/p>\n<p>Untested backups fail at a reliably bad moment, and the common failure is not\ncorruption. It is discovering that the archive excluded a folder, or captured the\nvault mid-sync in a half-written state.<\/p>\n<h2 id=\"what-you-are-protecting-against\">What you are protecting against<\/h2>\n<p>Not disk failure, which is rare and which sync handles.<\/p>\n<p>The real risk is an automation that quietly did something wrong three weeks ago,\nwhich you notice now. That needs history, which is why git carries more of the\nload here than file backups.<\/p>\n<h2 id=\"portability\">Portability<\/h2>\n<p>The vault is markdown and wikilinks, so leaving any particular tool costs\nnothing structural. What is worth checking occasionally:<\/p>\n<p><strong>Nothing important lives outside the files.<\/strong> Plugin-specific metadata, canvas\nfiles, database exports. All fine as extras, none of it should carry knowledge\nthat exists nowhere else.<\/p>\n<p><strong>Links resolve without Obsidian.<\/strong> <code>scripts/link_check.py<\/code> verifies this, since\nit parses wikilinks itself.<\/p>\n<p><strong>The agent instructions are in the vault,<\/strong> not in a chat history or an app\nsetting. <code>CLAUDE.md<\/code>, skills and commands travel with the folder.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"privacy-and-secrets.md\">Privacy<\/a><\/p>"},{"id":"09-maintenance/privacy-and-secrets","title":"Privacy","html":"<p>A mature second brain is one of the highest-signal documents about a person that\nexists. Everything you read, worked on, worried about and asked, connected and\nindexed.<\/p>\n<p>That is the point, and it is the reason to be deliberate about what goes in and\nwhere it lives.<\/p>\n<h2 id=\"decide-at-capture-not-later\">Decide at capture, not later<\/h2>\n<p>Redaction after ingest does not work. By the time you decide something should not\nbe there, it has propagated into concept pages, links and synthesis pages, and\nremoving it means finding all of them.<\/p>\n<p>Decide before the file lands in <code>raw/<\/code>. See <a href=\"../03-ingestion/chat-exports.md\">chat\nexports<\/a>, which is where this bites hardest,\nbecause chat history contains more than any other source and is imported in bulk.<\/p>\n<h2 id=\"what-does-not-belong\">What does not belong<\/h2>\n<p><strong>Credentials of any kind.<\/strong> Not because the agent leaks them, but because the\nvault gets synced, committed, backed up and occasionally shared. Every copy is\nanother place the key exists.<\/p>\n<p><strong>Other people's private information.<\/strong> Meeting transcripts, personal messages,\nanything told to you in confidence. Your notes are not the right home for\nsomeone else's confidences, and they did not consent to being ingested.<\/p>\n<p><strong>Material you are contractually bound to keep confidential.<\/strong> Client work under\nNDA in a vault that syncs to a personal cloud account is a real exposure.<\/p>\n<h2 id=\"separate-vaults-over-careful-filtering\">Separate vaults over careful filtering<\/h2>\n<p>If you have material that must not mix, use a separate vault rather than tags or\nfolders inside one.<\/p>\n<p>A single vault with a private section relies on every query, every export and\nevery publish step respecting the boundary. Two vaults cannot leak into each\nother, and the cost is having to pick which one to open.<\/p>\n<h2 id=\"local-models-for-sensitive-material\">Local models for sensitive material<\/h2>\n<p>If a category of material should not leave your machine at all, a local model\nhandles ingestion for that vault. Quality is lower than a frontier model, which\nis the trade.<\/p>\n<p>Worth it for medical, legal or financial material. Usually not worth it for\narticles about software.<\/p>\n<h2 id=\"publishing\">Publishing<\/h2>\n<p>Explicit opt-in only. See <a href=\"../08-outputs/publishing-and-export.md\">publishing and\nexport<\/a>.<\/p>\n<h2 id=\"before-sharing-a-vault\">Before sharing a vault<\/h2>\n<p>Search it for keys, run through the frontmatter for personal identifiers, and\nread the log for what was ingested from where. Once shared, it is out, and the\ngraph makes it easy for a reader to assemble a picture you did not intend to\ngive.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"scaling.md\">Scaling past a thousand pages<\/a><\/p>"},{"id":"09-maintenance/scaling","title":"Scaling past a thousand pages","html":"<p>Most of this guide assumes a vault of a few hundred to a few thousand pages,\nwhich is where personal vaults live for years. Past that, some things strain.<\/p>\n<h2 id=\"what-actually-breaks\">What actually breaks<\/h2>\n<p><strong>Not search.<\/strong> Ripgrep over ten thousand markdown files is still instant.<\/p>\n<p><strong>Not Obsidian,<\/strong> although the global graph view is hard to read long before\nthat: <a href=\"../05-graphs/obsidian-graph-view.md\">reading the graph view<\/a> puts the\nhairball at about two hundred pages, and the local graph is the view that keeps\nworking.<\/p>\n<p><strong>Retrieval economy.<\/strong> The index gets long enough that reading it costs real\ncontext, which is the first genuine constraint.<\/p>\n<p><strong>Your attention.<\/strong> A thousand pages is more than you can hold a mental map of,\nwhich is precisely when the vault becomes more useful and also when you stop\nnoticing that parts of it have rotted.<\/p>\n<h2 id=\"summary-layers\">Summary layers<\/h2>\n<p>The fix for the index problem: one level between the master index and the pages.<\/p>\n<p>A short page per topic area, listing what is in it and what each page covers. The\nagent reads the master index, opens the one topic index that matters, then opens\npages. Three cheap reads instead of one expensive one.<\/p>\n<p>Two levels is enough. Three means summaries of summaries, which drift from what\nthey describe and get read instead of it.<\/p>\n<h2 id=\"splitting-vaults\">Splitting vaults<\/h2>\n<p>Split by domain when two areas genuinely do not inform each other: work and a\nhobby, two unrelated fields.<\/p>\n<p>Do not split by date or by size. The whole value is that old material connects to\nnew, and a vault split chronologically severs exactly the connections worth\nhaving.<\/p>\n<p>The cost of splitting is that cross-domain connections stop happening, and those\nare often the interesting ones. Split late and reluctantly.<\/p>\n<h2 id=\"archiving\">Archiving<\/h2>\n<p>Move cold material to an <code>archive/<\/code> folder outside <code>wiki/<\/code>: still on disk, still\nsearchable with ripgrep, no longer in the index or the graph.<\/p>\n<p>Reversible, which matters, because \"cold\" is a guess. A topic you archived can be\nbrought back if it turns out to matter again.<\/p>\n<h2 id=\"pruning-what-never-mattered\">Pruning what never mattered<\/h2>\n<p>Concept pages with one source and no inbound links after a year were never\nconcepts, they were paragraphs. Archiving them improves everything else by\nreducing what queries have to read past, and they stay on disk if you were\nwrong. The vault template moves them to <code>archive/<\/code> and takes them out of the\nindex; it never hard-deletes.<\/p>\n<p>Run this once a year, not continuously.<\/p>\n<h2 id=\"the-honest-ceiling\">The honest ceiling<\/h2>\n<p>Somewhere past ten thousand pages, a curated wiki stops being the right structure\nfor a single person, because nobody can curate at that rate and the curation is\nwhat made it work.<\/p>\n<p>If you are there, either the vault has stopped being personal, or ingestion has\nbeen running without judgement for a long time. The second is far more common,\nand the fix is upstream, in what you feed it.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"../10-troubleshooting/README.md\">Troubleshooting<\/a>.<\/p>"},{"id":"10-troubleshooting/common-failures","title":"The failures everyone hits","html":"<h2 id=\"the-vault-stalls-after-two-weeks\">The vault stalls after two weeks<\/h2>\n<p>Almost always capture, not the system. Clipping takes three clicks instead of\none, or the phone has no path into the vault, so material stops arriving and\nthere is nothing to process.<\/p>\n<p>Fix the capture path, not the vault. See\n<a href=\"../03-ingestion/README.md\">Ingestion<\/a>.<\/p>\n<p>The other cause is expecting the payoff too early. At thirty pages there is\nnothing to connect. See <a href=\"../01-concepts/what-good-looks-like.md\">what good looks\nlike<\/a> for the real timeline.<\/p>\n<h2 id=\"pages-are-summaries-of-summaries\">Pages are summaries of summaries<\/h2>\n<p>Source pages that summarise the article, concept pages that summarise the source\npages. Each layer loses information and the bottom layer is what gets read.<\/p>\n<p>The cause is a page contract that says \"summarise\" anywhere in it. Concept pages\nexplain an idea in plain language, in your words, standing on their own. Rewrite\nthe contract in <code>CLAUDE.md<\/code> and re-ingest a few sources to check.<\/p>\n<h2 id=\"the-agent-rewrites-work-you-did-by-hand\">The agent rewrites work you did by hand<\/h2>\n<p>Infuriating and preventable. Mark hand-written pages in frontmatter:<\/p>\n<pre><code class=\"language-yaml\">maintained_by: human\n<\/code><\/pre>\n<p>And in <code>CLAUDE.md<\/code>: never rewrite a page marked <code>maintained_by: human<\/code>, only\nappend links and flag issues for the owner.<\/p>\n<h2 id=\"ingest-quality-drops-as-the-vault-grows\">Ingest quality drops as the vault grows<\/h2>\n<p>Real, and the cause is usually context. Ingesting into a vault of three hundred\npages means the agent should be checking what exists first, and if it is not, it\ncreates new pages instead of updating.<\/p>\n<p>Check that ingestion reads <code>index.md<\/code> before writing. That one step is what keeps\nquality flat as the vault grows.<\/p>\n<h2 id=\"everything-connects-to-everything\">Everything connects to everything<\/h2>\n<p>A few hub pages have accumulated every link, so the graph says nothing. Split\nthe hubs into the specific ideas people are actually linking to. See <a href=\"../04-structuring/linking-rules.md\">linking\nrules<\/a>.<\/p>\n<h2 id=\"you-stopped-opening-it\">You stopped opening it<\/h2>\n<p>The honest failure. Usually capture broke months ago and the vault has been\nstatic, or the review is too long to read.<\/p>\n<p>Both are fixable. Neither is a reason to start over with a different tool, which\nis the instinct and always costs another month.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"agent-writes-garbage.md\">The agent writes garbage<\/a><\/p>"},{"id":"10-troubleshooting/agent-writes-garbage","title":"The agent writes garbage","html":"<p>Pages that are technically about the right thing and useless to read.<\/p>\n<h2 id=\"diagnose-the-source-first\">Diagnose the source first<\/h2>\n<p>Before touching instructions, check the input. Open the file in <code>raw/<\/code> and read\nit.<\/p>\n<p>Half of the bad pages people blame on the agent come from a bad extraction: a PDF\nwhose columns interleaved, an auto-caption transcript with no punctuation, a\nclipped page that captured the cookie banner instead of the article.<\/p>\n<p>The agent cannot write a good page from mangled text, and it will not tell you it\nis struggling. See <a href=\"../03-ingestion/pdfs-and-books.md\">PDFs<\/a> and\n<a href=\"../03-ingestion/youtube-transcripts.md\">transcripts<\/a>.<\/p>\n<h2 id=\"then-check-claudemd\">Then check CLAUDE.md<\/h2>\n<p>If the source is clean, the page contract is the problem.<\/p>\n<p>The specific things that produce vague pages: no definition of what each page\ntype contains, the word \"summarise\" anywhere, no instruction to write for a\nreader who has not seen the source, no requirement to link.<\/p>\n<p>Rewrite the contract with the shape spelled out. See <a href=\"../04-structuring/page-types.md\">page\ntypes<\/a>.<\/p>\n<h2 id=\"add-an-example-not-another-rule\">Add an example, not another rule<\/h2>\n<p>The highest-leverage fix and the least used. Put one good concept page in\n<code>CLAUDE.md<\/code>, in full, as the target.<\/p>\n<p>Rules describe the output abstractly and each new rule interacts with the others.\nOne example communicates the target directly, and it is what a person would ask\nfor if you told them to match a style.<\/p>\n<h2 id=\"ask-what-it-was-working-from\">Ask what it was working from<\/h2>\n<pre><code>You wrote [[page]]. Which parts of the source did you use, and what did you leave\nout?\n<\/code><\/pre>\n<p>The answer usually identifies the problem immediately: it read a fragment, it\ncould not tell what the source claimed versus reported, or the instructions\npulled it toward summarising.<\/p>\n<h2 id=\"roll-back-and-re-run\">Roll back and re-run<\/h2>\n<p>Fix the contract, revert the bad pages, re-ingest.<\/p>\n<pre><code class=\"language-bash\">git revert &lt;run commit&gt;              # the bad run only\n# or restore the paths that run listed, nothing else:\ngit checkout HEAD~1 -- wiki/concepts/page-a.md wiki/sources/page-b.md\n<\/code><\/pre>\n<p>Do not patch the bad pages by hand. If the contract was wrong, every page from\nthat run has the same flaw, and hand-fixing the three you noticed leaves the rest.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"broken-links.md\">Broken links and orphans<\/a><\/p>"},{"id":"10-troubleshooting/broken-links","title":"Broken links and orphans","html":"<pre><code class=\"language-bash\">python3 scripts/link_check.py ~/brain\n<\/code><\/pre>\n<h2 id=\"why-renames-break-links\">Why renames break links<\/h2>\n<p>Obsidian updates links when you rename inside the app. An agent renaming a file\ndirectly does not, and that is the most common cause of broken links in an\nagent-maintained vault.<\/p>\n<p>Prevent it with a rule in <code>CLAUDE.md<\/code>: renames update every inbound link, add the\nold name as an alias, and get recorded in <code>log.md<\/code>. See <a href=\"../04-structuring/naming-and-aliases.md\">naming and\naliases<\/a>.<\/p>\n<h2 id=\"fixing-in-bulk\">Fixing in bulk<\/h2>\n<p>Two categories, handled differently.<\/p>\n<p><strong>Typos and renames<\/strong> get fixed: point the link at the right page. Safe to\nautomate.<\/p>\n<p><strong>Genuine gaps<\/strong>, where the target never existed, go into <code>index.md<\/code> under Gaps.\nDo not create empty pages to satisfy them; an empty page is worse than a\nrecorded gap because it looks like coverage.<\/p>\n<p>Always on a clean git state, so a bad bulk fix is one command to undo.<\/p>\n<h2 id=\"orphans\">Orphans<\/h2>\n<p>Pages nothing links to. Three cases.<\/p>\n<p><strong>Should be linked and is not.<\/strong> Find the pages that ought to reference it and\nadd the links. This is the common case after a bulk import.<\/p>\n<p><strong>Genuinely standalone.<\/strong> Rare and usually a sign the material does not belong in\nthe wiki. Reference material and checklists belong in a project folder.<\/p>\n<p><strong>Failed ingest.<\/strong> A stub that never got connected. Re-ingest from the original\nin <code>raw/<\/code>.<\/p>\n<h2 id=\"preventing-both-at-ingest\">Preventing both at ingest<\/h2>\n<p>The rule that removes most of this work: nothing is ingested until it is linked,\nin both directions, in the same run.<\/p>\n<p>An ingest that ends with unlinked pages is an ingest that did not finish. Enforce\nit in the skill rather than cleaning up weekly.<\/p>\n<h2 id=\"after-a-big-import\">After a big import<\/h2>\n<p>Always lint. A large backfill reliably produces orphans and near-duplicates,\nbecause the agent was moving fast through material that overlapped.<\/p>\n<p>Budget for it: a thousand-source import is followed by a lint pass and a merge\nreview, and skipping that step is what leaves a vault permanently messy.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"vault-too-big.md\">The vault got too big<\/a><\/p>"},{"id":"10-troubleshooting/vault-too-big","title":"The vault got too big","html":"<h2 id=\"symptoms\">Symptoms<\/h2>\n<p>Answers get slower and vaguer. The agent reads twenty pages and returns something\ngeneral. The graph view is a hairball. You cannot remember whether a topic is\ncovered, and checking takes longer than searching the web.<\/p>\n<h2 id=\"what-it-usually-is-not\">What it usually is not<\/h2>\n<p>Disk, search speed, or Obsidian. Those all scale fine.<\/p>\n<p>What it actually is: retrieval economy. The index is long enough that reading it\ncosts real context, so the agent either skips it or spends its budget there\ninstead of on pages.<\/p>\n<h2 id=\"first-check-it-is-size-and-not-rot\">First, check it is size and not rot<\/h2>\n<p>Run the <a href=\"../05-graphs/metrics.md\">metrics<\/a>. A vault with a twenty percent orphan\nrate does not have a size problem, it has a linking problem, and splitting it\nwill not help.<\/p>\n<p>Genuinely large and healthy looks like: low orphan rate, one dominant component,\naverage degree in range, and an index over a few hundred entries.<\/p>\n<h2 id=\"summary-layers\">Summary layers<\/h2>\n<p>The first fix and usually enough. One index per topic area between the master\nindex and the pages, so the agent makes three cheap reads instead of one\nexpensive one. See <a href=\"../09-maintenance/scaling.md\">scaling<\/a>.<\/p>\n<h2 id=\"splitting\">Splitting<\/h2>\n<p>By domain, never by date. Two vaults that genuinely do not inform each other.<\/p>\n<p>Accept that cross-domain connections stop happening. Those are often the\ninteresting ones, which is why splitting is a late move rather than a first\nresponse.<\/p>\n<h2 id=\"archiving\">Archiving<\/h2>\n<p>Cold material to <code>archive/<\/code>, outside <code>wiki/<\/code>. Still searchable, out of the index\nand the graph, reversible.<\/p>\n<p>Better than deleting, because \"cold\" is a guess and archived material can come\nback.<\/p>\n<h2 id=\"rebuild-the-index\">Rebuild the index<\/h2>\n<p>Sometimes the index has simply drifted: entries for pages that moved, missing\nentries for pages added by runs that failed halfway.<\/p>\n<pre><code>Rebuild index.md from the actual contents of wiki/. Group by type and theme, one\nline of description per entry, and list gaps at the bottom.\n<\/code><\/pre>\n<p>Cheap, and it fixes a surprising share of \"the vault feels broken\" complaints.<\/p>\n<h2 id=\"next\">Next<\/h2>\n<p><a href=\"faq.md\">FAQ<\/a><\/p>"},{"id":"10-troubleshooting/faq","title":"FAQ","html":"<p><strong>Do I need MCP?<\/strong><\/p>\n<p>No. Claude Code started inside the vault folder reads and writes it directly.\nMCP adds the ability to reach the vault from sessions not running in it, which\nmatters mainly for scheduled tasks. See <a href=\"../02-setup/mcp-obsidian.md\">MCP for\nObsidian<\/a>.<\/p>\n<p><strong>Does this work with agents other than Claude Code?<\/strong><\/p>\n<p>Yes. The vault is markdown and the skills are <code>SKILL.md<\/code> files, which the\n<a href=\"https://github.com/agentskills/agentskills\">Agent Skills repository<\/a> describes as\nan open format originally developed by Anthropic and adopted by a growing number\nof agent products. Anything that can read and write files in a folder can maintain the\nvault; the instructions in <code>CLAUDE.md<\/code> may need renaming for other tools.<\/p>\n<p><strong>How much does it cost to run?<\/strong><\/p>\n<p>Depends entirely on volume. A daily ingest of a handful of articles is small. A\none-time backfill of a thousand sources is not, which is why the\n<a href=\"../03-ingestion/bulk-backfill.md\">backfill<\/a> page insists on batches with visible\ncosts.<\/p>\n<p><strong>Can I use a local model?<\/strong><\/p>\n<p>For ingestion of sensitive material, yes, with lower quality. Local models are\nweaker at the judgement calls that matter here: what deserves its own page, when\ntwo sources genuinely disagree. A workable split is a local model for private\nmaterial and a frontier model for everything else.<\/p>\n<p><strong>Do I need Obsidian?<\/strong><\/p>\n<p>No. The vault is a folder of markdown files. Obsidian is a good viewer for the\ngraph and has the Web Clipper, which is the strongest practical reason to use it.\n<a href=\"https://github.com/logseq/logseq\">Logseq<\/a>, <a href=\"https://github.com/foambubble/foam\">Foam<\/a>\nor a plain editor all work with markdown files.<\/p>\n<p><strong>What if I already have a Notion or Evernote full of notes?<\/strong><\/p>\n<p>Use the official <a href=\"https://github.com/obsidianmd/obsidian-importer\">Importer<\/a>\nplugin, which handles Notion, Evernote, Roam, Bear, Apple Notes and others (see its\nREADME for the full list). Then treat\nthe result as raw material: backfill oldest first. Expect the\nexport to be messy. Fix extraction before ingesting rather than hoping the agent\ncopes.<\/p>\n<p><strong>How is this different from a memory feature?<\/strong><\/p>\n<p>Memory features remember facts about you across sessions and belong to the tool.\nThis is a body of knowledge you own as files, that outlives the tool, and that\nyou can read, edit and publish yourself.<\/p>\n<p><strong>Will the agent make things up?<\/strong><\/p>\n<p>It can, which is why every rule in <a href=\"../04-structuring/README.md\">structuring<\/a> is\nabout attribution: claims recorded as claims, sources attached, gaps stated\nrather than filled. A page with no source behind a specific number is the thing\nto watch for.<\/p>\n<p><strong>Is the graph view actually useful or is it just pretty?<\/strong><\/p>\n<p>The global view is mostly pretty. The local graph is genuinely useful as a\nfive-second quality check on any page. See <a href=\"../05-graphs/obsidian-graph-view.md\">reading the graph\nview<\/a>.<\/p>\n<p><strong>How long before it is worth it?<\/strong><\/p>\n<p>Weeks two to four for the first real payoff, month six for the state people\ndescribe as the whole point.<\/p>\n<hr />\n<p>Something missing here? Open an issue.<\/p>"},{"id":"course-0-map/what-an-agent-is","title":"What an agent is","html":"<p>Google's <a href=\"https://www.kaggle.com/whitepaper-introduction-to-agents\">Introduction to Agents<\/a> whitepaper (Kaggle, November 2025) defines an agent as an application that makes plans and takes actions to achieve a goal — not a model that answers a question. The definition sounds bland. The consequence is not: the model is one component of four, and usually not the one that fails.<\/p>\n<h2>Model, tools, orchestration<\/h2>\n<p>The whitepaper names four components. The model is the brain: the reasoning engine that decides what to do next. Tools are the hands: APIs, code execution, database queries — anything that lets reasoning touch the world. The orchestration layer is the nervous system: the loop that assembles context, calls the model, executes what it asked for, and feeds the result back in. Deployment is the body: hosting, logging, monitoring, the unglamorous rest.<\/p>\n<p>The loop is the part people underestimate. The paper describes a think–act–observe cycle: the agent receives a mission, surveys what it has, plans a step, takes it, looks at what happened, and goes round again until the goal is met. Strip away the branding and an agent is a loop that keeps rebuilding the model's context between steps.<\/p>\n<p><img alt=\"Diagram of the agent loop: a request goes to the model, which calls tools and gets results back, repeating until the goal is met, then returns an answer.\" src=\"docs/course-0-map/fig-agent-loop.svg\" /><\/p>\n<h2>Five levels of agency<\/h2>\n<p>Rather than a binary, the paper grades systems:<\/p>\n<ul>\n<li>Level 0 — the bare model, reasoning from training data alone. No tools, no memory.<\/li>\n<li>Level 1 — the connected problem-solver: model plus tools, so it can fetch what it does not know.<\/li>\n<li>Level 2 — the strategic problem-solver: multi-step plans and deliberate context engineering.<\/li>\n<li>Level 3 — the collaborative multi-agent system: specialist agents that treat each other as tools.<\/li>\n<li>Level 4 — the self-evolving system: builds new tools or agents when it finds a capability gap.<\/li>\n<\/ul>\n<p>Most agents you will build sit at levels 1 and 2. That is not a criticism; it is where the return is.<\/p>\n<h2>Not a chatbot, not a workflow<\/h2>\n<p>A chatbot answers one message at a time and the human decides every next step. A workflow — in Anthropic's <a href=\"https://www.anthropic.com/engineering/building-effective-agents\">Building effective agents<\/a> — is a system where LLMs and tools are orchestrated through predefined code paths. An agent is a system where LLMs dynamically direct their own processes and tool use: the model decides the next step from what it just observed. The dividing question is always the same: who decides what happens next — the human, your code, or the model?<\/p>\n<h2>Where agents pay off<\/h2>\n<p>The whitepaper's own examples span the range. At the small end, a customer-support agent resolving \"where is my order?\" by calling the order-lookup and tracking APIs itself, instead of a scripted decision tree. At the large end, Google's Co-Scientist, where a supervisor delegates to specialist agents — generation, reflection, ranking, evolution, meta-review — that refine scientific hypotheses over hours or days; and AlphaEvolve, which proposes and tests candidate algorithms and has produced improvements in data-centre efficiency and matrix multiplication.<\/p>\n<p>The common shape: the steps could not have been written down in advance, but the result can be checked. Where the steps can be written down, write them — that argument is <a href=\"agents-or-workflows.md\">agents or workflows<\/a>. And the four components are only the anatomy of one worker; the system around it is <a href=\"five-layers.md\">the five layers<\/a>.<\/p>\n<h2>Check yourself<\/h2>\n<ul>\n<li>Name the four components the whitepaper gives an agent. Which on
