), not the agent's claim that it finished. Agents declare victory fluently.<\/li>\n<li><strong>Trajectory<\/strong>: was the path reasonable? Count steps, detect loops, flag tool errors that were silently ignored. Two agents with equal success rates are not equal if one takes 40 turns and burns 20x the tokens.<\/li>\n<\/ul>\n<h2>Tool-call correctness<\/h2>\n<p>The most mechanical and highest-yield checks:<\/p>\n<ul>\n<li>Right tool chosen for the intent.<\/li>\n<li>Arguments valid and correctly extracted from context (IDs, dates, filters — this is where agents quietly fail).<\/li>\n<li>Ordering constraints respected (<code>search<\/code> before <code>answer<\/code>, <code>read<\/code> before <code>write<\/code>).<\/li>\n<li>Error handling: feed a tool failure mid-trajectory and check the agent retries or reports rather than hallucinating a result.<\/li>\n<\/ul>\n<p>These are code assertions over the trace, not judge calls. Save the <a href=\"llm-as-judge.md\">llm as judge<\/a> for \"was the plan sensible\" questions.<\/p>\n<h2>Environment-based evals<\/h2>\n<p>The gold standard: give the agent a sandboxed environment (a Docker container, a seeded database, a mock API) and grade the <em>state<\/em> afterwards with executable checks. Deterministic setup, programmatic teardown, no grader ambiguity. It is more work to build than a golden set of transcripts, and worth it for anything that mutates state.<\/p>\n<h2>Harness benchmarks, 2026 edition<\/h2>\n<p>Public benchmarks are for comparing models and harnesses, not for measuring your product — but they show what good environment-based evals look like:<\/p>\n<ul>\n<li><a href=\"https://www.swebench.com/\">SWE-bench<\/a> family — real GitHub issues, graded by the repo's tests; SWE-bench Verified is, per the <a href=\"https://github.com/SWE-bench/SWE-bench\">SWE-bench README<\/a>, \"a subset of 500 problems that real software engineers have confirmed are solvable\". The leaderboard data in the <a href=\"https://github.com/SWE-bench/swe-bench.github.io\">swe-bench.github.io repository<\/a> lists entries to February 2026; the top Verified entry, 79.2%, is dated 5 December 2025; vendors report their own numbers for newer models, so check the model card and the harness behind any figure.<\/li>\n<li><a href=\"https://www.tbench.ai/\">Terminal-Bench<\/a> — <a href=\"https://github.com/laude-institute/terminal-bench-2\">2.0<\/a> has 89 task directories, each with, in its README's words, \"several hours of human and LM-assisted validation\", run in containers and graded by executable tests. The cleanest template to steal from.<\/li>\n<li><a href=\"https://arxiv.org/abs/2311.12983\">GAIA<\/a> — general assistant tasks needing web, tools and multi-step reasoning.<\/li>\n<li><a href=\"https://github.com/sierra-research/tau2-bench\">tau2-bench<\/a> — tool-agent-<em>user<\/em> interaction: a simulation framework for customer-service agents in which the agent must follow a domain policy (<a href=\"https://github.com/sierra-research/tau2-bench\">README<\/a>).<\/li>\n<li><a href=\"https://github.com/UKGovernmentBEIS/inspect_evals\">Inspect Evals<\/a> — roughly 130 evaluation directories (about 250 <code>@task<\/code> definitions) in the repository's <code>src<\/code>, including SWE-bench, GAIA and tau2, under one framework. New evals are being added through an external register rather than to <code>src<\/code>; the repo's EVAL_REGISTER.md announces that <code>src<\/code> stops accepting eval submissions as of 8 May 2026.<\/li>\n<\/ul>\n<h2>CI integration<\/h2>\n<p>Evals belong in the pipeline, not a notebook:<\/p>\n<ul>\n<li>Small smoke suite (deterministic checks only) on every PR; full suite nightly and before releases.<\/li>\n<li>Gate merges on a threshold; run N trials per case and gate on the mean.<\/li>\n<li>Pin model versions in CI, and treat a model bump as a change that must pass the suite like any other.<\/li>\n<\/ul>\n<p>Tooling that makes this less painful is surveyed in <a href=\"tooling.md\">tooling<\/a>.<\/p>"},{"id":"track-evals/tooling","title":"Eval Tooling","html":"<p>The market consolidated around two shapes: eval-first platforms with observability bolted on, and tracing-first platforms with evals bolted on. All of the below are alive and maintained as of late 2026. Pick one and move on; the flywheel from <a href=\"why-evals.md\">why evals<\/a> matters far more than the vendor.<\/p>\n<h2>Platforms<\/h2>\n<ul>\n<li><a href=\"https://www.braintrust.dev/\">Braintrust<\/a> — eval-first commercial platform built around the <code>Eval()<\/code> loop: datasets, experiments, side-by-side regression diffs, CI gates. The default choice for engineering-led teams that started with evals rather than dashboards.<\/li>\n<li><a href=\"https://langfuse.com/\">Langfuse<\/a> — the most mature open-source option; OpenTelemetry-style tracing you can self-host in an afternoon, with datasets and LLM-judge evals layered on top. Take it if data residency or an open licence is non-negotiable.<\/li>\n<li><a href=\"https://www.langchain.com/langsmith\">LangSmith<\/a> — LangChain's platform. If you are on LangChain/LangGraph, instrumentation is a one-line change and the dataset workflow is solid; if you are not, there is little reason to arrive here.<\/li>\n<li><a href=\"https://weave-docs.wandb.ai/\">W&amp;B Weave<\/a> — evaluation and tracing from Weights &amp; Biases; decorate functions, get versioned traces and eval dashboards. Natural if your org already lives in W&amp;B.<\/li>\n<\/ul>\n<h2>Frameworks and CLIs<\/h2>\n<ul>\n<li><a href=\"https://www.promptfoo.dev/\">promptfoo<\/a> — open-source CLI: declare prompts, providers and assertions in YAML, get a comparison matrix. Fastest route to \"which prompt/model is better\", plus a serious red-teaming mode. Excellent in CI.<\/li>\n<li><a href=\"https://inspect.aisi.org.uk/\">Inspect<\/a> — the UK AI Security Institute's open-source Python framework: composable solvers, scorers and sandboxed agent environments, with a library of ready evals in <a href=\"https://github.com/UKGovernmentBEIS/inspect_evals\">inspect_evals<\/a> (about 130 evaluation directories in <code>src<\/code>, with new ones to be registered externally, announced for 8 May 2026). Built for rigour; the standard in safety-testing circles and very good for <a href=\"agent-evals.md\">agent evals<\/a> generally.<\/li>\n<li><a href=\"https://github.com/openai/evals\">OpenAI Evals<\/a> — the 2023 registry repo still stands, but OpenAI's supported path is now the Evals product inside the API and dashboard, with an <a href=\"https://developers.openai.com/api/docs/guides/evaluation-best-practices\">evaluation best-practices guide<\/a>. Use the docs, not the repo.<\/li>\n<li><a href=\"https://github.com/confident-ai/deepeval\">DeepEval<\/a> — pytest-style eval framework with off-the-shelf metrics (faithfulness, answer relevancy). Convenient for CI; treat the prebuilt metrics as starting points, not truths — calibrate per <a href=\"llm-as-judge.md\">llm as judge<\/a>.<\/li>\n<\/ul>\n<h2>Claude Code plugin evals<\/h2>\n<p>Anthropic shipped an eval harness inside Claude Code itself (Claude Code v2.1.269 or later): <code>claude plugin eval<\/code> runs a plugin or skill against a suite of realistic prompts, grades results with six grader types (<code>regex<\/code>, <code>tool_used<\/code>, <code>tool_order<\/code>, <code>file_exists<\/code>, <code>llm<\/code>, <code>baseline<\/code>), and — the honest part — re-runs <em>without<\/em> the plugin to report the delta the plugin actually contributes. <code>claude plugin eval init<\/code> proposes cases interactively; <code>--threshold<\/code> gates CI, exiting 1 if any case scores below it. Documented at <a href=\"https://code.claude.com/docs/en/plugin-evals\">code.claude.com/docs/en/plugin-evals<\/a>. If you write skills for agents, this is the same discipline applied to your prompt scaffolding.<\/p>\n<h2>Honest advice<\/h2>\n<p>Every platform demos beautifully with a toy dataset. The differentiator is whether your team will actually read traces in it weekly. Trial with your own failure taxonomy for a fortnight before signing anything.<\/p>"},{"id":"track-evals/build-traces","title":"Build: Read Your Traces","html":"<p>First of three build pages: this one gets you from \"the bot sometimes messes up\" to a golden set file on disk. <a href=\"build-suite.md\">Build the suite<\/a> makes it runnable; the gate page wires it into CI. An afternoon covers all three. Background, if you skipped it: <a href=\"why-evals.md\">why evals<\/a>.<\/p>\n<p>Arriving from <a href=\"../course-5-evals/evals-practice.md\">module 5's practice<\/a>? You already have twenty cases and a runner — skip collection and go straight to the taxonomy pass below; the golden set then grows out of what you have.<\/p>\n<h2>Collect 30 traces<\/h2>\n<p>Pull thirty real transcripts from production — logs, a database export, whatever exists. Real inputs beat invented ones every time. No traffic yet? Generate a starter set against your own app: write thirty questions a plausible user would ask into <code>starter_inputs.txt<\/code> (vary persona, phrasing, length; include a couple that should be refused), then run them through your actual entry point:<\/p>\n<pre><code class=\"language-python\">import json\n\nfrom app import answer  # your product's entry point: str -&gt; str\n\nwith open(&quot;starter_inputs.txt&quot;, encoding=&quot;utf-8&quot;) as f:\n    inputs = [line.strip() for line in f if line.strip()]\n\nwith open(&quot;traces.jsonl&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as out:\n    for text in inputs:\n        out.write(json.dumps({&quot;input&quot;: text, &quot;output&quot;: answer(text)}) + &quot;\\n&quot;)\n<\/code><\/pre>\n<h2>The error-analysis pass<\/h2>\n<p>Read every trace in order and write one line per trace in a plain text file. A format that works:<\/p>\n<pre><code>trace_id | verdict | one-sentence failure note | verbatim quote\n014 | fail | invented an order number not present in context | &quot;your order #88412 shipped&quot;\n015 | ok   |  |\n016 | fail | apologised and asked a question instead of acting | &quot;could you clarify which invoice&quot;\n<\/code><\/pre>\n<p>Four rules: one sentence per failure; always quote the output; log successes as <code>ok<\/code> so you know the denominator; and fix nothing until all thirty are read. The hour this takes is the highest-leverage hour of the whole build.<\/p>\n<h2>Cluster into a taxonomy<\/h2>\n<p>At thirty notes you can cluster by hand, but an LLM makes a decent first sorter. Paste your notes into this prompt:<\/p>\n<pre><code class=\"language-text\">Below are failure notes from an error-analysis pass over one AI product,\none note per line, prefixed with a trace id.\n\nCluster them into 3 to 8 failure modes. For each mode give:\n- a snake_case name\n- a one-sentence definition\n- the trace ids it covers\n\nEvery note must land in exactly one mode. Put genuine one-offs in a mode\ncalled &quot;other&quot; rather than inventing a mode for a single note. Do not\npropose fixes. Return a markdown list.\n\n&lt;notes&gt;\nPASTE YOUR NOTES HERE\n&lt;/notes&gt;\n<\/code><\/pre>\n<p>Treat the result as a draft: merge modes that are really one thing, rename anything vague, demote anything you disagree with. The model sorts; you own the taxonomy.<\/p>\n<h2>Write the golden set<\/h2>\n<p>Turn the taxonomy into <code>golden.jsonl<\/code>, one case per line:<\/p>\n<pre><code class=\"language-json\">{&quot;id&quot;: &quot;hallucinated_id_003&quot;, &quot;failure_mode&quot;: &quot;hallucinated_order_id&quot;, &quot;input&quot;: &quot;where is my order?&quot;, &quot;checks&quot;: {&quot;must_not_contain&quot;: [&quot;#&quot;]}, &quot;judge_expectation&quot;: null, &quot;source&quot;: &quot;trace 014&quot;}\n{&quot;id&quot;: &quot;clarify_loop_001&quot;, &quot;failure_mode&quot;: &quot;clarify_instead_of_acting&quot;, &quot;input&quot;: &quot;cancel my March invoice&quot;, &quot;checks&quot;: null, &quot;judge_expectation&quot;: &quot;The reply cancels or begins cancelling the invoice rather than asking a clarifying question.&quot;, &quot;source&quot;: &quot;trace 016&quot;}\n{&quot;id&quot;: &quot;happy_path_002&quot;, &quot;failure_mode&quot;: &quot;none&quot;, &quot;input&quot;: &quot;what is your refund window?&quot;, &quot;checks&quot;: {&quot;must_contain&quot;: [&quot;30 days&quot;]}, &quot;judge_expectation&quot;: null, &quot;source&quot;: &quot;trace 015&quot;}\n<\/code><\/pre>\n<p>Five fields. <code>id<\/code> is stable and greppable. <code>failure_mode<\/code> comes from the taxonomy (<code>none<\/code> for happy-path cases). <code>input<\/code> is what the product receives. Exactly one of <code>checks<\/code> (string assertions code can grade: <code>must_contain<\/code>, <code>must_not_contain<\/code>) or <code>judge_expectation<\/code> (a single sentence the judge verifies) is set — prefer <code>checks<\/code> wherever it can carry the case. <code>source<\/code> points back to the trace, because you will want the original when a case starts failing.<\/p>\n<p>Every named failure mode gets a handful of cases, plus boring successes so you do not over-fit to pathology — the reasoning is in <a href=\"designing-evals.md\">designing evals<\/a>. Commit the file next to your code and move on to the suite.<\/p>"},{"id":"track-evals/build-suite","title":"Build: the Suite","html":"<p>You have <code>golden.jsonl<\/code> from <a href=\"build-traces.md\">read your traces<\/a>. This page turns it into a runnable suite: one plain Python file, no framework. Code assertions grade everything they can; one narrow judge handles the rest, per <a href=\"llm-as-judge.md\">llm as judge<\/a>. The example target is a support assistant behind a single prompt — swap <code>run_target<\/code> for however your app is called.<\/p>\n<h2>The script<\/h2>\n<p>Save as <code>eval_suite.py<\/code>. Needs <code>pip install anthropic<\/code> and <code>ANTHROPIC_API_KEY<\/code> set. The judge is a different model to the target, deliberately. The IDs are the Claude Opus 5.5 and Sonnet 5.5 API IDs from the <a href=\"https://platform.claude.com/docs/en/about-claude/models/overview\">models overview<\/a>. <code>max_tokens<\/code> includes any thinking the model does (<a href=\"https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost\">steering thinking<\/a>), so the judge's cap is set well above the length of its one-line verdict.<\/p>\n<pre><code class=\"language-python\">import argparse\nimport json\nimport re\nimport sys\n\nimport anthropic\n\nclient = anthropic.Anthropic()\n\nTARGET_MODEL = &quot;claude-opus-5-5&quot;\nJUDGE_MODEL = &quot;claude-sonnet-5-5&quot;\n\nSYSTEM_PROMPT = (\n    &quot;You are the support assistant for Acme Invoicing. Answer only from the &quot;\n    &quot;provided account context. If the context does not contain the answer, say so.&quot;\n)\n\nJUDGE_PROMPT = &quot;&quot;&quot;You are grading one output from an invoicing assistant.\n\nStatement to verify:\n{expectation}\n\nAssistant output:\n&lt;output&gt;\n{output}\n&lt;/output&gt;\n\nFirst write one or two sentences of reasoning. Then, on the final line, write\nexactly VERDICT: pass if the statement is true of the output, or VERDICT: fail\nif it is not. Do not reward length, politeness, or effort.\n&quot;&quot;&quot;\n\n\ndef run_target(case: dict) -&gt; str:\n    response = client.messages.create(\n        model=TARGET_MODEL,\n        max_tokens=16000,\n        system=SYSTEM_PROMPT,\n        messages=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: case[&quot;input&quot;]}],\n    )\n    return &quot;&quot;.join(b.text for b in response.content if b.type == &quot;text&quot;)\n\n\ndef grade_code(output: str, checks: dict) -&gt; tuple[bool, str]:\n    for needle in checks.get(&quot;must_contain&quot;, []):\n        if needle.lower() not in output.lower():\n            return False, f&quot;missing required text: {needle!r}&quot;\n    for needle in checks.get(&quot;must_not_contain&quot;, []):\n        if needle.lower() in output.lower():\n            return False, f&quot;contains forbidden text: {needle!r}&quot;\n    return True, &quot;code checks passed&quot;\n\n\ndef grade_judge(output: str, expectation: str) -&gt; tuple[bool, str]:\n    response = client.messages.create(\n        model=JUDGE_MODEL,\n        max_tokens=4096,\n        messages=[{\n            &quot;role&quot;: &quot;user&quot;,\n            &quot;content&quot;: JUDGE_PROMPT.format(expectation=expectation, output=output),\n        }],\n    )\n    text = &quot;&quot;.join(b.text for b in response.content if b.type == &quot;text&quot;)\n    match = re.search(r&quot;VERDICT:\\s*(pass|fail)&quot;, text, re.IGNORECASE)\n    passed = bool(match) and match.group(1).lower() == &quot;pass&quot;\n    return passed, text.strip().splitlines()[0]\n\n\ndef main() -&gt; None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(&quot;golden&quot;, help=&quot;path to golden.jsonl&quot;)\n    parser.add_argument(&quot;--limit&quot;, type=int, default=0, help=&quot;run only the first N cases&quot;)\n    parser.add_argument(&quot;--threshold&quot;, type=float, default=0.0, help=&quot;exit 1 below this pass rate&quot;)\n    args = parser.parse_args()\n\n    with open(args.golden, encoding=&quot;utf-8&quot;) as f:\n        cases = [json.loads(line) for line in f if line.strip()]\n    if args.limit:\n        cases = cases[: args.limit]\n\n    results = []\n    for case in cases:\n        output = run_target(case)\n        if case.get(&quot;checks&quot;):\n            passed, reason = grade_code(output, case[&quot;checks&quot;])\n        else:\n            passed, reason = grade_judge(output, case[&quot;judge_expectation&quot;])\n        results.append({&quot;id&quot;: case[&quot;id&quot;], &quot;passed&quot;: passed, &quot;reason&quot;: reason})\n        print(f&quot;{'PASS' if passed else 'FAIL'}  {case['id']}  {reason}&quot;)\n\n    rate = sum(r[&quot;passed&quot;] for r in results) / len(results)\n    print(f&quot;\\npass rate: {rate:.0%}&quot;)\n    with open(&quot;results.json&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n        json.dump({&quot;pass_rate&quot;: rate, &quot;results&quot;: results}, f, indent=2)\n    if args.threshold and rate &lt; args.threshold:\n        sys.exit(1)\n\n\nif __name__ == &quot;__main__&quot;:\n    main()\n<\/code><\/pre>\n<p>Run it with <code>python eval_suite.py golden.jsonl<\/code>. It prints one line per case, writes <code>results.json<\/code>, and — with <code>--threshold<\/code> — exits non-zero on a bad run, which is all CI needs.<\/p>\n<h2>Calibrate the judge before trusting it<\/h2>\n<p>Hand-label ten judged outputs first: <code>labels.jsonl<\/code>, one line per output with <code>id<\/code>, <code>output<\/code>, <code>expectation<\/code>, and your own <code>label<\/code> (true/false). Then check agreement:<\/p>\n<pre><code class=\"language-python\">import json\n\nfrom eval_suite import grade_judge\n\nwith open(&quot;labels.jsonl&quot;, encoding=&quot;utf-8&quot;) as f:\n    labels = [json.loads(line) for line in f if line.strip()]\n\nagree = 0\nfor row in labels:\n    verdict, reason = grade_judge(row[&quot;output&quot;], row[&quot;expectation&quot;])\n    agree += verdict == row[&quot;label&quot;]\n    if verdict != row[&quot;label&quot;]:\n        print(f&quot;disagree on {row['id']}: judge={verdict} you={row['label']} - {reason}&quot;)\nprint(f&quot;agreement: {agree}/{len(labels)}&quot;)\n<\/code><\/pre>\n<p>Read every disagreement; usually the expectation sentence was woolly, sometimes your label was. Ten labels is the afternoon version — the full 50–100 label procedure is in <a href=\"llm-as-judge.md\">llm as judge<\/a>.<\/p>\n<h2>When a framework earns its keep<\/h2>\n<p>This file is enough for one target, one judge, and a few hundred cases. Reach for promptfoo when you want to compare several prompts or models side by side without writing the matrix yourself, and for Inspect when you need sandboxed agent environments, solvers, and per-step scoring. Both are surveyed in <a href=\"tooling.md\">tooling<\/a>; neither replaces the taxonomy work — they just run it at scale.<\/p>"},{"id":"track-evals/build-ci","title":"Build: the Gate","html":"<p>A suite that runs only when someone remembers is a suite that stops running. This page wires <code>eval_suite.py<\/code> from <a href=\"build-suite.md\">build the suite<\/a> into GitHub Actions: a subset gates every PR, the full suite runs nightly, and the number lands in a scoreboard committed to the repo. The principles are in the CI section of <a href=\"agent-evals.md\">agent evals<\/a>.<\/p>\n<h2>The workflow<\/h2>\n<p>Save as <code>.github/workflows/evals.yml<\/code>. Add <code>ANTHROPIC_API_KEY<\/code> under repository secrets first.<\/p>\n<pre><code class=\"language-yaml\">name: evals\n\non:\n  pull_request:\n  schedule:\n    - cron: &quot;30 2 * * *&quot;\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: evals-${{ github.ref }}\n  cancel-in-progress: true\n\nenv:\n  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n\njobs:\n  pr-gate:\n    if: github.event_name == 'pull_request'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-python@v6\n        with:\n          python-version: &quot;3.12&quot;\n      - run: pip install anthropic\n      - name: Run the smoke subset\n        run: python eval_suite.py golden.jsonl --limit 20 --threshold 0.85\n\n  nightly:\n    if: github.event_name == 'schedule'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-python@v6\n        with:\n          python-version: &quot;3.12&quot;\n      - run: pip install anthropic\n      - name: Run the full suite\n        run: python eval_suite.py golden.jsonl --threshold 0.85\n      - name: Append to the scoreboard\n        if: always()\n        run: |\n          rate=$(python -c &quot;import json; print(f\\&quot;{json.load(open('results.json'))['pass_rate']:.0%}\\&quot;)&quot;)\n          echo &quot;| $(date -u +%Y-%m-%d) | ${rate} | ${GITHUB_SHA::7} |&quot; &gt;&gt; scoreboard.md\n          git config user.name &quot;eval-bot&quot;\n          git config user.email &quot;actions@users.noreply.github.com&quot;\n          git add scoreboard.md\n          git commit -m &quot;scoreboard: nightly eval run&quot;\n          git push\n<\/code><\/pre>\n<h2>Choosing the threshold<\/h2>\n<p>Set the threshold below your current pass rate, not at it. Judged cases are stochastic: a suite sitting at 90% will occasionally print 87% with nothing changed, and a gate at 90% turns that noise into red builds nobody trusts. Run the full suite three times, take the worst number, and gate a couple of points under that. Raise the bar only after a real improvement holds for a week of nightlies. And pin your model IDs in the script — a model alias silently moving underneath you is a change, and it should arrive as a PR that faces the gate like any other.<\/p>\n<h2>Cost control<\/h2>\n<p>The PR job runs the first twenty cases; keep those the cheapest and most diagnostic ones — code-graded cases from your biggest failure modes, since ordering <code>golden.jsonl<\/code> is free and judge calls are the expensive part. Twenty cases at two calls each is small money per PR; the full suite with every judge case runs once a night regardless of how busy the repo is. <code>cancel-in-progress<\/code> stops force-pushes from stacking duplicate runs. If nightly spend still stings, that is a sign the suite has grown past the afternoon version, and the sample-size guidance in <a href=\"designing-evals.md\">designing evals<\/a> tells you which cases are earning their place.<\/p>\n<h2>The scoreboard<\/h2>\n<p>Seed <code>scoreboard.md<\/code> by hand:<\/p>\n<pre><code class=\"language-markdown\"># Eval scoreboard\n\n| date | pass rate | commit |\n|---|---|---|\n<\/code><\/pre>\n<p>The nightly job appends one row and commits it, even on failing runs — a bad number in the log is a fact, a missing row is a mystery. The point of the scoreboard is not the ceremony; it is that the number becomes visible history in every clone of the repo. When it dips, <code>git log scoreboard.md<\/code> and the nightly logs say exactly which day and which commit. That loop — read traces, encode failures, gate, watch the number — is the flywheel from <a href=\"why-evals.md\">why evals<\/a>, now running without you.<\/p>"},{"id":"track-evals/resources","title":"Eval Resources","html":"<p>A short list, deliberately. Everything here earns its place; everything it links to is optional. Anthropic, GitHub and Claude Code docs entries were re-checked on 5 October 2026; the Hamel Husain, Maven, arXiv and OpenAI entries were last checked September 2026 and not re-checked on 5 October 2026 because the pages could not be fetched. The concepts they teach map onto <a href=\"why-evals.md\">why evals<\/a> and the rest of this handbook.<\/p>\n<h2>The canon<\/h2>\n<ul>\n<li><a href=\"https://hamel.dev/blog/posts/evals/\">Your AI Product Needs Evals<\/a> — Hamel Husain. The essay that made evals a discipline: unit tests, human review, and A/B tests as three levels, plus the case for looking at your data. Start here.<\/li>\n<li><a href=\"https://hamel.dev/blog/posts/evals-faq/\">AI Evals FAQ<\/a> — Husain and Shreya Shankar's running answers to the questions every team asks: binary vs Likert, how many labels, who should annotate, build vs buy. Dense and free.<\/li>\n<li><a href=\"https://maven.com/parlance-labs/evals\">AI Evals for Engineers &amp; PMs<\/a> — the Maven course behind the FAQ; several thousand engineers and PMs through it, cohorts still running in 2026. Paid, and the one course worth the money in this space.<\/li>\n<li><a href=\"https://arxiv.org/abs/2404.12272\">Who Validates the Validators?<\/a> — Shankar et al. The research grounding for aligning LLM judges with human labels; explains why rubric criteria drift as humans grade more outputs.<\/li>\n<li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\">Demystifying Evals for AI Agents<\/a> — Anthropic's engineering guide (9 January 2026): task selection, trajectory vs outcome grading, judge calibration, evals as CI. The closest thing to an official playbook for <a href=\"agent-evals.md\">agent evals<\/a>.<\/li>\n<li><a href=\"https://developers.openai.com/api/docs/guides/evaluation-best-practices\">Evaluation Best Practices<\/a> — OpenAI's guide; complements the above and pairs with the <a href=\"https://developers.openai.com/cookbook/topic/evals\">evals cookbook section<\/a> for worked judge examples.<\/li>\n<\/ul>\n<h2>Repos worth reading<\/h2>\n<ul>\n<li><a href=\"https://github.com/UKGovernmentBEIS/inspect_evals\">inspect_evals<\/a> — about 130 evaluation directories (roughly 250 <code>@task<\/code> definitions) implemented under UK AISI's Inspect, with new evals to be registered externally (announced for 8 May 2026). Read a few scorers and solvers to see what production-grade eval code looks like.<\/li>\n<li><a href=\"https://github.com/laude-institute/terminal-bench\">terminal-bench<\/a> and <a href=\"https://github.com/laude-institute/terminal-bench-2\">terminal-bench-2<\/a> — containerised tasks with executable graders (the original repo's README now points new users to the harbor framework for 2.0). The cleanest reference for building environment-based evals of your own; more context in <a href=\"agent-evals.md\">agent evals<\/a>.<\/li>\n<\/ul>\n<h2>Start here: three steps<\/h2>\n<ol>\n<li><strong>Read 30 traces.<\/strong> Pull thirty real (or realistic) transcripts from your product tonight and write one sentence per failure. No tooling, just a spreadsheet. This is error analysis, and it will reshape your roadmap.<\/li>\n<li><strong>Name the failures, encode the top three.<\/strong> Cluster your notes into a taxonomy, then turn the three most frequent failure modes into checks — code assertions where possible, one narrow calibrated judge where not. The mechanics are in <a href=\"designing-evals.md\">designing evals<\/a> and <a href=\"llm-as-judge.md\">llm as judge<\/a>.<\/li>\n<li><strong>Put the suite in CI and re-run weekly.<\/strong> Wire the checks into your pipeline with a threshold, fix the biggest failure mode, and return to step 1 with fresh traces. That loop, repeated, is the entire discipline.<\/li>\n<\/ol>"}],"sections":{"01-concepts":{"title":"Concepts","blurb":"Why an LLM-maintained knowledge base beats the note system you abandoned, and what the pattern actually is."},"02-setup":{"title":"Setup","blurb":"From zero to a vault your agent maintains, in one evening. Follow the pages in order the first time. Nine steps, roughly twenty minutes of typing and however long the interview in step four takes you."},"03-ingestion":{"title":"Ingestion","blurb":"Getting everything you read, watch and write into `raw/` with as little friction as possible, then into the wiki without flooding it."},"04-structuring":{"title":"Structuring","blurb":"The rules that decide whether your vault becomes a graph or a landfill."},"05-graphs":{"title":"Graphs","blurb":"The part most second-brain guides skip. They tell you to open the graph view, say it looks like a brain, and move on."},"06-agents":{"title":"Agents","blurb":"Turning a one-off setup into a system that maintains itself."},"07-retrieval":{"title":"Retrieval","blurb":"How to actually ask your vault things and get answers worth trusting."},"08-outputs":{"title":"Outputs","blurb":"The vault earns its keep when things come out of it."},"09-maintenance":{"title":"Maintenance","blurb":"What keeps the thing alive after the novelty wears off."},"10-troubleshooting":{"title":"Troubleshooting","blurb":"Concrete failures, with fixes."},"course-0-map":{"title":"0 · The map","blurb":"What an agent is, the five layers around the model, and when a workflow beats a loop.","course":true},"course-1-context":{"title":"1 · Context","blurb":"What the model sees: attention, caching, the four places, sessions and memory.","course":true},"course-2-loop":{"title":"2 · Loop","blurb":"Who decides the next step: goal, checker, stop rule, budget - and the hybrid that survives production.","course":true},"course-3-gate":{"title":"3 · The gate","blurb":"Cheap decisions in front of expensive models: classifiers first, System One models where they earn it.","course":true},"course-4-harness":{"title":"4 · Harness","blurb":"The office around the model: containment, guides, sensors, permissions - built from the outside in.","course":true},"course-5-evals":{"title":"5 · Evals","blurb":"The same test every month: behavioural checks on traces, judged judges, golden sets that include failures.","course":true},"course-6-production":{"title":"6 · Production","blurb":"From demo to deployed: gateways, tracing, cost, security - and the day-one plan across all five layers.","course":true},"track-graph":{"title":"Knowledge graphs","blurb":"Graphs as agent memory: GraphRAG, extraction pipelines, stores — then an evening build of a graph layer over your own vault.","track":true},"track-jev":{"title":"Jev engineering","blurb":"The gate is the layer; Jev is one way to build it. Typed decisions with confidence scores instead of generated text — and a build you can run before your Jev access lands.","track":true},"track-harness":{"title":"Agent harnesses","blurb":"The machinery around the model: loops, tools, context engineering, the landscape — and a working harness in an evening, about 150 lines.","track":true},"track-loop":{"title":"Loop engineering","blurb":"The control system around the agent: stop conditions, critics, context hygiene — and an overnight loop you can trust by morning.","track":true},"track-evals":{"title":"Eval engineering","blurb":"Measurement as the discipline of AI products: golden sets, judges that do not lie, agent trajectories — and your first suite built in an afternoon.","track":true}},"order":{"01-concepts":["01-concepts/what-is-a-second-brain","01-concepts/the-save-for-later-paradox","01-concepts/llm-wiki-pattern","01-concepts/two-layers","01-concepts/why-markdown-and-plain-text","01-concepts/pkm-lineage","01-concepts/wiki-vs-rag","01-concepts/what-good-looks-like"],"02-setup":["02-setup/obsidian-install-and-vault","02-setup/claude-code-setup","02-setup/mcp-obsidian","02-setup/claude-md","02-setup/vault-structure","02-setup/project-scoping","02-setup/live-data","02-setup/obsidian-plugins","02-setup/git-and-sync"],"03-ingestion":["03-ingestion/web-clipper","03-ingestion/youtube-transcripts","03-ingestion/pdfs-and-books","03-ingestion/chat-exports","03-ingestion/voice-and-meetings","03-ingestion/newsletters-and-email","03-ingestion/bulk-backfill"],"04-structuring":["04-structuring/atomic-pages","04-structuring/page-types","04-structuring/linking-rules","04-structuring/frontmatter-schema","04-structuring/naming-and-aliases","04-structuring/dedupe-and-merge","04-structuring/contradictions-and-supersession","04-structuring/index-and-log"],"05-graphs":["05-graphs/graph-basics","05-graphs/obsidian-graph-view","05-graphs/typed-links","05-graphs/graph-vs-vectors","05-graphs/graphrag","05-graphs/exporting-your-graph","05-graphs/metrics"],"06-agents":["06-agents/agent-roles","06-agents/scheduled-maintenance","06-agents/subagents","06-agents/hooks","06-agents/skills-and-commands","06-agents/safety-and-guardrails"],"07-retrieval":["07-retrieval/asking-questions","07-retrieval/query-patterns","07-retrieval/search-tools","07-retrieval/rag-on-top","07-retrieval/context-budget"],"08-outputs":["08-outputs/writing-from-the-vault","08-outputs/research-reports","08-outputs/publishing-and-export","08-outputs/teaching-yourself"],"09-maintenance":["09-maintenance/lint-and-health","09-maintenance/review-cadence","09-maintenance/versioning-with-git","09-maintenance/backups-and-portability","09-maintenance/privacy-and-secrets","09-maintenance/scaling"],"10-troubleshooting":["10-troubleshooting/common-failures","10-troubleshooting/agent-writes-garbage","10-troubleshooting/broken-links","10-troubleshooting/vault-too-big","10-troubleshooting/faq"],"course-0-map":["course-0-map/what-an-agent-is","course-0-map/five-layers","course-0-map/agents-or-workflows"],"course-1-context":["course-1-context/how-models-read","course-1-context/the-four-places","course-1-context/context-practice"],"course-2-loop":["course-2-loop/loops-vs-workflows","course-2-loop/the-four-parts","course-2-loop/loop-practice"],"course-3-gate":["course-3-gate/cheap-decisions","course-3-gate/gates-in-practice","course-3-gate/gate-practice"],"course-4-harness":["course-4-harness/the-office","course-4-harness/the-four-rings","course-4-harness/harness-practice"],"course-5-evals":["course-5-evals/two-kinds-of-checks","course-5-evals/judges-and-golden-sets","course-5-evals/evals-practice"],"course-6-production":["course-6-production/from-prototype","course-6-production/operating-agents","course-6-production/day-one-plan"],"track-graph":["track-graph/why-graphs","track-graph/graphrag","track-graph/building-graphs-with-llms","track-graph/graph-stores","track-graph/tools","track-graph/build-extract","track-graph/build-query","track-graph/build-use","track-graph/resources"],"track-jev":["track-jev/system-one-models","track-jev/what-jev-is-good-for","track-jev/jev-in-an-agent-stack","track-jev/getting-started","track-jev/build-decision-endpoint","track-jev/build-router","track-jev/build-swap-in-jev","track-jev/resources"],"track-harness":["track-harness/what-a-harness-is","track-harness/claude-code-as-harness","track-harness/context-engineering","track-harness/tools-and-mcp","track-harness/harness-landscape","track-harness/build-the-loop","track-harness/build-guardrails","track-harness/build-graduate","track-harness/kv-cache-ssd-tier","track-harness/local-models-for-maintenance","track-harness/resources"],"track-loop":["track-loop/what-loop-engineering-is","track-loop/stop-conditions","track-loop/critics-and-verification","track-loop/context-hygiene","track-loop/patterns","track-loop/build-goal-test","track-loop/build-critic","track-loop/build-overnight","track-loop/resources"],"track-evals":["track-evals/why-evals","track-evals/designing-evals","track-evals/llm-as-judge","track-evals/agent-evals","track-evals/tooling","track-evals/build-traces","track-evals/build-suite","track-evals/build-ci","track-evals/resources"]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const P={}; D.pages.forEach(p=>{P[p.id]=p; p.section=p.id.split('/')[0]; p.section_title=D.sections[p.section].title; p.path='docs/'+p.id+'.md';});
const T={};
const DEC=document.createElement('textarea');
const unhtml=h=>{DEC.innerHTML=h.replace(/<[^>]+>/g,' ');return DEC.value.replace(/\s+/g,' ').trim();};
// text, lowercase text and h2 texts of a page, derived once from its html
function idx(p){if(!T[p.id]){const t=unhtml(p.html);
T[p.id]={t,l:t.toLowerCase(),h:[...p.html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/g)].map(m=>unhtml(m[1]).toLowerCase())};}return T[p.id];}
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
// escape text and wrap each occurrence of v (lowercase) in <mark>
function mark(s,v){let o='',i=0,l=s.toLowerCase(),k;
if(l.length!==s.length)return esc(s);
while((k=l.indexOf(v,i))>=0){o+=esc(s.slice(i,k))+'<mark>'+esc(s.slice(k,k+v.length))+'</mark>';i=k+v.length;}
return o+esc(s.slice(i));}
function snippet(x,v){const k=x.l.length===x.t.length?x.l.indexOf(v):-1;
let a=Math.max(0,(k<0?0:k)-45), b=Math.min(x.t.length,(k<0?0:k)+v.length+90);
if(a>0){const j=x.t.indexOf(' ',a);if(j>=0&&j<k)a=j+1;}
if(b<x.t.length){const j=x.t.lastIndexOf(' ',b);if(j>k+v.length)b=j;}
return (a>0?'…':'')+mark(x.t.slice(a,b),v)+(b<x.t.length?'…':'');}
const FLAT=[]; Object.keys(D.order).forEach(s=>D.order[s].forEach(id=>FLAT.push(id)));
const HERO=document.getElementById('hero').innerHTML;
function side(cur){
const s=document.getElementById('side'); let h='';
let mi=0, ti=0, ci=0, divT=false, divC=false;
Object.keys(D.order).forEach((sec)=>{
const isT = sec.startsWith('track-'), isC = sec.startsWith('course-');
if(isC && !divC){ h+='<div class="sdiv">the agents course</div>'; divC=true; }
if(isT && !divT){ h+='<div class="sdiv">handbooks</div>'; divT=true; }
const badge = isC ? 'C'+(ci++) : isT ? 'T'+(++ti) : String(++mi).padStart(2,'0');
const open = cur && cur.startsWith(sec);
h+=`<div class="sec ${open?'open':''}" data-sec="${sec}">
<button aria-expanded="${!!open}"><span class="k">${badge}</span>
${D.sections[sec].title}<span class="n">${D.order[sec].length}</span></button><ol>`;
D.order[sec].forEach(id=>{
h+=`<li><a href="#${id}" class="${id===cur?'cur':''}"${id===cur?' aria-current="page"':''}>${P[id].title}</a></li>`;
});
h+='</ol></div>';
});
s.innerHTML=h;
s.querySelectorAll('.sec>button').forEach(b=>b.onclick=()=>{
const d=b.parentElement; d.classList.toggle('open');
b.setAttribute('aria-expanded', d.classList.contains('open'));
});
}
// reading time: words in the rendered text at 230 a minute, at least one
function mins(p){return Math.max(1,Math.round(idx(p).t.split(' ').length/230));}
// copy buttons exist only with JavaScript. The status region sits outside
// <main>, so it survives page changes and announces "Copied".
const SAY=document.getElementById('copy-say');
function viaTextarea(t){
const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly','');
a.style.cssText='position:fixed;top:0;left:0;opacity:0';
document.body.appendChild(a); a.select();
let ok=false; try{ok=document.execCommand('copy');}catch(e){}
a.remove(); return ok;
}
function copy(b,t){
const done=ok=>{
clearTimeout(b._t); b.textContent=ok?'Copied':'Copy failed';
SAY.textContent=''; setTimeout(()=>{SAY.textContent=ok?'Copied':'Copy failed';},50);
b._t=setTimeout(()=>{b.textContent='Copy';SAY.textContent='';},2000);
};
if(navigator.clipboard&&navigator.clipboard.writeText)
navigator.clipboard.writeText(t).then(()=>done(true),()=>done(viaTextarea(t)));
else done(viaTextarea(t));
}
let first=true, last=location.pathname+location.search;
function render(){
if(location.hash==='#main'){history.replaceState(null,'',last);if(!first)return;}
last=location.pathname+location.search+location.hash;
const id=decodeURIComponent(location.hash.slice(1));
const main=document.getElementById('main'), rail=document.getElementById('rail');
if(!P[id]){
main.innerHTML=HERO; rail.innerHTML=''; side(null);
main.querySelectorAll('svg .node').forEach(n=>{
const go=()=>{location.hash=D.order[n.dataset.sec][0];};
n.onclick=go;
n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});
document.title='Second Brain OS - the guide';
window.scrollTo(0,0); done(); return;
}
const p=P[id], i=FLAT.indexOf(id), prev=FLAT[i-1], next=FLAT[i+1];
main.innerHTML=`<article class="page">
<div class="crumb">${p.section_title} / page ${D.order[p.section].indexOf(id)+1} of ${D.order[p.section].length}</div>
<h1>${p.title}</h1>
<p class="pmeta">${mins(p)} min read &middot; <a href="https://github.com/kuuratsanik/second-brain-os/edit/main/${p.path}">Edit on GitHub</a></p>${p.html}
<div class="pager">
${prev?`<a href="#${prev}"><span class="lbl">previous</span>${P[prev].title}</a>`:'<span></span>'}
${next?`<a href="#${next}" style="text-align:right"><span class="lbl">next</span>${P[next].title}</a>`:'<span></span>'}
</div>
<div class="src">source: <a href="https://github.com/kuuratsanik/second-brain-os/blob/main/${p.path}">${p.path}</a></div>
</article>`;
// rewrite internal links to hash routes, style them as wikilinks
main.querySelectorAll('a[href]').forEach(a=>{
const href=a.getAttribute('href');
if(/^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href)) return;
const hashAt=href.search(/[#?]/), path=hashAt<0?href:href.slice(0,hashAt), tail=hashAt<0?'':href.slice(hashAt);
let target=null;
if(path.endsWith('.md')){
const parts=path.replace(/^\.\//,'').split('/');
const file=parts[parts.length-1].replace('.md','');
if(file==='README'){
const sec=parts[parts.length-2]; if(D.order[sec]) target=D.order[sec][0];
} else {
const sec = parts.length>1 ? parts[parts.length-2] : p.section;
const cand = sec+'/'+file;
target = P[cand] ? cand : (P[p.section+'/'+file] ? p.section+'/'+file : null);
}
}
if(target){ a.setAttribute('href','#'+target); a.className='wiki'; return; }
// anything else points into the repository: send it to GitHub
const out=p.path.split('/').slice(0,-1);
path.split('/').forEach(seg=>{ if(seg==='..') out.pop(); else if(seg&&seg!=='.') out.push(seg); });
const last=out[out.length-1]||'';
const kind=(path===''||path.endsWith('/')||last.indexOf('.')<0)?'tree':'blob';
a.setAttribute('href','https://github.com/kuuratsanik/second-brain-os/'+kind+'/main/'+out.join('/')+tail);
});
const pres=main.querySelectorAll('pre');
pres.forEach((pre,n)=>{
pre.tabIndex=0;
const w=document.createElement('div'); w.className='cwrap';
pre.parentNode.insertBefore(w,pre);
const b=document.createElement('button'); b.type='button'; b.className='copy'; b.textContent='Copy';
b.setAttribute('aria-label',pres.length>1?'Copy code block '+(n+1)+' of '+pres.length:'Copy code');
b.onclick=()=>copy(b,pre.textContent);
w.appendChild(b); w.appendChild(pre);
});
main.querySelectorAll('th').forEach(h=>{if(!h.textContent.trim())h.innerHTML='<span class="vh">Row label</span>';});
const heads=[...main.querySelectorAll('h2')];
const outs=[...main.querySelectorAll('a.wiki')].slice(0,8);
rail.innerHTML=(heads.length?`<div class="grp"><div class="rh">on this page</div>`+
heads.map((h,n)=>{h.id='h'+n;return `<a href="#${id}" onclick="document.getElementById('h${n}').scrollIntoView();return false">${h.textContent}</a>`}).join('')+`</div>`:'')
+(outs.length?`<div class="grp"><div class="rh">links out</div>`+
outs.map(a=>`<a href="${a.getAttribute('href')}">${a.textContent}</a>`).join('')+`</div>`:'');
side(id); document.title=p.title+' - Second Brain OS'; window.scrollTo(0,0); done();
}
function done(){ if(first){first=false;return;} document.getElementById('main').focus({preventScroll:true}); }
// search
const q=document.getElementById('q'), hits=document.getElementById('hits'), hitcount=document.getElementById('hitcount');
q.addEventListener('input',()=>{
const v=q.value.trim().replace(/\s+/g,' ').toLowerCase();
if(v.length<2){hits.classList.remove('open');hitcount.textContent='';return;}
// title 10 (+6 at the start) > an h2 8 > body at most 3
const r=D.pages.map(p=>{
const x=idx(p); let sc=0; const t=p.title.toLowerCase();
if(t.includes(v)) sc+=10; if(t.startsWith(v)) sc+=6;
if(x.h.some(h=>h.includes(v))) sc+=8;
sc+=Math.min(x.l.split(v).length-1,3);
return {p,x,sc};
}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,9);
hits.innerHTML=r.length?r.map(x=>`<a class="hit" href="#${x.p.id}"><b>${mark(x.p.title,v)}</b><i>${esc(x.p.section_title)}</i><span class="sn">${snippet(x.x,v)}</span></a>`).join('')
:'<div class="hit"><i>nothing in the guide matches that</i></div>';
hits.classList.add('open');
hitcount.textContent=r.length?r.length+(r.length===1?' result':' results'):'no results';
});
q.addEventListener('keydown',e=>{
const f=hits.querySelector('a.hit');
if(e.key==='ArrowDown'&&f&&hits.classList.contains('open')){e.preventDefault();f.focus();}
if(e.key==='Enter'&&f&&hits.classList.contains('open')){e.preventDefault();f.click();}
});
hits.addEventListener('keydown',e=>{
const a=[...hits.querySelectorAll('a.hit')], i=a.indexOf(document.activeElement);
if(i<0)return;
if(e.key==='Escape'){e.preventDefault();hits.classList.remove('open');q.focus();}
if(e.key==='ArrowDown'){e.preventDefault();(a[i+1]||a[i]).focus();}
if(e.key==='ArrowUp'){e.preventDefault();(i?a[i-1]:q).focus();}
});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';hits.classList.remove('open');q.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hits.classList.remove('open');});
document.addEventListener('keydown',e=>{
const tg=e.target, typing=tg.closest&&tg.closest('input,textarea,select,[contenteditable]');
if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();q.focus();}
if(typing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey)return;
if(!P[decodeURIComponent(location.hash.slice(1))])return;
const i=FLAT.indexOf(decodeURIComponent(location.hash.slice(1)));
if(e.key==='ArrowRight'&&FLAT[i+1])location.hash=FLAT[i+1];
if(e.key==='ArrowLeft'&&FLAT[i-1])location.hash=FLAT[i-1];
});
hits.addEventListener('click',()=>{hits.classList.remove('open');q.value='';});
const toc=document.getElementById('toc');
if(toc){toc.onclick=()=>{const o=document.getElementById('side').classList.toggle('show');toc.setAttribute('aria-expanded',o);};}
document.getElementById('side').addEventListener('click',e=>{
if(e.target.tagName==='A'&&innerWidth<=860){ document.getElementById('side').classList.remove('show'); if(toc)toc.setAttribute('aria-expanded','false'); }
});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('main').focus();});
addEventListener('hashchange',render); render();</script></body></html>
