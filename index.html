e contains the think–act–observe loop?<\/li>\n<li>Your system calls a model three times in a fixed order with no branching. Which level is it, and is it an agent?<\/li>\n<\/ul>"},{"id":"course-0-map/five-layers","title":"Five layers, one system","html":"<p>Think of an agent as a new employee on his first day. He is bright, fast, and knows nothing about your company. Everything that decides whether he succeeds is the system you build around him — and that system has exactly five layers.<\/p>\n<p>The field talks about these layers as if they were rival schools: context engineering, loop engineering, JEV engineering, harness engineering, eval engineering. Five buzzwords, five conference tracks, five people telling you the other four are hype. They are not competing approaches. They are five layers of one system, and each answers one question: what it sees, who decides, who sorts, what it can reach, how you know.<\/p>\n<p><img alt=\"Diagram of five layers around a model: the gate, the harness (tools, keys, sandbox), context (what it sees) and the loop (who decides next), with evals running the same test after every change.\" src=\"docs/course-0-map/fig-five-layers.svg\" /><\/p>\n<h2>Context: what it sees<\/h2>\n<p>What is on his desk when he starts the task. The brief, the relevant files, the one page of history that matters — and nothing else. The model reasons only over what is in the window; everything outside it does not exist. Without this layer the agent guesses, invents plausible answers to questions it was never shown, and asks again for things it was already given. Bad context is routinely misdiagnosed as a bad model.<\/p>\n<h2>Loop: who decides<\/h2>\n<p>Does he work from a checklist, or does he decide the next step himself? A checklist is a workflow: cheap, predictable, dead at the first surprise. Self-directed steps are an agent loop: flexible, expensive, capable of wandering. Without deliberate loop design you get one failure or the other — a script that breaks on anything unforeseen, or a wanderer that burns tokens circling the same three files.<\/p>\n<h2>Gate: who sorts<\/h2>\n<p>The front desk sorting the mail. Not every request deserves the expensive employee: a small, fast decision — a classifier, a cheap model, a rule — routes the trivial away and the real work in. Without a gate, everything hits the costliest path, including the junk, the duplicates, and the traffic that should never reach an agent holding keys at all.<\/p>\n<h2>Harness: what it can reach<\/h2>\n<p>His office: the tools on the desk, the keys on the ring, and the person who checks his work before it goes out. Permissions, sandboxes, timeouts, review. Without a harness the agent is either useless — it can decide but not act — or dangerous: it can act on everything, and nobody looks before the action lands.<\/p>\n<h2>Evals: how you know<\/h2>\n<p>The same test, every month. Not a demo, not a vibe check after a prompt change — a fixed set of tasks with known answers, run on every version. Without evals you can only feel whether a change helped, and your regressions are discovered by your users.<\/p>\n<h2>The map<\/h2>\n<p>A failure in one layer wears the mask of another: missing context looks like a stupid model, a missing gate looks like runaway cost, missing evals look like nothing at all until production. Each layer gets a module of this course, and four get a handbook. The split is the contract of this whole site: the module teaches the idea once, in order; the handbook holds the full menu of techniques, tools and builds, for when that layer starts hurting.<\/p>\n<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Question<\/th>\n<th>Module<\/th>\n<th>Handbook<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Context<\/td>\n<td>What does it see?<\/td>\n<td><a href=\"../course-1-context/how-models-read.md\">Module 1: how models read<\/a><\/td>\n<td>Module 1 is the deep dive<\/td>\n<\/tr>\n<tr>\n<td>Loop<\/td>\n<td>Who decides the next step?<\/td>\n<td><a href=\"../course-2-loop/loops-vs-workflows.md\">Module 2: loops vs workflows<\/a><\/td>\n<td><a href=\"../track-loop/what-loop-engineering-is.md\">What loop engineering is<\/a><\/td>\n<\/tr>\n<tr>\n<td>Gate<\/td>\n<td>Who sorts the incoming work?<\/td>\n<td><a href=\"../course-3-gate/cheap-decisions.md\">Module 3: cheap decisions<\/a><\/td>\n<td><a href=\"../track-jev/system-one-models.md\">System-one models<\/a><\/td>\n<\/tr>\n<tr>\n<td>Harness<\/td>\n<td>What can it reach?<\/td>\n<td><a href=\"../course-4-harness/the-office.md\">Module 4: the office<\/a><\/td>\n<td><a href=\"../track-harness/what-a-harness-is.md\">What a harness is<\/a><\/td>\n<\/tr>\n<tr>\n<td>Evals<\/td>\n<td>How do you know it works?<\/td>\n<td><a href=\"../course-5-evals/two-kinds-of-checks.md\">Module 5: two kinds of checks<\/a><\/td>\n<td><a href=\"../track-evals/why-evals.md\">Why evals<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Check yourself<\/h2>\n<ul>\n<li>Your agent keeps re-requesting a file that was in its context two steps ago. Which layer is broken, and why does it look like a model problem?<\/li>\n<li>A teammate insists eval engineering has replaced prompt engineering. Using the five questions, explain why the claim is a category error.<\/li>\n<\/ul>"},{"id":"course-0-map/agents-or-workflows","title":"Agents or workflows","html":"<p>One decision comes before any building: can you write down the steps? If you can, write them. Code that runs known steps in a known order is a workflow, and a workflow beats an agent on every axis except one.<\/p>\n<p>Anthropic's <a href=\"https://www.anthropic.com/engineering/building-effective-agents\">Building effective agents<\/a> draws the line cleanly: a workflow is a system where model calls and tools run along code paths you defined in advance; an agent is a system where the model directs its own process and decides its next step as it goes. Their advice is to find the simplest solution that works and add complexity only when it earns its place — agentic systems trade latency and cost for capability, and the trade has to be worth it.<\/p>\n<h2>Why workflows win by default<\/h2>\n<p>Workflows are cheaper: each step carries only the context that step needs, not a growing transcript of everything so far. They run in parallel: independent steps fan out, while a loop is sequential by nature — each decision waits on the last observation. They are debuggable: a failed step has a name, an input, and a log line, where a failed loop has forty turns of transcript to read. And they are testable step by step, so a fix stays fixed.<\/p>\n<h2>Where loops earn their cost<\/h2>\n<p>Loops belong where the steps are unknowable in advance. Research, where the next query depends on what the last one returned. Debugging, where nobody knows which of a thousand files holds the fault. Open-ended synthesis, where the shape of the answer emerges from the material. The signature is always the same: you cannot enumerate the branches beforehand, but you can check the result afterwards. If both halves do not hold, you are paying agent prices for workflow work.<\/p>\n<h2>The cost reality<\/h2>\n<p>The multiplier is not folklore; Anthropic published it against their own traffic. In <a href=\"https://www.anthropic.com/engineering/built-multi-agent-research-system\">How we built our multi-agent research system<\/a> they report that agents typically use about 4x the tokens of a chat interaction, and multi-agent systems about 15x — and that multi-agent architectures only make economic sense where the task's value covers the bill. The same post concedes that domains where all agents must share the same context, or that have many dependencies between agents, are not a good fit for multi-agent systems today, and notes that most coding tasks have fewer parallelisable pieces than research.<\/p>\n<p>So the ladder runs: one model call, then a workflow, then a single agent, then multiple agents — and every rung must justify the climb to the next. Most systems should stop early. This course asks that question first.<\/p>\n<h2>How to take this course<\/h2>\n<p>In order, and with something to build. This module is the map: what an agent actually is, the five-layer frame, and this decision. Modules 1 through 5 then take one layer each, in the order the questions arise — what it sees, who decides, who sorts, what it can reach, how you know. Each module gives you working defaults; the deep-dive handbooks carry the reasoning behind them, and you can descend into a handbook the moment its layer starts hurting in your own system. Read <a href=\"what-an-agent-is.md\">what an agent is<\/a> and <a href=\"five-layers.md\">five layers, one system<\/a> before anything else; the rest will keep.<\/p>\n<ul>\n<li>Module 0 — the map: this page and its two companions<\/li>\n<li><a href=\"../course-1-context/how-models-read.md\">Module 1 — context<\/a>: <a href=\"../course-1-context/how-models-read.md\">how models read<\/a><\/li>\n<li><a href=\"../course-2-loop/loops-vs-workflows.md\">Module 2 — the loop<\/a>, with its handbook <a href=\"../track-loop/what-loop-engineering-is.md\">what loop engineering is<\/a><\/li>\n<li><a href=\"../course-3-gate/cheap-decisions.md\">Module 3 — the gate<\/a>, with its handbook <a href=\"../track-jev/system-one-models.md\">system-one models<\/a><\/li>\n<li><a href=\"../course-4-harness/the-office.md\">Module 4 — the harness<\/a>, with its handbook <a href=\"../track-harness/what-a-harness-is.md\">what a harness is<\/a><\/li>\n<li><a href=\"../course-5-evals/two-kinds-of-checks.md\">Module 5 — evals<\/a>, with its handbook <a href=\"../track-evals/why-evals.md\">why evals<\/a><\/li>\n<li><a href=\"../course-6-production/from-prototype.md\">Module 6 — production<\/a>: from demo to deployed, and the day-one plan<\/li>\n<\/ul>"},{"id":"course-1-context/how-models-read","title":"How models read context","html":"<p>A bigger context window looks like free capacity. It is not. The model reads every token you send, but it does not weigh them equally, and past a point each extra token makes the answer worse as well as slower and dearer. This page covers the mechanics; <a href=\"the-four-places.md\">The four places<\/a> covers the discipline built on top of them.<\/p>\n<h2>Attention has a shape<\/h2>\n<p>In <a href=\"https://arxiv.org/abs/2307.03172\">Lost in the Middle<\/a> (Liu et al., 2023), models answered questions over a pile of retrieved documents while the single document containing the answer was moved through the pile. With 20 documents, GPT-3.5-Turbo scored 75.8% when the answer sat in the first document, 53.8% when it sat in the middle, and 63.2% at the end. The closed-book baseline — the same question with no documents at all — was 56.1%. With the answer physically present in the window but buried in the middle, the model did worse than with nothing.<\/p>\n<p>The same U-shaped curve held across GPT-3.5-Turbo (4K and 16K), Claude 1.3 (including the 100K variant), MPT-30B-Instruct and LongChat-13B, and across piles of 10, 20 and 30 documents. Models attend strongly to the start of the window (primacy) and to the end (recency), and weakly to everything between. The paper tested 2023 models. Later models may flatten the curve, but nothing here shows it is gone, so measure yours (the first exercise in <a href=\"context-practice.md\">Context in practice<\/a> does). Google's whitepaper <a href=\"https://www.kaggle.com/whitepaper-context-engineering-sessions-and-memory\">Context Engineering: Sessions &amp; Memory<\/a> (Milam and Gulli, November 2025) calls the broader failure \"context rot\": as context grows, the model's ability to pay attention to critical information diminishes.<\/p>\n<p><img alt=\"Chart of accuracy by position of the relevant document in the window. Accuracy is highest at the start, dips lowest in the middle and recovers partly at the end. A reference line marks accuracy with no documents at all.\" src=\"docs/course-1-context/fig-lost-middle.svg\" /><\/p>\n<h2>Every token costs four ways<\/h2>\n<p>The same whitepaper lists four practical limits on long context: the hard window limit, API cost, latency, and quality. The window limit is the one people fear and the one that bites last. Cost, latency and quality degrade continuously from the first unnecessary token.<\/p>\n<p>Cost compounds in agent loops. Every turn resends the entire history, so a loop of N turns pays for its context roughly N times over. A 30-turn run carrying 20,000 tokens of dead weight does not waste 20,000 tokens; it wastes around 600,000. Latency scales the same way, and quality falls as the signal you care about drifts towards the weak middle of the window.<\/p>\n<h2>Prompt caching pays for stillness<\/h2>\n<p>Providers will re-serve an unchanged prefix at a steep discount. Anthropic's <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">prompt caching<\/a> prices cache reads at 0.1x the base input rate for most models — ten times cheaper — while a cache write costs 1.25x for the default 5-minute lifetime (2x for a 1-hour cache). The docs list exceptions with cheaper reads: 0.05x for Claude Opus 5.5 and 0.025x for Claude Fable 5.1 and Mythos 5.1.<\/p>\n<p>The catch is severity: a cache hit requires the prefix to be 100% identical, byte for byte, up to the cache breakpoint. The cache is hierarchical — tools, then system prompt, then messages — so editing one tool definition invalidates everything after it, and any change to the system prompt invalidates the whole message history cache. A timestamp in the system prompt guarantees a miss on every single call, silently costing you the whole discount. There is also a minimum cacheable length, between 512 and 4,096 tokens depending on the model (512 for Sonnet 5.5 and Opus 5.5, 4,096 for Haiku 4.5), below which the prefix is not cached.<\/p>\n<h2>The shape of the fix<\/h2>\n<p>The mechanics point one way. Content that never changes belongs at the very front, where it is cheap (cached) and well attended (primacy). Content that matters right now belongs at the very end, where recency works for you. Everything large or transient belongs out of the window entirely, on disk, fetched when needed. That placement discipline is the next page, and the harness handbook has a <a href=\"../track-harness/context-engineering.md\">deeper treatment<\/a> of wiring it into a real agent.<\/p>"},{"id":"course-1-context/the-four-places","title":"The four places","html":"<p><a href=\"how-models-read.md\">How models read<\/a> established the physics: attention favours the start and end of the window, every token costs, and caching only pays when the prefix never moves. The discipline that follows is simple to state. Every piece of context belongs in exactly one of four places, and most agent problems trace back to something sitting in the wrong one.<\/p>\n<p><img alt=\"Diagram of the context window in order: a byte-stable system prompt, a frozen tool set, history that grows and compacts, the goal, then a tail. Files on disk sit outside the window, and only their paths enter.\" src=\"docs/course-1-context/fig-four-places.svg\" /><\/p>\n<h2>One: the system prompt<\/h2>\n<p>Only what is true on every call. Persona, hard rules, output format — nothing else. It must be byte-stable: no timestamps, no user names, no retrieved memories, no \"current task\". Anything dynamic in the system prompt breaks the cache on every request (system sits above messages in the <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">cache hierarchy<\/a>: tools, then system, then messages) and squanders the primacy slot on content that did not need it. Treat edits to it as releases, not tweaks.<\/p>\n<h2>Two: the tools<\/h2>\n<p>The tool set is fixed for the whole conversation. Never add or remove definitions mid-run: tools sit first in the cache hierarchy, so touching one invalidates the entire cached prefix, and the model's behaviour shifts under it. When a tool must become unavailable, block the call instead — intercept it and return \"this tool is disabled for this task\" — leaving the definitions untouched. One sanctioned way to grow the visible tool set is tool search: deferred tools are appended inline as <code>tool_reference<\/code> blocks and, per the <a href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool\">API docs<\/a>, the cached prefix is untouched. The <code>inline-tools-2026-09-15<\/code> beta header is another: per the <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">prompt-caching docs<\/a>, it lets you send a new definition in a <code>tool_addition<\/code> block in a mid-conversation system message, leaving <code>tools<\/code> as first sent, so the cached prefix still matches.<\/p>\n<p>Definitions are expensive. Anthropic's <a href=\"https://www.anthropic.com/engineering/advanced-tool-use\">Advanced tool use<\/a> post (November 2025) measured a routine five-server MCP setup at 58 tools consuming roughly 55K tokens before the conversation starts, and saw 134K tokens of definitions internally before optimisation. Under about twenty tools, keep them all loaded; past that, switch to tool search, covered in <a href=\"context-practice.md\">Context in practice<\/a>.<\/p>\n<h2>Three: the disk<\/h2>\n<p>Anything large or long-lived goes in a file; only the path enters the window. Keep the key, not the content. A tool that fetches a 40,000-token page should not return the page:<\/p>\n<pre><code class=\"language-python\">import hashlib, pathlib, urllib.request\n\ndef fetch_to_disk(url: str) -&gt; str:\n    text = urllib.request.urlopen(url).read().decode(&quot;utf-8&quot;, &quot;replace&quot;)\n    path = pathlib.Path(&quot;cache&quot;) / (hashlib.sha1(url.encode()).hexdigest() + &quot;.txt&quot;)\n    path.parent.mkdir(exist_ok=True)\n    path.write_text(text, encoding=&quot;utf-8&quot;)\n    return f&quot;saved {len(text)} chars to {path}&quot;\n<\/code><\/pre>\n<p>The agent reads slices of the file when it needs them. The window holds a 15-token receipt instead of the document.<\/p>\n<h2>Four: the tail<\/h2>\n<p>The end of the window is the best-attended real estate you have. Restate the current goal there every few steps: one or two lines, appended after the latest tool results. In a long loop the original instruction has drifted into the weak middle; the tail restatement is what keeps the model on task for thirty tokens a turn.<\/p>\n<h2>What survives the session<\/h2>\n<p>Google's <a href=\"https://www.kaggle.com/whitepaper-context-engineering-sessions-and-memory\">Sessions &amp; Memory whitepaper<\/a> draws the line cleanly: the session is the workbench for one conversation; memory is the filing cabinet that persists across them. Its definition matters — memories are extracted information, not the raw dialogue. You do not archive transcripts; you run extraction (an LLM pulls out only facts matching defined topics — preferences, decisions, goals) and then consolidation, where new facts are compared against existing ones and merged, updated, or deleted when contradicted. Both run in the background after the reply is sent, never on the hot path. What you persist between sessions is the distilled record: stable preferences, standing decisions, hard-won facts. The transcript stays on disk as provenance.<\/p>\n<h2>Compacting the window<\/h2>\n<p>For the live session the whitepaper names three strategies, in rising sophistication: keep the last N turns (a sliding window), token-based truncation (fill a budget newest-first), and recursive summarisation (replace older turns with a rolling summary prefixed to recent verbatim ones). Trigger compaction on a count threshold, on inactivity, or on task completion. The loop handbook's <a href=\"../track-loop/context-hygiene.md\">context hygiene<\/a> page goes deeper on compaction inside long-running loops.<\/p>"},{"id":"course-1-context/context-practice","title":"Context in practice","html":"<p>You know the mechanics and <a href=\"the-four-places.md\">the four places<\/a>. This page is the working session: audit an existing agent, restructure it, and add the two upgrades that matter past a certain size.<\/p>\n<blockquote>\n<p>The whole audit below is also packaged as a skill: install <a href=\"../../plugins/README.md\">the course plugin<\/a> and run <code>/agents-course:context-audit<\/code> in your project.<\/p>\n<\/blockquote>\n<h2>Audit the window<\/h2>\n<p>Do this against a real agent, not from memory.<\/p>\n<ol>\n<li>Capture one full request payload — log the exact JSON your framework sends to the model on a mid-conversation turn.<\/li>\n<li>Token-count each section separately: system prompt, tool definitions, message history, retrieved content, current query. Write the five numbers down.<\/li>\n<li>Circle every dynamic value inside the system prompt — timestamps, user names, injected memories. Each one is a guaranteed cache miss on every call.<\/li>\n<li>Check whether the tool list is identical on turn 1 and turn 20. If it changed mid-run, you paid a full cache invalidation each time.<\/li>\n<li>Find the largest single item in the history. It is almost always a verbatim tool result that should have been a file path.<\/li>\n<li>Locate the current goal. If it appears only in the opening message, it now lives in the weak middle of the window.<\/li>\n<li>Read <code>cache_read_input_tokens<\/code> from the <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">usage object of the API response<\/a>. Zero on a warm conversation means something in your prefix is moving.<\/li>\n<\/ol>\n<h2>Restructure to the four places<\/h2>\n<p>Work through the audit findings in order. Strip the system prompt to what is true on every call and move every circled dynamic value into the message history. Freeze the tool list at conversation start and replace any mid-run removal with a blocked call that returns a refusal string. Rewrite fat tools to write their output to disk and return the path plus a one-line receipt. Then add the tail: after every few tool results, append one line restating the current goal. Re-run the audit; the five numbers should shift visibly towards a small stable prefix and a short live tail.<\/p>\n<h2>Switch to tool search past twenty<\/h2>\n<p>Anthropic's <a href=\"https://www.anthropic.com/engineering/advanced-tool-use\">Advanced tool use<\/a> post (November 2025) reports that keeping all definitions loaded stops scaling: with the tool search tool enabled instead, Opus 4 went from 49% to 74% on their MCP evaluation, and Opus 4.5 from 79.5% to 88.1%. Their own threshold is ten-plus tools or over 10K tokens of definitions; this course draws the hard line at twenty. Keep a small always-used core loaded (the API docs suggest the three to five most used tools), mark the rest with <code>defer_loading: true<\/code>, and let the model search for definitions on demand; see the <a href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool\">tool search tool<\/a> docs. The API docs add that tool selection degrades past 30 to 50 available tools. The prefix shrinks and, per those numbers, selection accuracy rises with it.<\/p>\n<h2>Add a summarising subagent<\/h2>\n<p>A subagent is a context firewall. When a task requires reading fifty files, do not read them in the main window — spawn a subagent whose own window absorbs the fifty files and hands back a one-page summary. The main agent keeps the conclusion, not the evidence. The same pattern fits any bulk read: log trawls, large diffs, document piles. The <a href=\"../track-harness/context-engineering.md\">harness handbook<\/a> covers wiring firewalls into a real setup.<\/p>\n<h2>Tips<\/h2>\n<ul>\n<li>Restate the goal in the tail every three to five steps.<\/li>\n<li>No verbatim tool result over about 2,000 tokens survives in the history; path plus receipt instead.<\/li>\n<li>Block tools, never remove them.<\/li>\n<li>Treat system prompt changes as releases; diff them.<\/li>\n<li>Watch cache metrics in production — a silent cache miss bills the prefix at ten times the cache-read rate or more.<\/li>\n<\/ul>\n<h2>Prove it to yourself<\/h2>\n<ol>\n<li>Plant one invented fact in the middle of a 30K-token transcript and ask about it; then move the same fact into the final message and ask again. Compare the answers.<\/li>\n<li>Send an identical request twice and read <code>cache_read_input_tokens<\/code>; then add a timestamp to the top of the system prompt and watch it drop to zero.<\/li>\n<li>Run the same fifty-file summarisation once in your main window and once through a subagent; compare final context size and answer quality.<\/li>\n<\/ol>\n<p>Next module: <a href=\"../course-2-loop/loops-vs-workflows.md\">loops versus workflows<\/a>.<\/p>\n<p>Go deeper → the <a href=\"../track-harness/context-engineering.md\">harness handbook's context engineering page<\/a>: the same discipline wired into a real setup.<\/p>"},{"id":"course-2-loop/loops-vs-workflows","title":"Loops versus workflows","html":"<p>A workflow is a sequence you wrote in advance: step one, step two, step three, done. A loop is different in exactly one place — the next step is chosen at run time, by the model, based on what just happened. The cycle is think, act, observe, decide, on repeat: the model proposes an action, the action runs, the result lands back in the history, and something decides whether to go round again. Google's \"Introduction to Agents\" whitepaper (Kaggle, 2025) draws the same cycle as get the mission, scan the scene, think it through, take action, then observe and iterate, running on a triad of model, tools and orchestration. The vocabulary varies; the shape does not.<\/p>\n<h2>Who chooses the next step<\/h2>\n<p>That is the entire distinction. In a workflow, you chose every step at design time; the code merely replays your decisions, and the same input takes the same path every run. In a loop, the model chooses at run time, so two runs of the same input can take different paths — which is the point, and also the problem. The Google whitepaper frames it as the developer moving from bricklayer to director: you stop laying each step and instead set the goal, pick the tools, and let the system route itself. Directing costs more than bricklaying, and it is harder to audit.<\/p>\n<p><img alt=\"Two diagrams. In a workflow you chose every step, from step 1 to step 2. In a loop the model chooses: think, act, observe, decide.\" src=\"docs/course-2-loop/fig-workflow-vs-loop.svg\" /><\/p>\n<h2>When each wins<\/h2>\n<p>A workflow wins whenever you can enumerate the steps. Known input shapes, known failure modes, a path you could draw on a whiteboard — write it as ordinary code. It runs in milliseconds, costs nothing per branch, never hallucinates a step, and fails loudly in a debugger. Most of what gets built as an \"agent\" today should be a workflow with one or two model calls inside it.<\/p>\n<p>A loop wins only when the path genuinely cannot be written down: debugging an unfamiliar failure, investigating an alert whose cause could be one of a hundred things, editing code until an external test passes. The unknown is the branching, not the work. If you find yourself writing \"the agent will first check X, then Y, then Z\", you have just written the workflow — ship that instead.<\/p>\n<h2>The cost math<\/h2>\n<p>Autonomy is priced in tokens. Anthropic's engineering write-up of its <a href=\"https://www.anthropic.com/engineering/built-multi-agent-research-system\">multi-agent research system<\/a> (June 2025) measured the ratios directly: agentic loops use roughly four times the tokens of a single chat interaction, and multi-agent systems roughly fifteen times. So a loop must clear a value bar about 4x a plain call, and a crew of agents about 15x, before it earns its keep. The bill compounds with unpredictability: Google's \"Prototype to Production\" whitepaper notes that because agent trajectories are assembled dynamically, cost and latency are unpredictable per run — and that roughly 80% of production effort goes on infrastructure, security and validation rather than the agent's intelligence. You are not just paying more per run; you are paying for the machinery to keep runs bounded.<\/p>\n<h2>A decision rule<\/h2>\n<p>Ask one question: can I write the steps in advance?<\/p>\n<ul>\n<li>Yes, completely — workflow. No model in the control flow.<\/li>\n<li>Yes, except one judgement — workflow with a single model call at that point.<\/li>\n<li>No, the path depends on what each step reveals — a loop, bounded by the four parts in <a href=\"the-four-parts.md\">the four parts<\/a>: a testable goal, an external checker, a stop rule and a budget.<\/li>\n<\/ul>\n<p>Default to the cheapest structure that survives contact with the task, and promote only on evidence. The discipline of designing that bounded cycle — rather than prompting it by hand — is <a href=\"../track-loop/what-loop-engineering-is.md\">loop engineering<\/a>, and the production pattern that ties both structures together (filter first, loop briefly, fall back) is built end to end in <a href=\"loop-practice.md\">loop practice<\/a>.<\/p>"},{"id":"course-2-loop/the-four-parts","title":"The four parts of a loop","html":"<p>Every loop that survives production has the same four parts: a goal with a testable definition of done, a checker that lives outside the model, a stop rule, and a budget counted in both turns and dollars. Remove any one and you have not simplified the loop; you have removed its brakes. This page takes each part in depth, then annotates the canonical skeleton.<\/p>\n<p><img alt=\"Diagram of a loop with a goal and a definition of done. The agent acts and a checker tests the result: pass ends the loop, fail retries unless it is stuck or over budget, in which case it falls back to a workflow. The checker lives outside the model.\" src=\"docs/course-2-loop/fig-four-parts.svg\" /><\/p>\n<h2>A goal with a testable done<\/h2>\n<p>\"Improve the error handling\" cannot terminate a loop, because nothing can ever say it is finished. \"All tests under <code>tests/<\/code> pass and the linter reports nothing\" can. The goal must be phrased so that a program — not a person, not the model — returns true or false against it. If you cannot write done as a check, you do not have a loopable task yet; you have an interactive session. Writing done as a forty-line script is a skill in itself, built concretely in <a href=\"../track-loop/build-goal-test.md\">the goal test build page<\/a>.<\/p>\n<h2>A checker outside the model<\/h2>\n<p>The checker is a test suite, a compiler, a linter, a schema validator — anything mechanical that judges the result without asking the model's opinion. Self-review is not a checker. The evidence here is direct: Huang et al., <a href=\"https://arxiv.org/abs/2310.01798\">\"Large Language Models Cannot Self-Correct Reasoning Yet\"<\/a> (ICLR 2024), found that models struggle to correct their own reasoning without external feedback, and that performance sometimes gets worse after self-correction. A model grading its own work is the same weights making the same mistake twice, now with more confidence. External checkers are therefore non-negotiable: the feedback that makes a loop converge has to come from outside the thing that produced the error. This is why coding is the best-behaved loop domain — the compiler and the test runner are free, fast, external checkers that come with the territory.<\/p>\n<h2>A stop rule<\/h2>\n<p>Three exits, any of which ends the run: the checker passes (success), the turn limit is hit (out of attempts), or two consecutive attempts are identical (the loop is spinning and more turns will only spend money). That last one matters because spin is quiet — the same failing test, the same empty diff, attempt after attempt. The full menu of brakes, including ratchets and fingerprinting, is in <a href=\"../track-loop/stop-conditions.md\">stop conditions<\/a>.<\/p>\n<h2>A budget in turns and dollars<\/h2>\n<p>Turns and dollars fail differently, so cap both. A turn cap bounds attempts; a dollar cap bounds damage when a single turn balloons — one tool call that returns a huge payload can cost more than ten normal turns. A loop with a turn cap but no spend cap is a bill with an unknown ceiling.<\/p>\n<h2>The skeleton, annotated<\/h2>\n<pre><code class=\"language-python\">for turn in range(MAX_TURNS):                      # budget, part one: turns\n    action = model.next_step(goal, history)        # the model chooses the step\n    result = run(action)                           # the world responds\n    history.append(result)                         # the observation survives\n    if checker(result):                            # external judge, never the model\n        break                                      # stop rule 1: done\n    if repeated(history, 2):                       # stop rule 2: spinning\n        break\n    if spent() &gt; BUDGET:                           # budget, part two: dollars\n        break\nelse:\n    fallback_workflow(goal)                        # turns exhausted: fixed path\n<\/code><\/pre>\n<p>Read the exits carefully. The <code>else<\/code> on a Python <code>for<\/code> runs only when the loop finishes without a <code>break<\/code>, so as written it catches exactly one failure mode: turns exhausted. The <code>repeated<\/code> and budget breaks leave without a result, so in production you route every exit that is not a checker pass to the same place — the fallback workflow, a deterministic path that produces a defensible answer without the model. The practice page wires that version up completely in <a href=\"loop-practice.md\">loop practice<\/a>.<\/p>\n<p>Notice also what the skeleton omits: there is no \"ask the model if it is satisfied\". The model chooses the next step; it never gets a vote on whether the work is done.<\/p>"},{"id":"course-2-loop/loop-practice","title":"Loop practice: filter, loop, fall back","html":"<p>The production pattern is not \"run the agent on everything\". It is filter first, loop briefly, fall back. Atlan's engineering write-up, <a href=\"https://blog.atlan.com/engineering/loop-engineering-in-production-putting-ai-agents-on-call/\">Loop Engineering in Production: Putting AI Agents on Call<\/a>, shows the shape at scale: a deterministic, non-LLM filter suppressed roughly 85% of about 11,000 alerts a month before a single token was spent, so only the remainder ever reached the agent; the agent then reasoned for about three cycles, and when confidence stayed below roughly 50% it escalated to a deterministic fallback workflow in plain Python. Investigations that had taken over ten minutes and a few dollars came down to about two minutes and $0.28 each. Cheap code handles the common case; the model handles the residue; a fixed path catches whatever the model cannot close. <em>Not re-checked on 5 October 2026: the page could not be fetched, and the figures here were confirmed only from search-result summaries of it.<\/em><\/p>\n<blockquote>\n<p>The goal-test half of this pattern is packaged as a skill: install <a href=\"../../plugins/README.md\">the course plugin<\/a> and run <code>/agents-course:goal-test<\/code>; the checker role ships as the <code>loop-critic<\/code> agent.<\/p>\n<\/blockquote>\n<p>One frame before the code: this build is the triage shape — filter, loop briefly, fall back. The other production shape, a loop wrapped around a coding agent and driven by a goal test, is the <a href=\"../track-loop/build-goal-test.md\">loop handbook's build<\/a>; same four parts, different body.<\/p>\n<h2>The build<\/h2>\n<p>The whole hybrid fits in one file. It runs as-is; swap <code>model_next_step<\/code> for a real API call and the control flow does not change.<\/p>\n<pre><code class=\"language-python\">&quot;&quot;&quot;Hybrid alert triage: deterministic filter, bounded loop, fixed fallback.&quot;&quot;&quot;\n\nMAX_TURNS = 3          # Atlan runs about three reasoning cycles before escalating\nBUDGET_USD = 0.10      # spend ceiling per alert\nCOST_PER_TURN = 0.02   # replace with real usage figures from your API responses\n\nALERTS = [\n    {&quot;id&quot;: 1, &quot;source&quot;: &quot;cron&quot;, &quot;message&quot;: &quot;nightly backup finished OK&quot;},\n    {&quot;id&quot;: 2, &quot;source&quot;: &quot;api&quot;, &quot;message&quot;: &quot;TimeoutError in /sync after 30s&quot;},\n    {&quot;id&quot;: 3, &quot;source&quot;: &quot;api&quot;, &quot;message&quot;: &quot;intermittent 502 from payments&quot;},\n]\n\ndef prefilter(alert):\n    &quot;&quot;&quot;Deterministic, costs nothing. Returns a verdict, or None for the loop.&quot;&quot;&quot;\n    message = alert[&quot;message&quot;].lower()\n    if alert[&quot;source&quot;] == &quot;cron&quot; or &quot;finished ok&quot; in message:\n        return {&quot;cause&quot;: &quot;known-benign pattern&quot;, &quot;next_step&quot;: &quot;close&quot;, &quot;via&quot;: &quot;filter&quot;}\n    return None\n\ndef checker(diagnosis):\n    &quot;&quot;&quot;External judge: a diagnosis must name a cause and a concrete next step.&quot;&quot;&quot;\n    return bool(diagnosis.get(&quot;cause&quot;)) and bool(diagnosis.get(&quot;next_step&quot;))\n\ndef model_next_step(alert, history):\n    &quot;&quot;&quot;Stub standing in for the model call. Swap in a real API call here.&quot;&quot;&quot;\n    if &quot;timeout&quot; in alert[&quot;message&quot;].lower():\n        return {&quot;cause&quot;: &quot;client timeout on /sync&quot;, &quot;next_step&quot;: &quot;raise limit to 60s&quot;}\n    return {&quot;cause&quot;: &quot;&quot;, &quot;next_step&quot;: &quot;&quot;}   # the stub cannot close this one\n\ndef fallback_workflow(alert):\n    &quot;&quot;&quot;Fixed path, no model: always produces a defensible answer.&quot;&quot;&quot;\n    return {&quot;cause&quot;: &quot;unresolved by agent&quot;, &quot;next_step&quot;: &quot;page on-call with raw alert&quot;,\n            &quot;via&quot;: &quot;fallback&quot;}\n\ndef triage(alert):\n    verdict = prefilter(alert)\n    if verdict is not None:\n        return verdict                                   # most alerts stop here\n    history, spent = [], 0.0\n    for turn in range(MAX_TURNS):\n        diagnosis = model_next_step(alert, history)\n        history.append(diagnosis)\n        spent += COST_PER_TURN\n        if checker(diagnosis):\n            diagnosis[&quot;via&quot;] = &quot;loop, turn %d&quot; % (turn + 1)\n            return diagnosis                             # exit 1: checker passed\n        if len(history) &gt;= 2 and history[-1] == history[-2]:\n            break                                        # exit 2: spinning\n        if spent &gt; BUDGET_USD:\n            break                                        # exit 3: over budget\n    return fallback_workflow(alert)                      # every other exit lands here\n\nif __name__ == &quot;__main__&quot;:\n    for alert in ALERTS:\n        print(alert[&quot;id&quot;], triage(alert))\n<\/code><\/pre>\n<p>Alert 1 never touches the model, alert 2 closes on the loop's first turn, and alert 3 spins twice and lands in the fallback. Every path returns the same shape, so the caller never knows which layer answered.<\/p>\n<h2>Tips<\/h2>\n<ul>\n<li>Grow the filter, not the loop. Every diagnosis the loop produces twice is a candidate rule for <code>prefilter<\/code>.<\/li>\n<li>Log <code>via<\/code> on every result. The ratio of filter to loop to fallback is your health metric; a rising fallback share means the loop is failing quietly.<\/li>\n<li>Keep the fallback boring. Its job is a defensible answer with no model, not a second attempt at cleverness.<\/li>\n<li>Make the checker stricter than feels polite — it is the only part the model cannot talk its way past. Hardening it against a real coding agent is <a href=\"../track-loop/build-goal-test.md\">the goal test build page<\/a>; the full menu of brakes is <a href=\"../track-loop/stop-conditions.md\">stop conditions<\/a>.<\/li>\n<\/ul>\n<h2>Prove it to yourself<\/h2>\n<ol>\n<li>Run the file, then set <code>MAX_TURNS = 0<\/code> and run it again. Every unfiltered alert should land in the fallback — if anything crashes instead, an exit path was missing.<\/li>\n<li>Make <code>model_next_step<\/code> return the same wrong answer forever. Confirm the spin check exits on turn two, not turn three.<\/li>\n<li>Add a fourth alert your filter catches, and log how many model calls the whole batch now makes. That number falling while coverage holds is the entire economics of the pattern — and deciding which decisions deserve a model at all is the next module, <a href=\"../course-3-gate/cheap-decisions.md\">cheap decisions<\/a>.<\/li>\n<\/ol>\n<p>Go deeper → the <a href=\"../track-loop/what-loop-engineering-is.md\">loop engineering handbook<\/a>: stop conditions, critics, context hygiene, and an overnight loop you can trust by morning.<\/p>"},{"id":"course-3-gate/cheap-decisions","title":"Cheap Decisions","html":"<p>An agent does two kinds of work. It writes — summaries, plans, replies, code — and it decides — is this urgent, which folder does this belong in, does this need a person. Writing is open-ended and genuinely needs a large model. Deciding is bounded: the answer comes from a set you already know. Most pipelines send both kinds of work to the same frontier model, which is paying the lawyer to sort the envelopes.<\/p>\n<p>This module is about the gate: a cheap decision layer that sits in front of the expensive model and sorts the stream, so the frontier model only sees the items that actually need judgement.<\/p>\n<p>A note on names: the module is called the gate, after the pattern. Its deep-dive handbook is <a href=\"../track-jev/system-one-models.md\">Jev engineering<\/a>, after the class of System One models that most often stands in the gate — the pattern and one strong way to build it.<\/p>\n<h2>Two kinds of work<\/h2>\n<p>Watch an agent process an inbox and count the decisions. Is this spam. Is this a newsletter. Which project does it touch. Does it need a reply. Only after all of that does any writing happen — and for most items it never does; the item is filed, archived, or dropped. A frontier model answering \"is this a newsletter\" burns seconds and real money to produce one bit of information. The decision was worth a fraction of a cent. The writing, on the rare item that needs it, is worth the full price.<\/p>\n<h2>What a gate is<\/h2>\n<p>A gate asks one narrow question per item and routes on the answer. The shape is always the same: everything comes in; each item gets a bounded question — one of these labels, yes or no, a score; items the gate answers confidently and routinely are handled by cheap deterministic code; anything the gate is unsure about goes through to the main model. Unsure means escalate. The gate is never the only path, only the fast one.<\/p>\n<p><img alt=\"Diagram of a gate in front of an expensive model. Every request reaches the gate. Confident cases are answered cheaply, in milliseconds and fractions of a cent. Unsure ones go on to the expensive model, which takes seconds and real money.\" src=\"docs/course-3-gate/fig-gate.svg\" /><\/p>\n<h2>The taxonomy of gates<\/h2>\n<p>Four tools, in rising order of cost and fallibility:<\/p>\n<ul>\n<li><strong>Rules.<\/strong> Regular expressions, sender allowlists, \"has an unsubscribe link\". Free, instant, and blind to anything you did not anticipate. Always the first layer, never the last.<\/li>\n<li><strong>A classic classifier.<\/strong> Logistic regression or similar over TF-IDF features, trained on a few hundred of your own labelled examples. Runs in microseconds on your own machine, costs nothing per call, and its mistakes are inspectable.<\/li>\n<li><strong>A small LLM.<\/strong> A Haiku-class model prompted to answer with one word. No training data needed and it copes with novelty, but it is the slowest and dearest of the cheap options, and you must parse text to get your answer.<\/li>\n<li><strong>A System One model.<\/strong> Jev, released in waitlisted early access by TypeSafe AI in September 2026 (see <a href=\"../track-jev/getting-started.md\">getting started<\/a>), is the first of these: typed decisions — yes/no, one of up to 255 options, or a scalar on an ordered scale — each with a confidence score, and no text generation at all. Background in <a href=\"../track-jev/system-one-models.md\">system one models<\/a>.<\/li>\n<\/ul>\n<h2>Where gates belong<\/h2>\n<p>Anywhere the stream fans in. At ingestion, before anything reaches the main agent: spam, duplicates, and pure reference material should never cost a frontier token. Before expensive tool calls: \"does this query need the web\" is a gate. And around actions, as guardrails: \"is this destructive\" as a yes/no, blocked above a threshold. Layer them — rules first, classifier second, model only for what survives the first two.<\/p>\n<p>The gate is an architecture decision, not a vendor decision. The architecture — narrow question, cheap answer, escalate on doubt — stays the same whichever tool fills the slot. Which tool that should be is an empirical question you answer with your own labels, and it is the subject of the next page: <a href=\"gates-in-practice.md\">gates in practice<\/a>.<\/p>"},{"id":"course-3-gate/gates-in-practice","title":"Gates in Practice","html":"<p>A gate is only as good as two numbers: how often it is right, and how well it knows when it might be wrong. This page covers both, then the honest current state of the newest tool for the job.<\/p>\n<h2>Thresholds and failing closed<\/h2>\n<p>Every gate answer carries a confidence score. The routing rule: take the cheap path only when the predicted label has a deterministic handler <em>and<\/em> the confidence clears a threshold. Everything else falls through to the main model. This is failing closed — the gate is allowed to be ignorant, it is not allowed to guess. An unfamiliar item should always land in front of the model with judgement, never in a handler chosen at 51% confidence.<\/p>\n<p>The threshold itself is a business decision, not a modelling one. Price it by the cost of a wrong fast-path action against the cost of an unnecessary escalation. A misfiled newsletter is cheap, so its route can run at a low threshold; an auto-archived job offer is expensive, so that route runs high or not at all. Working code for the whole pattern is in <a href=\"../track-jev/build-router.md\">the confidence-gated router<\/a>.<\/p>\n<h2>Calibration on your own labels<\/h2>\n<p>A confidence of 0.9 does not mean nine-in-ten right unless someone made it mean that. Treat every confidence score, from any vendor, as a ranking until you have checked. The check is short: hold out labelled examples the gate has never seen, group its predictions into confidence bands, and measure accuracy per band. Put the threshold where band accuracy meets your tolerance.<\/p>\n<p>One independent spam benchmark (<a href=\"https://github.com/pniessen/jev-test\">pniessen's jev-test<\/a>, on the public SMS Spam Collection and Enron-Spam corpora) shows what a healthy gate looks like: predictions in the bottom and top confidence bands were 100% accurate and carried 83% of the traffic, while nearly all errors sat in a thin middle band. Escalating that middle left zero errors on 82.7% of messages. Both figures come from the 1,000-message SMS test set only; the Enron-Spam set was run separately. That is the gate pattern working exactly as designed — most of the stream handled cheaply, all of the doubt sent upward.<\/p>\n<h2>Jev, honestly<\/h2>\n<p>The vendor claims 70–500ms end-to-end against seconds for LLM workflows, and $0.042 per million input tokens with output free. Independent testing has confirmed the price but not the floor: <a href=\"https://github.com/priorbench/jev\">priorbench's evaluation<\/a> measured a unit price of $0.042 per million tokens, and a fastest call of 347ms via a gateway from Europe against TypeSafe's advertised 70ms floor, and it suspects gateway overhead rather than the model, which it labels a hypothesis. In the weeks after launch, the first independent accuracy numbers appeared:<\/p>\n<ul>\n<li><strong>Spam detection.<\/strong> In <a href=\"https://github.com/bitnovus/jev-spam-eval\">bitnovus's jev-spam-eval<\/a>, on 18,514 unique emails in five-fold cross-validation, a TF-IDF logistic regression (five-fold cross-validated) scored 98.39% to zero-shot Jev's 98.33% once Jev was given detailed spam criteria — a tie with a decades-old method that trains in seconds on a laptop. Two limits apply: this is binary spam detection, not general email sorting, and the criteria were refined after error analysis. On the same repository's three-way test (legitimate, spam, phishing; 5,733 emails), the baseline led by 0.23 points, 98.87% to 98.64%.<\/li>\n<li><strong>Phishing detection.<\/strong> On <a href=\"https://github.com/anisselbd/jev-phishing-bench\">anisselbd's jev-phishing-bench<\/a> (2,000 emails), Jev asked one compound question — is this phishing — scored 62.6% against Claude Haiku 4.5's 81.3%. Decomposed into five narrow signal questions combined by a logistic regression fitted on 1,000 labels, Jev reached 95.0% to Haiku's 93.2%, a gap that was not statistically significant (McNemar p = 0.063); the repository adds that neither beat a two-line regex rule at 91.8%. Accuracy is engineered through question design, not delivered by default.<\/li>\n<li><strong>\"Zero hallucinations\"<\/strong> means schema conformance only: as the <a href=\"https://github.com/vamsikrishna2421/jev-usecases\">jev-usecases<\/a> catalog puts it, Jev cannot emit an invalid value but can return a schema-valid answer that is wrong. That reading is the catalog's own; TypeSafe's pages could not be fetched on 5 October 2026. Every answer is a valid option; choosing the wrong valid option is precisely what the accuracy figures above measure.<\/li>\n<li><strong>The confidence score is a ranking, not a calibrated probability<\/strong>, out of the box. The priorbench report calls it \"a ranking, not a probability\": accuracy was flat from 0.50 to 0.95 confidence (97.92% to 97.26%) and reached 100% only at 0.99, covering 60.2% of traffic. Its overall calibration error was low (ECE 0.051), which is why you check bands rather than trust one summary number. Set thresholds on your own labelled data.<\/li>\n<\/ul>\n<h2>When logistic regression simply wins<\/h2>\n<p>If your gate question is fixed, your domain is your own, and you can label a few hundred examples, logistic regression is free per call, runs locally, keeps your data private, is deterministic, and — on the evidence so far — loses to nothing above. Jev's genuine case is the cold start: no labels yet, many questions per item in one pass, wide option sets, or a distribution that drifts faster than you can retrain. But that case must be proven on your data, not the vendor's. Nothing enters the pipeline until it beats the thirty-minute baseline, which you build next: <a href=\"gate-practice.md\">gate practice<\/a>.<\/p>\n<p>The naming, settled: the gate is the layer; Jev is one way to build it. The <a href=\"../track-jev/system-one-models.md\">Jev engineering handbook<\/a> is the deep dive on that way — this module stays about the layer.<\/p>"},{"id":"course-3-gate/gate-practice","title":"Gate Practice","html":"<p>The discipline in one sentence: before evaluating any vendor, label a few hundred real examples and train a basic classifier. It takes thirty minutes, and it is the baseline every claim must beat on your data before it earns a place in your pipeline.<\/p>\n<blockquote>\n<p>This audit-and-baseline routine is packaged as a skill: install <a href=\"../../plugins/README.md\">the course plugin<\/a> and run <code>/agents-course:gate-check<\/code> on your pipeline.<\/p>\n<\/blockquote>\n<h2>Label two hundred real examples<\/h2>\n<p>Pull the last 200 items from the stream your agent actually processes — not synthetic examples, not someone's public dataset. Use three labels:<\/p>\n<ul>\n<li><code>file<\/code> — pure reference: newsletters, receipts, digests. Goes straight to storage, no model needed.<\/li>\n<li><code>act<\/code> — creates a concrete task: an invoice to pay, a form to sign, a meeting to confirm.<\/li>\n<li><code>judge<\/code> — needs actual judgement: an ambiguous request, a proposal, anything with stakes.<\/li>\n<\/ul>\n<p>Three rules while labelling. Label what the item is, not what you wish your categories were. When torn between two labels, choose <code>judge<\/code> — hesitation in you predicts hesitation in the gate. Do not invent new categories mid-run; note candidates and finish the pass. At five seconds an item this is about fifteen minutes. Save as <code>labels.csv<\/code>:<\/p>\n<pre><code class=\"language-csv\">text,label\n&quot;Weekly digest: ten AI papers you missed&quot;,file\n&quot;Invoice 2214 attached, due Friday, please confirm receipt&quot;,act\n&quot;Fwd: any thoughts on this partnership proposal?&quot;,judge\n<\/code><\/pre>\n<h2>Train the baseline<\/h2>\n<p>Install once with <code>pip install scikit-learn pandas joblib<\/code>, then:<\/p>\n<pre><code class=\"language-python\"># train_gate.py\nimport joblib\nimport pandas as pd\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import Pipeline\n\ndf = pd.read_csv(&quot;labels.csv&quot;)\n\nX_train, X_test, y_train, y_test = train_test_split(\n    df[&quot;text&quot;], df[&quot;label&quot;], test_size=0.25,\n    stratify=df[&quot;label&quot;], random_state=42,\n)\n\ngate = Pipeline([\n    (&quot;tfidf&quot;, TfidfVectorizer(ngram_range=(1, 2), min_df=2, sublinear_tf=True)),\n    (&quot;clf&quot;, LogisticRegression(max_iter=1000, class_weight=&quot;balanced&quot;)),\n])\ngate.fit(X_train, y_train)\n\nprint(classification_report(y_test, gate.predict(X_test), digits=3))\njoblib.dump(gate, &quot;gate.joblib&quot;)\n<\/code><\/pre>\n<h2>Measure, then decide<\/h2>\n<p>Read the per-class precision and recall, not just the headline accuracy. These numbers are your baseline. Only now is the vendor question well-posed: does anything fancier beat this, on this data, by enough to justify a network call, a bill, and a dependency? On the independent evidence so far — see <a href=\"gates-in-practice.md\">gates in practice<\/a> — the answer for a fixed, labelled task is usually no.<\/p>\n<h2>Wire the winner in<\/h2>\n<pre><code class=\"language-python\"># gate.py\nimport joblib\n\ngate = joblib.load(&quot;gate.joblib&quot;)\nTHRESHOLD = 0.85\nHANDLED = {&quot;file&quot;, &quot;act&quot;}\n\ndef route(text: str) -&gt; tuple[str, float]:\n    probs = gate.predict_proba([text])[0]\n    best = probs.argmax()\n    label = gate.classes_[best]\n    confidence = float(probs[best])\n    if label not in HANDLED or confidence &lt; THRESHOLD:\n        return &quot;escalate&quot;, confidence\n    return label, confidence\n<\/code><\/pre>\n<p>Everything returning <code>escalate<\/code> goes to the main model — fail closed. The full routing scaffold, with logging and the LLM fall-through, is in <a href=\"../track-jev/build-router.md\">the confidence-gated router<\/a>; this pipeline drops into its fast path unchanged.<\/p>\n<h2>Tips<\/h2>\n<ul>\n<li>Log every decision with its confidence, routed or not. The log is your future evaluation set.<\/li>\n<li>Retrain weekly. Escalations the main model resolved are free labels — append them to <code>labels.csv<\/code>.<\/li>\n<li>Keep <code>judge<\/code> forever. A gate with no escape hatch is a gate that guesses.<\/li>\n<li>Start the threshold at 0.85 and move it only after banding accuracy by confidence on held-out data.<\/li>\n<\/ul>\n<h2>Prove it to yourself<\/h2>\n<ol>\n<li>Band your held-out predictions by confidence (0–0.5, 0.5–0.85, 0.85–1.0) and report accuracy per band. If the top band is not near-perfect, raise the threshold.<\/li>\n<li>Rerun the report at thresholds 0.7, 0.85, and 0.95, and record escalation rate against fast-path error rate for each. Pick the trade-off deliberately.<\/li>\n<li>Shadow-run for a week: the gate decides but the main model still handles everything. Count the disagreements before trusting the fast path.<\/li>\n<\/ol>\n<p>With the gate sorting the stream, the expensive model finally has room to do its real work — the subject of the next module: <a href=\"../course-4-harness/the-office.md\">the office<\/a>.<\/p>\n<p>Go deeper → the <a href=\"../track-jev/system-one-models.md\">Jev engineering handbook<\/a>: System One models, what they are good for, and a confidence-gated router build.<\/p>"},{"id":"course-4-harness/the-office","title":"The Office","html":"<p>Hire the most brilliant engineer alive and put them in a bad office — no keys to the rooms they need, no documentation, no test suite, a manager who rubber-stamps everything — and you get bad work. An agent is a model plus a harness: the model is the hire, the harness is the office. <a href=\"../track-harness/what-a-harness-is.md\">What a harness is<\/a> covers the anatomy — loop, tools, prompts, permissions, context. This module covers the discipline: the office is a product you design and measure, not packaging around the clever part.<\/p>\n<h2>You buy a model and a harness<\/h2>\n<p>Nobody runs a bare model. The moment you adopt Claude Code, LangChain's deepagents or your own seventy-line loop, you have bought a second product with its own quality curve. Vendors price the model per token and give the harness away, which tricks teams into treating it as free and therefore unimportant. The 2026 measurements say the opposite: Anthropic's infrastructure study notes that setup differences can exceed the margins that separate top models on a leaderboard, and LangChain moved a score by 13.7 points without touching the model.<\/p>\n<h2>Six points from container resources<\/h2>\n<p>In February 2026 Anthropic reran Terminal-Bench 2.0 on a Google Kubernetes Engine cluster under six resource configurations, from strict enforcement of each task's CPU and memory spec up to fully uncapped — same model, same harness, same tasks. Uncapped resources lifted the score by 6 percentage points over strict enforcement (p &lt; 0.01), and under strict enforcement 5.8% of tasks failed on infrastructure errors — containers killed by transient memory spikes, not the model getting the answer wrong. The write-up is <a href=\"https://www.anthropic.com/engineering/infrastructure-noise\">Quantifying infrastructure noise in agentic coding evals<\/a>. If the RAM ceiling alone is worth six points, the environment is not a detail. It is part of the score.<\/p>\n<h2>Thirteen points from the harness alone<\/h2>\n<p>In February 2026 LangChain froze the model entirely — GPT-5.2-Codex throughout — and iterated only on the harness of their deepagents-cli: system prompt structure, tool design, and middleware such as loop detection and a pre-completion checklist. The agent went from 52.8 to 66.5 on Terminal-Bench 2.0, a 13.7-point gain with the model fixed. The post is <a href=\"https://www.langchain.com/blog/improving-deep-agents-with-harness-engineering\">Improving Deep Agents with harness engineering<\/a>. <em>Not re-checked on 5 October 2026: the page could not be fetched, and the figures here were confirmed only from search-result summaries of it.<\/em><\/p>\n<h2>A cheaper model in a better office<\/h2>\n<p>The July 2026 sequel, <a href=\"https://www.langchain.com/blog/tuning-the-harness-not-the-model-a-nemotron-3-ultra-playbook\">Tuning the harness, not the model<\/a>, applied the same playbook to NVIDIA's open-weights Nemotron 3 Ultra. Harness tuning alone took it to a best run of 0.86 on LangChain's Deep Agents suite against Claude Opus 4.8's best of 0.87 — at about $4.48 per run versus $43.48, roughly a tenth of the cost. One suite, scored by the harness's own authors, so hold it loosely; but the direction matches everything else measured this year. A strong office lets a cheaper hire do the job. <em>Not re-checked on 5 October 2026: the page could not be fetched, and the figures here were confirmed only from search-result summaries of it.<\/em><\/p>\n<h2>When you need one<\/h2>\n<p>The moment the agent touches anything real. A chatbot that answers badly costs you a wince and a retry; nothing happened until you acted on the text. An agent with a shell, a database connection or a send button acts on its own output — the wrong answer is now a pushed commit, a dropped table, a sent email. That is the line: while the output is text you review, prompt away and skip the ceremony. The day it becomes actions that simply happen, you need walls, guides, sensors and gates — in that order. <a href=\"the-four-rings.md\">The four rings<\/a> is that build order, and <a href=\"harness-practice.md\">harness practice<\/a> walks through hardening a real agent end to end.<\/p>"},{"id":"course-4-harness/the-four-rings","title":"The Four Rings","html":"<p>Build the harness from the outside in: containment, guides, sensors, permissions. The order matters because each ring must hold when every ring inside it fails. A guide can be ignored, a sensor can miss, an approval can be misclicked; a wall does not care. So the outermost ring goes up before the first prompt is written.<\/p>\n<p><img alt=\"Nested boxes around the model, from outside in: containment (what it cannot reach at all), guides (AGENTS.md, tool descriptions), sensors (tests, linters, review) and permissions (approval for the irreversible).\" src=\"docs/course-4-harness/fig-four-rings.svg\" /><\/p>\n<h2>Ring one: containment<\/h2>\n<p>Containment is what the agent physically cannot reach, and it is the only ring that works with zero model cooperation. The standard kit: a container or VM rather than your laptop's shell; a throwaway branch or git worktree rather than main; a read-only database user rather than the application's credentials; a network allowlist rather than the open internet. None of this involves prompting. If you set it up before the agent's first run, the worst possible session is a discarded branch and a wasted API bill.<\/p>\n<h2>Ring two: guides<\/h2>\n<p>Guides are everything the agent reads before acting: AGENTS.md files, tool descriptions, examples. They are cheap, and they carry most of the day-to-day quality. A useful AGENTS.md is four lines, not four pages:<\/p>\n<pre><code class=\"language-markdown\">- Monorepo: services live in services/, shared code in packages/. Run everything from the repo root.\n- `make test` must pass before you call any task done.\n- Never hand-edit files in migrations/ — generate them with `make migration`.\n- Your database user is read-only. Ask before proposing any schema change.\n<\/code><\/pre>\n<p>Tool design is the other half of this ring. Google's Kaggle whitepaper <a href=\"https://www.kaggle.com/whitepaper-agent-tools-and-interoperability-with-mcp\">Agent Tools &amp; Interoperability with MCP<\/a> sorts tools into function tools, built-in tools and agent tools, and its best practices are all guide-writing: document each tool well enough that the model can choose it by description alone, design tools around tasks rather than API surfaces, return concise output, and make errors teach the fix. Prefer a typed tool over raw access — <code>search_orders(customer_id)<\/code> beats handing over a SQL connection, because the schema is itself containment. The whitepaper's case for MCP is interoperability: one open protocol (JSON-RPC 2.0 over stdio or streamable HTTP) so N clients and M tool servers need one integration each, not N×M. The full treatment is in <a href=\"../track-harness/tools-and-mcp.md\">tools and MCP<\/a>.<\/p>\n<h2>Ring three: sensors<\/h2>\n<p>Sensors tell you, deterministically, whether the work is sound. Run the cheap ones on everything: linter, type checker, test suite after every change — they cost seconds and never get tired. Spend the expensive ones — a second model reviewing the diff, a human reading it — only on what matters: auth code, migrations, anything that moves money. A harness where <code>make test<\/code> runs automatically catches more than one where a reviewer is meant to remember.<\/p>\n<h2>Ring four: permissions<\/h2>\n<p>Anthropic reports that <a href=\"https://www.anthropic.com/engineering/claude-code-auto-mode\">Claude Code users approve 93% of permission prompts<\/a> (March 2026). A gate that opens 93 times in 100 trains people to stop reading it. The real protection is ring one — actions that are not available at all — so spend approval prompts only on the truly irreversible: pushing to a shared branch, sending anything, deleting anything. Three prompts a day get read; thirty get clicked.<\/p>\n<h2>Hooks: guides with teeth<\/h2>\n<p>A guide the model might skim becomes a rule the harness enforces. In Claude Code, a <a href=\"https://code.claude.com/docs/en/hooks\">PreToolUse hook<\/a> runs before a matching tool call and can block it; this one enforces \"never push to main\":<\/p>\n<pre><code class=\"language-json\">{\n  &quot;hooks&quot;: {\n    &quot;PreToolUse&quot;: [\n      {\n        &quot;matcher&quot;: &quot;Bash&quot;,\n        &quot;hooks&quot;: [\n          {\n            &quot;type&quot;: &quot;command&quot;,\n            &quot;command&quot;: &quot;jq -r '.tool_input.command' | grep -qE 'git push.*\\\\bmain\\\\b' &amp;&amp; { echo 'Blocked: never push to main' &gt;&amp;2; exit 2; } || exit 0&quot;\n          }\n        ]\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>Exit code 2 blocks the call and shows the hook's stderr to the model as the reason, so the agent corrects course instead of failing silently. The hooks guide positions hooks as the way to enforce project rules rather than relying on the model to follow them.<\/p>\n<h2>The bets expire<\/h2>\n<p>Every ring component is a bet that the model cannot do something. Anthropic added context resets to a harness because Claude Sonnet 4.5 wrapped up work prematurely near its context limit — then <a href=\"https://www.anthropic.com/engineering/harness-design-long-running-apps\">dropped them entirely<\/a> when Opus 4.5 largely removed that behaviour. Your bets will expire the same way. <a href=\"harness-practice.md\">Harness practice<\/a> turns that into a quarterly ritual.<\/p>"},{"id":"course-4-harness/harness-practice","title":"Harness Practice","html":"<p>Theory done; now harden a real agent. The worked example is a coding agent on a web app with a Postgres database, run through Claude Code, but every step translates to any harness — including the seventy-line loop from <a href=\"../track-harness/build-the-loop.md\">build the loop<\/a>. Work the rings in order.<\/p>\n<blockquote>\n<p>The audit half of this session is packaged as a skill: install <a href=\"../../plugins/README.md\">the course plugin<\/a> and run <code>/agents-course:harness-audit<\/code> before you harden by hand.<\/p>\n<\/blockquote>\n<p>One frame before the steps: this session hardens an agent you already run. Building the machinery itself from scratch — the seventy-line loop and its guardrails — is the <a href=\"../track-harness/build-the-loop.md\">harness handbook's build<\/a>.<\/p>\n<h2>Step one: build the walls<\/h2>\n<p>Before the first prompt, decide what the agent cannot reach. Give it a worktree instead of your checkout, and a database user that can only read:<\/p>\n<pre><code class=\"language-bash\">git worktree add ../agent-workspace -b agent/task-one\n<\/code><\/pre>\n<pre><code class=\"language-sql\">CREATE USER agent_ro WITH PASSWORD 'rotate-me';\nGRANT CONNECT ON DATABASE app TO agent_ro;\nGRANT USAGE ON SCHEMA public TO agent_ro;\nGRANT SELECT ON ALL TABLES IN SCHEMA public TO agent_ro;\n<\/code><\/pre>\n<p>If the agent needs to install packages or hit APIs, run it in a container with a network allowlist (your package registry and model API, nothing else). The test of this step: imagine the worst session possible and check the blast radius is a deleted worktree.<\/p>\n<h2>Step two: write the guides<\/h2>\n<p>One AGENTS.md at the repo root, short enough to be read every session. Claude Code's <a href=\"https://code.claude.com/docs/en/memory#agents-md\">memory docs<\/a> say it reads <code>AGENTS.md<\/code> only when there is no <code>CLAUDE.md<\/code> in the working directory or above it; if you already have a <code>CLAUDE.md<\/code>, add the line <code>@AGENTS.md<\/code> to it to import the file.<\/p>\n<pre><code class=\"language-markdown\">- App code in src/, tests in tests/, run everything from the repo root.\n- `make check` must pass before you call any task done.\n- Never hand-edit files in migrations/ — generate them with `make migration`.\n- Your database user is read-only. Ask before proposing any schema change.\n<\/code><\/pre>\n<p>Every line states a rule the agent can act on. No philosophy, no history.<\/p>\n<h2>Step three: wire the sensors<\/h2>\n<p>Make the deterministic checks one command, then have the harness run it after every change rather than hoping the model remembers. In Claude Code a <a href=\"https://code.claude.com/docs/en/hooks\">PostToolUse hook<\/a> shows its stderr to the model only when it exits with code 2; a hook that fails with any other code shows the user a one-line error, and its stdout is not shown to the model. So the command below sends the output to stderr and exits 2 on failure:<\/p>\n<pre><code class=\"language-make\">check:\n    ruff check .\n    mypy src\n    pytest -q\n<\/code><\/pre>\n<pre><code class=\"language-json\">{\n  &quot;hooks&quot;: {\n    &quot;PostToolUse&quot;: [\n      {\n        &quot;matcher&quot;: &quot;Edit|Write&quot;,\n        &quot;hooks&quot;: [\n          { &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;make check &gt;&amp;2 || exit 2&quot; }\n        ]\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>A failing check now reaches the model immediately, while the mistake is one edit old.<\/p>\n<h2>Step four: strip the permissions<\/h2>\n<p>Least privilege, then approvals only for the irreversible. Claude Code evaluates <a href=\"https://code.claude.com/docs/en/permissions\">permission rules<\/a> in the order deny, ask, allow, and the first match wins, so a broad deny cannot be overridden by a narrower allow:<\/p>\n<pre><code class=\"language-json\">{\n  &quot;permissions&quot;: {\n    &quot;allow&quot;: [&quot;Read&quot;, &quot;Grep&quot;, &quot;Glob&quot;, &quot;Bash(make check)&quot;, &quot;Bash(git diff:*)&quot;, &quot;Bash(git status)&quot;],\n    &quot;ask&quot;: [&quot;Bash(git commit:*)&quot;, &quot;Bash(git push:*)&quot;],\n    &quot;deny&quot;: [&quot;WebFetch&quot;, &quot;Bash(rm:*)&quot;]\n  }\n}\n<\/code><\/pre>\n<p>People approve almost every prompt they see, so a short ask-list is the only kind that gets read. If you find yourself approving something daily without thinking, move it to allow — or better, make it impossible and remove the prompt.<\/p>\n<h2>Step five: add one hook<\/h2>\n<p>Pick the rule from AGENTS.md whose violation hurts most and enforce it:<\/p>\n<pre><code class=\"language-json\">{\n  &quot;hooks&quot;: {\n    &quot;PreToolUse&quot;: [\n      {\n        &quot;matcher&quot;: &quot;Edit|Write&quot;,\n        &quot;hooks&quot;: [\n          {\n            &quot;type&quot;: &quot;command&quot;,\n            &quot;command&quot;: &quot;jq -r '.tool_input.file_path' | grep -q 'migrations/' &amp;&amp; { echo 'Blocked: generate migrations with make migration' &gt;&amp;2; exit 2; } || exit 0&quot;\n          }\n        ]\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>One hook, well chosen, beats ten that fire constantly.<\/p>\n<h2>The quarterly review<\/h2>\n<p>Every harness piece is a bet that the model cannot do something, and the bets expire — Anthropic deleted a whole scaffolding component (context resets for premature wrap-ups) after <a href=\"https://www.anthropic.com/engineering/harness-design-long-running-apps\">Opus 4.5 largely removed the behaviour it compensated for<\/a>. So put a recurring entry in the calendar. For each hook, guide line and denied permission, write the sentence \"this exists because the model cannot X\", then test X against the current model. Delete what no longer earns its keep; a harness that only grows is compensating for a model that no longer exists.<\/p>\n<h2>Tips<\/h2>\n<ul>\n<li>Add rules to AGENTS.md only after the agent gets something wrong twice. Speculative rules rot.<\/li>\n<li>Log blocked hook firings. A hook that never fires is a candidate for deletion at review.<\/li>\n<li>Tool descriptions are guides too — see <a href=\"../track-harness/tools-and-mcp.md\">tools and MCP<\/a> before adding a tool.<\/li>\n<\/ul>\n<h2>Prove it to yourself<\/h2>\n<ol>\n<li>Run the same task with and without AGENTS.md in a fresh session each time. Compare the transcripts.<\/li>\n<li>Count the permission prompts in one working day and how many you approved. Compute your own approval rate.<\/li>\n<li>Disable one harness component, rerun a task it was meant to protect, and see whether anything actually degrades.<\/li>\n<\/ol>\n<p>Next: sensors deserve a module of their own — <a href=\"../course-5-evals/two-kinds-of-checks.md\">two kinds of checks<\/a>.<\/p>\n<p>Go deeper → the <a href=\"../track-harness/what-a-harness-is.md\">agent harnesses handbook<\/a>: the machinery in depth, the landscape, and a working harness in about 150 lines.<\/p>"},{"id":"course-5-evals/two-kinds-of-checks","title":"Two Kinds of Checks","html":"<p>The previous modules built an agent that plans, calls tools, and edits your vault. This one is about knowing whether it works — before your users tell you. Everything in agent evaluation rests on one distinction: checks on the outcome versus checks on the behaviour. You need both, and they answer different questions.<\/p>\n<p><img alt=\"Diagram of one agent run with four steps: get_order, ask_approval, refund and reply. Behavioural checks read the steps: it looked up first and asked before acting. The end-to-end check reads only the result: the right outcome.\" src=\"docs/course-5-evals/fig-two-checks.svg\" /><\/p>\n<h2>End-to-end checks<\/h2>\n<p>An end-to-end check asks a single question: did the final answer come out right? Run the input, take the last message or the resulting state, score it — exact match, a rubric, a judge. This is the check users would design, because it measures the thing they experience.<\/p>\n<p>Its strength is also its limit. When the pass rate drops from 84% to 71% after a prompt edit, an end-to-end suite tells you the score moved. It does not tell you why. The failing transcripts still have to be read one at a time, because the failure could be in retrieval, in tool arguments, in a skipped verification step, or in the final phrasing. Google's <a href=\"https://www.kaggle.com/whitepaper-agent-quality\">Agent Quality whitepaper<\/a> treats this as black-box evaluation — \"did the agent achieve the user's goal?\" — and pairs it with a glass-box view of the path taken, on the principle it summarises as \"the trajectory is the truth\".<\/p>\n<h2>Behavioural checks<\/h2>\n<p>A behavioural check asks whether one specific thing happened on the way to the answer. Did the agent call search before answering? Did it ask a clarifying question when the request was ambiguous? Did it verify the file exists before claiming the task was done? Each check is narrow, binary, and cheap — an assertion, not a judgement.<\/p>\n<p>The payoff is diagnosis. Two agents that produce the same refund email are not the same agent if one looked up the order first and the other guessed. An end-to-end check scores them equal; a behavioural check separates them today, before the guesser meets an order it guesses wrong.<\/p>\n<h2>The trace is the substrate<\/h2>\n<p>Behavioural checks run on the trace: the full record of model turns, tool calls with their arguments, tool results, and retries. No trace, no behavioural checks — which is why the whitepaper argues agents should be instrumented for evaluation from the first line of code, with logs, traces, and metrics as the three pillars of observability. If your agent is a Claude Code setup, the transcript already is the trace: Claude Code <a href=\"https://code.claude.com/docs/en/agent-sdk/sessions\">writes every session<\/a>, tool calls and results included, to a JSONL file under <code>~/.claude/projects/<\/code>, so keep it. What to assert over it — tool choice, argument extraction, ordering constraints, error handling — is covered in depth in <a href=\"../track-evals/agent-evals.md\">agent evals<\/a>.<\/p>\n<h2>The speed budget<\/h2>\n<p>Split the suite into two tiers. The fast tier is deterministic behavioural assertions only: no model calls, no network, just code reading traces. Keep it fast enough that nobody decides whether to run it — a few seconds, call it five, is a workable budget. Beyond that, it becomes a thing you run before merging instead of after every edit, and the feedback loop dies. The slow tier — end-to-end runs with judges — goes nightly and before releases. The single-file structure in <a href=\"../track-evals/build-suite.md\">build the suite<\/a> extends naturally into this split.<\/p>\n<h2>Where each kind earns its keep<\/h2>\n<p>End-to-end checks earn their keep at decision points: shipping a release, swapping a model, comparing two prompts. Behavioural checks earn theirs during development, where you change one thing and want to know within seconds what it disturbed.<\/p>\n<p>One trap to avoid from day one: watch individual checks, not the overall pass rate. An aggregate can rise while one behaviour quietly breaks — five flaky cases start passing, and the agent stops asking approval before refunds. The aggregate says progress; check-level history says incident. Grading the slow tier is its own problem, which is where <a href=\"judges-and-golden-sets.md\">judges and golden sets<\/a> come in.<\/p>"},{"id":"course-5-evals/judges-and-golden-sets","title":"Judges and Golden Sets","html":"<p>Behavioural checks are code, and code is trustworthy. End-to-end grading usually is not code: \"is this reply correct and grounded\" needs a grader that reads, which in practice means another LLM. A judge is a measurement instrument, and no instrument ships calibrated. This page covers checking the judge, then building the set of cases it grades.<\/p>\n<h2>Judges need judging<\/h2>\n<p>Two properties decide whether a judge's number means anything.<\/p>\n<p>First, agreement with hand labels. Label outputs pass/fail yourself, run the judge on the same outputs, and measure agreement per class — a judge that always says pass scores 90% raw accuracy on mostly-good data while catching nothing. Read every disagreement: half the time the rubric was woolly, half the time your own label was. The full procedure, plus the documented bias failure modes (position, verbosity, self-preference), is in <a href=\"../track-evals/llm-as-judge.md\">llm as judge<\/a>.<\/p>\n<p>Second, repeat-run variance. Run the same judge on the same inputs several times and see how much the verdicts move. Airbnb learned this expensively: their pipeline regenerated model-written reference answers on every eval run, and <a href=\"https://airbnb.tech/ai-ml/from-weeks-to-a-day-how-we-made-llm-evaluation-fast-enough-to-iterate-on/\">their engineering blog<\/a> reports that roughly three quarters of those references differed across labelling runs on identical inputs. A two-point score movement could mean the agent improved, the judge drifted, or the references had been rerolled — the eval was measuring its own
